<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ระบบนัดคิวผู้ป่วยใส่แร่</title>
  <script>
    // ตั้งโหมดสี/ภาษาที่เคยเลือกไว้ก่อนแสดงผล เพื่อไม่ให้หน้าจอกะพริบ
    (function () {
      try {
        var th = localStorage.getItem('bq-theme');
        if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th);
        var lg = localStorage.getItem('bq-lang');
        if (lg === 'en' || lg === 'th') document.documentElement.lang = lg;
      } catch (e) { /* ไม่มี storage ก็ใช้ค่าเริ่มต้น */ }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f3fa;
      --card: #ffffff;
      --field: #ffffff;
      --raise: #faf9fd;
      --ink: #1f1b2e;
      --muted: #6b6680;
      --line: #e3dfee;
      --accent: #6b3fa0;
      --accent-ink: #ffffff;
      --accent-soft: #efe8f8;
      --accent-hover: rgba(107, 63, 160, .08);
      --sel-ring: rgba(107, 63, 160, .25);
      --header-bg: #6b3fa0;
      --header-ink: #ffffff;
      --tab-bg: rgba(255, 255, 255, .14);
      --tab-on-bg: #ffffff;
      --tab-on-ink: #6b3fa0;
      --home-line: rgba(255, 255, 255, .35);
      --ok: #1e7f4f;
      --ok-soft: #e3f4ea;
      --warn: #a15c00;
      --warn-soft: #fff3df;
      --warn-line: #f0d3a0;
      --on-warn: #ffffff;
      --bad: #b3261e;
      --bad-soft: #fdeceb;
      --bad-line: #f3c1bd;
      --on-bad: #ffffff;
      --toast-bg: #1f1b2e;
      --toast-ink: #ffffff;
      --overlay: rgba(20, 15, 35, .45);
      --radius: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #141120;
        --card: #1e1a2c;
        --field: #262137;
        --raise: #231e33;
        --ink: #ece8f6;
        --muted: #a7a1bd;
        --line: #363049;
        --accent: #b794f0;
        --accent-ink: #1a1228;
        --accent-soft: #2f2647;
        --accent-hover: rgba(183, 148, 240, .12);
        --sel-ring: rgba(183, 148, 240, .35);
        --header-bg: #2a2142;
        --header-ink: #f3eefc;
        --tab-bg: rgba(255, 255, 255, .08);
        --tab-on-bg: #b794f0;
        --tab-on-ink: #1a1228;
        --home-line: rgba(255, 255, 255, .18);
        --ok: #6fd39e;
        --ok-soft: #16332a;
        --warn: #f2b55e;
        --warn-soft: #3a2b14;
        --warn-line: #6b4f22;
        --on-warn: #2a1a05;
        --bad: #ff8f86;
        --bad-soft: #3e1d1c;
        --bad-line: #6e3431;
        --on-bad: #2a0d0b;
        --toast-bg: #ece8f6;
        --toast-ink: #1a1228;
        --overlay: rgba(0, 0, 0, .6);
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #141120;
      --card: #1e1a2c;
      --field: #262137;
      --raise: #231e33;
      --ink: #ece8f6;
      --muted: #a7a1bd;
      --line: #363049;
      --accent: #b794f0;
      --accent-ink: #1a1228;
      --accent-soft: #2f2647;
      --accent-hover: rgba(183, 148, 240, .12);
      --sel-ring: rgba(183, 148, 240, .35);
      --header-bg: #2a2142;
      --header-ink: #f3eefc;
      --tab-bg: rgba(255, 255, 255, .08);
      --tab-on-bg: #b794f0;
      --tab-on-ink: #1a1228;
      --home-line: rgba(255, 255, 255, .18);
      --ok: #6fd39e;
      --ok-soft: #16332a;
      --warn: #f2b55e;
      --warn-soft: #3a2b14;
      --warn-line: #6b4f22;
      --on-warn: #2a1a05;
      --bad: #ff8f86;
      --bad-soft: #3e1d1c;
      --bad-line: #6e3431;
      --on-bad: #2a0d0b;
      --toast-bg: #ece8f6;
      --toast-ink: #1a1228;
      --overlay: rgba(0, 0, 0, .6);
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font-family: 'Sarabun', system-ui, sans-serif; font-size: 15px; line-height: 1.5;
      transition: background-color .2s, color .2s;
    }
    header {
      background: var(--header-bg); color: var(--header-ink);
      padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 8px 16px;
      align-items: center; justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand .logo { width: 50px; height: 50px; flex: none; border-radius: 12px; background: #ffffff; padding: 3px; }
    .brandtext { display: grid; gap: 2px; min-width: 0; }
    .authlogo { display: block; width: 128px; height: auto; margin: 0 auto 10px; background: #ffffff; border-radius: 12px; padding: 8px; }
    .authhead { text-align: center; }
    header h1 { margin: 0; font-size: 26px; font-weight: 700; line-height: 1.2; letter-spacing: .01em; text-wrap: balance; }
    header .org { font-size: 14px; font-weight: 500; opacity: .88; }
    @media (max-width: 560px) { header h1 { font-size: 21px; } header .org { font-size: 13px; } .brand .logo { width: 42px; height: 42px; } }
    header .cal { font-size: 13px; opacity: .85; }
    main { max-width: 1200px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
    main > *, .grid2 > *, #viewBook > *, #viewDash > * { min-width: 0; }
    .grid2 { display: grid; gap: 16px; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); }
    @media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 16px;
    }
    .card h2 { margin: 0 0 12px; font-size: 16px; font-weight: 700; }
    .row { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
    @media (max-width: 480px) { .row { grid-template-columns: 1fr; } }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; font-weight: 500; }
    .req::after { content: ' *'; color: var(--bad); }
    .field { margin-bottom: 12px; }
    input, select, textarea, button { font: inherit; color: inherit; }
    input[type=text], input[type=number], input[type=date], input[type=search], input[type=email], input[type=password], select, textarea {
      width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--field);
    }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    textarea { resize: vertical; min-height: 40px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      border: 1px solid var(--line); background: var(--field); border-radius: 999px; padding: 4px 12px;
      cursor: pointer; font-size: 14px;
    }
    .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    .days { display: flex; flex-wrap: wrap; gap: 6px; }
    .days label {
      margin: 0; display: inline-flex; align-items: center; justify-content: center; min-width: 44px;
      padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; color: var(--ink);
      font-size: 14px; background: var(--field);
    }
    .days input { display: none; }
    .days label:has(input:checked) { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
    .radio { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; }
    .radio label { display: inline-flex; gap: 6px; align-items: center; color: var(--ink); font-size: 14px; margin: 0; }
    .check { display: inline-flex; gap: 6px; align-items: center; color: var(--ink); font-size: 14px; }
    .hint { font-size: 12px; color: var(--muted); }
    .manual { display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); margin-top: 6px; }
    .manual .mrow { display: grid; grid-template-columns: 56px minmax(0, 1fr) 30px; gap: 6px; align-items: center; }
    .manual .mrow input:invalid, .manual .mrow input.empty { border-color: var(--warn); }
    .manual .mfx {
      border: 1px solid var(--line); background: var(--field); border-radius: 8px; padding: 7px 0;
      font-weight: 700; font-size: 13px; color: var(--accent); cursor: pointer;
    }
    .manual .mrow.on .mfx { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    .manual .mrow.on input { border-color: var(--accent); }
    .manual .mclr { border: 0; background: none; color: var(--muted); font-size: 18px; line-height: 1; cursor: pointer; border-radius: 6px; padding: 4px 0; }
    .manual .mclr:hover { color: var(--bad); }

    /* ปฏิทินเลือกวันตาม Fraction: แต่ละวันแสดงจำนวนนัดที่มีแล้ว / สูงสุด */
    .mcal { border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-top: 8px; display: grid; gap: 8px; }
    .mcal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .mcal-head b { font-size: 15px; }
    .mcal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
    .mcal-grid .dow { font-size: 11px; color: var(--muted); text-align: center; font-weight: 600; }
    .mday {
      min-height: 54px; border: 1px solid var(--line); border-radius: 8px; background: var(--field); padding: 3px 2px;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 1px;
      cursor: pointer; font: inherit; color: inherit; min-width: 0;
    }
    .mday:hover:not(:disabled) { border-color: var(--accent); }
    .mday .dn { font-weight: 700; font-size: 14px; line-height: 1.25; }
    .mday .dc { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .mday .dfx { font-size: 10px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .mday.wkend, .mday.hol { background: var(--raise); }
    .mday.hol .dn { color: var(--bad); }
    .mday.full .dc { color: var(--warn); font-weight: 700; }
    .mday.over { background: var(--bad-soft); border-color: var(--bad-line); }
    .mday.over .dc { color: var(--bad); font-weight: 700; }
    .mday.today { box-shadow: inset 0 0 0 2px var(--accent); }
    .mday.picked { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    .mday.picked .dn, .mday.picked .dc { color: var(--accent-ink); }
    .mday.target { outline: 3px solid var(--sel-ring); outline-offset: 1px; }
    .mday.picked.over { box-shadow: inset 0 0 0 3px var(--bad); }
    .mday:disabled { opacity: .35; cursor: default; }
    .mlegend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
    .mlegend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; border: 1px solid var(--line); }

    .preview { display: grid; gap: 6px; max-height: 420px; overflow: auto; padding-right: 2px; }
    .fx {
      display: grid; gap: 8px; align-items: center;
      grid-template-columns: 64px minmax(0, 220px) minmax(0, 1fr);
      padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px;
    }
    .fx .no { font-weight: 700; color: var(--accent); }
    .fx .desc { font-size: 12px; color: var(--muted); }
    .fx.warn { background: var(--warn-soft); border-color: var(--warn-line); }
    .fx.warn .desc { color: var(--warn); }
    @media (max-width: 560px) {
      .fx { grid-template-columns: 52px 1fr; }
      .fx .desc { grid-column: 1 / -1; }
    }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      border: 1px solid var(--line); background: var(--field); border-radius: 10px; padding: 8px 14px; cursor: pointer;
    }
    .btn:hover { border-color: var(--accent); }
    .btn.primary {
      background: var(--accent); color: var(--accent-ink); border-color: var(--accent);
      font-weight: 700; font-size: 17px; padding: 12px 18px; width: 100%;
    }
    .btn.primary:hover { filter: brightness(1.08); }
    .btn:disabled { opacity: .55; cursor: progress; }
    .btn.sm { padding: 3px 10px; font-size: 13px; border-radius: 8px; }
    .btn.danger { color: var(--bad); }
    .btn.danger:hover { border-color: var(--bad); }
    .btn.okb { color: var(--ok); }
    .btn.okb:hover { border-color: var(--ok); }
    .btn.warnb { background: var(--warn); color: var(--on-warn); border-color: var(--warn); }

    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .toolbar input[type=search] { max-width: 260px; }
    .tablewrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--raise); position: sticky; top: 0; }
    td.name { white-space: normal; min-width: 140px; }
    tr.daysep td { background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 13px; padding: 5px 8px; }
    tr.cancel td:not(.act) { color: var(--muted); text-decoration: line-through; }
    .tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .tag.booked { background: var(--accent-soft); color: var(--accent); }
    .tag.done { background: var(--ok-soft); color: var(--ok); }
    .tag.cancel { background: var(--bad-soft); color: var(--bad); text-decoration: none; }
    td.act .acts { display: flex; gap: 4px; }
    .empty { text-align: center; color: var(--muted); padding: 24px; }
    .stats { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
    .stats b { color: var(--ink); font-size: 16px; }
    .badtext { color: var(--bad); }

    .toast {
      position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(140%);
      background: var(--toast-bg); color: var(--toast-ink); padding: 10px 18px; border-radius: 10px; transition: transform .25s, visibility .25s;
      max-width: calc(100% - 32px); z-index: 20; white-space: pre-line; visibility: hidden;
    }
    .toast.show { transform: translateX(-50%) translateY(0); visibility: visible; }
    .toast.err { background: var(--bad); color: var(--on-bad); }
    .modal { position: fixed; inset: 0; background: var(--overlay); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
    .modal.show { display: flex; }
    .modal .box { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; max-width: 520px; width: 100%; max-height: 92vh; overflow: auto; }
    .modal .box.wide { max-width: 600px; }
    .modal h3.plain { color: var(--ink); }
    .typepick { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .typepick input[type=text] { flex: 1 1 180px; width: auto; }
    .techtag { display: inline-block; padding: 1px 8px; border-radius: 6px; font-size: 12px; background: var(--raise); border: 1px solid var(--line); }
    td.stcell { white-space: normal; min-width: 150px; }
    .stline { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .btn.xs { padding: 1px 8px; font-size: 12px; border-radius: 7px; }
    .edited { display: block; margin-top: 3px; font-size: 11px; color: var(--muted); text-decoration: underline; text-align: left; }
    .histbox { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 10px; }
    .histbox h4 { margin: 0 0 6px; font-size: 14px; }
    .histbox ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 13px; }
    .histbox li { border-left: 3px solid var(--accent-soft); padding-left: 10px; }
    .histbox li b { font-weight: 600; }
    .histbox li ul { margin: 2px 0 0; padding-left: 16px; color: var(--muted); }
    .histbox .ago { color: var(--muted); font-size: 12px; }
    .modal h3 { margin: 0 0 8px; color: var(--warn); }
    .modal ul { padding-left: 18px; margin: 8px 0 14px; font-size: 14px; }
    .modal .acts { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
    .banner { background: var(--warn-soft); color: var(--warn); padding: 6px 16px; font-size: 13px; text-align: center; }
    .banner button { font: inherit; font-size: 12px; margin-left: 8px; border: 1px solid currentColor; background: none; color: inherit; border-radius: 6px; padding: 0 8px; cursor: pointer; }

    /* header: แท็บ + ผู้ใช้ + ภาษา + โหมดสี */
    .hleft { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; }
    .hright { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
    .tabs { display: flex; gap: 4px; }
    .tab {
      border: 0; background: var(--tab-bg); color: var(--header-ink); padding: 6px 14px; border-radius: 8px;
      cursor: pointer; font-weight: 600;
    }
    .tab.on { background: var(--tab-on-bg); color: var(--tab-on-ink); }
    .who { font-size: 13px; text-align: right; opacity: .92; }
    .who b { font-weight: 600; }
    .tools { display: flex; align-items: center; gap: 6px; }
    .seg { display: inline-flex; background: var(--tab-bg); border-radius: 8px; padding: 2px; }
    .seg button {
      border: 0; background: transparent; color: var(--header-ink); padding: 4px 10px; border-radius: 6px;
      cursor: pointer; font-size: 13px; font-weight: 600; min-width: 40px;
    }
    .seg button[aria-pressed="true"] { background: var(--tab-on-bg); color: var(--tab-on-ink); }
    .iconbtn {
      border: 0; background: var(--tab-bg); color: var(--header-ink); width: 36px; height: 32px; border-radius: 8px;
      display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .iconbtn svg { width: 18px; height: 18px; }
    /* ปุ่ม Home: กลับไปหน้าเว็บหลัก */
    .homebtn {
      display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px 0 10px; border-radius: 8px;
      border: 1px solid var(--home-line); background: var(--tab-bg); color: var(--header-ink);
      font-weight: 700; font-size: 14px; text-decoration: none; white-space: nowrap;
    }
    .homebtn svg { width: 18px; height: 18px; flex: none; }
    .homebtn:hover { filter: brightness(1.15); }
    .homebtn:focus-visible { outline: 2px solid var(--header-ink); outline-offset: 2px; }
    .iconbtn:hover, .seg button:hover { filter: brightness(1.15); }

    /* แถบแจ้งเตือนเกินเคส */
    .alertbar {
      background: var(--bad-soft); border: 1px solid var(--bad-line); color: var(--bad); border-radius: var(--radius);
      padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center;
    }
    .alertbar b { margin-right: 4px; }
    .alertbar button {
      font: inherit; font-size: 13px; border: 1px solid var(--bad-line); background: var(--card); color: var(--bad);
      border-radius: 999px; padding: 1px 10px; cursor: pointer;
    }
    .cap { font-size: 12px; font-weight: 600; }
    .cap.over { color: var(--bad); }

    /* ---------- แดชบอร์ด ---------- */
    .kpis { display: grid; gap: 12px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
    @media (max-width: 760px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
    .kpi .k { font-size: 13px; color: var(--muted); }
    .kpi .v { font-size: 28px; font-weight: 700; line-height: 1.2; }
    .kpi .s { font-size: 12px; color: var(--muted); }
    .kpi.bad { border-color: var(--bad-line); }
    .kpi.bad .v { color: var(--bad); }
    .monthnav { display: flex; align-items: center; gap: 8px; }
    .monthnav h2 { margin: 0; min-width: 150px; text-align: center; }
    .chartwrap { position: relative; }
    .chartwrap svg { display: block; width: 100%; height: auto; overflow: visible; }
    .chartwrap .grid line { stroke: var(--line); stroke-width: 1; }
    .chartwrap .axis text { fill: var(--muted); font-size: 11px; font-family: inherit; }
    .chartwrap .axis text.today { fill: var(--accent); font-weight: 700; }
    .chartwrap .limit { stroke: var(--bad); stroke-width: 1.5; stroke-dasharray: 5 4; }
    .chartwrap .limit-label { fill: var(--bad); font-size: 11px; font-weight: 600; font-family: inherit; }
    .chartwrap .bar { fill: var(--accent); }
    .chartwrap .bar.over { fill: var(--bad); }
    .chartwrap .bar.past { opacity: .45; }
    .chartwrap .hit { fill: transparent; cursor: pointer; }
    .chartwrap .bar, .chartwrap .val, .chartwrap .limit, .chartwrap .limit-label { pointer-events: none; }
    .chartwrap .hit:hover, .chartwrap .hit.sel { fill: var(--accent-hover); }
    .chartwrap .val { fill: var(--ink); font-size: 11px; font-weight: 600; font-family: inherit; text-anchor: middle; }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); margin-top: 6px; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
    .legend .dash { width: 16px; height: 0; border-top: 2px dashed var(--bad); border-radius: 0; vertical-align: 3px; }
    .tip {
      position: absolute; pointer-events: none; background: var(--toast-bg); color: var(--toast-ink); border-radius: 8px;
      padding: 8px 10px; font-size: 12px; line-height: 1.45; max-width: 260px; z-index: 5; display: none;
    }
    .tip b { font-size: 13px; }

    .calgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
    .calgrid .dow { font-size: 12px; color: var(--muted); font-weight: 600; text-align: center; padding-bottom: 2px; }
    .day {
      border: 1px solid var(--line); border-radius: 10px; min-height: 108px; padding: 6px; background: var(--card);
      display: flex; flex-direction: column; gap: 3px; cursor: pointer; text-align: left; font: inherit; color: inherit;
    }
    .day:hover { border-color: var(--accent); }
    .day.out { background: transparent; border-style: dashed; opacity: .45; cursor: default; }
    .day.holiday { background: var(--raise); }
    .day.today { outline: 2px solid var(--accent); outline-offset: -1px; }
    .day.sel { box-shadow: 0 0 0 3px var(--sel-ring); }
    .day.over { background: var(--bad-soft); border-color: var(--bad-line); }
    .day .top { display: flex; justify-content: space-between; align-items: center; gap: 4px; }
    .day .num { font-weight: 700; font-size: 14px; }
    .day .cnt { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 0 8px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
    .day.full .cnt { background: var(--warn-soft); color: var(--warn); }
    .day.over .cnt { background: var(--bad); color: var(--on-bad); }
    .day .hol { font-size: 11px; color: var(--muted); }
    .day ul { list-style: none; margin: 0; padding: 0; font-size: 11.5px; line-height: 1.35; overflow: hidden; }
    .day li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .day li.done { color: var(--ok); }
    .day li.more { color: var(--muted); }
    @media (max-width: 700px) {
      .calgrid { grid-template-columns: 1fr; }
      .calgrid .dow, .day.out, .day.empty { display: none; }
      .day { min-height: 0; }
      .day ul { font-size: 13px; }
      .day li { white-space: normal; }
    }
    .daydetail h3 { margin: 0 0 8px; font-size: 16px; }
    .docsum { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    /* ---------- เข้าสู่ระบบ / สมัครสมาชิก ---------- */
    .authwrap { display: flex; justify-content: center; padding-inline: 16px; padding-block: 40px 56px; }
    .authcard {
      width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      padding: 22px; display: grid; gap: 14px; align-content: start;
    }
    .authcard h2 { margin: 0; font-size: 24px; line-height: 1.25; text-wrap: balance; color: var(--accent); }
    .authcard .authorg { margin: 2px 0 6px; font-size: 14px; font-weight: 600; color: var(--ink); }
    .authcard p { margin: 4px 0 0; }
    .authcard form { display: grid; gap: 12px; }
    .authcard .field { margin: 0; }
    .authmsg { font-size: 14px; padding: 8px 12px; border-radius: 8px; }
    .authmsg.err { background: var(--bad-soft); color: var(--bad); }
    .authmsg.ok { background: var(--ok-soft); color: var(--ok); }
    .linkbtn { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; font-size: 14px; text-decoration: underline; justify-self: start; }
    .pwwrap { position: relative; }
    .pwwrap input { padding-right: 70px; }
    .pwwrap button {
      position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: var(--raise);
      color: var(--muted); border-radius: 6px; padding: 2px 8px; font-size: 12px; cursor: pointer;
    }
    .authalt { border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 8px; text-align: center; }
    .authalt a.btn { color: var(--ink); text-decoration: none; font-weight: 600; }
    .authfoot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .logout {
      border: 0; background: var(--tab-bg); color: var(--header-ink); padding: 2px 10px; border-radius: 7px;
      cursor: pointer; font-size: 12px; font-weight: 600; margin-left: 6px;
    }
    .tab .badge { background: var(--bad); color: var(--on-bad); border-radius: 999px; font-size: 11px; padding: 0 6px; margin-left: 4px; }
    .tag.pending { background: var(--warn-soft); color: var(--warn); }
    .tag.admin { background: var(--accent); color: var(--accent-ink); }
    .docsum span { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 1px 10px; font-size: 12px; font-weight: 600; }
  </style>
</head>

  <main id="appMain" hidden>
    <div class="alertbar" id="alertBar" hidden></div>

    <div id="viewBook" style="display:grid; gap:16px">
    <div class="grid2">
      <!-- ฟอร์มลงนัด -->
      <section class="card">
        <h2 data-i18n="new_appt"></h2>
        <form id="f" autocomplete="off">
          <div class="row">
            <div class="field">
              <label for="hn" class="req">HN</label>
              <input type="text" id="hn" required data-i18n-ph="hn_ph" inputmode="numeric">
            </div>
            <div class="field">
              <label for="doctor" class="req" data-i18n="doctor"></label>
              <select id="doctor" required><option value="" data-i18n="choose_doctor"></option></select>
            </div>
          </div>
          <div class="field">
            <label for="name" class="req" data-i18n="name"></label>
            <input type="text" id="name" required data-i18n-ph="name_ph">
          </div>

          <div class="field">
            <label class="req" id="techLabel" data-i18n="technique"></label>
            <div class="typepick" role="radiogroup" aria-labelledby="techLabel">
              <div class="chips" id="techChips"></div>
              <input type="text" id="techOther" maxlength="100" data-i18n-ph="tech_other_ph" hidden>
            </div>
          </div>

          <div class="field">
            <label for="totalFx" class="req" data-i18n="fx_count"></label>
            <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap">
              <input type="number" id="totalFx" min="1" max="30" value="4" required style="width:90px">
              <div class="chips" id="fxChips"></div>
            </div>
          </div>

          <div class="field" style="max-width:240px" id="startDateField">
            <label for="startDate" class="req" data-i18n="start_date"></label>
            <input type="date" id="startDate" required>
          </div>

          <div class="field">
            <label data-i18n="pattern"></label>
            <div class="radio">
              <label><input type="radio" name="mode" value="days" checked> <span data-i18n="by_weekday"></span></label>
              <label><input type="radio" name="mode" value="interval"> <span data-i18n="every_n"></span></label>
              <label><input type="radio" name="mode" value="manual"> <span data-i18n="by_manual"></span></label>
            </div>
            <div id="modeDays">
              <div class="days" id="days"></div>
              <div class="chips" style="margin-top:6px">
                <button type="button" class="chip" data-preset="1,2,3,4,5" data-i18n="p_mf"></button>
                <button type="button" class="chip" data-preset="1,4" data-i18n="p_mth"></button>
                <button type="button" class="chip" data-preset="2,5" data-i18n="p_tf"></button>
                <button type="button" class="chip" data-preset="weekly" data-i18n="p_weekly"></button>
              </div>
            </div>
            <div id="modeInterval" hidden>
              <div style="display:flex; gap:8px; align-items:center">
                <span data-i18n="every"></span> <input type="number" id="interval" min="1" max="30" value="7" style="width:80px"> <span data-i18n="days_unit"></span>
              </div>
            </div>
            <div id="modeManual" hidden>
              <div class="hint" data-i18n="manual_hint"></div>
              <div class="mcal">
                <div class="mcal-head">
                  <button type="button" class="btn sm" id="mPrev" data-i18n-aria="prev_m">‹</button>
                  <b id="mTitle"></b>
                  <button type="button" class="btn sm" id="mNext" data-i18n-aria="next_m">›</button>
                </div>
                <div class="mcal-grid" id="mGrid"></div>
                <div class="mlegend" id="mLegend"></div>
              </div>
              <div class="manual" id="manualList"></div>
            </div>
            <div style="margin-top:8px" id="holidayRow">
              <label class="check" style="margin:0"><input type="checkbox" id="skipHoliday" checked> <span data-i18n="skip_holiday"></span></label>
            </div>
          </div>

          <div class="field">
            <label for="note" data-i18n="note"></label>
            <textarea id="note" rows="2" data-i18n-ph="note_ph"></textarea>

  const ST_BOOKED = 'นัดแล้ว', ST_DONE = 'มาตามนัด', ST_CANCEL = 'ยกเลิก';
  const STATUS_KEY = { [ST_BOOKED]: 'st_booked', [ST_DONE]: 'st_done', [ST_CANCEL]: 'st_cancel' };

  let lang = document.documentElement.lang === 'en' ? 'en' : 'th';
  function t(key, vars) {
    const s = (I18N[lang] && I18N[lang][key]) || I18N.th[key] || key;
    return s.replace(/\{(\w+)\}/g, (m, k) => (vars && k in vars ? vars[k] : m));
  }

  const store = {
    get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } },

  /* ================= token เข้าสู่ระบบ ================= */
  // "จำฉันไว้" เก็บใน localStorage ไม่งั้นเก็บใน sessionStorage (ปิดเบราว์เซอร์แล้วต้องเข้าใหม่)
  const auth = {
    token: (function () {
      try { return localStorage.getItem('bq-token') || sessionStorage.getItem('bq-token') || ''; } catch (e) { return ''; }
    })(),
    save(tk, remember) {
      this.token = tk;
      try {
        localStorage.removeItem('bq-token'); sessionStorage.removeItem('bq-token');
        (remember ? localStorage : sessionStorage).setItem('bq-token', tk);
      } catch (e) { /* ใช้ token ในหน่วยความจำต่อไป */ }
    },

  const isGas = typeof google !== 'undefined' && google.script && google.script.run;

  // ถ้าเซิร์ฟเวอร์ตอบว่าต้องเข้าสู่ระบบใหม่ (token หมดอายุ/บัญชีถูกระงับ) ให้กลับไปหน้าเข้าสู่ระบบ
  function withAuthCheck(raw) {
    const wrapped = {};
    Object.keys(raw).forEach(k => {
      wrapped[k] = (...args) => raw[k](...args).catch(e => {
        const m = e && e.message ? e.message : String(e);
        if (m.indexOf(AUTH_PREFIX) >= 0) onAuthLost(m.slice(m.indexOf(AUTH_PREFIX) + AUTH_PREFIX.length).trim());
        throw e;
      });
    });
    return wrapped;
  }

  function gasApi() {
    const call = (fn, ...args) => new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
    });
    return {
      login: (f) => call('login', Object.assign({ lang: lang }, f)),
      ssoLogin: (ticket) => call('ssoLogin', ticket, lang),
      logout: (tk) => call('logout', tk),
      init: () => call('getInitData', auth.token, lang),
      list: () => call('listAppointments', auth.token, lang),
      create: (p) => call('createAppointments', auth.token, Object.assign({ lang: lang }, p)),
      cancel: (id, scope) => call('cancelAppointment', auth.token, id, scope, lang),
      done: (id) => call('markDone', auth.token, id, lang),
      edit: (id, ch) => call('updateAppointment', auth.token, id, ch, lang)
    };
  }

  function mockApi() {
    const KEY = 'brachyQueueDemo';
    const MAX = 6;
    const DOCS = ['ทัศน์วรรณ อาษากิจ', 'ศิริรัตน์ เชื้อสำราญ', 'พัฒธิดา มโนรส', 'ทินกร จอมใจ'];
    const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; } };
    const save = (a) => store.set(KEY, JSON.stringify(a));
    // เรียงตามวันที่ แล้วตามลำดับที่ลงนัด (เหมือนลำดับแถวในชีต)
    const sorted = () => load().map((a, i) => Object.assign(a, { row: i })).sort((a, b) => a.date.localeCompare(b.date) || a.row - b.row);
    const delay = (v) => new Promise(r => setTimeout(() => r(v), 300));
    const fail = (key) => new Promise((r, rej) => setTimeout(() => rej(new Error(t(key))), 300));
    // บัญชีในโหมดทดลอง: ชื่อผู้ใช้อะไรก็ได้ รหัสผ่านอย่างน้อย 8 ตัว (ของจริงตรวจที่ LPCH RO Workspace)
    const now = () => { const d = new Date(); return iso(d) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
    const demoUser = (u) => ({ username: u, fullName: 'ผู้ใช้ทดลอง ' + u, role: 'RO', email: '', isAdmin: true });
    const me = () => (auth.token.startsWith('demo.') ? demoUser(auth.token.slice(5)) : null);
    const needUser = (fn) => {
      const a = me();
      if (!a) return Promise.reject(new Error(AUTH_PREFIX + ' ' + t('m_session')));
      return fn(a);
    };
    const label = () => { const a = me(); return a ? a.fullName + ' (' + a.username + ')' : 'demo'; };
    function addHist(a, changes) {
      const at = now();
      a.history = (a.history || []).concat([{ at, by: (me() || {}).username || 'demo', name: label(), changes }]);
      a.editedBy = label(); a.editedAt = at;
    }
    return {
      login: (f) => {
        const id = String(f.login || '').trim().toLowerCase();
        if (!id || String(f.password || '').length < 8) return fail('m_badLogin');
        const u = id.split('@')[0].replace(/[^a-z0-9._-]/g, '') || 'demo';
        return delay({ token: 'demo.' + u, user: demoUser(u) });
      },
      ssoLogin: () => fail('m_sso_demo'),
      logout: () => delay({ ok: true }),
      init: () => needUser(a => delay({
        user: a,
        doctors: DOCS,
        techniques: ['Full', 'Mould', 'เสียบเข็ม'],
        holidays: [{ date: '2026-10-13', name: 'วันนวมินทรมหาราช' }, { date: '2026-10-23', name: 'วันปิยมหาราช' }],
        settings: { maxCasesPerDay: MAX, calendarName: 'Demo' },
        appointments: sorted()
      })),
      seed: () => {
        // ข้อมูลตัวอย่างสำหรับดูหน้าแดชบอร์ด
        const all = []; const base = new Date(); base.setDate(base.getDate() - 6);
        const first = ['สมหญิง', 'มาลี', 'บุญมา', 'จันทร์เพ็ญ', 'สุดา', 'วิไล', 'ประภา', 'นงลักษณ์', 'อรุณี', 'กาญจนา', 'ลำดวน', 'พิมพ์ใจ'];
        const last = ['ใจดี', 'ศรีสุข', 'แก้วมณี', 'ทองดี', 'บุญเรือง', 'สายทอง', 'รุ่งเรือง', 'มีสุข'];
        const todayStr = iso(new Date());
        for (let k = 0; k < 14; k++) {
          const startDay = new Date(base); startDay.setDate(base.getDate() + (k * 3) % 26);
          const days = k % 3 === 0 ? [1, 4] : [1, 2, 3, 4, 5];
          const total = 4; const courseId = 'BTDEMO' + k; let d = new Date(startDay), fx = 0, guard = 0;
          while (fx < total && guard++ < 60) {
            if (days.includes(d.getDay())) {
              fx++;
              const ds = iso(d);
              all.push({ apptId: courseId + '-' + fx, courseId, hn: String(6500100 + k * 37), name: first[k % first.length] + ' ' + last[k % last.length],
                doctor: DOCS[k % 4], fx, totalFx: total, date: ds, note: '', status: ds < todayStr ? ST_DONE : ST_BOOKED,
                technique: ['Full', 'Mould', 'เสียบเข็ม'][k % 3], createdAt: ds + ' 09:00', createdBy: 'demo', history: [] });
            }
            d.setDate(d.getDate() + 1);
          }
        }
        save(all); return delay(sorted());
      },
      clear: () => { save([]); return delay([]); },
      list: () => delay(sorted()),
      create: (p) => {
        const all = load();
        if (!p.force) {
          const conflicts = [];
          p.sessions.forEach((s, i) => {
            const o = all.filter(a => a.status === ST_BOOKED && a.hn === p.hn && a.date === s.date);
            if (o.length) conflicts.push({ fx: i + 1, date: s.date, with: o.map(a => 'HN ' + a.hn + ' ' + a.name + ' Fx ' + a.fx + '/' + a.totalFx).join(', ') });
          });
          const counts = {}; all.forEach(a => { if (a.status !== ST_CANCEL) counts[a.date] = (counts[a.date] || 0) + 1; });
          const adding = {}; p.sessions.forEach(s => { adding[s.date] = (adding[s.date] || 0) + 1; });
          const overCapacity = Object.keys(adding).sort().map(d => ({ date: d, existing: counts[d] || 0, adding: adding[d], total: (counts[d] || 0) + adding[d] })).filter(x => x.total > MAX);
          if (conflicts.length || overCapacity.length) return delay({ ok: false, needConfirm: true, conflicts, overCapacity, max: MAX });
        }
        const courseId = 'BT' + Date.now().toString().slice(-10);
        const by = me();
        p.sessions.forEach((s, i) => all.push({
          apptId: courseId + '-' + (i + 1), courseId, hn: p.hn, name: p.name, doctor: p.doctor, technique: p.technique,
          fx: i + 1, totalFx: p.totalFx, date: s.date, note: p.note, status: ST_BOOKED,
          createdAt: now(), createdBy: by ? by.username : 'demo', history: []
        }));
        save(all);
        const counts2 = {}; all.forEach(a => { if (a.status !== ST_CANCEL) counts2[a.date] = (counts2[a.date] || 0) + 1; });
        const over2 = [...new Set(p.sessions.map(s => s.date))].filter(d => counts2[d] > MAX).map(d => ({ date: d, total: counts2[d] }));
        return delay({ ok: true, courseId, count: p.sessions.length, overCapacity: over2, appointments: sorted() });
      },
      cancel: (id, scope) => {
        const all = load(); const tg = all.find(a => a.apptId === id); let changed = 0;
        all.forEach(a => {
          const m = scope === 'course' ? a.courseId === tg.courseId && a.status === ST_BOOKED : a.apptId === id;
          if (m && a.status !== ST_CANCEL) { addHist(a, [{ f: 'status', from: a.status, to: ST_CANCEL }]); a.status = ST_CANCEL; changed++; }
        });
        save(all); return delay({ ok: true, changed, appointments: sorted() });
      },
      done: (id) => {
        const all = load();
        all.forEach(a => { if (a.apptId === id) { addHist(a, [{ f: 'status', from: a.status, to: ST_DONE }]); a.status = ST_DONE; } });
        save(all); return delay({ ok: true, changed: 1, appointments: sorted() });
      },
      edit: (id, ch) => {
        const all = load(); const a = all.find(x => x.apptId === id);
        const diff = Object.keys(ch).filter(f => (a[f] || '') !== ch[f]).map(f => ({ f, from: a[f] || '', to: ch[f] }));
        if (diff.length) { addHist(a, diff); diff.forEach(d => { a[d.f] = d.to; }); save(all); }
        const total = all.filter(x => x.date === a.date && x.status !== ST_CANCEL).length;
        return delay({ ok: true, changed: diff.length, overCapacity: total > MAX && ch.date ? [{ date: a.date, total }] : [], appointments: sorted() });
      }
    };
  }

  /* ================= state & helpers ================= */
