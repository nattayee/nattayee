    showAuth('login', t('logged_out'), true);
  });

  /* ================= โหมดกลางวัน / กลางคืน ================= */
  const darkMq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function effectiveTheme() {
    const a = document.documentElement.getAttribute('data-theme');
    if (a === 'light' || a === 'dark') return a;
    return darkMq && darkMq.matches ? 'dark' : 'light';
  }
  function updateThemeButton() {
    const dark = effectiveTheme() === 'dark';
    // SVG ไม่มี property .hidden จึงต้องสลับ attribute เอง
    $('icoMoon').toggleAttribute('hidden', dark);   // โหมดกลางวัน: แสดงพระจันทร์ (กดเพื่อเป็นกลางคืน)
    $('icoSun').toggleAttribute('hidden', !dark);   // โหมดกลางคืน: แสดงพระอาทิตย์ (กดเพื่อเป็นกลางวัน)
    const label = dark ? t('to_light') : t('to_dark');
    $('themeBtn').setAttribute('aria-label', label);
    $('themeBtn').title = label;
  }
  $('themeBtn').addEventListener('click', () => {
    const next = effectiveTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    store.set('bq-theme', next);
    updateThemeButton();
  });
  if (darkMq && darkMq.addEventListener) darkMq.addEventListener('change', updateThemeButton);

  /* ================= form setup ================= */
  [1, 2, 3, 4, 5, 6].forEach(n => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.textContent = n; b.dataset.fx = n;
    $('fxChips').appendChild(b);
  });
  $('fxChips').addEventListener('click', (e) => {
    if (!e.target.dataset.fx) return;
    $('totalFx').value = e.target.dataset.fx; regenerate();
  });

  // วันในสัปดาห์ (เริ่มจันทร์)
  [1, 2, 3, 4, 5, 6, 0].forEach(d => {
    const l = document.createElement('label');
    l.innerHTML = '<input type="checkbox" value="' + d + '"' + (d >= 1 && d <= 5 ? ' checked' : '') + '><span></span>';
    $('days').appendChild(l);
  });
  document.querySelectorAll('[data-preset]').forEach(b => b.addEventListener('click', () => {
    let set;
    if (b.dataset.preset === 'weekly') {
      const sd = $('startDate').value ? parseIso($('startDate').value).getDay() : 1;
      set = [sd];
    } else set = b.dataset.preset.split(',').map(Number);
    $('days').querySelectorAll('input').forEach(i => { i.checked = set.includes(Number(i.value)); });
    regenerate();
  }));
  document.querySelectorAll('input[name=mode]').forEach(r => r.addEventListener('change', () => {
    const m = modeVal();
    // เปลี่ยนเป็นเลือกวันเอง: ตั้งต้นจากวันที่ที่สร้างไว้ตอนนี้ แล้วค่อยแก้ทีละ Fx
    if (m === 'manual') {
      state.manual = state.sessions.map(x => x.date);
      state.manualActive = -1;
      const first = state.manual.find(Boolean);
      state.manualMonth = monthStart(first ? parseIso(first) : new Date());
    }
    $('modeDays').hidden = m !== 'days';
    $('modeInterval').hidden = m !== 'interval';
    $('modeManual').hidden = m !== 'manual';
    $('startDateField').hidden = m === 'manual';
    $('holidayRow').hidden = m === 'manual';
    regenerate();
  }));
  const modeVal = () => document.querySelector('input[name=mode]:checked').value;

  ['totalFx', 'startDate', 'interval', 'skipHoliday'].forEach(id => $(id).addEventListener('change', regenerate));
  $('days').addEventListener('change', regenerate);
  $('totalFx').addEventListener('input', regenerate);
  $('hn').addEventListener('change', renderPreview);

  /* ================= เลือกวันเองตาม Fraction ================= */
  // state.manual = วันของแต่ละ Fx ('' = ยังไม่เลือก), manualActive = Fx ที่การกดวันในปฏิทินจะใส่ให้ (-1 = ไม่มี)
  state.manual = []; state.manualActive = -1; state.manualMonth = null;
  // ให้ Fx ที่เลือกอยู่ชี้ไปช่องว่างช่องแรก ถ้าตอนนี้ไม่ได้ชี้ช่องใด
  function fixManualActive() {
    if (state.manualActive < 0 || state.manualActive >= state.manual.length) state.manualActive = state.manual.findIndex(d => !d);
  }
  // เรียงวันจากเก่าไปใหม่ (Fx 1 = วันแรก) ช่องว่างไปอยู่ท้าย แล้วชี้ Fx ที่เลือกไปช่องว่างช่องแรก
  function sortManual() {
    const filled = state.manual.filter(Boolean).sort();
    state.manual = filled.concat(state.manual.map(() => '').slice(filled.length));
    state.manualActive = filled.length < state.manual.length ? filled.length : -1;
  }
  function renderManual() {
    fixManualActive();
    $('manualList').innerHTML = state.manual.map((d, i) =>
      '<div class="mrow' + (i === state.manualActive ? ' on' : '') + '">' +
      '<button type="button" class="mfx" data-mact="' + i + '" aria-pressed="' + (i === state.manualActive) + '" title="' +
        esc(t('m_pick_fx', { n: i + 1 })) + '">Fx ' + (i + 1) + '</button>' +
      '<input type="date" data-mi="' + i + '" value="' + esc(d) + '"' + (d ? '' : ' class="empty"') +
        ' aria-label="' + esc(t('fx_date_aria', { n: i + 1 })) + '">' +
      '<button type="button" class="mclr" data-mclr="' + i + '" aria-label="' + esc(t('m_clear', { n: i + 1 })) + '" title="' +
        esc(t('m_clear', { n: i + 1 })) + '"' + (d ? '' : ' hidden') + '>×</button></div>').join('');
    renderManualCal();
  }
  // ปฏิทินเดือนเดียว (เริ่มวันจันทร์) แต่ละวัน: จำนวนนัดที่มีแล้ว / สูงสุด และ Fx ที่เลือกวันนั้น
  function renderManualCal() {
    if (modeVal() !== 'manual') return;
    if (!state.manualMonth) state.manualMonth = monthStart(new Date());
    const m = state.manualMonth, days = daysOfMonth(m), counts = dayCounts(), today = todayIso();
    const picked = {};
    state.manual.forEach((d, i) => { if (d) (picked[d] = picked[d] || []).push(i + 1); });
    const target = state.manual[state.manualActive] || '';
    $('mTitle').textContent = m.toLocaleDateString(LOCALE[lang], { month: 'long', year: 'numeric' });
    let html = [1, 2, 3, 4, 5, 6, 0].map(d => '<div class="dow">' + esc(DOW[lang][d]) + '</div>').join('');
    const lead = (m.getDay() + 6) % 7;
    for (let i = 0; i < lead; i++) html += '<div></div>';
    days.forEach(d => {
      const dt = parseIso(d), n = (counts[d] || []).length, fx = picked[d] || [], total = n + fx.length;
      const hol = state.holidays[d], wk = dt.getDay() === 0 || dt.getDay() === 6;
      const cls = ['mday', d < today ? 'past' : '', wk ? 'wkend' : '', hol ? 'hol' : '', d === today ? 'today' : '',
        fx.length ? 'picked' : '', d === target ? 'target' : '',
        total > state.max ? 'over' : total === state.max ? 'full' : ''].filter(Boolean).join(' ');
      const tip = fmtDate(d, LONG) + ' · ' + t('booked_cap', { n: n, max: state.max }) + (hol ? ' · ' + t('w_holiday', { name: hol }) : '') +
        (fx.length ? ' · Fx ' + fx.join(', ') : '');
      html += '<button type="button" class="' + cls + '" data-md="' + d + '"' + (d < today ? ' disabled' : '') +
        ' title="' + esc(tip) + '" aria-label="' + esc(tip) + '">' +
        '<span class="dn">' + dt.getDate() + '</span>' +
        '<span class="dc">' + (total > state.max ? '⚠ ' : '') + n + '/' + state.max + '</span>' +
        (fx.length ? '<span class="dfx">Fx ' + fx.join(',') + '</span>' : '') + '</button>';
    });
    $('mGrid').innerHTML = html;
    $('mLegend').innerHTML = '<span>' + esc(t('ml_booked')) + '</span>' +
      '<span><i style="background:var(--accent);border-color:var(--accent)"></i>' + esc(t('ml_picked')) + '</span>' +
      '<span><i style="background:var(--bad-soft);border-color:var(--bad-line)"></i>' + esc(t('ml_over')) + '</span>' +
      '<span><i style="background:var(--raise)"></i>' + esc(t('ml_off')) + '</span>';
  }
  $('mPrev').addEventListener('click', () => { const m = state.manualMonth; state.manualMonth = new Date(m.getFullYear(), m.getMonth() - 1, 1); renderManualCal(); });
  $('mNext').addEventListener('click', () => { const m = state.manualMonth; state.manualMonth = new Date(m.getFullYear(), m.getMonth() + 1, 1); renderManualCal(); });
  // กดวัน: ใส่ให้ Fx ที่เลือกอยู่ แล้วเลื่อนไปช่องว่างถัดไป
  $('mGrid').addEventListener('click', (e) => {
    const b = e.target.closest('[data-md]'); if (!b || b.disabled) return;
    fixManualActive();
    const i = state.manualActive;
    if (i < 0) { toast(t('m_full', { n: state.manual.length })); return; }
    state.manual[i] = b.dataset.md;
    sortManual();
    regenerate();
  });
  $('manualList').addEventListener('click', (e) => {
    const pick = e.target.closest('[data-mact]'), clr = e.target.closest('[data-mclr]');
    if (pick) {
      state.manualActive = Number(pick.dataset.mact);
      const d = state.manual[state.manualActive];
      if (d) state.manualMonth = monthStart(parseIso(d));
      renderManual();
    } else if (clr) {
      state.manual[Number(clr.dataset.mclr)] = '';
      sortManual();
      regenerate();
    }
  });
  // พิมพ์/เลือกวันจากช่องวันที่ได้เหมือนเดิม
  $('manualList').addEventListener('focusin', (e) => {
    const i = e.target.dataset.mi; if (i == null || Number(i) === state.manualActive) return;
    state.manualActive = Number(i);
    $('manualList').querySelectorAll('.mrow').forEach((r, k) => r.classList.toggle('on', k === state.manualActive));
    renderManualCal();
  });
  $('manualList').addEventListener('change', (e) => {
    const i = e.target.dataset.mi; if (i == null) return;
    state.manual[Number(i)] = e.target.value;
    e.target.classList.toggle('empty', !e.target.value);
    const clr = e.target.parentNode.querySelector('.mclr'); if (clr) clr.hidden = !e.target.value;
    if (e.target.value) state.manualMonth = monthStart(parseIso(e.target.value));
    regenerate(true);
  });

  /* ================= สร้างรายการวันนัด ================= */
  function isBlocked(d) {
    if (!$('skipHoliday').checked) return false;
    return d.getDay() === 0 || d.getDay() === 6 || !!state.holidays[iso(d)];
  }
  function nextFree(d) {
    let x = new Date(d), guard = 0;
    while (isBlocked(x) && guard++ < 60) x = addDays(x, 1);
    return x;
  }

  function regenerate(keepManualInputs) {
    const n = Math.max(0, Math.min(30, parseInt($('totalFx').value, 10) || 0));
    if (modeVal() === 'manual') {
      // ช่องวันที่เท่ากับจำนวน Fraction: เพิ่มช่องว่างหรือตัดช่องท้ายออก
      state.manual = state.manual.slice(0, n);
      while (state.manual.length < n) state.manual.push('');
      if (keepManualInputs !== true) renderManual(); else renderManualCal();
      state.sessions = state.manual.map(d => ({ date: d }));
      renderPreview();
      return;
    }
    const sd = $('startDate').value;
    const out = [];
    if (sd && n) {
      if (modeVal() === 'interval') {
        const step = Math.max(1, parseInt($('interval').value, 10) || 1);
        let d = nextFree(parseIso(sd));
        for (let i = 0; i < n; i++) { out.push(d); d = nextFree(addDays(d, step)); }
      } else {
        const allowed = Array.from($('days').querySelectorAll('input:checked')).map(i => Number(i.value));
        if (allowed.length) {
          let d = parseIso(sd), guard = 0;
          while (out.length < n && guard++ < 400) {
            const holiday = $('skipHoliday').checked && state.holidays[iso(d)];
            if (allowed.includes(d.getDay()) && !holiday) out.push(new Date(d));
            d = addDays(d, 1);
          }
        }
      }
    }
    state.sessions = out.map(d => ({ date: iso(d) }));
    renderPreview();
  }

  function renderPreview() {
    const box = $('preview');
    const n = state.sessions.length;
    if (!state.busy) $('saveBtn').textContent = n ? t('save_n', { n: n }) : t('save');
    if (!n) { box.innerHTML = '<div class="empty">' + esc(t('preview_empty')) + '</div>'; return; }
    const booked = state.appts.filter(a => a.status === ST_BOOKED);
    const counts = dayCounts();
    const hn = $('hn').value.trim();
    box.innerHTML = state.sessions.map((s, i) => {
      if (!s.date) {
        return '<div class="fx warn"><span class="no">Fx ' + (i + 1) + '</span>' +
          '<input type="date" data-i="' + i + '" value="" aria-label="' + esc(t('fx_date_aria', { n: i + 1 })) + '">' +
          '<span class="desc">⚠️ ' + esc(t('w_nodate')) + '</span></div>';
      }
      const warns = [];
      const d = parseIso(s.date);
      if (state.holidays[s.date]) warns.push(t('w_holiday', { name: state.holidays[s.date] }));
      if (d.getDay() === 0 || d.getDay() === 6) warns.push(t('w_weekend'));
      if (s.date < todayIso()) warns.push(t('w_past'));
      const prev = state.sessions.slice(0, i).map(x => x.date).filter(Boolean).pop();
      if (prev && s.date < prev) warns.push(t('w_order'));
      if (hn && booked.some(a => a.hn === hn && a.date === s.date)) warns.push(t('w_dup'));
      const existing = (counts[s.date] || []).length;
      const after = existing + state.sessions.filter(x => x.date === s.date).length;
      if (after > state.max) warns.push(t('w_over', { n: after, max: state.max }));
      return '<div class="fx' + (warns.length ? ' warn' : '') + '">' +
        '<span class="no">Fx ' + (i + 1) + '</span>' +
        '<input type="date" data-i="' + i + '" value="' + s.date + '" aria-label="' + esc(t('fx_date_aria', { n: i + 1 })) + '">' +
        '<span class="desc">' + esc(fmtDate(s.date, LONG)) +
        ' · <span class="cap' + (after > state.max ? ' over' : '') + '">' + esc(t('booked_cap', { n: existing, max: state.max })) + '</span>' +
        (warns.length ? ' — ⚠️ ' + esc(warns.join(' · ')) : '') + '</span>' +
        '</div>';
    }).join('');
  }
  $('preview').addEventListener('change', (e) => {
    const i = e.target.dataset.i;
    if (i == null || !e.target.value) return;
    state.sessions[Number(i)].date = e.target.value;
    if (modeVal() === 'manual') { state.manual[Number(i)] = e.target.value; renderManual(); }
    renderPreview();
  });

  /* ================= บันทึก (คลิกเดียว) ================= */
  function buildPayload(force) {
    return {
      hn: $('hn').value.trim(), name: $('name').value.trim(), doctor: $('doctor').value.trim(), technique: techPick.get(),
      totalFx: parseInt($('totalFx').value, 10), note: $('note').value.trim(),
      sessions: state.sessions.map(s => ({ date: s.date })), force: !!force
    };
  }

  function validate(p) {
    if (!p.hn) return ['hn', t('v_hn')];
    if (!p.name) return ['name', t('v_name')];
    if (!p.doctor) return ['doctor', t('v_doctor')];
    if (!techPick.selected()) return [null, t('v_tech')];
    if (!p.technique) return ['techOther', t('v_tech_other')];
    if (!(p.totalFx >= 1 && p.totalFx <= 30)) return ['totalFx', t('v_fx')];
    if (modeVal() !== 'manual' && !$('startDate').value) return ['startDate', t('v_start')];
    if (p.sessions.length !== p.totalFx) return [null, t('v_incomplete', { n: p.totalFx })];
    const bad = p.sessions.findIndex(s => !s.date);
    if (bad >= 0) {
      const el = modeVal() === 'manual' ? document.querySelector('[data-mi="' + bad + '"]') : null;
      if (el) el.focus();
      return [null, t('v_fxdate', { n: bad + 1 })];
    }
    const dupHn = state.appts.find(a => a.hn === p.hn && a.status === ST_BOOKED && a.date >= todayIso());
    if (dupHn && !confirm(t('c_dup_course', { hn: p.hn, date: fmtDate(dupHn.date) }))) return [null, null];
    return null;
  }

  async function save(force) {
    if (state.busy) return;
    const p = buildPayload(force);
    const v = force ? null : validate(p);
    if (v) {
      if (v[0]) $(v[0]).focus();
      if (v[1]) toast(v[1], true);
      return;
    }
    setBusy(true);
    try {
      const res = await api.create(p);
      if (res.needConfirm) { showConfirm(res); return; }
      state.appts = res.appointments;
      if (res.overCapacity && res.overCapacity.length) {
        toast(t('t_saved_over', { max: state.max, list: res.overCapacity.map(d => fmtDate(d.date) + ' (' + d.total + ')').join(', ') }), true);
      } else {
        toast(t('t_saved', { hn: p.hn, n: res.count }));
      }
      resetForm();
    } catch (e) {
      toast(t('t_save_failed', { msg: errMsg(e) }), true);
    } finally {
      setBusy(false);
      renderAll();
    }
  }
  $('saveBtn').addEventListener('click', () => save(false));
  $('f').addEventListener('submit', (e) => { e.preventDefault(); save(false); });

  function setBusy(b) {
    state.busy = b;
    $('saveBtn').disabled = b;
    if (b) $('saveBtn').textContent = t('saving'); else renderPreview();
  }

  function resetForm() {
    ['hn', 'name', 'note'].forEach(id => { $(id).value = ''; });
    $('doctor').value = '';
    techPick.set('');
    state.manual = []; state.manualActive = -1;
    regenerate();
    $('hn').focus();
  }

  function showConfirm(res) {
    let html = '';
    const over = res.overCapacity || [], conf = res.conflicts || [];
    const max = res.max || state.max;
    if (over.length) {
      html += '<p><b class="badtext">' + esc(t('m_over', { max: max })) + '</b></p><ul>' + over.map(d =>
        '<li>' + esc(t('m_over_li', { date: fmtDate(d.date), e: d.existing, a: d.adding })) + ' <b class="badtext">' + esc(cases(d.total)) + '</b></li>'
      ).join('') + '</ul>';
    }
    if (conf.length) {
      html += '<p><b>' + esc(t('m_dup')) + '</b></p><ul>' + conf.map(c =>
        '<li><b>Fx ' + c.fx + '</b> ' + esc(fmtDate(c.date)) + '<br><span class="hint">' + esc(t('m_dup_with', { w: c.with })) + '</span></li>'
      ).join('') + '</ul>';
    }
    html += '<p class="hint">' + esc(t('m_hint')) + '</p>';
    $('mBody').innerHTML = html;
    $('modal').classList.add('show');
    $('mOk').focus();
  }
  $('mCancel').addEventListener('click', () => $('modal').classList.remove('show'));
  $('mOk').addEventListener('click', () => { $('modal').classList.remove('show'); save(true); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('modal').classList.remove('show'); });

  /* ================= ตารางนัด ================= */
  $('filters').addEventListener('click', (e) => {
    const f = e.target.dataset.f; if (!f) return;
    state.filter = f;
    $('filters').querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.f === f));
    renderTable();
  });
  $('q').addEventListener('input', renderTable);
  $('refreshBtn').addEventListener('click', async () => {
    try { state.appts = await api.list(); renderAll(); toast(t('refreshed')); }
    catch (e) { toast(errMsg(e), true); }
  });

  const COLS = 9;
  function theadHtml() {
    return '<tr><th>' + esc(t('th_queue')) + '</th><th>HN</th><th>' + esc(t('th_name')) + '</th><th>' + esc(t('th_doctor')) +
      '</th><th>' + esc(t('th_tech')) + '</th><th>Fx</th><th>' + esc(t('th_note')) + '</th><th>' + esc(t('th_status')) + '</th><th></th></tr>';
  }
  function rowHtml(a, queueNo) {
    const cls = a.status === ST_CANCEL ? 'cancel' : a.status === ST_DONE ? 'done' : 'booked';
    return '<tr class="' + (cls === 'cancel' ? 'cancel' : '') + '">' +
      '<td>' + (a.status === ST_CANCEL ? '–' : queueNo[a.apptId]) + '</td>' +
      '<td><b>' + esc(a.hn) + '</b></td>' +
      '<td class="name">' + esc(a.name) + '</td>' +
      '<td>' + esc(a.doctor) + '</td>' +
      '<td>' + (a.technique ? '<span class="techtag">' + esc(techText(a.technique)) + '</span>' : '<span class="hint">–</span>') + '</td>' +
      '<td>' + esc(a.fx) + '/' + esc(a.totalFx) + '</td>' +
      '<td class="name hint">' + esc(a.note) + '</td>' +
      '<td class="stcell act"><div class="stline"><span class="tag ' + cls + '">' + esc(statusText(a.status)) + '</span>' +
        '<button type="button" class="btn xs" data-act="edit" data-id="' + esc(a.apptId) + '" title="' + esc(t('a_edit_title')) + '">' + esc(t('a_edit')) + '</button></div>' +
        (a.editedAt ? '<button type="button" class="linkbtn edited" data-act="hist" data-id="' + esc(a.apptId) + '">' +
          esc(t('edited_by', { name: a.editedBy, at: a.editedAt })) + '</button>' : '') + '</td>' +
      '<td class="act"><div class="acts">' + actionButtons(a) + '</div></td></tr>';
  }

  function renderTable() {
    const today = todayIso();
    const q = $('q').value.trim().toLowerCase();
    let list = state.appts.slice();
    if (state.filter === 'today') list = list.filter(a => a.date === today);
    else if (state.filter === 'upcoming') list = list.filter(a => a.date >= today);
    else if (state.filter === 'past') list = list.filter(a => a.date < today).reverse();
    if (q) list = list.filter(a => (a.hn + ' ' + a.name + ' ' + a.doctor + ' ' + (a.technique || '')).toLowerCase().includes(q));

    const active = state.appts.filter(a => a.status !== ST_CANCEL);
    const todays = active.filter(a => a.date === today).length;
    const upcoming = active.filter(a => a.date >= today && a.status === ST_BOOKED);
    const patients = new Set(upcoming.map(a => a.hn)).size;
    $('stats').innerHTML = t('stats', { a: todays, b: upcoming.length, c: patients });

    if (!list.length) { $('tbody').innerHTML = '<tr><td colspan="' + COLS + '" class="empty">' + esc(t('no_appts')) + '</td></tr>'; return; }
    const counts = dayCounts();
    const queueNo = queueNumbers(counts);
    let lastDate = '';
    $('tbody').innerHTML = list.map(a => {
      let sep = '';
      if (a.date !== lastDate) {
        lastDate = a.date;
        const n = (counts[a.date] || []).length;
        sep = '<tr class="daysep"><td colspan="' + COLS + '">' + esc(fmtDate(a.date, LONG)) + (a.date === today ? esc(t('today_tag')) : '') +
          ' · ' + esc(cases(n)) + (n > state.max ? ' <span class="badtext">' + esc(t('over_max', { max: state.max })) + '</span>' : '') + '</td></tr>';
      }
      return sep + rowHtml(a, queueNo);
    }).join('');
  }

  async function onActionClick(e) {
    const b = e.target.closest('button[data-act]'); if (!b) return;
    const a = state.appts.find(x => x.apptId === b.dataset.id); if (!a) return;
    const who = 'HN ' + a.hn + ' ' + a.name;
    if (b.dataset.act === 'edit' || b.dataset.act === 'hist') { openEdit(a, b.dataset.act === 'hist'); return; }
    let p;
    if (b.dataset.act === 'done') p = api.done(a.apptId);
    else if (b.dataset.act === 'cancel') {
      if (!confirm(t('c_cancel_one', { fx: a.fx, who: who, date: fmtDate(a.date) }))) return;
      p = api.cancel(a.apptId, 'one');
    } else {
      if (!confirm(t('c_cancel_course', { who: who }))) return;
      p = api.cancel(a.apptId, 'course');
    }
    b.disabled = true;
    try {
      const res = await p; state.appts = res.appointments; renderAll();
      toast(b.dataset.act === 'done' ? t('t_done') : t('t_cancelled', { n: res.changed }));
    } catch (err) { toast(errMsg(err), true); b.disabled = false; }
  }
  $('tbody').addEventListener('click', onActionClick);
  $('dayDetail').addEventListener('click', onActionClick);

  /* ================= รูปแบบการใส่ ================= */
  state.techniques = ['Full', 'Mould', 'เสียบเข็ม'];
  const TECH_OTHER = 'อื่นๆ';
  // ค่าที่เก็บในชีตเป็นคำเดิม (Full / Mould / เสียบเข็ม / ที่กรอกเอง) แปลเฉพาะตอนแสดงผล
  const techText = (v) => (v === 'เสียบเข็ม' ? t('tech_needle') : v);
  function makeTechPicker(chipsId, otherId) {
    let sel = '';
    const chips = $(chipsId), other = $(otherId);
    const api = {
      render() {
        chips.innerHTML = state.techniques.concat(TECH_OTHER).map(v =>
          '<button type="button" class="chip' + (v === sel ? ' on' : '') + '" role="radio" aria-checked="' + (v === sel) + '" data-tech="' + esc(v) + '">' +
          esc(v === TECH_OTHER ? t('tech_other') : techText(v)) + '</button>').join('');
        other.hidden = sel !== TECH_OTHER;
      },
      set(v) {
        v = String(v || '');
        if (!v) { sel = ''; other.value = ''; }
        else if (state.techniques.indexOf(v) >= 0) { sel = v; other.value = ''; }
        else { sel = TECH_OTHER; other.value = v; }
        api.render();
      },
      get() { return sel === TECH_OTHER ? other.value.replace(/\s+/g, ' ').trim() : sel; },
      selected() { return sel; }
    };
    chips.addEventListener('click', (e) => {
      const b = e.target.closest('[data-tech]'); if (!b) return;
      sel = b.dataset.tech; api.render();
      if (sel === TECH_OTHER) other.focus();
    });
    return api;
  }
  const techPick = makeTechPicker('techChips', 'techOther');
  const ePick = makeTechPicker('eTechChips', 'eTechOther');

  /* ================= แก้ไขนัด + ประวัติ ================= */
  let editing = null;
  function openEdit(a, focusHistory) {
    editing = a;
    $('eWho').textContent = 'HN ' + a.hn + ' · ' + a.name + ' · Fx ' + a.fx + '/' + a.totalFx;
    $('eDate').value = a.date;
    $('eStatus').innerHTML = [ST_BOOKED, ST_DONE, ST_CANCEL].map(v =>
      '<option value="' + esc(v) + '"' + (v === a.status ? ' selected' : '') + '>' + esc(statusText(v)) + '</option>').join('');
    if (a.doctor && !Array.from($('eDoctor').options).some(o => o.value === a.doctor)) {
      $('eDoctor').insertAdjacentHTML('beforeend', '<option value="' + esc(a.doctor) + '">' + esc(a.doctor) + '</option>');
    }
    $('eDoctor').value = a.doctor;
    ePick.set(a.technique || '');
    $('eNote').value = a.note || '';
    renderEditHints();
    renderHistory(a);
    $('editModal').classList.add('show');
    setTimeout(() => {
      if (focusHistory) $('eHistory').scrollIntoView({ block: 'nearest' }); else $('eDate').focus();
    }, 0);
  }
  function closeEdit() { $('editModal').classList.remove('show'); editing = null; }
  function renderEditHints() {
    if (!editing) return;
    const d = $('eDate').value, st = $('eStatus').value;
    if (d && st !== ST_CANCEL) {
      const others = state.appts.filter(x => x.date === d && x.status !== ST_CANCEL && x.apptId !== editing.apptId).length;
      const after = others + 1;
      $('eCap').innerHTML = '<span class="cap' + (after > state.max ? ' over' : '') + '">' + esc(t('booked_cap', { n: others, max: state.max })) + '</span>' +
        (after > state.max ? ' — ⚠️ ' + esc(t('w_over', { n: after, max: state.max })) : '') +
        (state.holidays[d] ? ' · ' + esc(t('w_holiday', { name: state.holidays[d] })) : '');
    } else $('eCap').textContent = '';
    $('eStatusHint').textContent = st === ST_CANCEL && editing.status !== ST_CANCEL ? t('e_cancel_hint')
      : st !== ST_CANCEL && editing.status === ST_CANCEL ? t('e_restore_hint') : '';
  }
  $('eDate').addEventListener('change', renderEditHints);
  $('eStatus').addEventListener('change', renderEditHints);
  $('eClose').addEventListener('click', closeEdit);
  $('editModal').addEventListener('click', (e) => { if (e.target === $('editModal')) closeEdit(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && editing) closeEdit(); });

  function fieldValue(f, v) {
    if (!v) return '–';
    if (f === 'status') return statusText(v);
    if (f === 'date') return fmtDate(v);
    if (f === 'technique') return techText(v);
    return v;
  }
  function renderHistory(a) {
    const items = (a.history || []).slice().reverse().map(h =>
      '<li><b>' + esc(h.name || h.by) + '</b> <span class="ago">· ' + esc(h.at) + '</span><ul>' +
      (h.changes || []).map(c => '<li>' + esc(t('f_' + c.f)) + ': ' + esc(fieldValue(c.f, c.from)) + ' → <b>' + esc(fieldValue(c.f, c.to)) + '</b></li>').join('') +
      '</ul></li>');
    const created = a.createdBy ? '<li><span class="ago">' + esc(t('e_created', { name: a.createdBy, at: a.createdAt || '' })) + '</span></li>' : '';
    $('eHistory').innerHTML = (items.length ? items.join('') : '<li class="hint">' + esc(t('e_none')) + '</li>') + created;
  }

  $('editForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!editing) return;
    const a = editing;
    if (!$('eDate').value) { toast(t('v_fxdate', { n: a.fx }), true); $('eDate').focus(); return; }
    if (!ePick.selected()) { toast(t('v_tech'), true); return; }
    const next = { date: $('eDate').value, status: $('eStatus').value, doctor: $('eDoctor').value,
      technique: ePick.get(), note: $('eNote').value.trim() };
    if (!next.technique) { toast(t('v_tech_other'), true); $('eTechOther').focus(); return; }
    const ch = {};
    Object.keys(next).forEach(k => { if (next[k] !== (a[k] || '')) ch[k] = next[k]; });
    if (!Object.keys(ch).length) { toast(t('e_nochange')); return; }
    const btn = $('eSave'); btn.disabled = true;
    try {
      const res = await api.edit(a.apptId, ch);
      state.appts = res.appointments;
      closeEdit();
      renderAll();
      if (res.overCapacity && res.overCapacity.length) {
        toast(t('e_saved') + ' · ' + t('t_saved_over', { max: state.max, list: res.overCapacity.map(d => fmtDate(d.date) + ' (' + d.total + ')').join(', ') }), true);
      } else toast(t('e_saved'));
    } catch (err) { toast(errMsg(err), true); }
    finally { btn.disabled = false; }
  });

  /* ================= ส่วนกลาง ================= */
  // นัดที่ไม่ถูกยกเลิก จัดกลุ่มตามวัน { 'yyyy-MM-dd': [appt, ...] }
  function dayCounts() {
    const m = {};
    state.appts.forEach(a => { if (a.status !== ST_CANCEL) (m[a.date] = m[a.date] || []).push(a); });
    return m;
  }
  // ลำดับคิวในแต่ละวัน (ตามลำดับที่ลงนัด ไม่นับนัดที่ยกเลิก)
  function queueNumbers(counts) {
    const q = {};
    Object.keys(counts).forEach(d => counts[d].forEach((a, i) => { q[a.apptId] = i + 1; }));
    return q;
  }
  function actionButtons(a) {
    if (a.status !== ST_BOOKED) return '';
    const id = esc(a.apptId);
    return '<button class="btn sm okb" data-act="done" data-id="' + id + '" title="' + esc(t('a_done_title')) + '">' + esc(t('a_done')) + '</button>' +
      '<button class="btn sm danger" data-act="cancel" data-id="' + id + '" title="' + esc(t('a_cancel_title')) + '">' + esc(t('a_cancel')) + '</button>' +
      (a.totalFx > 1 ? '<button class="btn sm danger" data-act="course" data-id="' + id + '" title="' + esc(t('a_course_title')) + '">' + esc(t('a_course')) + '</button>' : '');
  }

  function renderAll() {
    renderAlerts();
    renderTable();
    renderPreview();
    renderManualCal();
    if (state.view === 'dash') renderDash();
  }

  // แถบแจ้งเตือน: วันนี้เป็นต้นไปที่มีเคสเกินกำหนด
  function renderAlerts() {
    const counts = dayCounts(), today = todayIso();
    const over = Object.keys(counts).filter(d => d >= today && counts[d].length > state.max).sort();
    const bar = $('alertBar');
    if (!over.length) { bar.hidden = true; return; }
    bar.hidden = false;
    bar.innerHTML = '<b>' + esc(t('alert', { n: over.length, max: state.max })) + '</b>' +
      over.map(d => '<button type="button" data-goto="' + d + '">' + esc(fmtDate(d)) + ' · ' + esc(cases(counts[d].length)) + '</button>').join('');
  }
  $('alertBar').addEventListener('click', (e) => {
    const d = e.target.closest('[data-goto]'); if (!d) return;
    const dt = parseIso(d.dataset.goto);
    state.dashMonth = new Date(dt.getFullYear(), dt.getMonth(), 1);
    state.dashDay = d.dataset.goto;
    setView('dash');
    $('dayDetail').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  /* ================= สลับหน้า ================= */
  function setView(v) {
    state.view = v;
    $('viewBook').hidden = v !== 'book';
    $('viewDash').hidden = v !== 'dash';
    $('tabs').querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x.dataset.view === v));
    if (v === 'dash') renderDash();
  }
  $('tabs').addEventListener('click', (e) => { const x = e.target.closest('[data-view]'); if (x) setView(x.dataset.view); });

  /* ================= แดชบอร์ด ================= */
  const monthStart = (d) => new Date(d.getFullYear(), d.getMonth(), 1);
  function daysOfMonth(m) {
    const n = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate(), out = [];
    for (let i = 1; i <= n; i++) out.push(iso(new Date(m.getFullYear(), m.getMonth(), i)));
    return out;
  }
  $('prevM').addEventListener('click', () => { const m = state.dashMonth; state.dashMonth = new Date(m.getFullYear(), m.getMonth() - 1, 1); state.dashDay = null; renderDash(); });
  $('nextM').addEventListener('click', () => { const m = state.dashMonth; state.dashMonth = new Date(m.getFullYear(), m.getMonth() + 1, 1); state.dashDay = null; renderDash(); });
  $('thisM').addEventListener('click', () => { state.dashMonth = monthStart(new Date()); state.dashDay = todayIso(); renderDash(); });

  function renderDash() {
    if (!state.dashMonth) state.dashMonth = monthStart(new Date());
    const m = state.dashMonth;
    const counts = dayCounts();
    const today = todayIso();
    const days = daysOfMonth(m);
    if (!state.dashDay || state.dashDay.slice(0, 7) !== days[0].slice(0, 7)) {
      state.dashDay = today.slice(0, 7) === days[0].slice(0, 7) ? today : (days.find(d => counts[d]) || days[0]);
    }
    $('monthTitle').textContent = m.toLocaleDateString(LOCALE[lang], { month: 'long', year: 'numeric' });

    // KPI
    const now = new Date(); const dow = (now.getDay() + 6) % 7;
    const wkStart = iso(addDays(now, -dow)), wkEnd = iso(addDays(now, 6 - dow));
    const sumRange = (a, b) => Object.keys(counts).filter(d => d >= a && d <= b).reduce((n, d) => n + counts[d].length, 0);
    const monthTotal = days.reduce((n, d) => n + (counts[d] || []).length, 0);
    const overDays = days.filter(d => (counts[d] || []).length > state.max);
    const busiest = days.reduce((best, d) => ((counts[d] || []).length > (counts[best] || []).length ? d : best), days[0]);
    const todayN = (counts[today] || []).length;
    const short = { day: 'numeric', month: 'short' };
    $('kpis').innerHTML =
      kpi(t('k_today'), todayN, todayN > state.max ? t('over_max', { max: state.max }) : t('k_today_sub', { max: state.max }), todayN > state.max) +
      kpi(t('k_week'), sumRange(wkStart, wkEnd), fmtDate(wkStart, short) + ' – ' + fmtDate(wkEnd, short)) +
      kpi(t('k_month', { m: m.toLocaleDateString(LOCALE[lang], { month: 'short' }) }), monthTotal,
        (counts[busiest] || []).length ? t('k_busiest', { date: fmtDate(busiest, short), cases: cases(counts[busiest].length) }) : t('k_none_yet')) +
      kpi(t('k_over', { max: state.max }), overDays.length,
        overDays.length ? t('k_over_days', { list: overDays.map(d => parseIso(d).getDate()).join(', ') }) : t('none'), overDays.length > 0);

    renderChart(days, counts, today);
    renderCalendar(m, days, counts, today);
    renderDayDetail(counts);
  }

  function kpi(k, v, s, bad) {
    return '<div class="kpi' + (bad ? ' bad' : '') + '"><div class="k">' + esc(k) + '</div><div class="v">' + esc(v) + '</div><div class="s">' + esc(s) + '</div></div>';
  }

  // กราฟแท่ง: เคสต่อวัน + เส้นจำกัดจำนวนเคส
  function renderChart(days, counts, today) {
    // วาดตามความกว้างจริงของกล่อง ให้ตัวหนังสือไม่เล็กลงบนมือถือ
    const W = Math.max(300, Math.round($('chart').clientWidth || 900)), H = W < 560 ? 200 : 240, L = 30, R = 12, T = 18, B = 26;
    const vals = days.map(d => (counts[d] || []).length);
    const yMax = Math.max(state.max + 2, ...vals);
    const step = yMax > 12 ? 4 : 2;
    const top = Math.ceil(yMax / step) * step;
    const cw = (W - L - R) / days.length;
    const bw = Math.max(4, cw - 4); // เว้นช่องระหว่างแท่ง
    const y = (v) => T + (H - T - B) * (1 - v / top);
    let g = '<g class="grid">';
    for (let v = 0; v <= top; v += step) g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/>';
    g += '</g><g class="axis">';
    for (let v = 0; v <= top; v += step) g += '<text x="' + (L - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v + '</text>';
    const every = cw < 14 ? 5 : cw < 22 ? 2 : 1;
    days.forEach((d, i) => {
      const n = i + 1;
      if (n === 1 || (n - 1) % every === 0) {
        g += '<text x="' + (L + cw * i + cw / 2) + '" y="' + (H - 8) + '" text-anchor="middle"' + (d === today ? ' class="today"' : '') + '>' + n + '</text>';
      }
    });
    g += '</g>';
    let bars = '';
    days.forEach((d, i) => {
      const v = vals[i]; const x = L + cw * i + (cw - bw) / 2;
      if (v > 0) {
        const y0 = y(0), y1 = y(v), r = Math.min(4, bw / 2, y0 - y1);
        const cls = 'bar' + (v > state.max ? ' over' : '') + (d < today ? ' past' : '');
        bars += '<path class="' + cls + '" d="M' + x + ',' + y0 + 'V' + (y1 + r) + 'Q' + x + ',' + y1 + ' ' + (x + r) + ',' + y1 +
          'H' + (x + bw - r) + 'Q' + (x + bw) + ',' + y1 + ' ' + (x + bw) + ',' + (y1 + r) + 'V' + y0 + 'Z"/>';
        if (v > state.max) bars += '<text class="val" x="' + (x + bw / 2) + '" y="' + (y1 - 4) + '">' + v + '</text>';
      }
    });
    const ly = y(state.max);
    const limit = '<line class="limit" x1="' + L + '" x2="' + (W - R) + '" y1="' + ly + '" y2="' + ly + '"/>' +
      '<text class="limit-label" x="' + (W - R) + '" y="' + (ly - 5) + '" text-anchor="end">' + esc(t('limit_label', { max: state.max })) + '</text>';
    let hits = '';
    days.forEach((d, i) => {
      hits += '<rect class="hit' + (d === state.dashDay ? ' sel' : '') + '" data-d="' + d + '" x="' + (L + cw * i) + '" y="' + T + '" width="' + cw + '" height="' + (H - T - B + 18) + '" rx="4"/>';
    });
    $('chart').innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(t('chart_aria')) + '">' + g + hits + bars + limit + '</svg><div class="tip" id="tip"></div>';
    $('legend').innerHTML = '<span><i style="background:var(--accent)"></i>' + esc(t('lg_cases')) + '</span>' +
      '<span><i style="background:var(--bad)"></i>' + esc(t('lg_over', { max: state.max })) + '</span>' +
      '<span><i style="background:var(--accent);opacity:.45"></i>' + esc(t('lg_past')) + '</span>' +
      '<span><i class="dash"></i>' + esc(t('lg_limit')) + '</span>';
  }
  // tooltip + คลิกแท่ง
  $('chart').addEventListener('mousemove', (e) => {
    const r = e.target.closest('.hit'); const tip = $('tip'); if (!tip) return;
    if (!r) { tip.style.display = 'none'; return; }
    const d = r.dataset.d, list = dayCounts()[d] || [];
    tip.innerHTML = '<b>' + esc(fmtDate(d)) + '</b><br>' + esc(cases(list.length)) + (list.length > state.max ? ' · ' + esc(t('over_max', { max: state.max })) : '') +
      (list.length ? '<br>' + list.slice(0, 8).map((a, i) => esc((i + 1) + '. HN ' + a.hn + ' ' + a.name)).join('<br>') + (list.length > 8 ? '<br>…' : '') : '');
    tip.style.display = 'block';
    const box = $('chart').getBoundingClientRect();
    let x = e.clientX - box.left + 12; if (x + 260 > box.width) x = e.clientX - box.left - tip.offsetWidth - 12;
    tip.style.left = Math.max(0, x) + 'px'; tip.style.top = Math.max(0, e.clientY - box.top - 10) + 'px';
  });
  $('chart').addEventListener('mouseleave', () => { const tip = $('tip'); if (tip) tip.style.display = 'none'; });
  $('chart').addEventListener('click', (e) => {
    const r = e.target.closest('.hit'); if (!r) return;
    state.dashDay = r.dataset.d; renderDash();
  });
  let resizeT;
  window.addEventListener('resize', () => {
    clearTimeout(resizeT);
    resizeT = setTimeout(() => { if (state.view === 'dash') renderChart(daysOfMonth(state.dashMonth), dayCounts(), todayIso()); }, 150);
  });

  // ปฏิทินรายเดือน: แต่ละวันแสดงจำนวนเคสและรายชื่อตามคิว
  function renderCalendar(m, days, counts, today) {
    const lead = (new Date(m.getFullYear(), m.getMonth(), 1).getDay() + 6) % 7; // เริ่มวันจันทร์
    let html = [1, 2, 3, 4, 5, 6, 0].map(d => '<div class="dow">' + esc(DOW[lang][d]) + '</div>').join('');
    for (let i = 0; i < lead; i++) html += '<div class="day out"></div>';
    days.forEach(d => {
      const list = counts[d] || [];
      const n = list.length, hol = state.holidays[d];
      const cls = ['day', n === 0 ? 'empty' : '', hol ? 'holiday' : '', d === today ? 'today' : '', d === state.dashDay ? 'sel' : '',
        n > state.max ? 'over' : n === state.max ? 'full' : ''].filter(Boolean).join(' ');
      const show = list.slice(0, 7);
      html += '<button type="button" class="' + cls + '" data-d="' + d + '">' +
        '<div class="top"><span class="num">' + parseIso(d).getDate() +
        '<span class="hint" style="font-weight:400"> ' + esc(DOW[lang][parseIso(d).getDay()]) + '</span></span>' +
        (n ? '<span class="cnt">' + (n > state.max ? '⚠️ ' : '') + esc(cases(n)) + '</span>' : '') + '</div>' +
        (hol ? '<div class="hol">🏖 ' + esc(hol) + '</div>' : '') +
        (n ? '<ul>' + show.map((a, i) => '<li class="' + (a.status === ST_DONE ? 'done' : '') + '" title="' + esc('HN ' + a.hn + ' ' + a.name + ' · ' + a.doctor + (a.technique ? ' · ' + techText(a.technique) : '') + ' · Fx ' + a.fx + '/' + a.totalFx) + '">' +
          (a.status === ST_DONE ? '✓ ' : (i + 1) + '. ') + esc(a.hn) + ' ' + esc(a.name) + '</li>').join('') +
          (n > show.length ? '<li class="more">' + esc(t('more', { n: n - show.length })) + '</li>' : '') + '</ul>' : '') +
        '</button>';
    });
    const trail = (7 - (lead + days.length) % 7) % 7;
    for (let i = 0; i < trail; i++) html += '<div class="day out"></div>';
    $('calgrid').innerHTML = html;
  }
  $('calgrid').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-d]'); if (!b) return;
    state.dashDay = b.dataset.d; renderDash();
    if (window.innerWidth < 860) $('dayDetail').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  // รายละเอียดวันที่เลือก
  function renderDayDetail(counts) {
    const d = state.dashDay;
    const all = state.appts.filter(a => a.date === d);
    const active = counts[d] || [];
    const queueNo = queueNumbers(counts);
    const byDoc = {};
    active.forEach(a => { byDoc[a.doctor] = (byDoc[a.doctor] || 0) + 1; });
    const n = active.length;
    let html = '<h3>' + esc(fmtDate(d, LONG)) + ' — ' + esc(cases(n)) +
      (n > state.max ? ' <span class="badtext">' + esc(t('dd_over', { max: state.max, n: n - state.max })) + '</span>' : '') + '</h3>';
    if (state.holidays[d]) html += '<p class="hint">🏖 ' + esc(t('w_holiday', { name: state.holidays[d] })) + '</p>';
    if (Object.keys(byDoc).length) {
      html += '<div class="docsum">' + Object.keys(byDoc).map(k => '<span>👩‍⚕️ ' + esc(k) + ' · ' + byDoc[k] + '</span>').join('') + '</div>';
    }
    if (!all.length) { $('dayDetail').innerHTML = html + '<div class="empty">' + esc(t('no_appts_day')) + '</div>'; return; }
    html += '<div class="tablewrap"><table><thead>' + theadHtml() + '</thead><tbody>' +
      all.map(a => rowHtml(a, queueNo)).join('') + '</tbody></table></div>';
    $('dayDetail').innerHTML = html;
  }

  /* ================= init ================= */
  applyStaticText();
  $('startDate').value = iso(nextFree(addDays(new Date(), 1)));

  // โหลดข้อมูลหลังเข้าสู่ระบบ (หรือเมื่อเปิดหน้าโดยมี token เดิม)
  async function loadApp() {
    $('tbody').innerHTML = '<tr><td colspan="' + COLS + '" class="empty">' + esc(t('loading')) + '</td></tr>';
    state.loadError = '';
    try {
      const d = await api.init();
      state.user = d.user;
      state.calName = d.settings.calendarName;
      state.techniques = d.techniques || ['Full', 'Mould', 'เสียบเข็ม'];
      techPick.render(); ePick.render();
      $('eDoctor').innerHTML = d.doctors.map(x => '<option value="' + esc(x) + '">' + esc(x) + '</option>').join('');
      state.max = d.settings.maxCasesPerDay || 6;
      $('doctor').innerHTML = '<option value="" data-i18n="choose_doctor">' + esc(t('choose_doctor')) + '</option>' +
        d.doctors.map(x => '<option value="' + esc(x) + '">' + esc(x) + '</option>').join('');
      d.holidays.forEach(h => { state.holidays[h.date] = h.name || t('holiday_default'); });
      $('startDate').value = iso(nextFree(addDays(new Date(), 1)));
      state.appts = d.appointments;
    } catch (e) {
      if (!auth.token) return; // ต้องเข้าสู่ระบบใหม่ (onAuthLost แสดงหน้าเข้าสู่ระบบแล้ว)
      state.loadError = errMsg(e);
      toast(state.loadError, true);
    }
    showApp();
    renderUser();
    regenerate();
    renderAll();
  }

  // พารามิเตอร์ในลิงก์ เช่น ?sso=... (เว็บแอปอยู่ใน iframe จึงต้องถามผ่าน google.script.url)
  function readParams() {
    return new Promise(resolve => {
      try {
        if (isGas && google.script.url) { google.script.url.getLocation(loc => resolve((loc && loc.parameter) || {})); return; }
      } catch (e) { /* เปิดใน dialog ของชีต: ไม่มีพารามิเตอร์ */ }
      const o = {};
      try { new URLSearchParams(location.search).forEach((v, k) => { o[k] = v; }); } catch (e) { /* ignore */ }
      resolve(o);
    });
  }
  // ลบ ?sso=... ออกจากแถบที่อยู่ ไม่ให้รีเฟรชแล้วใช้บัตรผ่านเดิมซ้ำ (บัตรใช้ได้ครั้งเดียว)
  function clearParams() {
    try { if (isGas && google.script.history) google.script.history.replace(null, {}); } catch (e) { /* ignore */ }
  }

  // เปิดจากปุ่มใน LPCH RO Workspace ที่ติ๊ก "เข้าสู่ระบบอัตโนมัติ": แลกบัตรผ่านเป็นการเข้าสู่ระบบ
  readParams().then(async p => {
    if (p.sso) {
      clearParams();
      showAuth('login', t('sso_working'), true);
      try {
        const r = await api.ssoLogin(p.sso);
        auth.save(r.token, false);
        authMsg('');
        await loadApp();
        return;
      } catch (e) {
        if (!auth.token) { showAuth('login', errMsg(e)); return; }
        // บัตรผ่านใช้ไม่ได้ (เช่น รีเฟรชหน้า) แต่ยังมีการเข้าสู่ระบบเดิมอยู่: ใช้ต่อ
      }
    }
    if (auth.token) loadApp(); else showAuth('login');
  });

  if (!isGas) {
    $('seedBtn').addEventListener('click', async () => { state.appts = await api.seed(); renderAll(); toast(t('seeded')); });
    $('clearBtn').addEventListener('click', async () => { state.appts = await api.clear(); renderAll(); toast(t('cleared')); });
  }
})();
</script>
</body>
</html>
