<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>นัดคิวผู้ป่วยใส่แร่</title>
  <script>
    // ตั้งโหมดสี/ภาษาที่เคยเลือกไว้ก่อนแสดงผล เพื่อไม่ให้หน้าจอกะพริบ
    (function () {
      try {
        var th = localStorage.getItem('bq-theme');
        if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th);
        var lg = localStorage.getItem('bq-lang');
        if (lg === 'en' || lg === 'th') document.documentElement.lang = lg;
      } catch (e) { /* ไม่มี storage ก็ใช้ค่าเริ่มต้น */ }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f3fa;
      --card: #ffffff;
      --field: #ffffff;
      --raise: #faf9fd;
      --ink: #1f1b2e;
      --muted: #6b6680;
      --line: #e3dfee;
      --accent: #6b3fa0;
      --accent-ink: #ffffff;
      --accent-soft: #efe8f8;
      --accent-hover: rgba(107, 63, 160, .08);
      --sel-ring: rgba(107, 63, 160, .25);
      --header-bg: #6b3fa0;
      --header-ink: #ffffff;
      --tab-bg: rgba(255, 255, 255, .14);
      --tab-on-bg: #ffffff;
      --tab-on-ink: #6b3fa0;
      --ok: #1e7f4f;
      --ok-soft: #e3f4ea;
      --warn: #a15c00;
      --warn-soft: #fff3df;
      --warn-line: #f0d3a0;
      --on-warn: #ffffff;
      --bad: #b3261e;
      --bad-soft: #fdeceb;
      --bad-line: #f3c1bd;
      --on-bad: #ffffff;
      --toast-bg: #1f1b2e;
      --toast-ink: #ffffff;
      --overlay: rgba(20, 15, 35, .45);
      --radius: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #141120;
        --card: #1e1a2c;
        --field: #262137;
        --raise: #231e33;
        --ink: #ece8f6;
        --muted: #a7a1bd;
        --line: #363049;
        --accent: #b794f0;
        --accent-ink: #1a1228;
        --accent-soft: #2f2647;
        --accent-hover: rgba(183, 148, 240, .12);
        --sel-ring: rgba(183, 148, 240, .35);
        --header-bg: #2a2142;
        --header-ink: #f3eefc;
        --tab-bg: rgba(255, 255, 255, .08);
        --tab-on-bg: #b794f0;
        --tab-on-ink: #1a1228;
        --ok: #6fd39e;
        --ok-soft: #16332a;
        --warn: #f2b55e;
        --warn-soft: #3a2b14;
        --warn-line: #6b4f22;
        --on-warn: #2a1a05;
        --bad: #ff8f86;
        --bad-soft: #3e1d1c;
        --bad-line: #6e3431;
        --on-bad: #2a0d0b;
        --toast-bg: #ece8f6;
        --toast-ink: #1a1228;
        --overlay: rgba(0, 0, 0, .6);
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #141120;
      --card: #1e1a2c;
      --field: #262137;
      --raise: #231e33;
      --ink: #ece8f6;
      --muted: #a7a1bd;
      --line: #363049;
      --accent: #b794f0;
      --accent-ink: #1a1228;
      --accent-soft: #2f2647;
      --accent-hover: rgba(183, 148, 240, .12);
      --sel-ring: rgba(183, 148, 240, .35);
      --header-bg: #2a2142;
      --header-ink: #f3eefc;
      --tab-bg: rgba(255, 255, 255, .08);
      --tab-on-bg: #b794f0;
      --tab-on-ink: #1a1228;
      --ok: #6fd39e;
      --ok-soft: #16332a;
      --warn: #f2b55e;
      --warn-soft: #3a2b14;
      --warn-line: #6b4f22;
      --on-warn: #2a1a05;
      --bad: #ff8f86;
      --bad-soft: #3e1d1c;
      --bad-line: #6e3431;
      --on-bad: #2a0d0b;
      --toast-bg: #ece8f6;
      --toast-ink: #1a1228;
      --overlay: rgba(0, 0, 0, .6);
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font-family: 'Sarabun', system-ui, sans-serif; font-size: 15px; line-height: 1.5;
      transition: background-color .2s, color .2s;
    }
    header {
      background: var(--header-bg); color: var(--header-ink);
      padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 8px 16px;
      align-items: center; justify-content: space-between;
    }
    header h1 { margin: 0; font-size: 20px; font-weight: 700; }
    header .cal { font-size: 13px; opacity: .85; }
    main { max-width: 1200px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
    main > *, .grid2 > *, #viewBook > *, #viewDash > * { min-width: 0; }
    .grid2 { display: grid; gap: 16px; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); }
    @media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 16px;
    }
    .card h2 { margin: 0 0 12px; font-size: 16px; font-weight: 700; }
    .row { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
    @media (max-width: 480px) { .row { grid-template-columns: 1fr; } }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; font-weight: 500; }
    .req::after { content: ' *'; color: var(--bad); }
    .field { margin-bottom: 12px; }
    input, select, textarea, button { font: inherit; color: inherit; }
    input[type=text], input[type=number], input[type=date], input[type=search], select, textarea {
      width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--field);
    }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    textarea { resize: vertical; min-height: 40px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      border: 1px solid var(--line); background: var(--field); border-radius: 999px; padding: 4px 12px;
      cursor: pointer; font-size: 14px;
    }
    .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    .days { display: flex; flex-wrap: wrap; gap: 6px; }
    .days label {
      margin: 0; display: inline-flex; align-items: center; justify-content: center; min-width: 44px;
      padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; color: var(--ink);
      font-size: 14px; background: var(--field);
    }
    .days input { display: none; }
    .days label:has(input:checked) { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
    .radio { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; }
    .radio label { display: inline-flex; gap: 6px; align-items: center; color: var(--ink); font-size: 14px; margin: 0; }
    .check { display: inline-flex; gap: 6px; align-items: center; color: var(--ink); font-size: 14px; }
    .hint { font-size: 12px; color: var(--muted); }
    .manual { display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); margin-top: 6px; }
    .manual .mrow { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 6px; align-items: center; }
    .manual .mrow span { font-weight: 700; color: var(--accent); font-size: 14px; }
    .manual .mrow input:invalid, .manual .mrow input.empty { border-color: var(--warn); }

    .preview { display: grid; gap: 6px; max-height: 420px; overflow: auto; padding-right: 2px; }
    .fx {
      display: grid; gap: 8px; align-items: center;
      grid-template-columns: 64px minmax(0, 220px) minmax(0, 1fr);
      padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px;
    }
    .fx .no { font-weight: 700; color: var(--accent); }
    .fx .desc { font-size: 12px; color: var(--muted); }
    .fx.warn { background: var(--warn-soft); border-color: var(--warn-line); }
    .fx.warn .desc { color: var(--warn); }
    @media (max-width: 560px) {
      .fx { grid-template-columns: 52px 1fr; }
      .fx .desc { grid-column: 1 / -1; }
    }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      border: 1px solid var(--line); background: var(--field); border-radius: 10px; padding: 8px 14px; cursor: pointer;
    }
    .btn:hover { border-color: var(--accent); }
    .btn.primary {
      background: var(--accent); color: var(--accent-ink); border-color: var(--accent);
      font-weight: 700; font-size: 17px; padding: 12px 18px; width: 100%;
    }
    .btn.primary:hover { filter: brightness(1.08); }
    .btn:disabled { opacity: .55; cursor: progress; }
    .btn.sm { padding: 3px 10px; font-size: 13px; border-radius: 8px; }
    .btn.danger { color: var(--bad); }
    .btn.danger:hover { border-color: var(--bad); }
    .btn.okb { color: var(--ok); }
    .btn.okb:hover { border-color: var(--ok); }
    .btn.warnb { background: var(--warn); color: var(--on-warn); border-color: var(--warn); }

    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .toolbar input[type=search] { max-width: 260px; }
    .tablewrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--raise); position: sticky; top: 0; }
    td.name { white-space: normal; min-width: 140px; }
    tr.daysep td { background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 13px; padding: 5px 8px; }
    tr.cancel td:not(.act) { color: var(--muted); text-decoration: line-through; }
    .tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .tag.booked { background: var(--accent-soft); color: var(--accent); }
    .tag.done { background: var(--ok-soft); color: var(--ok); }
    .tag.cancel { background: var(--bad-soft); color: var(--bad); text-decoration: none; }
    td.act .acts { display: flex; gap: 4px; }
    .empty { text-align: center; color: var(--muted); padding: 24px; }
    .stats { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
    .stats b { color: var(--ink); font-size: 16px; }
    .badtext { color: var(--bad); }

    .toast {
      position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(140%);
      background: var(--toast-bg); color: var(--toast-ink); padding: 10px 18px; border-radius: 10px; transition: transform .25s;
      max-width: calc(100% - 32px); z-index: 20; white-space: pre-line;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.err { background: var(--bad); color: var(--on-bad); }
    .modal { position: fixed; inset: 0; background: var(--overlay); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
    .modal.show { display: flex; }
    .modal .box { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; max-width: 520px; width: 100%; }
    .modal h3 { margin: 0 0 8px; color: var(--warn); }
    .modal ul { padding-left: 18px; margin: 8px 0 14px; font-size: 14px; }
    .modal .acts { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
    .banner { background: var(--warn-soft); color: var(--warn); padding: 6px 16px; font-size: 13px; text-align: center; }
    .banner button { font: inherit; font-size: 12px; margin-left: 8px; border: 1px solid currentColor; background: none; color: inherit; border-radius: 6px; padding: 0 8px; cursor: pointer; }

    /* header: แท็บ + ผู้ใช้ + ภาษา + โหมดสี */
    .hleft { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; }
    .hright { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
    .tabs { display: flex; gap: 4px; }
    .tab {
      border: 0; background: var(--tab-bg); color: var(--header-ink); padding: 6px 14px; border-radius: 8px;
      cursor: pointer; font-weight: 600;
    }
    .tab.on { background: var(--tab-on-bg); color: var(--tab-on-ink); }
    .who { font-size: 13px; text-align: right; opacity: .92; }
    .who b { font-weight: 600; }
    .tools { display: flex; align-items: center; gap: 6px; }
    .seg { display: inline-flex; background: var(--tab-bg); border-radius: 8px; padding: 2px; }
    .seg button {
      border: 0; background: transparent; color: var(--header-ink); padding: 4px 10px; border-radius: 6px;
      cursor: pointer; font-size: 13px; font-weight: 600; min-width: 40px;
    }
    .seg button[aria-pressed="true"] { background: var(--tab-on-bg); color: var(--tab-on-ink); }
    .iconbtn {
      border: 0; background: var(--tab-bg); color: var(--header-ink); width: 36px; height: 32px; border-radius: 8px;
      display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .iconbtn svg { width: 18px; height: 18px; }
    .iconbtn:hover, .seg button:hover { filter: brightness(1.15); }

    /* แถบแจ้งเตือนเกินเคส */
    .alertbar {
      background: var(--bad-soft); border: 1px solid var(--bad-line); color: var(--bad); border-radius: var(--radius);
      padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center;
    }
    .alertbar b { margin-right: 4px; }
    .alertbar button {
      font: inherit; font-size: 13px; border: 1px solid var(--bad-line); background: var(--card); color: var(--bad);
      border-radius: 999px; padding: 1px 10px; cursor: pointer;
    }
    .cap { font-size: 12px; font-weight: 600; }
    .cap.over { color: var(--bad); }

    /* ---------- แดชบอร์ด ---------- */
    .kpis { display: grid; gap: 12px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
    @media (max-width: 760px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
    .kpi .k { font-size: 13px; color: var(--muted); }
    .kpi .v { font-size: 28px; font-weight: 700; line-height: 1.2; }
    .kpi .s { font-size: 12px; color: var(--muted); }
    .kpi.bad { border-color: var(--bad-line); }
    .kpi.bad .v { color: var(--bad); }
    .monthnav { display: flex; align-items: center; gap: 8px; }
    .monthnav h2 { margin: 0; min-width: 150px; text-align: center; }
    .chartwrap { position: relative; }
    .chartwrap svg { display: block; width: 100%; height: auto; overflow: visible; }
    .chartwrap .grid line { stroke: var(--line); stroke-width: 1; }
    .chartwrap .axis text { fill: var(--muted); font-size: 11px; font-family: inherit; }
    .chartwrap .axis text.today { fill: var(--accent); font-weight: 700; }
    .chartwrap .limit { stroke: var(--bad); stroke-width: 1.5; stroke-dasharray: 5 4; }
    .chartwrap .limit-label { fill: var(--bad); font-size: 11px; font-weight: 600; font-family: inherit; }
    .chartwrap .bar { fill: var(--accent); }
    .chartwrap .bar.over { fill: var(--bad); }
    .chartwrap .bar.past { opacity: .45; }
    .chartwrap .hit { fill: transparent; cursor: pointer; }
    .chartwrap .bar, .chartwrap .val, .chartwrap .limit, .chartwrap .limit-label { pointer-events: none; }
    .chartwrap .hit:hover, .chartwrap .hit.sel { fill: var(--accent-hover); }
    .chartwrap .val { fill: var(--ink); font-size: 11px; font-weight: 600; font-family: inherit; text-anchor: middle; }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); margin-top: 6px; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
    .legend .dash { width: 16px; height: 0; border-top: 2px dashed var(--bad); border-radius: 0; vertical-align: 3px; }
    .tip {
      position: absolute; pointer-events: none; background: var(--toast-bg); color: var(--toast-ink); border-radius: 8px;
      padding: 8px 10px; font-size: 12px; line-height: 1.45; max-width: 260px; z-index: 5; display: none;
    }
    .tip b { font-size: 13px; }

    .calgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
    .calgrid .dow { font-size: 12px; color: var(--muted); font-weight: 600; text-align: center; padding-bottom: 2px; }
    .day {
      border: 1px solid var(--line); border-radius: 10px; min-height: 108px; padding: 6px; background: var(--card);
      display: flex; flex-direction: column; gap: 3px; cursor: pointer; text-align: left; font: inherit; color: inherit;
    }
    .day:hover { border-color: var(--accent); }
    .day.out { background: transparent; border-style: dashed; opacity: .45; cursor: default; }
    .day.holiday { background: var(--raise); }
    .day.today { outline: 2px solid var(--accent); outline-offset: -1px; }
    .day.sel { box-shadow: 0 0 0 3px var(--sel-ring); }
    .day.over { background: var(--bad-soft); border-color: var(--bad-line); }
    .day .top { display: flex; justify-content: space-between; align-items: center; gap: 4px; }
    .day .num { font-weight: 700; font-size: 14px; }
    .day .cnt { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 0 8px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
    .day.full .cnt { background: var(--warn-soft); color: var(--warn); }
    .day.over .cnt { background: var(--bad); color: var(--on-bad); }
    .day .hol { font-size: 11px; color: var(--muted); }
    .day ul { list-style: none; margin: 0; padding: 0; font-size: 11.5px; line-height: 1.35; overflow: hidden; }
    .day li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .day li.done { color: var(--ok); }
    .day li.more { color: var(--muted); }
    @media (max-width: 700px) {
      .calgrid { grid-template-columns: 1fr; }
      .calgrid .dow, .day.out, .day.empty { display: none; }
      .day { min-height: 0; }
      .day ul { font-size: 13px; }
      .day li { white-space: normal; }
    }
    .daydetail h3 { margin: 0 0 8px; font-size: 16px; }
    .docsum { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .docsum span { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 1px 10px; font-size: 12px; font-weight: 600; }
  </style>
</head>
<body>
  <div id="demoBanner" class="banner" hidden><span data-i18n="demo_banner"></span>
    <button type="button" id="seedBtn" data-i18n="seed"></button><button type="button" id="clearBtn" data-i18n="clear"></button></div>
  <header>
    <div class="hleft">
      <h1>📅 <span data-i18n="app_title"></span></h1>
      <nav class="tabs" id="tabs">
        <button type="button" class="tab on" data-view="book" data-i18n="tab_book"></button>
        <button type="button" class="tab" data-view="dash" data-i18n="tab_dash"></button>
      </nav>
    </div>
    <div class="hright">
      <div class="who"><span id="userEmail"></span><br><span class="cal" id="calName"></span></div>
      <div class="tools">
        <div class="seg" role="group" id="langSeg" data-i18n-aria="lang_group">
          <button type="button" data-lang="th" lang="th" aria-pressed="true">ไทย</button>
          <button type="button" data-lang="en" lang="en" aria-pressed="false">EN</button>
        </div>
        <button type="button" class="iconbtn" id="themeBtn">
          <svg id="icoMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg id="icoSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v2.5M12 20v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M1.5 12H4M20 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main>
    <div class="alertbar" id="alertBar" hidden></div>

    <div id="viewBook" style="display:grid; gap:16px">
    <div class="grid2">
      <!-- ฟอร์มลงนัด -->
      <section class="card">
        <h2 data-i18n="new_appt"></h2>
        <form id="f" autocomplete="off">
          <div class="row">
            <div class="field">
              <label for="hn" class="req">HN</label>
              <input type="text" id="hn" required data-i18n-ph="hn_ph" inputmode="numeric">
            </div>
            <div class="field">
              <label for="doctor" class="req" data-i18n="doctor"></label>
              <select id="doctor" required><option value="" data-i18n="choose_doctor"></option></select>
            </div>
          </div>
          <div class="field">
            <label for="name" class="req" data-i18n="name"></label>

    };

  function mockApi() {
    const KEY = 'brachyQueueDemo';
    const MAX = 6;
    const DOCS = ['ทัศน์วรรณ อาษากิจ', 'ศิริรัตน์ เชื้อสำราญ', 'พัฒธิดา มโนรส', 'ทินกร จอมใจ'];
    const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; } };
    const save = (a) => store.set(KEY, JSON.stringify(a));
    // เรียงตามวันที่ แล้วตามลำดับที่ลงนัด (เหมือนลำดับแถวในชีต)
    const sorted = () => load().map((a, i) => Object.assign(a, { row: i })).sort((a, b) => a.date.localeCompare(b.date) || a.row - b.row);
    const delay = (v) => new Promise(r => setTimeout(() => r(v), 300));
    return {
      init: () => delay({
        user: { email: 'demo.user@gmail.com', name: 'demo.user@gmail.com' },
        doctors: DOCS,
        holidays: [{ date: '2026-10-13', name: 'วันนวมินทรมหาราช' }, { date: '2026-10-23', name: 'วันปิยมหาราช' }],
        settings: { maxCasesPerDay: MAX, calendarName: 'Demo' },
        appointments: sorted()
      }),
      seed: () => {
        // ข้อมูลตัวอย่างสำหรับดูหน้าแดชบอร์ด
        const all = []; const base = new Date(); base.setDate(base.getDate() - 6);
        const first = ['สมหญิง', 'มาลี', 'บุญมา', 'จันทร์เพ็ญ', 'สุดา', 'วิไล', 'ประภา', 'นงลักษณ์', 'อรุณี', 'กาญจนา', 'ลำดวน', 'พิมพ์ใจ'];
        const last = ['ใจดี', 'ศรีสุข', 'แก้วมณี', 'ทองดี', 'บุญเรือง', 'สายทอง', 'รุ่งเรือง', 'มีสุข'];
        const todayStr = iso(new Date());
        for (let k = 0; k < 14; k++) {
          const startDay = new Date(base); startDay.setDate(base.getDate() + (k * 3) % 26);
          const days = k % 3 === 0 ? [1, 4] : [1, 2, 3, 4, 5];
          const total = 4; const courseId = 'BTDEMO' + k; let d = new Date(startDay), fx = 0, guard = 0;
          while (fx < total && guard++ < 60) {
            if (days.includes(d.getDay())) {
              fx++;
              const ds = iso(d);
              all.push({ apptId: courseId + '-' + fx, courseId, hn: String(6500100 + k * 37), name: first[k % first.length] + ' ' + last[k % last.length],
                doctor: DOCS[k % 4], fx, totalFx: total, date: ds, note: '', status: ds < todayStr ? ST_DONE : ST_BOOKED });
            }
            d.setDate(d.getDate() + 1);
          }
        }
        save(all); return delay(sorted());
      },
      clear: () => { save([]); return delay([]); },
      list: () => delay(sorted()),
      create: (p) => {
        const all = load();
        if (!p.force) {
          const conflicts = [];
          p.sessions.forEach((s, i) => {
            const o = all.filter(a => a.status === ST_BOOKED && a.hn === p.hn && a.date === s.date);
            if (o.length) conflicts.push({ fx: i + 1, date: s.date, with: o.map(a => 'HN ' + a.hn + ' ' + a.name + ' Fx ' + a.fx + '/' + a.totalFx).join(', ') });
          });
          const counts = {}; all.forEach(a => { if (a.status !== ST_CANCEL) counts[a.date] = (counts[a.date] || 0) + 1; });
          const adding = {}; p.sessions.forEach(s => { adding[s.date] = (adding[s.date] || 0) + 1; });
          const overCapacity = Object.keys(adding).sort().map(d => ({ date: d, existing: counts[d] || 0, adding: adding[d], total: (counts[d] || 0) + adding[d] })).filter(x => x.total > MAX);
          if (conflicts.length || overCapacity.length) return delay({ ok: false, needConfirm: true, conflicts, overCapacity, max: MAX });
        }
        const courseId = 'BT' + Date.now().toString().slice(-10);
        p.sessions.forEach((s, i) => all.push({
          apptId: courseId + '-' + (i + 1), courseId, hn: p.hn, name: p.name, doctor: p.doctor,
          fx: i + 1, totalFx: p.totalFx, date: s.date, note: p.note, status: ST_BOOKED
        }));
        save(all);
        const counts2 = {}; all.forEach(a => { if (a.status !== ST_CANCEL) counts2[a.date] = (counts2[a.date] || 0) + 1; });
        const over2 = [...new Set(p.sessions.map(s => s.date))].filter(d => counts2[d] > MAX).map(d => ({ date: d, total: counts2[d] }));
        return delay({ ok: true, courseId, count: p.sessions.length, overCapacity: over2, appointments: sorted() });
      },
      cancel: (id, scope) => {
        const all = load(); const tg = all.find(a => a.apptId === id); let changed = 0;
        all.forEach(a => {
          const m = scope === 'course' ? a.courseId === tg.courseId && a.status === ST_BOOKED : a.apptId === id;
          if (m && a.status !== ST_CANCEL) { a.status = ST_CANCEL; changed++; }
        });
        save(all); return delay({ ok: true, changed, appointments: sorted() });
      },
      done: (id) => {
        const all = load(); all.forEach(a => { if (a.apptId === id) a.status = ST_DONE; });
        save(all); return delay({ ok: true, changed: 1, appointments: sorted() });
      }
    };
  }

  /* ================= state & helpers ================= */
  const $ = (id) => document.getElementById(id);

  function pad(n) { return String(n).padStart(2, '0'); }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  const parseIso = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const todayIso = () => iso(new Date());
  const fmtDate = (s, opt) => parseIso(s).toLocaleDateString(LOCALE[lang], opt || { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
  const LONG = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function toast(msg, isErr) {
    const el = $('toast'); el.textContent = msg; el.className = 'toast show' + (isErr ? ' err' : '');
    clearTimeout(toast._t); toast._t = setTimeout(() => { el.className = 'toast' + (isErr ? ' err' : ''); }, isErr ? 6000 : 3500);
  }
  const errMsg = (e) => (e && e.message ? e.message : String(e)).replace(/^Error:\s*/, '');

  /* ================= โหมดกลางวัน / กลางคืน ================= */
  const darkMq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function effectiveTheme() {

    return darkMq && darkMq.matches ? 'dark' : 'light';

    const label = dark ? t('to_light') : t('to_dark');

  /* ================= เลือกวันเองตาม Fraction ================= */
  state.manual = [];
  function renderManual() {
    $('manualList').innerHTML = state.manual.map((d, i) =>
      '<label class="mrow"><span>Fx ' + (i + 1) + '</span><input type="date" data-mi="' + i + '" value="' + esc(d) + '"' +

  /* ================= สร้างรายการวันนัด ================= */
  function isBlocked(d) {
    if (!$('skipHoliday').checked) return false;
    return d.getDay() === 0 || d.getDay() === 6 || !!state.holidays[iso(d)];
  }
  function nextFree(d) {
    let x = new Date(d), guard = 0;
    while (isBlocked(x) && guard++ < 60) x = addDays(x, 1);
    return x;
  }

  function regenerate(keepManualInputs) {
    const n = Math.max(0, Math.min(30, parseInt($('totalFx').value, 10) || 0));
    if (modeVal() === 'manual') {
      // ช่องวันที่เท่ากับจำนวน Fraction: เพิ่มช่องว่างหรือตัดช่องท้ายออก
      state.manual = state.manual.slice(0, n);
      while (state.manual.length < n) state.manual.push('');
      if (keepManualInputs !== true) renderManual();
      state.sessions = state.manual.map(d => ({ date: d }));
      renderPreview();
      return;
    }
    const sd = $('startDate').value;
    const out = [];
    if (sd && n) {
      if (modeVal() === 'interval') {
        const step = Math.max(1, parseInt($('interval').value, 10) || 1);
        let d = nextFree(parseIso(sd));
        for (let i = 0; i < n; i++) { out.push(d); d = nextFree(addDays(d, step)); }
      } else {
        const allowed = Array.from($('days').querySelectorAll('input:checked')).map(i => Number(i.value));
        if (allowed.length) {
          let d = parseIso(sd), guard = 0;
          while (out.length < n && guard++ < 400) {
            const holiday = $('skipHoliday').checked && state.holidays[iso(d)];
            if (allowed.includes(d.getDay()) && !holiday) out.push(new Date(d));
            d = addDays(d, 1);
          }
        }
      }
    }
    state.sessions = out.map(d => ({ date: iso(d) }));
    renderPreview();
  }

  function renderPreview() {
    const box = $('preview');
    const n = state.sessions.length;
    if (!state.busy) $('saveBtn').textContent = n ? t('save_n', { n: n }) : t('save');
    if (!n) { box.innerHTML = '<div class="empty">' + esc(t('preview_empty')) + '</div>'; return; }
    const booked = state.appts.filter(a => a.status === ST_BOOKED);
    const counts = dayCounts();
    const hn = $('hn').value.trim();
    box.innerHTML = state.sessions.map((s, i) => {
      if (!s.date) {
        return '<div class="fx warn"><span class="no">Fx ' + (i + 1) + '</span>' +
          '<input type="date" data-i="' + i + '" value="" aria-label="' + esc(t('fx_date_aria', { n: i + 1 })) + '">' +
          '<span class="desc">⚠️ ' + esc(t('w_nodate')) + '</span></div>';
      }
      const warns = [];
      const d = parseIso(s.date);
      if (state.holidays[s.date]) warns.push(t('w_holiday', { name: state.holidays[s.date] }));
      if (d.getDay() === 0 || d.getDay() === 6) warns.push(t('w_weekend'));
      if (s.date < todayIso()) warns.push(t('w_past'));
      const prev = state.sessions.slice(0, i).map(x => x.date).filter(Boolean).pop();
      if (prev && s.date < prev) warns.push(t('w_order'));
      if (hn && booked.some(a => a.hn === hn && a.date === s.date)) warns.push(t('w_dup'));
      const existing = (counts[s.date] || []).length;
      const after = existing + state.sessions.filter(x => x.date === s.date).length;
      if (after > state.max) warns.push(t('w_over', { n: after, max: state.max }));
      return '<div class="fx' + (warns.length ? ' warn' : '') + '">' +
        '<span class="no">Fx ' + (i + 1) + '</span>' +
        '<input type="date" data-i="' + i + '" value="' + s.date + '" aria-label="' + esc(t('fx_date_aria', { n: i + 1 })) + '">' +
        '<span class="desc">' + esc(fmtDate(s.date, LONG)) +
        ' · <span class="cap' + (after > state.max ? ' over' : '') + '">' + esc(t('booked_cap', { n: existing, max: state.max })) + '</span>' +
        (warns.length ? ' — ⚠️ ' + esc(warns.join(' · ')) : '') + '</span>' +
        '</div>';
    }).join('');
  }
  $('preview').addEventListener('change', (e) => {

  /* ================= บันทึก (คลิกเดียว) ================= */
  function buildPayload(force) {
    return {
      hn: $('hn').value.trim(), name: $('name').value.trim(), doctor: $('doctor').value.trim(),
      totalFx: parseInt($('totalFx').value, 10), note: $('note').value.trim(),
      sessions: state.sessions.map(s => ({ date: s.date })), force: !!force
    };
  }

  function validate(p) {
    if (!p.hn) return ['hn', t('v_hn')];
    if (!p.name) return ['name', t('v_name')];
    if (!p.doctor) return ['doctor', t('v_doctor')];
    if (!(p.totalFx >= 1 && p.totalFx <= 30)) return ['totalFx', t('v_fx')];
    if (modeVal() !== 'manual' && !$('startDate').value) return ['startDate', t('v_start')];
    if (p.sessions.length !== p.totalFx) return [null, t('v_incomplete', { n: p.totalFx })];
    const bad = p.sessions.findIndex(s => !s.date);
    if (bad >= 0) {
      const el = modeVal() === 'manual' ? document.querySelector('[data-mi="' + bad + '"]') : null;
      if (el) el.focus();
      return [null, t('v_fxdate', { n: bad + 1 })];
    }
    const dupHn = state.appts.find(a => a.hn === p.hn && a.status === ST_BOOKED && a.date >= todayIso());
    if (dupHn && !confirm(t('c_dup_course', { hn: p.hn, date: fmtDate(dupHn.date) }))) return [null, null];
    return null;
  }

  async function save(force) {
    if (state.busy) return;
    const p = buildPayload(force);
    const v = force ? null : validate(p);
    if (v) {
      if (v[0]) $(v[0]).focus();
      if (v[1]) toast(v[1], true);
      return;
    }
    setBusy(true);
    try {
      const res = await api.create(p);
      if (res.needConfirm) { showConfirm(res); return; }
      state.appts = res.appointments;
      if (res.overCapacity && res.overCapacity.length) {
        toast(t('t_saved_over', { max: state.max, list: res.overCapacity.map(d => fmtDate(d.date) + ' (' + d.total + ')').join(', ') }), true);
      } else {
        toast(t('t_saved', { hn: p.hn, n: res.count }));
      }
      resetForm();
    } catch (e) {
      toast(t('t_save_failed', { msg: errMsg(e) }), true);
    } finally {
      setBusy(false);
      renderAll();
    }
  }
  $('saveBtn').addEventListener('click', () => save(false));

      ).join('') + '</ul>';

      '</th><th>Fx</th><th>' + esc(t('th_note')) + '</th><th>' + esc(t('th_status')) + '</th><th></th></tr>';
  }
  function rowHtml(a, queueNo) {
    const cls = a.status === ST_CANCEL ? 'cancel' : a.status === ST_DONE ? 'done' : 'booked';
    return '<tr class="' + (cls === 'cancel' ? 'cancel' : '') + '">' +
      '<td>' + (a.status === ST_CANCEL ? '–' : queueNo[a.apptId]) + '</td>' +
      '<td><b>' + esc(a.hn) + '</b></td>' +
      '<td class="name">' + esc(a.name) + '</td>' +
      '<td>' + esc(a.doctor) + '</td>' +
      '<td>' + esc(a.fx) + '/' + esc(a.totalFx) + '</td>' +
      '<td class="name hint">' + esc(a.note) + '</td>' +
      '<td><span class="tag ' + cls + '">' + esc(statusText(a.status)) + '</span></td>' +
      '<td class="act"><div class="acts">' + actionButtons(a) + '</div></td></tr>';
  }

  function renderTable() {
    const today = todayIso();
    const q = $('q').value.trim().toLowerCase();
    let list = state.appts.slice();
    if (state.filter === 'today') list = list.filter(a => a.date === today);
    else if (state.filter === 'upcoming') list = list.filter(a => a.date >= today);
    else if (state.filter === 'past') list = list.filter(a => a.date < today).reverse();
    if (q) list = list.filter(a => (a.hn + ' ' + a.name + ' ' + a.doctor).toLowerCase().includes(q));

    const active = state.appts.filter(a => a.status !== ST_CANCEL);
    const todays = active.filter(a => a.date === today).length;
    const upcoming = active.filter(a => a.date >= today && a.status === ST_BOOKED);
    const patients = new Set(upcoming.map(a => a.hn)).size;
    $('stats').innerHTML = t('stats', { a: todays, b: upcoming.length, c: patients });

    if (!list.length) { $('tbody').innerHTML = '<tr><td colspan="' + COLS + '" class="empty">' + esc(t('no_appts')) + '</td></tr>'; return; }
    const counts = dayCounts();
    const queueNo = queueNumbers(counts);
    let lastDate = '';
    $('tbody').innerHTML = list.map(a => {
      let sep = '';
      if (a.date !== lastDate) {
        lastDate = a.date;
        const n = (counts[a.date] || []).length;
        sep = '<tr class="daysep"><td colspan="' + COLS + '">' + esc(fmtDate(a.date, LONG)) + (a.date === today ? esc(t('today_tag')) : '') +
          ' · ' + esc(cases(n)) + (n > state.max ? ' <span class="badtext">' + esc(t('over_max', { max: state.max })) + '</span>' : '') + '</td></tr>';
      }
      return sep + rowHtml(a, queueNo);
    }).join('');
  }

  async function onActionClick(e) {
    const b = e.target.closest('button[data-act]'); if (!b) return;
    const a = state.appts.find(x => x.apptId === b.dataset.id); if (!a) return;
    const who = 'HN ' + a.hn + ' ' + a.name;
    let p;
    if (b.dataset.act === 'done') p = api.done(a.apptId);
    else if (b.dataset.act === 'cancel') {
      if (!confirm(t('c_cancel_one', { fx: a.fx, who: who, date: fmtDate(a.date) }))) return;
      p = api.cancel(a.apptId, 'one');
    } else {
      if (!confirm(t('c_cancel_course', { who: who }))) return;
      p = api.cancel(a.apptId, 'course');
    }
    b.disabled = true;
    try {
      const res = await p; state.appts = res.appointments; renderAll();
      toast(b.dataset.act === 'done' ? t('t_done') : t('t_cancelled', { n: res.changed }));
    } catch (err) { toast(errMsg(err), true); b.disabled = false; }
  }
  $('tbody').addEventListener('click', onActionClick);
  $('dayDetail').addEventListener('click', onActionClick);

  /* ================= ส่วนกลาง ================= */
  // นัดที่ไม่ถูกยกเลิก จัดกลุ่มตามวัน { 'yyyy-MM-dd': [appt, ...] }
  function dayCounts() {
    const m = {};
    state.appts.forEach(a => { if (a.status !== ST_CANCEL) (m[a.date] = m[a.date] || []).push(a); });
    return m;
  }
  // ลำดับคิวในแต่ละวัน (ตามลำดับที่ลงนัด ไม่นับนัดที่ยกเลิก)
  function queueNumbers(counts) {
    const q = {};
    Object.keys(counts).forEach(d => counts[d].forEach((a, i) => { q[a.apptId] = i + 1; }));
    return q;
  }
  function actionButtons(a) {
    if (a.status !== ST_BOOKED) return '';
    const id = esc(a.apptId);
    return '<button class="btn sm okb" data-act="done" data-id="' + id + '" title="' + esc(t('a_done_title')) + '">' + esc(t('a_done')) + '</button>' +
      '<button class="btn sm danger" data-act="cancel" data-id="' + id + '" title="' + esc(t('a_cancel_title')) + '">' + esc(t('a_cancel')) + '</button>' +
      (a.totalFx > 1 ? '<button class="btn sm danger" data-act="course" data-id="' + id + '" title="' + esc(t('a_course_title')) + '">' + esc(t('a_course')) + '</button>' : '');
  }

  function renderAll() {
    renderAlerts();
    renderTable();
    renderPreview();
    if (state.view === 'dash') renderDash();
  }

  // แถบแจ้งเตือน: วันนี้เป็นต้นไปที่มีเคสเกินกำหนด
  function renderAlerts() {
    const counts = dayCounts(), today = todayIso();
    const over = Object.keys(counts).filter(d => d >= today && counts[d].length > state.max).sort();
    const bar = $('alertBar');
    if (!over.length) { bar.hidden = true; return; }
    bar.hidden = false;
    bar.innerHTML = '<b>' + esc(t('alert', { n: over.length, max: state.max })) + '</b>' +
      over.map(d => '<button type="button" data-goto="' + d + '">' + esc(fmtDate(d)) + ' · ' + esc(cases(counts[d].length)) + '</button>').join('');
  }
  $('alertBar').addEventListener('click', (e) => {
    const d = e.target.closest('[data-goto]'); if (!d) return;
    const dt = parseIso(d.dataset.goto);
    state.dashMonth = new Date(dt.getFullYear(), dt.getMonth(), 1);
    state.dashDay = d.dataset.goto;
    setView('dash');
    $('dayDetail').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  /* ================= สลับหน้า ================= */
  function setView(v) {
    state.view = v;
    $('viewBook').hidden = v !== 'book';
    $('viewDash').hidden = v !== 'dash';
    $('tabs').querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x.dataset.view === v));
    if (v === 'dash') renderDash();
  }
  $('tabs').addEventListener('click', (e) => { const x = e.target.closest('[data-view]'); if (x) setView(x.dataset.view); });

  /* ================= แดชบอร์ด ================= */
  const monthStart = (d) => new Date(d.getFullYear(), d.getMonth(), 1);
  function daysOfMonth(m) {
    const n = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate(), out = [];
    for (let i = 1; i <= n; i++) out.push(iso(new Date(m.getFullYear(), m.getMonth(), i)));
    return out;
  }
  $('prevM').addEventListener('click', () => { const m = state.dashMonth; state.dashMonth = new Date(m.getFullYear(), m.getMonth() - 1, 1); state.dashDay = null; renderDash(); });
  $('nextM').addEventListener('click', () => { const m = state.dashMonth; state.dashMonth = new Date(m.getFullYear(), m.getMonth() + 1, 1); state.dashDay = null; renderDash(); });
  $('thisM').addEventListener('click', () => { state.dashMonth = monthStart(new Date()); state.dashDay = todayIso(); renderDash(); });

  function renderDash() {
    if (!state.dashMonth) state.dashMonth = monthStart(new Date());
    const m = state.dashMonth;
    const counts = dayCounts();
    const today = todayIso();
    const days = daysOfMonth(m);
    if (!state.dashDay || state.dashDay.slice(0, 7) !== days[0].slice(0, 7)) {
      state.dashDay = today.slice(0, 7) === days[0].slice(0, 7) ? today : (days.find(d => counts[d]) || days[0]);
    }
    $('monthTitle').textContent = m.toLocaleDateString(LOCALE[lang], { month: 'long', year: 'numeric' });

    // KPI
    const now = new Date(); const dow = (now.getDay() + 6) % 7;
    const wkStart = iso(addDays(now, -dow)), wkEnd = iso(addDays(now, 6 - dow));
    const sumRange = (a, b) => Object.keys(counts).filter(d => d >= a && d <= b).reduce((n, d) => n + counts[d].length, 0);
    const monthTotal = days.reduce((n, d) => n + (counts[d] || []).length, 0);
    const overDays = days.filter(d => (counts[d] || []).length > state.max);
    const busiest = days.reduce((best, d) => ((counts[d] || []).length > (counts[best] || []).length ? d : best), days[0]);
    const todayN = (counts[today] || []).length;
    const short = { day: 'numeric', month: 'short' };
    $('kpis').innerHTML =
      kpi(t('k_today'), todayN, todayN > state.max ? t('over_max', { max: state.max }) : t('k_today_sub', { max: state.max }), todayN > state.max) +
      kpi(t('k_week'), sumRange(wkStart, wkEnd), fmtDate(wkStart, short) + ' – ' + fmtDate(wkEnd, short)) +
      kpi(t('k_month', { m: m.toLocaleDateString(LOCALE[lang], { month: 'short' }) }), monthTotal,
        (counts[busiest] || []).length ? t('k_busiest', { date: fmtDate(busiest, short), cases: cases(counts[busiest].length) }) : t('k_none_yet')) +
      kpi(t('k_over', { max: state.max }), overDays.length,
        overDays.length ? t('k_over_days', { list: overDays.map(d => parseIso(d).getDate()).join(', ') }) : t('none'), overDays.length > 0);

    renderChart(days, counts, today);
    renderCalendar(m, days, counts, today);
    renderDayDetail(counts);
  }

  function kpi(k, v, s, bad) {
    return '<div class="kpi' + (bad ? ' bad' : '') + '"><div class="k">' + esc(k) + '</div><div class="v">' + esc(v) + '</div><div class="s">' + esc(s) + '</div></div>';
  }

  // กราฟแท่ง: เคสต่อวัน + เส้นจำกัดจำนวนเคส
  function renderChart(days, counts, today) {
    // วาดตามความกว้างจริงของกล่อง ให้ตัวหนังสือไม่เล็กลงบนมือถือ
    const W = Math.max(300, Math.round($('chart').clientWidth || 900)), H = W < 560 ? 200 : 240, L = 30, R = 12, T = 18, B = 26;
    const vals = days.map(d => (counts[d] || []).length);
    const yMax = Math.max(state.max + 2, ...vals);
    const step = yMax > 12 ? 4 : 2;
    const top = Math.ceil(yMax / step) * step;
    const cw = (W - L - R) / days.length;
    const bw = Math.max(4, cw - 4); // เว้นช่องระหว่างแท่ง
    const y = (v) => T + (H - T - B) * (1 - v / top);
    let g = '<g class="grid">';
    for (let v = 0; v <= top; v += step) g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/>';
    g += '</g><g class="axis">';
    for (let v = 0; v <= top; v += step) g += '<text x="' + (L - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v + '</text>';
    const every = cw < 14 ? 5 : cw < 22 ? 2 : 1;
    days.forEach((d, i) => {
      const n = i + 1;
      if (n === 1 || (n - 1) % every === 0) {
        g += '<text x="' + (L + cw * i + cw / 2) + '" y="' + (H - 8) + '" text-anchor="middle"' + (d === today ? ' class="today"' : '') + '>' + n + '</text>';
      }
    });
    g += '</g>';
    let bars = '';
    days.forEach((d, i) => {
      const v = vals[i]; const x = L + cw * i + (cw - bw) / 2;
      if (v > 0) {
        const y0 = y(0), y1 = y(v), r = Math.min(4, bw / 2, y0 - y1);
        const cls = 'bar' + (v > state.max ? ' over' : '') + (d < today ? ' past' : '');
        bars += '<path class="' + cls + '" d="M' + x + ',' + y0 + 'V' + (y1 + r) + 'Q' + x + ',' + y1 + ' ' + (x + r) + ',' + y1 +
          'H' + (x + bw - r) + 'Q' + (x + bw) + ',' + y1 + ' ' + (x + bw) + ',' + (y1 + r) + 'V' + y0 + 'Z"/>';
        if (v > state.max) bars += '<text class="val" x="' + (x + bw / 2) + '" y="' + (y1 - 4) + '">' + v + '</text>';
      }
    });
    const ly = y(state.max);
    const limit = '<line class="limit" x1="' + L + '" x2="' + (W - R) + '" y1="' + ly + '" y2="' + ly + '"/>' +
      '<text class="limit-label" x="' + (W - R) + '" y="' + (ly - 5) + '" text-anchor="end">' + esc(t('limit_label', { max: state.max })) + '</text>';
    let hits = '';
    days.forEach((d, i) => {
      hits += '<rect class="hit' + (d === state.dashDay ? ' sel' : '') + '" data-d="' + d + '" x="' + (L + cw * i) + '" y="' + T + '" width="' + cw + '" height="' + (H - T - B + 18) + '" rx="4"/>';
    });
    $('chart').innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(t('chart_aria')) + '">' + g + hits + bars + limit + '</svg><div class="tip" id="tip"></div>';
    $('legend').innerHTML = '<span><i style="background:var(--accent)"></i>' + esc(t('lg_cases')) + '</span>' +
      '<span><i style="background:var(--bad)"></i>' + esc(t('lg_over', { max: state.max })) + '</span>' +
      '<span><i style="background:var(--accent);opacity:.45"></i>' + esc(t('lg_past')) + '</span>' +
      '<span><i class="dash"></i>' + esc(t('lg_limit')) + '</span>';
  }
  // tooltip + คลิกแท่ง
  $('chart').addEventListener('mousemove', (e) => {
    const r = e.target.closest('.hit'); const tip = $('tip'); if (!tip) return;
    if (!r) { tip.style.display = 'none'; return; }
    const d = r.dataset.d, list = dayCounts()[d] || [];
    tip.innerHTML = '<b>' + esc(fmtDate(d)) + '</b><br>' + esc(cases(list.length)) + (list.length > state.max ? ' · ' + esc(t('over_max', { max: state.max })) : '') +
      (list.length ? '<br>' + list.slice(0, 8).map((a, i) => esc((i + 1) + '. HN ' + a.hn + ' ' + a.name)).join('<br>') + (list.length > 8 ? '<br>…' : '') : '');
    tip.style.display = 'block';
    const box = $('chart').getBoundingClientRect();
    let x = e.clientX - box.left + 12; if (x + 260 > box.width) x = e.clientX - box.left - tip.offsetWidth - 12;
    tip.style.left = Math.max(0, x) + 'px'; tip.style.top = Math.max(0, e.clientY - box.top - 10) + 'px';
  });
  $('chart').addEventListener('mouseleave', () => { const tip = $('tip'); if (tip) tip.style.display = 'none'; });
  $('chart').addEventListener('click', (e) => {
    const r = e.target.closest('.hit'); if (!r) return;
    state.dashDay = r.dataset.d; renderDash();
  });
  let resizeT;
  window.addEventListener('resize', () => {
    clearTimeout(resizeT);
    resizeT = setTimeout(() => { if (state.view === 'dash') renderChart(daysOfMonth(state.dashMonth), dayCounts(), todayIso()); }, 150);
  });

  // ปฏิทินรายเดือน: แต่ละวันแสดงจำนวนเคสและรายชื่อตามคิว
  function renderCalendar(m, days, counts, today) {
    const lead = (new Date(m.getFullYear(), m.getMonth(), 1).getDay() + 6) % 7; // เริ่มวันจันทร์
    let html = [1, 2, 3, 4, 5, 6, 0].map(d => '<div class="dow">' + esc(DOW[lang][d]) + '</div>').join('');
    for (let i = 0; i < lead; i++) html += '<div class="day out"></div>';
    days.forEach(d => {
      const list = counts[d] || [];
      const n = list.length, hol = state.holidays[d];
      const cls = ['day', n === 0 ? 'empty' : '', hol ? 'holiday' : '', d === today ? 'today' : '', d === state.dashDay ? 'sel' : '',
        n > state.max ? 'over' : n === state.max ? 'full' : ''].filter(Boolean).join(' ');
      const show = list.slice(0, 7);
      html += '<button type="button" class="' + cls + '" data-d="' + d + '">' +
        '<div class="top"><span class="num">' + parseIso(d).getDate() +
        '<span class="hint" style="font-weight:400"> ' + esc(DOW[lang][parseIso(d).getDay()]) + '</span></span>' +
        (n ? '<span class="cnt">' + (n > state.max ? '⚠️ ' : '') + esc(cases(n)) + '</span>' : '') + '</div>' +
        (hol ? '<div class="hol">🏖 ' + esc(hol) + '</div>' : '') +
        (n ? '<ul>' + show.map((a, i) => '<li class="' + (a.status === ST_DONE ? 'done' : '') + '" title="' + esc('HN ' + a.hn + ' ' + a.name + ' · ' + a.doctor + ' · Fx ' + a.fx + '/' + a.totalFx) + '">' +
          (a.status === ST_DONE ? '✓ ' : (i + 1) + '. ') + esc(a.hn) + ' ' + esc(a.name) + '</li>').join('') +
          (n > show.length ? '<li class="more">' + esc(t('more', { n: n - show.length })) + '</li>' : '') + '</ul>' : '') +
        '</button>';
    });
    const trail = (7 - (lead + days.length) % 7) % 7;
    for (let i = 0; i < trail; i++) html += '<div class="day out"></div>';
    $('calgrid').innerHTML = html;
  }
  $('calgrid').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-d]'); if (!b) return;
    state.dashDay = b.dataset.d; renderDash();
    if (window.innerWidth < 860) $('dayDetail').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  // รายละเอียดวันที่เลือก
  function renderDayDetail(counts) {
    const d = state.dashDay;
    const all = state.appts.filter(a => a.date === d);
    const active = counts[d] || [];
    const queueNo = queueNumbers(counts);
    const byDoc = {};
    active.forEach(a => { byDoc[a.doctor] = (byDoc[a.doctor] || 0) + 1; });
    const n = active.length;
    let html = '<h3>' + esc(fmtDate(d, LONG)) + ' — ' + esc(cases(n)) +
      (n > state.max ? ' <span class="badtext">' + esc(t('dd_over', { max: state.max, n: n - state.max })) + '</span>' : '') + '</h3>';
    if (state.holidays[d]) html += '<p class="hint">🏖 ' + esc(t('w_holiday', { name: state.holidays[d] })) + '</p>';
    if (Object.keys(byDoc).length) {
      html += '<div class="docsum">' + Object.keys(byDoc).map(k => '<span>👩‍⚕️ ' + esc(k) + ' · ' + byDoc[k] + '</span>').join('') + '</div>';
    }
    if (!all.length) { $('dayDetail').innerHTML = html + '<div class="empty">' + esc(t('no_appts_day')) + '</div>'; return; }
    html += '<div class="tablewrap"><table><thead>' + theadHtml() + '</thead><tbody>' +
      all.map(a => rowHtml(a, queueNo)).join('') + '</tbody></table></div>';
    $('dayDetail').innerHTML = html;
  }

  /* ================= init ================= */
  applyStaticText();
  $('tbody').innerHTML = '<tr><td colspan="' + COLS + '" class="empty">' + esc(t('loading')) + '</td></tr>';
  (async function init() {
    $('startDate').value = iso(nextFree(addDays(new Date(), 1)));
    try {
      const d = await api.init();
      state.user = d.user;
      state.calName = d.settings.calendarName;
      state.max = d.settings.maxCasesPerDay || 6;
      $('doctor').innerHTML = '<option value="" data-i18n="choose_doctor">' + esc(t('choose_doctor')) + '</option>' +
        d.doctors.map(x => '<option value="' + esc(x) + '">' + esc(x) + '</option>').join('');
      d.holidays.forEach(h => { state.holidays[h.date] = h.name || t('holiday_default'); });
      $('startDate').value = iso(nextFree(addDays(new Date(), 1)));
      state.appts = d.appointments;
    } catch (e) {
      state.loadError = errMsg(e);
      toast(state.loadError, true);
    }
    renderUser();
    regenerate();
    renderAll();
  })();

  if (!isGas) {
    $('seedBtn').addEventListener('click', async () => { state.appts = await api.seed(); renderAll(); toast(t('seeded')); });
    $('clearBtn').addEventListener('click', async () => { state.appts = await api.clear(); renderAll(); toast(t('cleared')); });
  }
})();
</script>
</body>
