  const st = state, t = id ? typeById(st, id) : null;
  const v = t ? { ...t } : { name: '', desc: '', category: 'patient', weight: 1, days: 2, needsCheck: true, checkWeight: 0.5, color: PALETTE[st.taskTypes.length % PALETTE.length] };
  const colors = [...new Set([...PALETTE, v.color])];
  ui.dlg = { kind: 'type', id: t ? t.id : null };
  openDialog(`<form class="dlg" data-form="type" novalidate>
    <div class="dlg-h"><h2>${t ? 'แก้ไขประเภทงาน' : 'เพิ่มประเภทงาน'}</h2><button type="button" class="icon-btn" data-action="dlg-close" aria-label="ปิด">${ic.x}</button></div>
    <div class="dlg-b">
      <div class="row-2">
        <label class="field"><span class="label">ชื่อย่อ <span class="req">*</span></span><input type="text" id="ty-name" value="${esc(v.name)}" placeholder="เช่น VMAT" autofocus></label>
        <label class="field"><span class="label">คำอธิบาย</span><input type="text" id="ty-desc" value="${esc(v.desc)}" placeholder="เช่น Volumetric-modulated arc therapy"></label>
      </div>
      <div class="field"><span class="label">กลุ่มงาน</span><div class="seg"><label><input type="radio" name="ty-cat" value="patient" ${v.category !== 'qa' ? 'checked' : ''}><span>งานผู้ป่วย (มี HN)</span></label><label><input type="radio" name="ty-cat" value="qa" ${v.category === 'qa' ? 'checked' : ''}><span>QA / งานประจำ</span></label></div></div>
      <div class="row-3" style="margin-top:14px">
        <label class="field"><span class="label">แต้มภาระงาน</span><input type="number" id="ty-weight" min="0" step="0.25" value="${esc(v.weight)}"></label>
        <label class="field"><span class="label">กำหนดเสร็จ (วันทำการ)</span><input type="number" id="ty-days" min="0" max="60" step="1" value="${esc(v.days)}"></label>
        <label class="field"><span class="label">แต้มผู้ตรวจแผน</span><input type="number" id="ty-cw" min="0" step="0.25" value="${esc(v.checkWeight)}"></label>
      </div>
      <label class="switch" style="margin-top:10px"><input type="checkbox" id="ty-check" ${v.needsCheck ? 'checked' : ''}><span><b>ต้องมีผู้ตรวจสอบแผน</b><small>ระบบจะเลือกผู้ตรวจ (คนละคนกับผู้วางแผน) ให้อัตโนมัติ</small></span></label>
      <div class="field" style="margin-top:8px"><span class="label">สี</span><div class="swatches">${colors.map(c => `<label><input type="radio" name="ty-color" value="${c}" ${c === v.color ? 'checked' : ''}><span style="--c:${c}"></span></label>`).join('')}</div></div>
      <div class="form-err" id="tyErr"></div>
    </div>
    <div class="dlg-f"><span class="sp"></span><button type="button" class="btn" data-action="dlg-close">ยกเลิก</button><button type="submit" class="btn primary">บันทึก</button></div>
  </form>`);
}
function saveTypeDialog() {
  const name = $('#ty-name').value.trim();
  if (!name) { $('#ty-name').classList.add('invalid'); $('#tyErr').innerHTML = `${ic.alert}<span>กรุณากรอกชื่อประเภทงาน</span>`; return; }
  const v = {
    name, desc: $('#ty-desc').value.trim(), category: ($('#dlg input[name="ty-cat"]:checked') || {}).value || 'patient',
    weight: Math.max(0, num($('#ty-weight').value, 1)), days: clamp(Math.round(num($('#ty-days').value, 0)), 0, 60),
    needsCheck: $('#ty-check').checked, checkWeight: Math.max(0, num($('#ty-cw').value, 0)),
    color: ($('#dlg input[name="ty-color"]:checked') || {}).value || PALETTE[0],
  };
  const id = ui.dlg.id || uid();
  commit(st => { const t = typeById(st, id); if (t) Object.assign(t, v); else st.taskTypes.push({ id, ...v }); });
  closeDialog();
  toast(`บันทึกประเภทงาน <b>${esc(name)}</b> แล้ว`);
}
async function deleteType(id) {
  const t = typeById(state, id); if (!t) return;
  const n = state.tasks.filter(x => x.typeId === id).length;
  if (n) { await confirmBox({ title: `ลบ ${esc(t.name)} ไม่ได้`, body: `มีงานประเภทนี้ ${n} รายการในระบบ แนะนำให้แก้ไขชื่อแทน`, ok: 'เข้าใจแล้ว' }); return; }
  if (!await confirmBox({ title: `ลบประเภทงาน ${esc(t.name)}?`, ok: 'ลบ', danger: true })) return;
  commit(st => { st.taskTypes = st.taskTypes.filter(x => x.id !== id); st.staff.forEach(s => { s.exclude = (s.exclude || []).filter(x => x !== id); }); });
  toast('ลบประเภทงานแล้ว');
}

/* ============================================================
   ส่งออก / นำเข้า
   ============================================================ */
function exportTasksCSV(rows) {
  const st = state;
  const data = [['ลำดับ', 'วันที่รับงาน', 'กำหนดเสร็จ', 'ประเภทงาน', 'HN', 'ชื่อผู้ป่วย', 'ตำแหน่งที่ฉาย', 'แพทย์', 'ผู้รับผิดชอบ', 'ผู้ตรวจแผน', 'สถานะ', 'แต้ม', 'หมายเหตุ']];
  for (const t of rows) {
    const ty = typeById(st, t.typeId);
    data.push([t.seq, thDate(t.date, { year: true }), thDate(t.due, { year: true }), ty ? ty.name : '', t.hn, t.patient, t.site, t.doctor, fullName(staffById(st, t.assigneeId)), t.checkerId ? fullName(staffById(st, t.checkerId)) : '', STATUS[t.status].label, ty ? ty.weight : '', t.note]);
  }
  download(`งานฟิสิกส์การแพทย์-${stamp()}.csv`, toCSV(data), 'text/csv');
}
function exportLeaveCSV() {
  const st = state;
  const data = [['บุคลากร', 'ประเภทการลา', 'ตั้งแต่', 'ถึง', 'ช่วงเวลา', 'จำนวนวันทำการ', 'หมายเหตุ']];
  [...st.leaves].sort((a, b) => a.start.localeCompare(b.start)).forEach(l => data.push([fullName(staffById(st, l.staffId)), LEAVE_TYPES[l.type].label, thDate(l.start, { year: true }), thDate(l.end, { year: true }), LEAVE_PARTS[l.part], workdaysBetween(st, l.start, l.end) * (l.part === 'full' ? 1 : 0.5), l.note]));
  download(`วันลา-${stamp()}.csv`, toCSV(data), 'text/csv');
}
function exportReportCSV() {
  const r = ui._report; if (!r) return;
  const data = [['บุคลากร', ...r.types.map(t => t.name), 'ตรวจแผน', 'รวมงาน', 'แต้ม']];
  r.rows.forEach(x => data.push([fullName(x.s), ...x.cells, x.checks, x.total, fmtNum(x.pts)]));
  download(`สรุปภาระงาน-${r.ym}.csv`, toCSV(data), 'text/csv');
}

/* ============================================================
   ตัวจัดการเหตุการณ์
   ============================================================ */
const actions = {
  'go': el => go(el.dataset.view),
  'theme': () => { const order = ['auto', 'light', 'dark']; prefs.theme = order[(order.indexOf(prefs.theme || 'auto') + 1) % 3]; savePrefs(); applyTheme(); renderNav(); },
  'dlg-close': () => closeDialog(),
  'print': () => window.print(),
  'hide-demo': () => { ui.hideDemo = true; render(); },
  'clear-demo': async () => {
    if (!await confirmBox({ title: 'ล้างงานและวันลาทั้งหมด?', body: 'รายชื่อบุคลากร ประเภทงาน วันหยุด และการตั้งค่าจะยังอยู่ แนะนำให้สำรองข้อมูลก่อนหากมีข้อมูลจริง', ok: 'ล้างข้อมูล', danger: true })) return;
    commit(st => { st.tasks = []; st.leaves = []; st.seq = 0; st.demo = false; });
    ui.draft = null;
    toast('ล้างข้อมูลแล้ว พร้อมเริ่มใช้งานจริง');
  },
  'reset-demo': async () => {
    if (!await confirmBox({ title: 'โหลดข้อมูลตัวอย่าง?', body: 'ข้อมูลปัจจุบันทั้งหมดจะถูกแทนที่ด้วยข้อมูลตัวอย่าง', ok: 'โหลดข้อมูลตัวอย่าง', danger: true })) return;
    const fresh = seedState();
    commit(st => { Object.keys(st).forEach(k => delete st[k]); Object.assign(st, structuredClone(fresh)); });
    ui.draft = null; ui.hideDemo = false;
    toast('โหลดข้อมูลตัวอย่างแล้ว');
  },
  // กระจายงาน
  'draft-type': el => {
    const d = ensureDraft(); d.typeId = el.dataset.id;
    if (!d.dueTouched) d.due = defaultDue(state, d.typeId, d.date);
    render();
  },
  'draft-mode': el => {
    const d = ensureDraft(); d.mode = el.dataset.mode;
    if (d.mode === 'manual' && !d.assigneeId) {
      const ty = typeById(state, d.typeId), base = { typeId: d.typeId, date: d.date, due: d.due };
      const p = autoPick(state, { ...base, role: 'planner' });
      d.assigneeId = p ? p.staff.id : '';
      if (ty && ty.needsCheck && !d.checkerId) { const c = autoPick(state, { ...base, role: 'checker', exclude: d.assigneeId ? { [d.assigneeId]: '-' } : {} }); d.checkerId = c ? c.staff.id : ''; }
    }
    render();
  },
  'draft-pick': el => {
    const d = ensureDraft();
    if (d.mode === 'auto') {
      const base = { typeId: d.typeId, date: d.date, due: d.due };
      const p = autoPick(state, { ...base, role: 'planner' });
      d.assigneeId = p ? p.staff.id : '';
      const ty = typeById(state, d.typeId);
      if (ty && ty.needsCheck) { const c = autoPick(state, { ...base, role: 'checker', exclude: d.assigneeId ? { [d.assigneeId]: '-' } : {} }); d.checkerId = c ? c.staff.id : ''; }
    }
    d.mode = 'manual';
    if (el.dataset.role === 'checker') d.checkerId = el.dataset.id;
    else { d.assigneeId = el.dataset.id; if (d.checkerId === d.assigneeId) d.checkerId = ''; }
    render();
  },
  'draft-reset': () => { const d = ensureDraft(); ui.draft = newDraft({ typeId: d.typeId, mode: d.mode }); render(); },
  'duty-open': () => openDutyDialog(),
  // งาน
  'task-edit': el => openTaskDialog(el.dataset.id),
  'task-delete': async el => {
    const t = state.tasks.find(x => x.id === el.dataset.id); if (!t) return;
    const ty = typeById(state, t.typeId);
    if (!await confirmBox({ title: 'ลบงานนี้?', body: `${esc(ty ? ty.name : '')} ${esc(t.hn || '')} · ${thDate(t.date, { year: true })}`, ok: 'ลบงาน', danger: true })) return;
    closeDialog();
    commit(st => { st.tasks = st.tasks.filter(x => x.id !== t.id); });
    toast('ลบงานแล้ว');
  },
  'task-auto': el => {
    const v = readTaskDialog(), role = el.dataset.role;
    const sim = structuredClone(state);
    const t = sim.tasks.find(x => x.id === v.id);
    Object.assign(t, { typeId: v.typeId, date: v.date, due: v.due, assigneeId: v.assigneeId || null, checkerId: v.checkerId || null });
    const p = reassign(sim, v.id, role);
    if (!p) { toast('ไม่มีผู้ว่างคนอื่นในช่วงวันที่นี้', 'warn'); return; }
    v[role === 'checker' ? 'checkerId' : 'assigneeId'] = p.staff.id;
    drawTaskDialog();
    toast(`ระบบเลือก <b>${esc(shortName(p.staff))}</b> — กดบันทึกเพื่อยืนยัน`, 'info');
  },
  'tasks-open': () => { ui.tf = { q: '', status: 'open', staff: '', type: '', month: '' }; go('tasks'); },
  'tf-status': el => { ui.tf.status = el.dataset.v; ui.limit = 120; $$('[data-action="tf-status"]').forEach(b => b.setAttribute('aria-pressed', b === el)); refreshTaskResults(); },
  'tf-clear': () => { ui.tf = { q: '', status: 'all', staff: '', type: '', month: '' }; render(); },
  'tf-more': () => { ui.limit += 200; refreshTaskResults(); },
  'tasks-csv': () => exportTasksCSV(ui.view === 'tasks' ? filteredTasks() : [...state.tasks].sort((a, b) => a.date.localeCompare(b.date) || a.seq - b.seq)),
  'report-csv': () => exportReportCSV(),
  'issues-open': () => openIssuesDialog(null, 'งานที่ต้องกระจายใหม่'),
  // วันลา
  'leave-new': el => openLeaveDialog({ staffId: el.dataset.staff }),
  'leave-edit': el => openLeaveDialog({ id: el.dataset.id }),
  'leave-delete': el => deleteLeave(el.dataset.id),
  'leave-csv': () => exportLeaveCSV(),
  'cal-move': el => { const [y, m] = ui.calMonth.split('-').map(Number); const d = new Date(Date.UTC(y, m - 1 + +el.dataset.n, 1)); ui.calMonth = `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}`; render(); },
  'cal-today': () => { ui.calMonth = todayISO().slice(0, 7); render(); },
  // บุคลากร
  'staff-new': () => openStaffDialog(null),
  'staff-edit': el => openStaffDialog(el.dataset.id),
  'staff-delete': el => deleteStaff(el.dataset.id),
  // ตั้งค่า
  'type-new': () => openTypeDialog(null),
  'type-edit': el => openTypeDialog(el.dataset.id),
  'type-delete': el => deleteType(el.dataset.id),
  'hol-add': () => {
    const date = $('#hol-date').value, name = $('#hol-name').value.trim();
    if (!isISO(date)) { $('#hol-date').classList.add('invalid'); return; }
    if (state.holidays.some(h => h.date === date)) { toast('มีวันหยุดวันนี้อยู่แล้ว', 'warn'); return; }
    commit(st => { st.holidays.push({ date, name: name || 'วันหยุด' }); });
    toast('เพิ่มวันหยุดแล้ว');
  },
  'hol-delete': el => { const d = el.dataset.date; commit(st => { st.holidays = st.holidays.filter(h => h.date !== d); }); },
  'backup': () => download(`medphys-backup-${stamp()}.json`, JSON.stringify(state, null, 2), 'application/json'),
  'restore': () => $('#importFile').click(),
};
document.addEventListener('click', e => {
  // คลิก/แตะช่องว่างบนปฏิทินวันลา
  const td = e.target.closest('.cal td.cell');
  if (td && !e.target.closest('.lv')) {
    if (Date.now() < suppressClickUntil) return;
    openLeaveDialog({ staffId: td.dataset.s, start: td.dataset.d, end: td.dataset.d });
    return;
  }
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const fn = actions[el.dataset.action];
  if (!fn) return;
  e.preventDefault();
  fn(el, e);
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.draft) {
    const d = ensureDraft(), k = el.dataset.draft;
    d[k] = el.value;
    el.classList.remove('invalid');
    if (k === 'date' && isISO(el.value)) {
      if (!d.dueTouched || d.due < d.date) { d.due = defaultDue(state, d.typeId, d.date); const due = $('[data-draft="due"]'); if (due) due.value = d.due; }
      const due = $('[data-draft="due"]'); if (due) due.min = d.date;
    }
    if (k === 'due') d.dueTouched = true;
    if (k === 'date') { const dh = $('#dateHint'); if (dh) dh.innerHTML = dateNote(d.date); }
    if (k === 'date' || k === 'due') {
      const h = $('#dueHint');
      if (h && isISO(d.date) && isISO(d.due)) h.textContent = d.due === d.date ? 'เสร็จภายในวันเดียวกัน' : d.due < d.date ? 'ก่อนวันรับงาน' : `อีก ${workdaysBetween(state, addDays(d.date, 1), d.due)} วันทำการ`;
      refreshPreview();
    }
    return;
  }
  if (el.dataset.filter === 'q') { ui.tf.q = el.value; ui.limit = 120; refreshTaskResults(); return; }
  if (el.id === 'sf-cap') { $('#sf-cap-o').textContent = el.value + '%'; return; }
  if (el.matches('[data-lv]')) { updateLeaveSummary(); return; }
  if (el.matches('[data-du]')) { updateDutyPreview(); return; }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.draft) {
    // วันที่เปลี่ยน → วาดรายการงานของวันนั้นใหม่; ผู้รับผิดชอบเปลี่ยน → อัปเดตตัวเลือกผู้ตรวจ
    const k = el.dataset.draft;
    if (k === 'assigneeId') { const d = ensureDraft(); if (d.checkerId === d.assigneeId) d.checkerId = ''; render(); }
    else if (k === 'checkerId') refreshPreview();
    else if (k === 'date' && isISO(el.value)) render();
    return;
  }
  if (el.dataset.filter && el.dataset.filter !== 'q') { ui.tf[el.dataset.filter] = el.value; ui.limit = 120; refreshTaskResults(); return; }
  if (el.dataset.change === 'task-status') {
    const id = el.dataset.id, v = el.value;
    commit(st => { const t = st.tasks.find(x => x.id === id); if (t) { t.status = v; if (v === 'done') t.doneAt = new Date().toISOString(); } });
    return;
  }
  if (el.dataset.change === 'report-month') { ui.reportMonth = el.value; render(); return; }
  if (el.dataset.change === 'leave-past') { ui.showPastLeaves = el.checked; render(); return; }
  if (el.dataset.change === 'staff-active') {
    const id = el.dataset.id, v = el.checked;
    commit(st => { const s = staffById(st, id); if (s) s.active = v; });
    return;
  }
  if (el.dataset.setting) {
    const k = el.dataset.setting;
    let v = el.type === 'checkbox' ? el.checked : el.value;
    if (k === 'windowDays') { v = clamp(Math.round(num(v, 30)), 7, 365); el.value = v; }
    if (typeof v === 'string') v = v.trim();
    commit(st => { st.settings[k] = v; });
    toast('บันทึกการตั้งค่าแล้ว');
    return;
  }
  if (el.matches('[data-lv]')) { updateLeaveSummary(); return; }
  if (el.matches('[data-du]')) { updateDutyPreview(); return; }
  if (el.dataset.tv === 'typeId' || el.dataset.tv === 'assigneeId' || el.dataset.tv === 'checkerId' || el.dataset.tv === 'date' || el.dataset.tv === 'due') {
    const v = readTaskDialog();
    if (el.dataset.tv === 'date' && v.due < v.date) v.due = v.date;
    drawTaskDialog();
  }
});
document.addEventListener('submit', e => {
  const f = e.target;
  if (f.id === 'assignForm') { e.preventDefault(); submitAssign(); return; }
  const kind = f.dataset.form;
  if (!kind) return;
  e.preventDefault();
  ({ leave: saveLeaveDialog, staff: saveStaffDialog, type: saveTypeDialog, task: saveTaskDialog, issues: applyIssuesDialog, duty: applyDuty })[kind]?.();
});
$('#importFile').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!data || !Array.isArray(data.staff) || !Array.isArray(data.tasks)) throw new Error('รูปแบบไฟล์ไม่ถูกต้อง');
    if (!await confirmBox({ title: 'นำเข้าข้อมูลสำรอง?', body: `บุคลากร ${data.staff.length} คน · งาน ${data.tasks.length} รายการ · วันลา ${(data.leaves || []).length} รายการ<br>ข้อมูลปัจจุบันทั้งหมดจะถูกแทนที่`, ok: 'นำเข้า', danger: true })) return;
    const fresh = normalizeState(data);
    commit(st => { Object.keys(st).forEach(k => delete st[k]); Object.assign(st, structuredClone(fresh)); });
    ui.draft = null;
    toast('นำเข้าข้อมูลเรียบร้อย');
  } catch (err) { toast('นำเข้าไม่สำเร็จ: ' + esc(err.message), 'danger', 6000); }
});
window.addEventListener('storage', e => {
  if (session.mode === 'local' && e.key === STORE_KEY && e.newValue) {
    try { state = normalizeState(JSON.parse(e.newValue)); safeRender(); } catch (err) { /* ignore */ }
  }
});
window.addEventListener('hashchange', () => { const v = location.hash.replace(/^#\/?/, ''); if (VIEWS[v] && v !== ui.view) go(v); });

/* ============================================================
   เริ่มต้นระบบ
   ============================================================ */
async function boot() {
  applyTheme();
  const h = location.hash.replace(/^#\/?/, '');
  if (VIEWS[h]) ui.view = h;
  if (hasGAS()) {
    session.mode = 'gas';
    $('#view').innerHTML = emptyBox('กำลังโหลดข้อมูลจาก Google Sheets…', ic.sheet);
    setSync('loading');
    try {
      const r = await gas('apiLoad');
      session.rev = r.rev || 0; session.user = r.user || '';
      if (r.json) state = normalizeState(JSON.parse(r.json));
      else { state = seedState(); pending.push(() => {}); pushRemote(); }
      setSync('saved');
    } catch (e) {
      console.error(e);
      $('#view').innerHTML = `<div class="callout warn">${ic.alert}<div class="body"><h3>เชื่อมต่อ Google Sheets ไม่สำเร็จ</h3><p class="muted">${esc(e && e.message || e)}</p><div class="actions"><button class="btn sm primary" onclick="location.reload()">ลองใหม่</button></div></div></div>`;
      setSync('error', 'เชื่อมต่อไม่สำเร็จ');
      return;
    }
    setInterval(pullRemote, 30000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) pullRemote(); });
  } else {
    state = loadLocal();
    saveLocal();
  }
  render();
}
// สำหรับทดสอบ/ดีบักจากคอนโซล
window.MedPhys = { get state() { return state; }, rankStaff: (o) => rankStaff(state, o), findIssues: () => findIssues(state), seedState, normalizeState };
boot();
})();
