<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #EEF1F6; --surface: #FFFFFF; --ink: #152033; --ink-2: #4B5A70; --line: #D6DDE8;
  --accent: #2747B0; --accent-ink: #2747B0; --on-accent: #FFFFFF; --warn-bg: #FBEBDD; --warn: #B4570A;
  --font-body: "IBM Plex Sans Thai", "Noto Sans Thai", "Leelawadee UI", Tahoma, system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #10151F; --surface: #171E2A; --ink: #E7ECF4; --ink-2: #B3BECF; --line: #2B3546;
    --accent: #6A86EE; --accent-ink: #9DB0FF; --on-accent: #0E1424; --warn-bg: #3A2A18; --warn: #E3A94B; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.55 var(--font-body); padding: 0 16px; display: grid; place-items: center; }
.card { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 28px 24px; display: grid; gap: 16px; }
h1 { margin: 0; font-size: 1.5rem; font-weight: 700; }
h1 span { color: var(--accent-ink); }
p { margin: 0; color: var(--ink-2); }
.btn { display: block; text-align: center; text-decoration: none; background: var(--accent); color: var(--on-accent); font: 600 1rem var(--font-body); padding: 12px 16px; border-radius: 8px; }
.btn:hover { filter: brightness(1.08); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.note { font-size: .85rem; color: var(--warn); background: var(--warn-bg); padding: 8px 12px; border-radius: 6px; }
.eq { font: 500 .8rem var(--font-mono); color: var(--ink-2); }
</style>
</head>
<body>

    <div class="eq">TDF = 1.19 · N · d^1.538 · X^−0.169</div>
  </main>
</body>
</html>
