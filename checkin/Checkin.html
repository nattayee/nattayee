<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เช็กอินเจ้าหน้าที่</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f6f8;
      --surface: #ffffff;
      --surface-2: #f0f2f5;
      --border: #dde1e6;
      --text: #1b1f24;
      --muted: #5f6b78;
      --accent: #1f6feb;
      --present: #1a7f37;
      --present-bg: #dcf5e3;
      --absent: #3d5a80;
      --absent-bg: #e1e9f4;
      --injured: #c4271b;
      --injured-bg: #fde2df;
      --warn: #9a6700;
      --radius: 14px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1216;
        --surface: #181c22;
        --surface-2: #20252d;
        --border: #2d333c;
        --text: #e8ebef;
        --muted: #9aa5b1;
        --accent: #4c8dff;
        --present: #4ac26b;
        --present-bg: #12301d;
        --absent: #8fb3e3;
        --absent-bg: #1a2638;
        --injured: #ff7b72;
        --injured-bg: #3d1614;
        --warn: #e3b341;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Sarabun', 'Noto Sans Thai', 'Leelawadee UI', Tahoma, sans-serif;
      font-size: 17px; line-height: 1.45; -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 40px; }

    header { background: var(--accent); color: #fff; }
    header .wrap { padding-top: 14px; padding-bottom: 14px; }
    header h1 { margin: 0; font-size: 21px; }
    header .sub { font-size: 14px; opacity: .9; }
    .zone-pill { display: inline-block; margin-top: 6px; background: rgba(255,255,255,.2); border-radius: 999px; padding: 2px 12px; font-size: 14px; font-weight: 600; }

    h2 { font-size: 19px; margin: 20px 0 8px; }
    .muted { color: var(--muted); font-size: 14px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
    .banner { margin-top: 16px; padding: 10px 12px; border-radius: 10px; font-size: 14px; background: var(--surface-2); color: var(--muted); }
    .banner.error { background: var(--injured-bg); color: var(--injured); }
    .loading { text-align: center; color: var(--muted); padding: 48px 0; }

    .me { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; border-color: var(--accent); }
    .me .who { font-size: 18px; font-weight: 700; }
    .row-btns { display: flex; gap: 8px; }
    .row-btns > * { flex: 1; }

    .search { position: relative; }
    .search input {
      width: 100%; padding: 14px 44px 14px 14px; border-radius: 12px; border: 2px solid var(--border);
      background: var(--surface); outline: none; font-size: 18px;
    }
    .search input:focus { border-color: var(--accent); }
    .search .clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none; color: var(--muted); font-size: 22px; padding: 4px 10px; display: none; }
    .search.has-text .clear { display: block; }
    .scope { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .scope button { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 14px; }
    .scope button.on { background: var(--accent); border-color: var(--accent); color: #fff; }

    .dept-title { font-size: 14px; font-weight: 700; color: var(--muted); margin: 16px 2px 6px; }
    .results { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .person {
      display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px;
    }
    .person:hover, .person:focus-visible { border-color: var(--accent); }
    .person .info { flex: 1; min-width: 0; }
    .person .name { font-weight: 700; }
    .person .meta { font-size: 13px; color: var(--muted); }
    .badge { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 8px; background: var(--present-bg); color: var(--present); white-space: nowrap; }
    .chev { color: var(--muted); font-size: 20px; }
    .empty { text-align: center; color: var(--muted); padding: 24px 8px; }

    .back { border: 0; background: none; color: var(--accent); padding: 12px 0 0; font-size: 15px; font-weight: 600; }
    .who-card { margin-top: 8px; }
    .who-card .name { font-size: 20px; font-weight: 700; }
    form { display: flex; flex-direction: column; gap: 18px; margin-top: 16px; }
    .flabel { display: block; font-size: 16px; font-weight: 700; margin-bottom: 6px; }
    .req { color: var(--injured); }
    .hint { font-size: 13px; color: var(--muted); margin-top: 4px; }
    .hint.ok { color: var(--present); }
    .err { font-size: 14px; color: var(--injured); margin-top: 4px; display: none; }
    .field.invalid .err { display: block; }
    .field.invalid input, .field.invalid select, .field.invalid .status-pick label { border-color: var(--injured); }
    .field input, .field select, .field textarea {
      width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); outline: none; font-size: 17px;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
    .field textarea { resize: vertical; min-height: 72px; }
    .dob { display: grid; grid-template-columns: 1fr 1.7fr 1.3fr; gap: 8px; }

    .status-pick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .status-pick > div { position: relative; }
    .status-pick input { position: absolute; left: 0; top: 0; width: 1px; height: 1px; margin: 0; opacity: 0; pointer-events: none; }
    .status-pick label {
      display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 14px 4px;
      border: 2px solid var(--border); border-radius: 12px; background: var(--surface); font-weight: 700; cursor: pointer; text-align: center;
    }
    .status-pick label .ic { font-size: 24px; line-height: 1; }
    .status-pick input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }
    .status-pick input:checked + label.present { background: var(--present-bg); border-color: var(--present); color: var(--present); }
    .status-pick input:checked + label.absent { background: var(--absent-bg); border-color: var(--absent); color: var(--absent); }
    .status-pick input:checked + label.injured { background: var(--injured-bg); border-color: var(--injured); color: var(--injured); }

    .primary { background: var(--accent); border: 0; color: #fff; border-radius: 12px; padding: 14px 18px; font-weight: 700; font-size: 18px; width: 100%; }
    .primary:disabled { opacity: .6; cursor: default; }
    .secondary { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; font-weight: 600; }
    .form-err { color: var(--injured); font-size: 15px; display: none; text-align: center; }
    .form-err.show { display: block; }

    .done { text-align: center; margin-top: 32px; }
    .done .tick { width: 84px; height: 84px; border-radius: 50%; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; font-size: 46px; color: #fff; background: var(--present); }
    .done.injured .tick { background: var(--injured); }
    .done.absent .tick { background: var(--absent); }
    .done h2 { margin: 0 0 4px; font-size: 24px; }
    .done .name { font-size: 19px; font-weight: 700; }
    .done .status { display: inline-block; margin: 10px 0; padding: 4px 16px; border-radius: 999px; font-weight: 700; background: var(--present-bg); color: var(--present); }
    .done.injured .status { background: var(--injured-bg); color: var(--injured); }
    .done.absent .status { background: var(--absent-bg); color: var(--absent); }
    .done .actions { display: flex; flex-direction: column; gap: 8px; margin-top: 20px; }
    .help-note { margin-top: 12px; font-size: 15px; color: var(--injured); font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>เช็กอินเจ้าหน้าที่</h1>
      <div class="sub" id="subtitle">กำลังโหลด…</div>
      <span class="zone-pill" id="zonePill" hidden></span>
    </div>
  </header>

  <main class="wrap">
    <div id="banner"></div>

    <!-- ขั้นที่ 1: ค้นหาชื่อ -->
    <section id="viewFind" hidden>
      <div class="card me" id="meCard" hidden>
        <div class="muted">เช็กอินครั้งก่อนบนเครื่องนี้</div>
        <div class="who" id="meName"></div>
        <div class="row-btns">
          <button type="button" class="primary" id="meYes">ใช่ ฉันเอง</button>
          <button type="button" class="secondary" id="meNo">ไม่ใช่</button>
        </div>
      </div>
      <h2>ค้นหาชื่อของคุณ</h2>
      <div class="search" id="searchBox">
        <input type="search" id="search" placeholder="พิมพ์ชื่อหรือนามสกุล" autocomplete="off" aria-label="ค้นหาชื่อ">
        <button class="clear" id="clearSearch" type="button" aria-label="ล้างคำค้นหา">×</button>
      </div>
      <div class="scope" id="scope" hidden></div>
      <div id="results" class="results"></div>
    </section>

    <!-- ขั้นที่ 2: กรอกข้อมูล -->
    <section id="viewForm" hidden>
      <button type="button" class="back" id="backBtn">← เลือกชื่ออื่น</button>
      <div class="card who-card">
        <div class="name" id="fName"></div>
        <div class="muted" id="fMeta"></div>
      </div>
      <form id="form" novalidate>
        <div class="field" id="fStatus">
          <span class="flabel">สถานะของคุณตอนนี้ <span class="req">*</span></span>
          <div class="status-pick" role="radiogroup" aria-label="สถานะ">
            <div><input type="radio" name="status" id="stPresent" value="อยู่"><label for="stPresent" class="present"><span class="ic">✓</span>อยู่</label></div>
            <div><input type="radio" name="status" id="stAbsent" value="ไม่อยู่"><label for="stAbsent" class="absent"><span class="ic">–</span>ไม่อยู่</label></div>
            <div><input type="radio" name="status" id="stInjured" value="บาดเจ็บ"><label for="stInjured" class="injured"><span class="ic">✚</span>บาดเจ็บ</label></div>
          </div>
          <div class="err">กรุณาเลือกสถานะ</div>
        </div>
        <div class="field" id="fPhone">
          <label class="flabel" for="phone">เบอร์โทร <span class="req" id="phoneReq">*</span></label>
          <input type="tel" id="phone" inputmode="tel" autocomplete="tel" placeholder="เช่น 081-234-5678" maxlength="15">
          <div class="hint" id="phoneHint"></div>
          <div class="err">กรุณากรอกเบอร์โทร 9–10 หลัก ขึ้นต้นด้วย 0</div>
        </div>
        <div class="field" id="fDob">
          <span class="flabel" id="dobLabel">วันเกิด <span class="req" id="dobReq">*</span></span>
          <div class="dob" role="group" aria-labelledby="dobLabel">
            <select id="dobDay" aria-label="วัน"></select>
            <select id="dobMonth" aria-label="เดือน"></select>
            <select id="dobYear" aria-label="ปี พ.ศ."></select>
          </div>
          <div class="hint" id="dobHint">ปีเป็น พ.ศ.</div>
          <div class="err">กรุณาเลือกวันเกิดให้ครบและถูกต้อง</div>
        </div>
        <div class="field">
          <label class="flabel" for="note" id="noteLabel">หมายเหตุ</label>
          <textarea id="note" maxlength="300" placeholder="ข้อมูลที่ต้องการแจ้ง (ถ้ามี)"></textarea>
        </div>
        <div class="form-err" id="formErr" role="alert"></div>
        <button type="submit" class="primary" id="submitBtn">ยืนยันเช็กอิน</button>
      </form>
    </section>

    <!-- ขั้นที่ 3: สำเร็จ -->
    <section id="viewDone" hidden>
      <div class="done" id="doneBox">
        <div class="tick" id="doneIcon">✓</div>
        <h2>เช็กอินสำเร็จ</h2>
        <div class="name" id="doneName"></div>
        <div class="status" id="doneStatus"></div>
        <div class="muted" id="doneTime"></div>
        <div class="help-note" id="doneHelp" hidden>หากต้องการความช่วยเหลือ แจ้งเจ้าหน้าที่ที่จุดรวมพลทันที</div>
        <div class="actions">
          <button type="button" class="secondary" id="editAgain">แก้ไขข้อมูลของฉัน</button>
          <button type="button" class="secondary" id="another">เช็กอินให้คนอื่น</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    var MONTHS_FULL = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
    var STATUS_KEY = { 'อยู่': 'present', 'ไม่อยู่': 'absent', 'บาดเจ็บ': 'injured' };
    var MAX_RESULTS = 40;

    var state = { roster: null, zone: null, scopeAll: false, query: '', person: null, last: null };

    // ---------- API (google.script.run หรือโหมดตัวอย่าง) ----------
    var isDemo = !(window.google && google.script && google.script.run);
    var api = isDemo ? demoApi() : {
      call: function (fn) {
        var args = Array.prototype.slice.call(arguments, 1);
        return new Promise(function (resolve, reject) {
          var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
          runner[fn].apply(runner, args);
        });
      }
    };
    function getParams() {
      return new Promise(function (resolve) {
        if (isDemo) {
          var out = {};
          new URLSearchParams(location.search).forEach(function (v, k) { out[k] = v; });
          return resolve(out);
        }
        google.script.url.getLocation(function (loc) { resolve(loc.parameter || {}); });
      });
    }

    // ---------- helpers ----------
    function $(id) { return document.getElementById(id); }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function errMsg(e) { return (e && (e.message || e.toString())) || 'เกิดข้อผิดพลาด'; }
    function squash(s) { return String(s || '').toLowerCase().replace(/\s+/g, ''); }
    function readMe() { try { return JSON.parse(localStorage.getItem('checkin.me') || 'null'); } catch (e) { return null; } }
    function writeMe(v) { try { localStorage.setItem('checkin.me', JSON.stringify(v)); } catch (e) {} }
    function clearMe() { try { localStorage.removeItem('checkin.me'); } catch (e) {} }
    function validPhone(s) {
      var d = String(s || '').replace(/\D/g, '');
      if (d.indexOf('66') === 0 && d.length === 11) d = '0' + d.slice(2);
      return /^0\d{8,9}$/.test(d);
    }
    function show(view) {
      ['viewFind', 'viewForm', 'viewDone'].forEach(function (v) { $(v).hidden = v !== view; });
      window.scrollTo(0, 0);
    }

    function allPeople() {
      var out = [];
      state.roster.zones.forEach(function (z) {
        z.departments.forEach(function (d) {
          d.people.forEach(function (p) { out.push({ zone: z, dept: d, person: p }); });
        });
      });
      return out;
    }

    // ---------- ขั้นที่ 1: ค้นหาชื่อ ----------
    function renderFind() {
      var me = readMe(), hit = me && findEntry(me.sheet, me.name);
      $('meCard').hidden = !hit;
      if (hit) $('meName').textContent = hit.person.name;

      $('scope').hidden = !state.zone;
      if (state.zone) {
        $('scope').innerHTML =
          '<button type="button" data-scope="zone" class="' + (state.scopeAll ? '' : 'on') + '">' + esc(state.zone.name) + '</button>' +
          '<button type="button" data-scope="all" class="' + (state.scopeAll ? 'on' : '') + '">ทุกโซน</button>';
      }
      renderResults();
    }

    function renderResults() {
      var q = squash(state.query);
      var inZone = state.zone && !state.scopeAll;
      var list = allPeople().filter(function (e) {
        if (inZone && e.zone !== state.zone) return false;
        return !q || squash(e.person.name).indexOf(q) >= 0;
      });

      if (!q && !inZone) {
        $('results').innerHTML = '<div class="empty">พิมพ์ชื่อหรือนามสกุลเพื่อค้นหา</div>';
        return;
      }
      if (!list.length) {
        $('results').innerHTML = '<div class="empty">ไม่พบชื่อ' + (inZone ? 'ใน' + esc(state.zone.name) +
          '<br><button type="button" class="secondary" data-scope="all" style="margin-top:10px">ค้นหาทุกโซน</button>' :
          '<br>ลองพิมพ์เฉพาะชื่อหรือเฉพาะนามสกุล') + '</div>';
        return;
      }

      var html = '', lastDept = null;
      list.slice(0, q ? MAX_RESULTS : list.length).forEach(function (e) {
        if (!q && e.dept !== lastDept) {
          html += '<div class="dept-title">' + esc(e.dept.name) + '</div>';
          lastDept = e.dept;
        }
        var meta = [e.person.position, q ? e.dept.name : '', inZone ? '' : e.zone.name].filter(Boolean).join(' · ');
        html += '<button type="button" class="person" data-sheet="' + esc(e.zone.sheet) + '" data-name="' + esc(e.person.name) + '">' +
                '<div class="info"><div class="name">' + esc(e.person.name) + '</div><div class="meta">' + esc(meta) + '</div></div>' +
                (e.person.checkedIn ? '<span class="badge">เช็กอินแล้ว</span>' : '') + '<span class="chev">›</span></button>';
      });
      if (q && list.length > MAX_RESULTS) html += '<div class="empty">แสดง ' + MAX_RESULTS + ' จาก ' + list.length + ' คน พิมพ์ชื่อให้ละเอียดขึ้น</div>';
      $('results').innerHTML = html;
    }

    function findEntry(sheet, name) {
      var hit = null;
      allPeople().forEach(function (e) { if (e.zone.sheet === sheet && e.person.name === name) hit = e; });
      return hit;
    }

    // ---------- ขั้นที่ 2: ฟอร์ม ----------
    function setupForm() {
      var day = '<option value="">วัน</option>';
      for (var d = 1; d <= 31; d++) day += '<option value="' + d + '">' + d + '</option>';
      $('dobDay').innerHTML = day;
      $('dobMonth').innerHTML = '<option value="">เดือน</option>' + MONTHS_FULL.map(function (m, i) {
        return '<option value="' + (i + 1) + '">' + m + '</option>';
      }).join('');
      var thisYear = new Date().getFullYear(), years = '<option value="">ปี พ.ศ.</option>';
      for (var y = thisYear - 15; y >= thisYear - 80; y--) years += '<option value="' + y + '">' + (y + 543) + '</option>';
      $('dobYear').innerHTML = years;
    }

    function openForm(entry) {
      state.person = entry;
      var p = entry.person;
      $('fName').textContent = p.name;
      $('fMeta').textContent = [p.position, entry.dept.name, entry.zone.name].filter(Boolean).join(' · ');
      $('form').reset();
      ['fStatus', 'fPhone', 'fDob'].forEach(function (id) { $(id).classList.remove('invalid'); });
      $('formErr').className = 'form-err';

      $('phoneReq').hidden = p.hasPhone;
      $('phoneHint').textContent = p.hasPhone ? '✓ มีเบอร์ในระบบแล้ว เว้นว่างได้ หรือกรอกใหม่เพื่อแก้ไข' : '';
      $('phoneHint').className = 'hint' + (p.hasPhone ? ' ok' : '');
      $('dobReq').hidden = p.hasBirthday;
      $('dobHint').textContent = p.hasBirthday ? '✓ มีวันเกิดในระบบแล้ว เว้นว่างได้ (ปีเป็น พ.ศ.)' : 'ปีเป็น พ.ศ.';
      $('dobHint').className = 'hint' + (p.hasBirthday ? ' ok' : '');
      updateNoteLabel();
      $('submitBtn').disabled = false;
      $('submitBtn').textContent = 'ยืนยันเช็กอิน';
      show('viewForm');
    }

    function selectedStatus() {
      var el = $('form').querySelector('input[name=status]:checked');
      return el ? el.value : '';
    }
    function updateNoteLabel() {
      var hurt = selectedStatus() === 'บาดเจ็บ';
      $('noteLabel').textContent = hurt ? 'อาการบาดเจ็บ / จุดที่อยู่ตอนนี้' : 'หมายเหตุ';
      $('note').placeholder = hurt ? 'เช่น ข้อเท้าแพลง อยู่ที่จุดปฐมพยาบาล' : 'ข้อมูลที่ต้องการแจ้ง (ถ้ามี)';
    }

    function readDob() {
      var d = $('dobDay').value, m = $('dobMonth').value, y = $('dobYear').value;
      if (!d && !m && !y) return { iso: '' };
      if (!d || !m || !y) return null;
      var date = new Date(+y, +m - 1, +d);
      if (date.getMonth() !== +m - 1 || date > new Date()) return null;
      return { iso: y + '-' + ('0' + m).slice(-2) + '-' + ('0' + d).slice(-2) };
    }

    function submit(ev) {
      ev.preventDefault();
      var entry = state.person, p = entry.person;
      var status = selectedStatus();
      var phone = $('phone').value.trim();
      var dob = readDob();
      var okStatus = !!status;
      var okPhone = phone ? validPhone(phone) : p.hasPhone;
      var okDob = !!dob && (dob.iso || p.hasBirthday);
      $('fStatus').classList.toggle('invalid', !okStatus);
      $('fPhone').classList.toggle('invalid', !okPhone);
      $('fDob').classList.toggle('invalid', !okDob);
      if (!okStatus || !okPhone || !okDob) {
        var first = document.querySelector('.field.invalid');
        if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }

      $('submitBtn').disabled = true;
      $('submitBtn').textContent = 'กำลังบันทึก…';
      $('formErr').className = 'form-err';
      api.call('selfCheckin', entry.zone.sheet, p.row, p.name, {
        status: status, phone: phone, birthday: dob.iso, note: $('note').value.trim()
      }).then(function (res) {
        p.checkedIn = true;
        if (phone) p.hasPhone = true;
        if (dob.iso) p.hasBirthday = true;
        writeMe({ sheet: entry.zone.sheet, name: p.name });
        showDone(p.name, res.status, res.updated);
      }).catch(function (e) {
        $('submitBtn').disabled = false;
        $('submitBtn').textContent = 'ยืนยันเช็กอิน';
        $('formErr').textContent = 'บันทึกไม่สำเร็จ: ' + errMsg(e);
        $('formErr').className = 'form-err show';
      });
    }

    // ---------- ขั้นที่ 3: สำเร็จ ----------
    function showDone(name, status, updated) {
      $('doneBox').className = 'done ' + (STATUS_KEY[status] || '');
      $('doneIcon').textContent = status === 'บาดเจ็บ' ? '✚' : status === 'ไม่อยู่' ? '–' : '✓';
      $('doneName').textContent = name;
      $('doneStatus').textContent = 'สถานะ: ' + status;
      $('doneTime').textContent = updated ? 'เวลา ' + updated : '';
      $('doneHelp').hidden = status !== 'บาดเจ็บ';
      show('viewDone');
    }

    // ---------- events ----------
    document.addEventListener('click', function (ev) {
      var t = ev.target.closest('button');
      if (!t) return;
      if (t.hasAttribute('data-scope')) {
        state.scopeAll = t.getAttribute('data-scope') === 'all';
        return renderFind();
      }
      if (t.classList.contains('person')) {
        var e = findEntry(t.getAttribute('data-sheet'), t.getAttribute('data-name'));
        if (e) openForm(e);
      }
    });
    var searchTimer;
    $('search').addEventListener('input', function (e) {
      $('searchBox').classList.toggle('has-text', !!e.target.value);
      clearTimeout(searchTimer);
      searchTimer = setTimeout(function () { state.query = e.target.value; renderResults(); }, 100);
    });
    $('clearSearch').addEventListener('click', function () {
      $('search').value = ''; state.query = '';
      $('searchBox').classList.remove('has-text');
      renderResults(); $('search').focus();
    });
    $('meYes').addEventListener('click', function () {
      var me = readMe(), e = me && findEntry(me.sheet, me.name);
      if (e) openForm(e);
    });
    $('meNo').addEventListener('click', function () { clearMe(); renderFind(); $('search').focus(); });
    $('backBtn').addEventListener('click', function () { show('viewFind'); renderFind(); });
    $('form').addEventListener('submit', submit);
    $('form').addEventListener('change', function (ev) {
      if (ev.target.name === 'status') { $('fStatus').classList.remove('invalid'); updateNoteLabel(); }
      if (/^dob/.test(ev.target.id) && readDob()) $('fDob').classList.remove('invalid');
    });
    $('phone').addEventListener('input', function () { if (validPhone(this.value)) $('fPhone').classList.remove('invalid'); });
    $('editAgain').addEventListener('click', function () { if (state.person) openForm(state.person); });
    $('another').addEventListener('click', function () {
      state.person = null; state.query = ''; $('search').value = '';
      $('searchBox').classList.remove('has-text');
      show('viewFind'); $('meCard').hidden = true; renderResults(); $('search').focus();
    });

    // ---------- start ----------
    setupForm();
    $('banner').innerHTML = isDemo ? '<div class="banner">โหมดตัวอย่าง: ข้อมูลจำลอง ไม่ได้เชื่อมต่อ Google Sheet</div>' : '';
    Promise.all([getParams(), api.call('getRoster')]).then(function (r) {
      var params = r[0];
      state.roster = r[1];
      $('subtitle').textContent = state.roster.title;
      state.roster.zones.forEach(function (z) { if (params.z && String(z.id) === String(params.z)) state.zone = z; });
      if (state.zone) {
        $('zonePill').textContent = state.zone.name;
        $('zonePill').hidden = false;
      }
      show('viewFind');
      renderFind();
    }).catch(function (e) {
      $('subtitle').textContent = '';
      $('banner').innerHTML = '<div class="banner error">โหลดรายชื่อไม่สำเร็จ: ' + esc(errMsg(e)) + ' กรุณาลองสแกนใหม่อีกครั้ง</div>';
    });

    // ---------- โหมดตัวอย่าง (เปิดไฟล์นี้นอก Apps Script) ----------
    function demoApi() {
      var zones = [
        { id: 0, sheet: 'โซนที่ 1 ', depts: [['งานบริการผู้ป่วยนอก', 6], ['งานเวชระเบียนและสถิติ', 4], ['งานประชาสัมพันธ์', 3]] },
        { id: 111, sheet: 'โซน 2', depts: [['กลุ่มงานรังสีรักษา', 4], ['งานรังสีรักษา', 5]] },
        { id: 222, sheet: 'โซน3', depts: [['จ่ายกลาง', 3], ['โรงครัว/ โรงอาหาร', 4]] }
      ];
      var first = ['สมชาย', 'สมหญิง', 'วิภา', 'อนุชา', 'กมลา', 'ธนพล', 'ปิยะนุช', 'ศักดิ์ชัย', 'มาลี', 'ณัฐพล', 'จันทร์เพ็ญ', 'ประเสริฐ'];
      var last = ['ใจดี', 'มีสุข', 'รักงาน', 'ทองดี', 'แก้วใส', 'ศรีสวัสดิ์', 'บุญมา', 'สายทอง'];
      var pos = ['พยาบาลวิชาชีพชำนาญการ', 'เจ้าพนักงานธุรการ', 'พนักงานช่วยเหลือคนไข้', 'นักรังสีการแพทย์ปฏิบัติการ'];
      var n = 0;
      var roster = {
        title: 'รายชื่อเจ้าหน้าที่แต่ละโซน (ตัวอย่าง)',
        statuses: ['อยู่', 'ไม่อยู่', 'บาดเจ็บ'],
        zones: zones.map(function (z) {
          var row = 2;
          return {
            id: z.id, sheet: z.sheet, name: z.sheet.trim(),
            departments: z.depts.map(function (d) {
              row++;
              var people = [];
              for (var i = 0; i < d[1]; i++) {
                n++; row++;
                people.push({
                  row: row,
                  name: (n % 3 ? 'นางสาว' : 'นาย') + first[n % first.length] + '  ' + last[(n * 3) % last.length],
                  position: pos[n % pos.length],
                  checkedIn: n % 5 === 0, hasPhone: n % 4 === 0, hasBirthday: n % 3 === 0
                });
              }
              return { name: d[0], people: people, notes: [] };
            })
          };
        })
      };
      function stamp() {
        var d = new Date(), p = function (x) { return (x < 10 ? '0' : '') + x; };
        return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
      }
      var fns = {
        getRoster: function () { return JSON.parse(JSON.stringify(roster)); },
        selfCheckin: function (sheet, row, name, data) {
          if (!data.status) throw new Error('กรุณาเลือกสถานะ');
          if (data.phone && !validPhone(data.phone)) throw new Error('เบอร์โทรไม่ถูกต้อง');
          return { name: name, status: data.status, updated: stamp() };
        }
      };
      return {
        call: function (fn) {
          var args = Array.prototype.slice.call(arguments, 1);
          return new Promise(function (resolve, reject) {
            setTimeout(function () {
              try { resolve(fns[fn].apply(null, args)); } catch (e) { reject(e); }
            }, 250);
          });
        }
      };
    }
  </script>
