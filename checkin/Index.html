<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ระบบเช็กอินเจ้าหน้าที่</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f6f8;
      --surface: #ffffff;
      --surface-2: #f0f2f5;
      --border: #dde1e6;
      --text: #1b1f24;
      --muted: #5f6b78;
      --accent: #1f6feb;
      --present: #1a7f37;
      --present-bg: #dcf5e3;
      --absent: #3d5a80;
      --absent-bg: #e1e9f4;
      --injured: #c4271b;
      --injured-bg: #fde2df;
      --unknown: #9a6700;
      --unknown-bg: #fff1c7;
      --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
      --radius: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1216;
        --surface: #181c22;
        --surface-2: #20252d;
        --border: #2d333c;
        --text: #e8ebef;
        --muted: #9aa5b1;
        --accent: #4c8dff;
        --present: #4ac26b;
        --present-bg: #12301d;
        --absent: #8fb3e3;
        --absent-bg: #1a2638;
        --injured: #ff7b72;
        --injured-bg: #3d1614;
        --unknown: #e3b341;
        --unknown-bg: #3a2e0b;
        --shadow: none;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Sarabun', 'Noto Sans Thai', 'Leelawadee UI', Tahoma, sans-serif;
      font-size: 16px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .wrap { max-width: 960px; margin: 0 auto; padding: 0 16px 48px; }

    header.top {
      position: sticky; top: 0; z-index: 20;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }
    .top-inner { max-width: 960px; margin: 0 auto; padding: 12px 16px 10px; }
    .title-row { display: flex; align-items: center; gap: 12px; }
    .title-row h1 { font-size: 20px; margin: 0; font-weight: 700; flex: 1; min-width: 0; }
    .title-row .sub { display: block; font-size: 13px; font-weight: 400; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .icon-btn {
      border: 1px solid var(--border); background: var(--surface);
      border-radius: 10px; padding: 8px 12px; font-size: 14px; display: inline-flex; align-items: center; gap: 6px;
      white-space: nowrap;
    }
    .icon-btn:disabled { opacity: .6; cursor: default; }
    .spin { animation: spin 1s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .summary { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 10px; }
    .stat {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      padding: 6px 10px; text-align: left; transition: border-color .15s, box-shadow .15s; min-width: 0;
    }
    .stat .label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    .stat .value { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .stat.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
    .dot.present { background: var(--present); }
    .dot.absent { background: var(--absent); }
    .dot.injured { background: var(--injured); }
    .dot.unknown { background: var(--unknown); }
    .dot.all { background: var(--muted); }
    .stat.present .value { color: var(--present); }
    .stat.absent .value { color: var(--absent); }
    .stat.injured .value { color: var(--injured); }
    .stat.unknown .value { color: var(--unknown); }

    .bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; display: flex; }
    .bar span { display: block; height: 100%; transition: width .3s; }
    .bar .present { background: var(--present); }
    .bar .absent { background: var(--absent); }
    .bar .injured { background: var(--injured); }
    .summary-bar { margin-top: 8px; }

    .zones { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: thin; }
    .zone-tab {
      flex: none; border: 1px solid var(--border); background: var(--surface); border-radius: 999px;
      padding: 6px 12px; font-size: 14px; display: inline-flex; align-items: center; gap: 6px;
    }
    .zone-tab .count { font-size: 12px; color: var(--unknown); font-weight: 600; }
    .zone-tab .count.done { color: var(--present); }
    .zone-tab .hurt { font-size: 12px; font-weight: 700; color: #fff; background: var(--injured); border-radius: 999px; padding: 0 6px; }
    .zone-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .zone-tab.active .count { color: #fff; }

    .tools { display: flex; gap: 8px; margin-top: 10px; }
    .search { position: relative; flex: 1; min-width: 0; }
    .search input {
      width: 100%; padding: 10px 36px 10px 12px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--surface); outline: none;
    }
    .search input:focus { border-color: var(--accent); }
    .search .clear {
      position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
      border: 0; background: transparent; color: var(--muted); font-size: 18px; padding: 4px 8px; display: none;
    }
    .search.has-text .clear { display: block; }
    .chip {
      flex: none; border: 1px solid var(--border); background: var(--surface); border-radius: 10px;
      padding: 0 12px; font-size: 14px; white-space: nowrap;
    }
    .chip.active { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }

    .banner {
      margin-top: 16px; padding: 10px 12px; border-radius: 10px; font-size: 14px;
      background: var(--unknown-bg); color: var(--unknown);
    }
    .banner.error { background: var(--injured-bg); color: var(--injured); }

    .overview { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; margin-top: 16px; }
    .zone-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 14px; text-align: left; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px;
    }
    .zone-card:hover { border-color: var(--accent); }
    .zone-card h3 { margin: 0; font-size: 18px; display: flex; align-items: center; gap: 8px; }
    .zone-card .depts { font-size: 13px; color: var(--muted); }
    .nums { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 14px; font-variant-numeric: tabular-nums; }
    .nums span { display: inline-flex; align-items: center; gap: 4px; }
    .zone-card .pct { font-size: 13px; color: var(--muted); }

    .dept { margin-top: 20px; }
    .dept-head {
      display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
      padding: 0 2px 6px; border-bottom: 2px solid var(--border);
    }
    .dept-head h2 { font-size: 17px; margin: 0; flex: 1; min-width: 0; }
    .dept-head .zone-label { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 6px; }
    .dept-head .nums { font-size: 13px; color: var(--muted); gap: 10px; }
    .dept-note { font-size: 14px; color: var(--muted); padding: 8px 2px; font-style: italic; }

    .person {
      display: flex; align-items: center; gap: 12px;
      background: var(--surface); border: 1px solid var(--border); border-left-width: 4px;
      border-radius: 10px; padding: 10px 12px; margin-top: 8px;
    }
    .person.s-present { border-left-color: var(--present); }
    .person.s-absent { border-left-color: var(--absent); }
    .person.s-injured { border-left-color: var(--injured); background: linear-gradient(90deg, var(--injured-bg), var(--surface) 60%); }
    .person.s-unknown { border-left-color: var(--unknown); }
    .person .info { flex: 1; min-width: 0; }
    .person .name { font-weight: 600; }
    .person .meta { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 0 10px; }
    .person .meta a { color: var(--accent); text-decoration: none; }
    .person .missing { color: var(--unknown); }
    .person .saving { color: var(--accent); }
    .person .pnote { font-size: 13px; margin-top: 2px; color: var(--text); }
    .person.s-injured .pnote { color: var(--injured); font-weight: 600; }
    .link-btn { border: 0; background: none; padding: 0; color: var(--accent); font-size: 13px; text-decoration: underline; }

    .actions { display: flex; gap: 6px; flex: none; }
    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .seg button {
      border: 0; background: var(--surface); padding: 8px 10px; font-size: 14px; font-weight: 600;
      color: var(--muted); min-width: 64px;
    }
    .seg button + button { border-left: 1px solid var(--border); }
    .seg button:disabled { cursor: default; }
    .seg button.on.present { background: var(--present-bg); color: var(--present); }
    .seg button.on.absent { background: var(--absent-bg); color: var(--absent); }
    .seg button.on.injured { background: var(--injured-bg); color: var(--injured); }
    .edit-btn { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 8px 10px; font-size: 14px; color: var(--accent); font-weight: 600; white-space: nowrap; }

    .empty { text-align: center; color: var(--muted); padding: 40px 0; }
    .loading { text-align: center; color: var(--muted); padding: 60px 0; }

    .footer-actions { margin-top: 32px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); }
    .danger { color: var(--injured); border-color: var(--injured); background: transparent; }

    /* ---------- ฟอร์มเช็กอิน ---------- */
    dialog {
      border: 0; padding: 0; border-radius: 16px; width: min(520px, calc(100% - 32px));
      background: var(--surface); color: var(--text); box-shadow: 0 12px 40px rgba(0,0,0,.3);
    }
    dialog::backdrop { background: rgba(15, 18, 22, .55); }
    .dlg-head { padding: 16px 16px 8px; border-bottom: 1px solid var(--border); }
    .dlg-head h2 { margin: 0; font-size: 19px; }
    .dlg-head .sub { font-size: 13px; color: var(--muted); }
    .dlg-body { padding: 12px 16px; display: flex; flex-direction: column; gap: 14px; max-height: calc(100vh - 200px); overflow-y: auto; }
    .field > label, .field > .flabel { display: block; font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .field .hint { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .field .err { font-size: 13px; color: var(--injured); margin-top: 2px; display: none; }
    .field.invalid .err { display: block; }
    .field.invalid input, .field.invalid select { border-color: var(--injured); }
    .field input, .field select, .field textarea {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px;
      background: var(--surface); outline: none;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
    .field textarea { resize: vertical; min-height: 64px; }
    .dob { display: grid; grid-template-columns: 1fr 1.6fr 1.2fr; gap: 8px; }
    .status-pick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .status-pick label {
      border: 1px solid var(--border); border-radius: 10px; padding: 10px 4px; text-align: center;
      font-weight: 600; font-size: 14px; color: var(--muted); cursor: pointer; display: block;
    }
    .status-pick input { position: absolute; opacity: 0; pointer-events: none; }
    .status-pick input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 1px; }
    .status-pick input:checked + label.present { background: var(--present-bg); color: var(--present); border-color: var(--present); }
    .status-pick input:checked + label.absent { background: var(--absent-bg); color: var(--absent); border-color: var(--absent); }
    .status-pick input:checked + label.injured { background: var(--injured-bg); color: var(--injured); border-color: var(--injured); }
    .status-pick input:checked + label.unknown { background: var(--unknown-bg); color: var(--unknown); border-color: var(--unknown); }
    .dlg-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px 16px; border-top: 1px solid var(--border); }
    .primary { background: var(--accent); border: 1px solid var(--accent); color: #fff; border-radius: 10px; padding: 10px 18px; font-weight: 600; }
    .primary:disabled { opacity: .6; cursor: default; }
    .form-err { color: var(--injured); font-size: 14px; display: none; }
    .form-err.show { display: block; }

    .toast {
      position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(120%);
      background: #1b1f24; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px;
      max-width: calc(100% - 32px); transition: transform .25s, opacity .25s; z-index: 50; box-shadow: 0 4px 16px rgba(0,0,0,.25);
      opacity: 0; pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast.error { background: var(--injured); }

    @media (max-width: 600px) {
      header.top { position: static; }
      .title-row h1 { font-size: 18px; }
      .summary { gap: 4px; }
      .stat { padding: 6px; }
      .stat .label { font-size: 11px; gap: 4px; }
      .stat .value { font-size: 18px; }
      .person { flex-direction: column; align-items: stretch; gap: 8px; }
      .actions { width: 100%; }
      .seg { display: flex; flex: 1; }
      .seg button { flex: 1; min-width: 0; padding: 10px 4px; }
      .refresh-label { display: none; }
      dialog { width: 100%; max-width: 100%; margin: auto 0 0; border-radius: 16px 16px 0 0; }
      .dlg-body { max-height: calc(100vh - 180px); }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="title-row">
        <h1>ระบบเช็กอินเจ้าหน้าที่ <span class="sub" id="subtitle">กำลังโหลด…</span></h1>
        <button class="icon-btn" id="refreshBtn" title="ดึงข้อมูลล่าสุด">
          <span id="refreshIcon">⟳</span><span class="refresh-label">รีเฟรช</span>
        </button>
      </div>
      <div class="summary" id="summary"></div>
      <div class="bar summary-bar" id="summaryBar"></div>
      <nav class="zones" id="zones" aria-label="เลือกโซน"></nav>
      <div class="tools">
        <div class="search" id="searchBox">
          <input type="search" id="search" placeholder="ค้นหาชื่อ ตำแหน่ง หน่วยงาน" autocomplete="off">
          <button class="clear" id="clearSearch" aria-label="ล้างคำค้นหา">×</button>
        </div>
        <button class="chip" id="missingBtn" title="แสดงเฉพาะคนที่ยังไม่กรอกเบอร์โทรหรือวันเกิด">ข้อมูลไม่ครบ</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div id="banner"></div>
    <div id="content"><div class="loading">กำลังโหลดข้อมูลจาก Google Sheet…</div></div>
    <div class="footer-actions" id="footer" hidden>
      <span id="fetchedAt"></span>
      <button class="icon-btn danger" id="resetBtn">รีเซ็ตสถานะ</button>
    </div>
  </main>

  <dialog id="dlg" aria-labelledby="dlgName">
    <form id="dlgForm" method="dialog" novalidate>
      <div class="dlg-head">
        <h2 id="dlgName"></h2>
        <div class="sub" id="dlgSub"></div>
      </div>
      <div class="dlg-body">
        <div class="field">
          <span class="flabel">สถานะ</span>
          <div class="status-pick" id="statusPick" role="radiogroup" aria-label="สถานะ"></div>
        </div>
        <div class="field" id="fPhone">
          <label for="phone">เบอร์โทร</label>
          <input type="tel" id="phone" inputmode="tel" autocomplete="tel" placeholder="เช่น 081-234-5678" maxlength="15">
          <div class="err">กรุณากรอกเบอร์โทร 9–10 หลัก ขึ้นต้นด้วย 0</div>
        </div>
        <div class="field" id="fDob">
          <span class="flabel" id="dobLabel">วันเกิด</span>
          <div class="dob" role="group" aria-labelledby="dobLabel">
            <select id="dobDay" aria-label="วัน"></select>
            <select id="dobMonth" aria-label="เดือน"></select>
            <select id="dobYear" aria-label="ปี พ.ศ."></select>
          </div>
          <div class="hint">ปีเป็น พ.ศ.</div>
          <div class="err">กรุณาเลือกวันเกิดให้ครบและถูกต้อง</div>
        </div>
        <div class="field">
          <label for="note">หมายเหตุ</label>
          <textarea id="note" maxlength="300" placeholder="เช่น อาการบาดเจ็บ จุดที่อยู่ตอนนี้ หรือข้อมูลที่ต้องแจ้ง"></textarea>
        </div>
        <div class="form-err" id="formErr" role="alert"></div>
      </div>
      <div class="dlg-foot">
        <button type="button" class="icon-btn" id="dlgCancel">ยกเลิก</button>
        <button type="submit" class="primary" id="dlgSave">บันทึกเช็กอิน</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    // ไม่ทราบ = ยังไม่เช็กอิน
    var STATUS = {
      'อยู่': { key: 'present', label: 'อยู่' },
      'ไม่อยู่': { key: 'absent', label: 'ไม่อยู่' },
      'บาดเจ็บ': { key: 'injured', label: 'บาดเจ็บ' },
      'ไม่ทราบ': { key: 'unknown', label: 'ไม่ทราบ' }
    };
    var STATUS_ORDER = ['อยู่', 'ไม่อยู่', 'บาดเจ็บ', 'ไม่ทราบ'];
    var CHECKIN_STATUSES = ['อยู่', 'ไม่อยู่', 'บาดเจ็บ'];
    var UNKNOWN = 'ไม่ทราบ';
    var INJURED = 'บาดเจ็บ';
    var MONTHS = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
    var MONTHS_FULL = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
    var AUTO_REFRESH_MS = 20000;

    var state = {
      data: null,
      zone: readPref('zone', ''),
      filter: '',
      missing: false,
      query: '',
      pending: {},
      loading: false,
      editing: null
    };

    // ---------- API (google.script.run หรือโหมดตัวอย่าง) ----------
    var isDemo = !(window.google && google.script && google.script.run);
    var api = isDemo ? demoApi() : {
      call: function (fn) {
        var args = Array.prototype.slice.call(arguments, 1);
        return new Promise(function (resolve, reject) {
          var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
          runner[fn].apply(runner, args);
        });
      }
    };

    // ---------- helpers ----------
    function $(id) { return document.getElementById(id); }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function readPref(k, d) { try { var v = localStorage.getItem('checkin.' + k); return v == null ? d : v; } catch (e) { return d; } }
    function writePref(k, v) { try { localStorage.setItem('checkin.' + k, v); } catch (e) {} }
    function personKey(zone, p) { return zone.sheet + '#' + p.row + '#' + p.name; }
    function normalize(s) { return String(s || '').toLowerCase().replace(/\s+/g, ' ').trim(); }
    function errMsg(e) { return (e && (e.message || e.toString())) || 'เกิดข้อผิดพลาด'; }
    function isMissing(p) { return !p.phone || !p.birthday; }
    function phoneDigits(s) { return String(s || '').replace(/\D/g, ''); }
    function validPhone(s) {
      var d = phoneDigits(s);
      if (d.indexOf('66') === 0 && d.length === 11) d = '0' + d.slice(2);
      return !d || /^0\d{8,9}$/.test(d);
    }
    function parseIso(iso) {
      var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
      return m ? { y: +m[1], m: +m[2], d: +m[3] } : null;
    }
    function thaiDate(iso) {
      var d = parseIso(iso);
      return d ? d.d + ' ' + MONTHS[d.m - 1] + ' ' + (d.y + 543) : '';
    }
    function ageOf(iso) {
      var d = parseIso(iso);
      if (!d) return '';
      var now = new Date();
      var age = now.getFullYear() - d.y - ((now.getMonth() + 1 < d.m || (now.getMonth() + 1 === d.m && now.getDate() < d.d)) ? 1 : 0);
      return age >= 0 ? age : '';
    }

    var toastTimer;
    function toast(msg, isError) {
      var t = $('toast');
      t.textContent = msg;
      t.className = 'toast show' + (isError ? ' error' : '');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { t.className = 'toast' + (isError ? ' error' : ''); }, isError ? 4500 : 2200);
    }

    function countPeople(people) {
      var c = { total: 0, missing: 0 };
      STATUS_ORDER.forEach(function (s) { c[s] = 0; });
      people.forEach(function (p) { c.total++; c[p.status]++; if (isMissing(p)) c.missing++; });
      return c;
    }
    function zonePeople(zone) {
      var out = [];
      zone.departments.forEach(function (d) { out = out.concat(d.people); });
      return out;
    }
    function allPeople() {
      var out = [];
      (state.data ? state.data.zones : []).forEach(function (z) { out = out.concat(zonePeople(z)); });
      return out;
    }
    function currentZone() {
      if (!state.data) return null;
      for (var i = 0; i < state.data.zones.length; i++) {
        if (state.data.zones[i].sheet === state.zone) return state.data.zones[i];
      }
      return null;
    }
    function barHtml(c) {
      if (!c.total) return '';
      return CHECKIN_STATUSES.map(function (s) {
        return '<span class="' + STATUS[s].key + '" style="width:' + (c[s] / c.total * 100) + '%"></span>';
      }).join('');
    }
    function countsHtml(c) {
      return STATUS_ORDER.map(function (s) {
        return '<span title="' + s + '"><i class="dot ' + STATUS[s].key + '"></i>' + c[s] + '</span>';
      }).join('');
    }

    // ---------- render ----------
    function render() {
      if (!state.data) return;
      renderHeader();
      renderContent();
    }

    function renderHeader() {
      var zone = currentZone();
      var c = countPeople(zone ? zonePeople(zone) : allPeople());
      $('subtitle').textContent = (zone ? zone.name + ' · ' : 'ทุกโซน · ') + state.data.title;

      var stats = [{ s: '', key: 'all', label: 'ทั้งหมด', value: c.total }].concat(STATUS_ORDER.map(function (s) {
        return { s: s, key: STATUS[s].key, label: STATUS[s].label, value: c[s] };
      }));
      $('summary').innerHTML = stats.map(function (x) {
        return '<button class="stat ' + x.key + (state.filter === x.s ? ' active' : '') + '" data-filter="' + esc(x.s) + '">' +
               '<div class="label"><i class="dot ' + x.key + '"></i>' + esc(x.label) + '</div>' +
               '<div class="value">' + x.value + '</div></button>';
      }).join('');
      $('summaryBar').innerHTML = barHtml(c);

      $('missingBtn').textContent = 'ข้อมูลไม่ครบ ' + c.missing;
      $('missingBtn').classList.toggle('active', state.missing);
      $('missingBtn').setAttribute('aria-pressed', state.missing);

      var all = countPeople(allPeople());
      var tabs = tabHtml('', 'ภาพรวม', all, !zone);
      tabs += state.data.zones.map(function (z) {
        return tabHtml(z.sheet, z.name, countPeople(zonePeople(z)), zone === z);
      }).join('');
      $('zones').innerHTML = tabs;

      $('fetchedAt').textContent = 'ข้อมูล ณ ' + state.data.fetchedAt;
      $('resetBtn').textContent = zone ? 'รีเซ็ตสถานะ' + zone.name : 'รีเซ็ตสถานะทุกโซน';
      $('footer').hidden = false;
    }

    function tabHtml(sheet, name, c, active) {
      return '<button class="zone-tab' + (active ? ' active' : '') + '" data-zone="' + esc(sheet) + '">' + esc(name) +
             ' <span class="count' + (c[UNKNOWN] ? '' : ' done') + '" title="ยังไม่เช็กอิน">' + (c[UNKNOWN] || '✓') + '</span>' +
             (c[INJURED] ? '<span class="hurt" title="บาดเจ็บ">' + c[INJURED] + '</span>' : '') + '</button>';
    }

    function renderContent() {
      var zone = currentZone();
      var q = normalize(state.query);

      // หน้าภาพรวม (ไม่ได้เลือกโซน ไม่ค้นหา ไม่กรอง) แสดงการ์ดสรุปแต่ละโซน
      if (!zone && !q && !state.filter && !state.missing) {
        $('content').innerHTML = '<div class="overview">' + state.data.zones.map(function (z) {
          var c = countPeople(zonePeople(z));
          var pct = c.total ? Math.round((c.total - c[UNKNOWN]) / c.total * 100) : 0;
          return '<button class="zone-card" data-zone="' + esc(z.sheet) + '">' +
                 '<h3>' + esc(z.name) + (c[INJURED] ? '<span class="zone-tab"><span class="hurt">บาดเจ็บ ' + c[INJURED] + '</span></span>' : '') + '</h3>' +
                 '<div class="depts">' + z.departments.length + ' หน่วยงาน · ' + c.total + ' คน</div>' +
                 '<div class="bar">' + barHtml(c) + '</div>' +
                 '<div class="nums">' + countsHtml(c) + '</div>' +
                 '<div class="pct">เช็กอินแล้ว ' + pct + '%</div></button>';
        }).join('') + '</div>';
        return;
      }

      var zones = zone ? [zone] : state.data.zones;
      var html = '';
      zones.forEach(function (z) {
        z.departments.forEach(function (d) {
          var deptMatch = q && normalize(d.name).indexOf(q) >= 0;
          var people = d.people.filter(function (p) {
            if (state.filter && p.status !== state.filter) return false;
            if (state.missing && !isMissing(p)) return false;
            if (!q || deptMatch) return true;
            return normalize(p.name).indexOf(q) >= 0 || normalize(p.position).indexOf(q) >= 0 ||
                   (p.phone && phoneDigits(p.phone).indexOf(phoneDigits(q)) >= 0 && phoneDigits(q).length >= 3);
          });
          var showNotes = !state.filter && !state.missing && (!q || deptMatch) && d.notes.length;
          if (!people.length && !showNotes) return;

          html += '<section class="dept"><div class="dept-head"><h2>' + esc(d.name) +
                  (zone ? '' : '<span class="zone-label">' + esc(z.name) + '</span>') + '</h2>' +
                  '<div class="nums">' + countsHtml(countPeople(d.people)) + '</div></div>';
          if (showNotes) d.notes.forEach(function (n) { html += '<div class="dept-note">หมายเหตุ: ' + esc(n) + '</div>'; });
          people.forEach(function (p) { html += personHtml(z, p); });
          html += '</section>';
        });
      });
      $('content').innerHTML = html || '<div class="empty">ไม่พบรายชื่อที่ตรงกับเงื่อนไข</div>';
    }

    function personHtml(zone, p) {
      var key = personKey(zone, p);
      var saving = !!state.pending[key];
      var ref = ' data-sheet="' + esc(zone.sheet) + '" data-row="' + p.row + '" data-name="' + esc(p.name) + '"';
      var meta = [];
      if (p.position) meta.push(esc(p.position));
      meta.push(p.phone
        ? '<a href="tel:' + esc(phoneDigits(p.phone)) + '">☎ ' + esc(p.phone) + '</a>'
        : '<span class="missing">ไม่มีเบอร์โทร</span>');
      meta.push(p.birthday
        ? '<span>เกิด ' + esc(thaiDate(p.birthday)) + (ageOf(p.birthday) !== '' ? ' (' + ageOf(p.birthday) + ' ปี)' : '') + '</span>'
        : '<span class="missing">ไม่มีวันเกิด</span>');
      if (saving) meta.push('<span class="saving">กำลังบันทึก…</span>');
      else if (p.updated) meta.push('อัปเดต ' + esc(p.updated));

      var note = '';
      if (p.note) note = '<div class="pnote">หมายเหตุ: ' + esc(p.note) + '</div>';
      else if (p.status === INJURED) note = '<div class="pnote"><button class="link-btn" data-edit="1"' + ref + '>+ เพิ่มรายละเอียดอาการบาดเจ็บ</button></div>';

      return '<div class="person s-' + STATUS[p.status].key + '">' +
             '<div class="info"><div class="name">' + esc(p.name) + '</div>' +
             '<div class="meta">' + meta.join('<span aria-hidden="true">·</span>') + '</div>' + note + '</div>' +
             '<div class="actions"><div class="seg" role="group" aria-label="สถานะของ ' + esc(p.name) + '">' +
             CHECKIN_STATUSES.map(function (s) {
               var on = p.status === s;
               return '<button class="' + STATUS[s].key + (on ? ' on' : '') + '" aria-pressed="' + on + '"' +
                      (saving ? ' disabled' : '') + ref + ' data-status="' + esc(s) + '">' + s + '</button>';
             }).join('') + '</div>' +
             '<button class="edit-btn" data-edit="1"' + ref + (saving ? ' disabled' : '') + ' title="กรอกเบอร์โทร วันเกิด และหมายเหตุ">✎ ข้อมูล</button>' +
             '</div></div>';
    }

    // ---------- data ----------
    function load(silent) {
      if (state.loading) return Promise.resolve();
      state.loading = true;
      $('refreshBtn').disabled = true;
      $('refreshIcon').className = 'spin';
      return api.call('getData').then(function (data) {
        // คงค่าที่กำลังบันทึกไว้ เพื่อไม่ให้ข้อมูลเก่าทับการกดล่าสุด
        data.zones.forEach(function (z) {
          zonePeople(z).forEach(function (p) {
            var pend = state.pending[personKey(z, p)];
            if (pend) Object.keys(pend).forEach(function (k) { p[k] = pend[k]; });
          });
        });
        state.data = data;
        if (state.zone && !currentZone()) state.zone = '';
        $('banner').innerHTML = isDemo ? '<div class="banner">โหมดตัวอย่าง: แสดงข้อมูลจำลอง ไม่ได้เชื่อมต่อ Google Sheet</div>' : '';
        render();
      }).catch(function (e) {
        if (!silent || !state.data) {
          $('banner').innerHTML = '<div class="banner error">โหลดข้อมูลไม่สำเร็จ: ' + esc(errMsg(e)) + '</div>';
        }
        if (!state.data) $('content').innerHTML = '';
      }).then(function () {
        state.loading = false;
        $('refreshBtn').disabled = false;
        $('refreshIcon').className = '';
      });
    }

    function findPerson(el) {
      var sheet = el.getAttribute('data-sheet');
      var row = Number(el.getAttribute('data-row'));
      var name = el.getAttribute('data-name');
      var hit = null;
      state.data.zones.forEach(function (z) {
        if (z.sheet !== sheet) return;
        z.departments.forEach(function (d) {
          d.people.forEach(function (p) { if (p.row === row && p.name === name) hit = { zone: z, dept: d, person: p }; });
        });
      });
      return hit;
    }

    /** บันทึกข้อมูล (เฉพาะช่องใน changes) แบบแสดงผลทันที ถ้าไม่สำเร็จจะคืนค่าเดิม */
    function save(hit, changes) {
      var p = hit.person, key = personKey(hit.zone, p), prev = {};
      Object.keys(changes).forEach(function (k) { prev[k] = p[k]; p[k] = changes[k]; });
      state.pending[key] = changes;
      render();

      return api.call('saveCheckin', hit.zone.sheet, p.row, p.name, changes).then(function (res) {
        delete state.pending[key];
        ['status', 'phone', 'birthday', 'note', 'updated', 'row'].forEach(function (k) { if (k in res) p[k] = res[k]; });
        render();
        return res;
      }).catch(function (e) {
        delete state.pending[key];
        Object.keys(prev).forEach(function (k) { p[k] = prev[k]; });
        render();
        throw e;
      });
    }

    function quickStatus(btn) {
      var hit = findPerson(btn);
      var status = btn.getAttribute('data-status');
      if (!hit || hit.person.status === status) return;
      save(hit, { status: status }).then(function () {
        toast(hit.person.name + ' → ' + status);
      }).catch(function (e) {
        toast('บันทึกไม่สำเร็จ: ' + errMsg(e), true);
      });
    }

    function reset() {
      var zone = currentZone();
      var label = zone ? zone.name : 'ทุกโซน';
      if (!confirm('ยืนยันรีเซ็ตสถานะของ' + label + ' ให้เป็น "ไม่ทราบ" ทั้งหมด?\nสถานะและหมายเหตุเดิมจะถูกล้าง (เบอร์โทรและวันเกิดยังอยู่)')) return;
      $('resetBtn').disabled = true;
      api.call('resetStatuses', zone ? zone.sheet : '').then(function (res) {
        toast('รีเซ็ตแล้ว ' + res.count + ' คน');
        return load();
      }).catch(function (e) {
        toast('รีเซ็ตไม่สำเร็จ: ' + errMsg(e), true);
      }).then(function () { $('resetBtn').disabled = false; });
    }

    // ---------- ฟอร์มเช็กอิน ----------
    function setupForm() {
      $('statusPick').innerHTML = STATUS_ORDER.map(function (s, i) {
        return '<div><input type="radio" name="status" id="st' + i + '" value="' + esc(s) + '">' +
               '<label for="st' + i + '" class="' + STATUS[s].key + '">' + (s === UNKNOWN ? 'ยังไม่เช็กอิน' : s) + '</label></div>';
      }).join('');

      var day = '<option value="">วัน</option>';
      for (var d = 1; d <= 31; d++) day += '<option value="' + d + '">' + d + '</option>';
      $('dobDay').innerHTML = day;
      $('dobMonth').innerHTML = '<option value="">เดือน</option>' + MONTHS_FULL.map(function (m, i) {
        return '<option value="' + (i + 1) + '">' + m + '</option>';
      }).join('');
      var thisYear = new Date().getFullYear(), years = '<option value="">ปี พ.ศ.</option>';
      for (var y = thisYear - 15; y >= thisYear - 80; y--) years += '<option value="' + y + '">' + (y + 543) + '</option>';
      $('dobYear').innerHTML = years;
    }

    function openForm(el) {
      var hit = findPerson(el);
      if (!hit) return;
      var p = hit.person;
      state.editing = hit;
      $('dlgName').textContent = p.name;
      $('dlgSub').textContent = [p.position, hit.dept.name, hit.zone.name].filter(Boolean).join(' · ');
      $('dlgForm').querySelector('input[name=status][value="' + p.status + '"]').checked = true;
      $('phone').value = p.phone || '';
      var dob = parseIso(p.birthday);
      if (dob && !$('dobYear').querySelector('option[value="' + dob.y + '"]')) {
        $('dobYear').insertAdjacentHTML('beforeend', '<option value="' + dob.y + '">' + (dob.y + 543) + '</option>');
      }
      $('dobDay').value = dob ? dob.d : '';
      $('dobMonth').value = dob ? dob.m : '';
      $('dobYear').value = dob ? dob.y : '';
      $('note').value = p.note || '';
      ['fPhone', 'fDob'].forEach(function (id) { $(id).classList.remove('invalid'); });
      $('formErr').className = 'form-err';
      $('dlgSave').disabled = false;
      $('dlgSave').textContent = 'บันทึกเช็กอิน';
      $('dlg').showModal();
      if (!p.phone) $('phone').focus();
    }

    function readDob() {
      var d = $('dobDay').value, m = $('dobMonth').value, y = $('dobYear').value;
      if (!d && !m && !y) return { iso: '' };
      if (!d || !m || !y) return null;
      var date = new Date(+y, +m - 1, +d);
      if (date.getMonth() !== +m - 1 || date > new Date()) return null;
      return { iso: y + '-' + ('0' + m).slice(-2) + '-' + ('0' + d).slice(-2) };
    }

    function submitForm(ev) {
      ev.preventDefault();
      var hit = state.editing;
      if (!hit) return;
      var p = hit.person;
      var phoneOk = validPhone($('phone').value);
      var dob = readDob();
      $('fPhone').classList.toggle('invalid', !phoneOk);
      $('fDob').classList.toggle('invalid', !dob);
      if (!phoneOk || !dob) return;

      var checked = $('dlgForm').querySelector('input[name=status]:checked');
      var next = { status: checked ? checked.value : p.status, phone: $('phone').value.trim(), birthday: dob.iso, note: $('note').value.trim() };
      var changes = {};
      Object.keys(next).forEach(function (k) { if ((p[k] || '') !== next[k]) changes[k] = next[k]; });
      if (!Object.keys(changes).length) { $('dlg').close(); return; }

      $('dlgSave').disabled = true;
      $('dlgSave').textContent = 'กำลังบันทึก…';
      save(hit, changes).then(function () {
        $('dlg').close();
        state.editing = null;
        toast('บันทึกข้อมูล ' + p.name + ' แล้ว');
      }).catch(function (e) {
        $('dlgSave').disabled = false;
        $('dlgSave').textContent = 'บันทึกเช็กอิน';
        $('formErr').textContent = 'บันทึกไม่สำเร็จ: ' + errMsg(e);
        $('formErr').className = 'form-err show';
      });
    }

    // ---------- events ----------
    document.addEventListener('click', function (ev) {
      var t = ev.target.closest('button');
      if (!t || t.closest('dialog')) return;
      if (t.hasAttribute('data-status')) return quickStatus(t);
      if (t.hasAttribute('data-edit')) return openForm(t);
      if (t.hasAttribute('data-zone')) {
        state.zone = t.getAttribute('data-zone');
        writePref('zone', state.zone);
        render();
        window.scrollTo(0, 0);
        return;
      }
      if (t.hasAttribute('data-filter')) {
        var f = t.getAttribute('data-filter');
        state.filter = state.filter === f ? '' : f;
        return render();
      }
    });
    $('missingBtn').addEventListener('click', function () { state.missing = !state.missing; render(); });
    $('refreshBtn').addEventListener('click', function () { load(); });
    $('resetBtn').addEventListener('click', reset);
    $('dlgForm').addEventListener('submit', submitForm);
    $('dlgCancel').addEventListener('click', function () { $('dlg').close(); });
    $('dlg').addEventListener('close', function () { state.editing = null; });
    $('phone').addEventListener('input', function () { if (validPhone(this.value)) $('fPhone').classList.remove('invalid'); });
    ['dobDay', 'dobMonth', 'dobYear'].forEach(function (id) {
      $(id).addEventListener('change', function () { if (readDob()) $('fDob').classList.remove('invalid'); });
    });

    var searchTimer;
    $('search').addEventListener('input', function (e) {
      $('searchBox').classList.toggle('has-text', !!e.target.value);
      clearTimeout(searchTimer);
      searchTimer = setTimeout(function () { state.query = e.target.value; render(); }, 120);
    });
    $('clearSearch').addEventListener('click', function () {
      $('search').value = '';
      $('searchBox').classList.remove('has-text');
      state.query = '';
      render();
      $('search').focus();
    });

    setInterval(function () {
      if (document.hidden || state.editing || Object.keys(state.pending).length) return;
      load(true);
    }, AUTO_REFRESH_MS);
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && state.data && !state.editing) load(true);
    });

    setupForm();
    load();

    // ---------- โหมดตัวอย่าง (เปิดไฟล์นี้นอก Apps Script) ----------
    function demoApi() {
      var zones = [
        { sheet: 'โซนที่ 1 ', depts: [['งานบริการผู้ป่วยนอก', 6], ['งานเวชระเบียนและสถิติ', 4], ['งานประชาสัมพันธ์', 3]] },
        { sheet: 'โซน 2', depts: [['กลุ่มงานรังสีรักษา', 4], ['งานรังสีรักษา', 5]] },
        { sheet: 'โซน3', depts: [['จ่ายกลาง', 3], ['โรงครัว/ โรงอาหาร', 4]] },
        { sheet: 'โซน4', depts: [['สำนักผู้อำนวยการ', 1], ['งานรังสีรักษา', 0, 'เช็ครายชื่อที่โซน 2'], ['งานการเงิน', 4]] }
      ];
      var first = ['สมชาย', 'สมหญิง', 'วิภา', 'อนุชา', 'กมลา', 'ธนพล', 'ปิยะนุช', 'ศักดิ์ชัย', 'มาลี', 'ณัฐพล', 'จันทร์เพ็ญ', 'ประเสริฐ'];
      var last = ['ใจดี', 'มีสุข', 'รักงาน', 'ทองดี', 'แก้วใส', 'ศรีสวัสดิ์', 'บุญมา', 'สายทอง'];
      var pos = ['พยาบาลวิชาชีพชำนาญการ', 'เจ้าพนักงานธุรการ', 'พนักงานช่วยเหลือคนไข้', 'นักรังสีการแพทย์ปฏิบัติการ'];
      var n = 0;
      var data = {
        title: 'รายชื่อเจ้าหน้าที่แต่ละโซน (ตัวอย่าง)',
        statuses: STATUS_ORDER,
        zones: zones.map(function (z) {
          var row = 2;
          return {
            sheet: z.sheet, name: z.sheet.trim(),
            departments: z.depts.map(function (d) {
              row++;
              var people = [];
              for (var i = 0; i < d[1]; i++) {
                n++; row++;
                people.push({
                  row: row,
                  name: (n % 3 ? 'นางสาว' : 'นาย') + first[n % first.length] + '  ' + last[(n * 3) % last.length],
                  position: pos[n % pos.length],
                  status: n % 5 === 0 ? 'อยู่' : n % 7 === 0 ? 'ไม่อยู่' : n === 11 ? 'บาดเจ็บ' : 'ไม่ทราบ',
                  phone: n % 4 === 0 ? '081-234-' + (5600 + n) : '',
                  birthday: n % 3 === 0 ? (1970 + n) + '-0' + (1 + n % 9) + '-1' + (n % 9) : '',
                  updated: '',
                  note: n === 11 ? 'ข้อเท้าแพลง อยู่จุดปฐมพยาบาล' : ''
                });
              }
              return { name: d[0], people: people, notes: d[2] ? [d[2]] : [] };
            })
          };
        })
      };
      function stamp() {
        var d = new Date(), p = function (x) { return (x < 10 ? '0' : '') + x; };
        return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
      }
      function fmtPhone(s) {
        var d = phoneDigits(s);
        if (!d) return '';
        if (!validPhone(d)) throw new Error('เบอร์โทรไม่ถูกต้อง');
        if (d.indexOf('66') === 0) d = '0' + d.slice(2);
        if (d.length === 10) return d.slice(0, 3) + '-' + d.slice(3, 6) + '-' + d.slice(6);
        return d.indexOf('02') === 0 ? d.slice(0, 2) + '-' + d.slice(2, 5) + '-' + d.slice(5) : d.slice(0, 3) + '-' + d.slice(3, 6) + '-' + d.slice(6);
      }
      var fns = {
        getData: function () { data.fetchedAt = stamp(); return JSON.parse(JSON.stringify(data)); },
        saveCheckin: function (sheet, row, name, changes) {
          var z = data.zones.filter(function (z) { return z.sheet === sheet; })[0];
          var p = z && zonePeople(z).filter(function (p) { return p.row === row && p.name === name; })[0];
          if (!p) throw new Error('ไม่พบรายชื่อ');
          if ('phone' in changes) changes.phone = fmtPhone(changes.phone);
          Object.keys(changes).forEach(function (k) { p[k] = changes[k]; });
          p.updated = stamp();
          return JSON.parse(JSON.stringify(p));
        },
        resetStatuses: function (sheet) {
          var count = 0;
          data.zones.forEach(function (z) {
            if (sheet && z.sheet !== sheet) return;
            zonePeople(z).forEach(function (p) { p.status = UNKNOWN; p.updated = ''; p.note = ''; count++; });
          });
          return { count: count };
        }
      };
      return {
        call: function (fn) {
          var args = Array.prototype.slice.call(arguments, 1);
          return new Promise(function (resolve, reject) {
            setTimeout(function () {
              try { resolve(fns[fn].apply(null, args)); } catch (e) { reject(e); }
            }, 250);
          });
        }
      };
    }
  </script>
