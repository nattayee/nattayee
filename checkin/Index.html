<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ระบบเช็กอินเจ้าหน้าที่</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f6f8;
      --surface: #ffffff;
      --surface-2: #f0f2f5;
      --border: #dde1e6;
      --text: #1b1f24;
      --muted: #5f6b78;
      --accent: #1f6feb;
      --present: #1a7f37;
      --present-bg: #dcf5e3;
      --leave: #9a6700;
      --leave-bg: #fff1c7;
      --unknown: #b42318;
      --unknown-bg: #fde2df;
      --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
      --radius: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1216;
        --surface: #181c22;
        --surface-2: #20252d;
        --border: #2d333c;
        --text: #e8ebef;
        --muted: #9aa5b1;
        --accent: #4c8dff;
        --present: #4ac26b;
        --present-bg: #12301d;
        --leave: #e3b341;
        --leave-bg: #3a2e0b;
        --unknown: #ff7b72;
        --unknown-bg: #3d1614;
        --shadow: none;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Sarabun', 'Noto Sans Thai', 'Leelawadee UI', Tahoma, sans-serif;
      font-size: 16px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .wrap { max-width: 960px; margin: 0 auto; padding: 0 16px 48px; }

    header.top {
      position: sticky; top: 0; z-index: 20;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }
    .top-inner { max-width: 960px; margin: 0 auto; padding: 12px 16px 10px; }
    .title-row { display: flex; align-items: center; gap: 12px; }
    .title-row h1 { font-size: 20px; margin: 0; font-weight: 700; flex: 1; min-width: 0; }
    .title-row .sub { display: block; font-size: 13px; font-weight: 400; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .icon-btn {
      border: 1px solid var(--border); background: var(--surface);
      border-radius: 10px; padding: 8px 12px; font-size: 14px; display: inline-flex; align-items: center; gap: 6px;
      white-space: nowrap;
    }
    .icon-btn:disabled { opacity: .6; cursor: default; }
    .spin { animation: spin 1s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
    .stat {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      padding: 6px 10px; text-align: left; transition: border-color .15s, box-shadow .15s;
    }
    .stat .label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .stat .value { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .stat.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
    .dot.present { background: var(--present); }
    .dot.leave { background: var(--leave); }
    .dot.unknown { background: var(--unknown); }
    .dot.all { background: var(--muted); }
    .stat.present .value { color: var(--present); }
    .stat.leave .value { color: var(--leave); }
    .stat.unknown .value { color: var(--unknown); }

    .bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; display: flex; }
    .bar span { display: block; height: 100%; transition: width .3s; }
    .bar .present { background: var(--present); }
    .bar .leave { background: var(--leave); }
    .summary-bar { margin-top: 8px; }

    .zones { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: thin; }
    .zone-tab {
      flex: none; border: 1px solid var(--border); background: var(--surface); border-radius: 999px;
      padding: 6px 12px; font-size: 14px; display: inline-flex; align-items: center; gap: 6px;
    }
    .zone-tab .count { font-size: 12px; color: var(--unknown); font-weight: 600; }
    .zone-tab .count.done { color: var(--present); }
    .zone-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .zone-tab.active .count { color: #fff; }

    .search { margin-top: 10px; position: relative; }
    .search input {
      width: 100%; padding: 10px 36px 10px 12px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--surface); outline: none;
    }
    .search input:focus { border-color: var(--accent); }
    .search .clear {
      position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
      border: 0; background: transparent; color: var(--muted); font-size: 18px; padding: 4px 8px; display: none;
    }
    .search.has-text .clear { display: block; }

    .banner {
      margin-top: 16px; padding: 10px 12px; border-radius: 10px; font-size: 14px;
      background: var(--leave-bg); color: var(--leave); border: 1px solid transparent;
    }
    .banner.error { background: var(--unknown-bg); color: var(--unknown); }

    .overview { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; margin-top: 16px; }
    .zone-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 14px; text-align: left; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px;
    }
    .zone-card:hover { border-color: var(--accent); }
    .zone-card h3 { margin: 0; font-size: 18px; }
    .zone-card .depts { font-size: 13px; color: var(--muted); }
    .zone-card .nums { display: flex; gap: 12px; font-size: 14px; font-variant-numeric: tabular-nums; }
    .zone-card .nums span { display: inline-flex; align-items: center; gap: 4px; }
    .zone-card .pct { font-size: 13px; color: var(--muted); }

    .dept { margin-top: 20px; }
    .dept-head {
      display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
      padding: 0 2px 6px; border-bottom: 2px solid var(--border);
    }
    .dept-head h2 { font-size: 17px; margin: 0; flex: 1; min-width: 0; }
    .dept-head .zone-label { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 6px; }
    .dept-head .mini { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; display: flex; gap: 10px; }
    .dept-head .mini span { display: inline-flex; align-items: center; gap: 4px; }
    .note { font-size: 14px; color: var(--muted); padding: 8px 2px; font-style: italic; }

    .person {
      display: flex; align-items: center; gap: 12px;
      background: var(--surface); border: 1px solid var(--border); border-left-width: 4px;
      border-radius: 10px; padding: 10px 12px; margin-top: 8px;
    }
    .person.s-present { border-left-color: var(--present); }
    .person.s-leave { border-left-color: var(--leave); }
    .person.s-unknown { border-left-color: var(--unknown); }
    .person .info { flex: 1; min-width: 0; }
    .person .name { font-weight: 600; }
    .person .meta { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 0 10px; }
    .person .meta a { color: var(--accent); text-decoration: none; }
    .person .saving { color: var(--accent); }

    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; flex: none; }
    .seg button {
      border: 0; background: var(--surface); padding: 8px 12px; font-size: 14px; font-weight: 600;
      color: var(--muted); min-width: 64px;
    }
    .seg button + button { border-left: 1px solid var(--border); }
    .seg button:disabled { cursor: default; }
    .seg button.on.present { background: var(--present-bg); color: var(--present); }
    .seg button.on.leave { background: var(--leave-bg); color: var(--leave); }
    .seg button.on.unknown { background: var(--unknown-bg); color: var(--unknown); }

    .empty { text-align: center; color: var(--muted); padding: 40px 0; }
    .loading { text-align: center; color: var(--muted); padding: 60px 0; }

    .footer-actions { margin-top: 32px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); }
    .danger { color: var(--unknown); border-color: var(--unknown); background: transparent; }

    .toast {
      position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(120%);
      background: #1b1f24; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px;
      max-width: calc(100% - 32px); transition: transform .25s, opacity .25s; z-index: 50; box-shadow: 0 4px 16px rgba(0,0,0,.25);
      opacity: 0; pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast.error { background: var(--unknown); }

    @media (max-width: 600px) {
      header.top { position: static; }
      .title-row h1 { font-size: 18px; }
      .stat { padding: 6px 8px; }
      .stat .value { font-size: 19px; }
      .person { flex-direction: column; align-items: stretch; gap: 8px; }
      .seg { display: flex; }
      .seg button { flex: 1; min-width: 0; padding: 10px 6px; }
      .refresh-label { display: none; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="title-row">
        <h1>ระบบเช็กอินเจ้าหน้าที่ <span class="sub" id="subtitle">กำลังโหลด…</span></h1>
        <button class="icon-btn" id="refreshBtn" title="ดึงข้อมูลล่าสุด">
          <span id="refreshIcon">⟳</span><span class="refresh-label">รีเฟรช</span>
        </button>
      </div>
      <div class="summary" id="summary"></div>
      <div class="bar summary-bar" id="summaryBar"></div>
      <nav class="zones" id="zones" aria-label="เลือกโซน"></nav>
      <div class="search" id="searchBox">
        <input type="search" id="search" placeholder="ค้นหาชื่อ ตำแหน่ง หรือหน่วยงาน" autocomplete="off">
        <button class="clear" id="clearSearch" aria-label="ล้างคำค้นหา">×</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div id="banner"></div>
    <div id="content"><div class="loading">กำลังโหลดข้อมูลจาก Google Sheet…</div></div>
    <div class="footer-actions" id="footer" hidden>
      <span id="fetchedAt"></span>
      <button class="icon-btn danger" id="resetBtn">รีเซ็ตสถานะเป็น "ไม่ทราบ"</button>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    var STATUS = {
      'อยู่': { key: 'present', label: 'อยู่' },
      'ลา': { key: 'leave', label: 'ลา' },
      'ไม่ทราบ': { key: 'unknown', label: 'ไม่ทราบ' }
    };
    var STATUS_ORDER = ['อยู่', 'ลา', 'ไม่ทราบ'];
    var AUTO_REFRESH_MS = 20000;

    var state = {
      data: null,
      zone: readPref('zone', ''),
      filter: '',
      query: '',
      pending: {},
      loading: false
    };

    // ---------- API (google.script.run หรือโหมดตัวอย่าง) ----------
    var isDemo = !(window.google && google.script && google.script.run);
    var api = isDemo ? demoApi() : {
      call: function (fn) {
        var args = Array.prototype.slice.call(arguments, 1);
        return new Promise(function (resolve, reject) {
          var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
          runner[fn].apply(runner, args);
        });
      }
    };

    // ---------- helpers ----------
    function $(id) { return document.getElementById(id); }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function readPref(k, d) { try { var v = localStorage.getItem('checkin.' + k); return v == null ? d : v; } catch (e) { return d; } }
    function writePref(k, v) { try { localStorage.setItem('checkin.' + k, v); } catch (e) {} }
    function personKey(zone, p) { return zone.sheet + '#' + p.row + '#' + p.name; }
    function normalize(s) { return String(s || '').toLowerCase().replace(/\s+/g, ' ').trim(); }
    function errMsg(e) { return (e && (e.message || e.toString())) || 'เกิดข้อผิดพลาด'; }

    var toastTimer;
    function toast(msg, isError) {
      var t = $('toast');
      t.textContent = msg;
      t.className = 'toast show' + (isError ? ' error' : '');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { t.className = 'toast' + (isError ? ' error' : ''); }, isError ? 4500 : 2200);
    }

    function countPeople(people) {
      var c = { total: 0, 'อยู่': 0, 'ลา': 0, 'ไม่ทราบ': 0 };
      people.forEach(function (p) { c.total++; c[p.status]++; });
      return c;
    }
    function zonePeople(zone) {
      var out = [];
      zone.departments.forEach(function (d) { out = out.concat(d.people); });
      return out;
    }
    function allPeople() {
      var out = [];
      (state.data ? state.data.zones : []).forEach(function (z) { out = out.concat(zonePeople(z)); });
      return out;
    }
    function currentZone() {
      if (!state.data) return null;
      for (var i = 0; i < state.data.zones.length; i++) {
        if (state.data.zones[i].sheet === state.zone) return state.data.zones[i];
      }
      return null;
    }
    function barHtml(c) {
      if (!c.total) return '';
      return '<span class="present" style="width:' + (c['อยู่'] / c.total * 100) + '%"></span>' +
             '<span class="leave" style="width:' + (c['ลา'] / c.total * 100) + '%"></span>';
    }
    function miniCounts(c) {
      return STATUS_ORDER.map(function (s) {
        return '<span title="' + s + '"><i class="dot ' + STATUS[s].key + '"></i>' + c[s] + '</span>';
      }).join('');
    }

    // ---------- render ----------
    function render() {
      if (!state.data) return;
      renderHeader();
      renderContent();
    }

    function renderHeader() {
      var zone = currentZone();
      var scope = zone ? zonePeople(zone) : allPeople();
      var c = countPeople(scope);
      $('subtitle').textContent = (zone ? zone.name + ' · ' : 'ทุกโซน · ') + state.data.title;

      var stats = [{ s: '', key: 'all', label: 'ทั้งหมด', value: c.total }].concat(STATUS_ORDER.map(function (s) {
        return { s: s, key: STATUS[s].key, label: s, value: c[s] };
      }));
      $('summary').innerHTML = stats.map(function (x) {
        return '<button class="stat ' + x.key + (state.filter === x.s ? ' active' : '') + '" data-filter="' + esc(x.s) + '">' +
               '<div class="label"><i class="dot ' + x.key + '"></i>' + esc(x.label) + '</div>' +
               '<div class="value">' + x.value + '</div></button>';
      }).join('');
      $('summaryBar').innerHTML = barHtml(c);

      var all = countPeople(allPeople());
      var tabs = '<button class="zone-tab' + (zone ? '' : ' active') + '" data-zone="">ภาพรวม <span class="count' +
                 (all['ไม่ทราบ'] ? '' : ' done') + '">' + (all['ไม่ทราบ'] || '✓') + '</span></button>';
      tabs += state.data.zones.map(function (z) {
        var zc = countPeople(zonePeople(z));
        return '<button class="zone-tab' + (zone === z ? ' active' : '') + '" data-zone="' + esc(z.sheet) + '">' + esc(z.name) +
               ' <span class="count' + (zc['ไม่ทราบ'] ? '' : ' done') + '" title="ยังไม่ทราบสถานะ">' + (zc['ไม่ทราบ'] || '✓') + '</span></button>';
      }).join('');
      $('zones').innerHTML = tabs;

      $('fetchedAt').textContent = 'ข้อมูล ณ ' + state.data.fetchedAt;
      $('resetBtn').textContent = zone ? 'รีเซ็ตสถานะ' + zone.name + ' เป็น "ไม่ทราบ"' : 'รีเซ็ตสถานะทุกโซนเป็น "ไม่ทราบ"';
      $('footer').hidden = false;
    }

    function renderContent() {
      var zone = currentZone();
      var q = normalize(state.query);

      // หน้าภาพรวม (ไม่ได้เลือกโซน ไม่ค้นหา ไม่กรอง) แสดงการ์ดสรุปแต่ละโซน
      if (!zone && !q && !state.filter) {
        $('content').innerHTML = '<div class="overview">' + state.data.zones.map(function (z) {
          var c = countPeople(zonePeople(z));
          var pct = c.total ? Math.round((c['อยู่'] + c['ลา']) / c.total * 100) : 0;
          return '<button class="zone-card" data-zone="' + esc(z.sheet) + '">' +
                 '<h3>' + esc(z.name) + '</h3>' +
                 '<div class="depts">' + z.departments.length + ' หน่วยงาน · ' + c.total + ' คน</div>' +
                 '<div class="bar">' + barHtml(c) + '</div>' +
                 '<div class="nums">' + miniCounts(c) + '</div>' +
                 '<div class="pct">ทราบสถานะแล้ว ' + pct + '%</div></button>';
        }).join('') + '</div>';
        return;
      }

      var zones = zone ? [zone] : state.data.zones;
      var html = '';
      zones.forEach(function (z) {
        z.departments.forEach(function (d) {
          var deptMatch = q && normalize(d.name).indexOf(q) >= 0;
          var people = d.people.filter(function (p) {
            if (state.filter && p.status !== state.filter) return false;
            if (!q || deptMatch) return true;
            return normalize(p.name).indexOf(q) >= 0 || normalize(p.position).indexOf(q) >= 0;
          });
          var showNotes = !state.filter && (!q || deptMatch) && d.notes.length;
          if (!people.length && !showNotes) return;

          html += '<section class="dept"><div class="dept-head"><h2>' + esc(d.name) +
                  (zone ? '' : '<span class="zone-label">' + esc(z.name) + '</span>') + '</h2>' +
                  '<div class="mini">' + miniCounts(countPeople(d.people)) + '</div></div>';
          if (showNotes) d.notes.forEach(function (n) { html += '<div class="note">หมายเหตุ: ' + esc(n) + '</div>'; });
          people.forEach(function (p) { html += personHtml(z, p); });
          html += '</section>';
        });
      });
      $('content').innerHTML = html || '<div class="empty">ไม่พบรายชื่อที่ตรงกับเงื่อนไข</div>';
    }

    function personHtml(zone, p) {
      var key = personKey(zone, p);
      var saving = !!state.pending[key];
      var meta = [];
      if (p.position) meta.push(esc(p.position));
      if (p.phone) meta.push('<a href="tel:' + esc(p.phone.replace(/[^\d+]/g, '')) + '">☎ ' + esc(p.phone) + '</a>');
      if (saving) meta.push('<span class="saving">กำลังบันทึก…</span>');
      else if (p.updated) meta.push('อัปเดต ' + esc(p.updated));

      return '<div class="person s-' + STATUS[p.status].key + '">' +
             '<div class="info"><div class="name">' + esc(p.name) + '</div>' +
             '<div class="meta">' + meta.join('<span aria-hidden="true">·</span>') + '</div></div>' +
             '<div class="seg" role="group" aria-label="สถานะของ ' + esc(p.name) + '">' +
             STATUS_ORDER.map(function (s) {
               var on = p.status === s;
               return '<button class="' + STATUS[s].key + (on ? ' on' : '') + '" aria-pressed="' + on + '"' +
                      (saving ? ' disabled' : '') +
                      ' data-sheet="' + esc(zone.sheet) + '" data-row="' + p.row + '" data-name="' + esc(p.name) +
                      '" data-status="' + esc(s) + '">' + s + '</button>';
             }).join('') + '</div></div>';
    }

    // ---------- actions ----------
    function load(silent) {
      if (state.loading) return Promise.resolve();
      state.loading = true;
      $('refreshBtn').disabled = true;
      $('refreshIcon').className = 'spin';
      return api.call('getData').then(function (data) {
        // คงสถานะที่กำลังบันทึกไว้ เพื่อไม่ให้ข้อมูลเก่าทับการกดล่าสุด
        data.zones.forEach(function (z) {
          zonePeople(z).forEach(function (p) {
            var pend = state.pending[personKey(z, p)];
            if (pend) p.status = pend;
          });
        });
        state.data = data;
        if (state.zone && !currentZone()) state.zone = '';
        $('banner').innerHTML = isDemo ? '<div class="banner">โหมดตัวอย่าง: แสดงข้อมูลจำลอง ไม่ได้เชื่อมต่อ Google Sheet</div>' : '';
        render();
      }).catch(function (e) {
        if (!silent || !state.data) {
          $('banner').innerHTML = '<div class="banner error">โหลดข้อมูลไม่สำเร็จ: ' + esc(errMsg(e)) + '</div>';
        }
        if (!state.data) $('content').innerHTML = '';
      }).then(function () {
        state.loading = false;
        $('refreshBtn').disabled = false;
        $('refreshIcon').className = '';
      });
    }

    function findPerson(sheet, row, name) {
      var zone = null;
      state.data.zones.forEach(function (z) { if (z.sheet === sheet) zone = z; });
      if (!zone) return null;
      var found = null;
      zonePeople(zone).forEach(function (p) { if (p.row === row && p.name === name) found = p; });
      return found ? { zone: zone, person: found } : null;
    }

    function setStatus(btn) {
      var row = Number(btn.getAttribute('data-row'));
      var sheet = btn.getAttribute('data-sheet');
      var name = btn.getAttribute('data-name');
      var status = btn.getAttribute('data-status');
      var hit = findPerson(sheet, row, name);
      if (!hit || hit.person.status === status) return;

      var p = hit.person, key = personKey(hit.zone, p), prev = p.status;
      p.status = status;
      state.pending[key] = status;
      render();

      api.call('setStatus', sheet, row, name, status).then(function (res) {
        delete state.pending[key];
        p.status = res.status;
        p.updated = res.updated;
        if (res.row !== p.row) p.row = res.row;
        render();
        toast(name + ' → ' + status);
      }).catch(function (e) {
        delete state.pending[key];
        p.status = prev;
        render();
        toast('บันทึกไม่สำเร็จ: ' + errMsg(e), true);
      });
    }

    function reset() {
      var zone = currentZone();
      var label = zone ? zone.name : 'ทุกโซน';
      if (!confirm('ยืนยันรีเซ็ตสถานะของ' + label + ' ให้เป็น "ไม่ทราบ" ทั้งหมด?\nสถานะเดิมในชีตจะถูกล้าง')) return;
      $('resetBtn').disabled = true;
      api.call('resetStatuses', zone ? zone.sheet : '').then(function (res) {
        toast('รีเซ็ตแล้ว ' + res.count + ' คน');
        return load();
      }).catch(function (e) {
        toast('รีเซ็ตไม่สำเร็จ: ' + errMsg(e), true);
      }).then(function () { $('resetBtn').disabled = false; });
    }

    // ---------- events ----------
    document.addEventListener('click', function (ev) {
      var t = ev.target.closest('button');
      if (!t) return;
      if (t.hasAttribute('data-status')) return setStatus(t);
      if (t.hasAttribute('data-zone')) {
        state.zone = t.getAttribute('data-zone');
        writePref('zone', state.zone);
        render();
        window.scrollTo(0, 0);
        return;
      }
      if (t.hasAttribute('data-filter')) {
        var f = t.getAttribute('data-filter');
        state.filter = state.filter === f ? '' : f;
        return render();
      }
    });
    $('refreshBtn').addEventListener('click', function () { load(); });
    $('resetBtn').addEventListener('click', reset);

    var searchTimer;
    $('search').addEventListener('input', function (e) {
      $('searchBox').classList.toggle('has-text', !!e.target.value);
      clearTimeout(searchTimer);
      searchTimer = setTimeout(function () { state.query = e.target.value; render(); }, 120);
    });
    $('clearSearch').addEventListener('click', function () {
      $('search').value = '';
      $('searchBox').classList.remove('has-text');
      state.query = '';
      render();
      $('search').focus();
    });

    setInterval(function () {
      if (document.hidden || Object.keys(state.pending).length) return;
      load(true);
    }, AUTO_REFRESH_MS);
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && state.data) load(true);
    });

    load();

    // ---------- โหมดตัวอย่าง (เปิดไฟล์นี้นอก Apps Script) ----------
    function demoApi() {
      var zones = [
        { sheet: 'โซนที่ 1 ', depts: [['งานบริการผู้ป่วยนอก', 6], ['งานเวชระเบียนและสถิติ', 4], ['งานประชาสัมพันธ์', 3]] },
        { sheet: 'โซน 2', depts: [['กลุ่มงานรังสีรักษา', 4], ['งานรังสีรักษา', 5]] },
        { sheet: 'โซน3', depts: [['จ่ายกลาง', 3], ['โรงครัว/ โรงอาหาร', 4]] },
        { sheet: 'โซน4', depts: [['สำนักผู้อำนวยการ', 1], ['งานรังสีรักษา', 0, 'เช็ครายชื่อที่โซน 2'], ['งานการเงิน', 4]] }
      ];
      var first = ['สมชาย', 'สมหญิง', 'วิภา', 'อนุชา', 'กมลา', 'ธนพล', 'ปิยะนุช', 'ศักดิ์ชัย', 'มาลี', 'ณัฐพล', 'จันทร์เพ็ญ', 'ประเสริฐ'];
      var last = ['ใจดี', 'มีสุข', 'รักงาน', 'ทองดี', 'แก้วใส', 'ศรีสวัสดิ์', 'บุญมา', 'สายทอง'];
      var pos = ['พยาบาลวิชาชีพชำนาญการ', 'เจ้าพนักงานธุรการ', 'พนักงานช่วยเหลือคนไข้', 'นักรังสีการแพทย์ปฏิบัติการ'];
      var n = 0;
      var data = {
        title: 'รายชื่อเจ้าหน้าที่แต่ละโซน (ตัวอย่าง)',
        statuses: STATUS_ORDER,
        zones: zones.map(function (z) {
          var row = 2;
          return {
            sheet: z.sheet, name: z.sheet.trim(),
            departments: z.depts.map(function (d) {
              row++;
              var people = [];
              for (var i = 0; i < d[1]; i++) {
                n++; row++;
                people.push({
                  row: row,
                  name: (n % 3 ? 'นางสาว' : 'นาย') + first[n % first.length] + '  ' + last[(n * 3) % last.length],
                  position: pos[n % pos.length],
                  status: n % 5 === 0 ? 'อยู่' : n % 7 === 0 ? 'ลา' : 'ไม่ทราบ',
                  phone: n % 4 === 0 ? '08' + String(10000000 + n * 7919).slice(0, 8) : '',
                  birthday: '', updated: ''
                });
              }
              return { name: d[0], people: people, notes: d[2] ? [d[2]] : [] };
            })
          };
        })
      };
      function stamp() {
        var d = new Date(), p = function (x) { return (x < 10 ? '0' : '') + x; };
        return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
      }
      var fns = {
        getData: function () { data.fetchedAt = stamp(); return JSON.parse(JSON.stringify(data)); },
        setStatus: function (sheet, row, name, status) {
          var z = data.zones.filter(function (z) { return z.sheet === sheet; })[0];
          var p = z && zonePeople(z).filter(function (p) { return p.row === row && p.name === name; })[0];
          if (!p) throw new Error('ไม่พบรายชื่อ');
          p.status = status; p.updated = stamp();
          return { row: row, status: status, updated: p.updated };
        },
        resetStatuses: function (sheet) {
          var count = 0;
          data.zones.forEach(function (z) {
            if (sheet && z.sheet !== sheet) return;
            zonePeople(z).forEach(function (p) { p.status = 'ไม่ทราบ'; p.updated = ''; count++; });
          });
          return { count: count };
        }
      };
      return {
        call: function (fn) {
          var args = Array.prototype.slice.call(arguments, 1);
          return new Promise(function (resolve, reject) {
            setTimeout(function () {
              try { resolve(fns[fn].apply(null, args)); } catch (e) { reject(e); }
            }, 250);
          });
        }
      };
    }
  </script>
