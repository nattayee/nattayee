<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linac QA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <div class="brand">
        <span class="logo" aria-hidden="true">☢</span>
        <span id="app-title">Linac QA</span>
      </div>
      <nav class="tabs" role="tablist">
        <button class="tab active" data-view="form" role="tab">บันทึก QA</button>
        <button class="tab" data-view="history" role="tab">ประวัติ</button>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <!-- ฟอร์มบันทึก -->
    <section id="view-form" class="view">
      <div class="card head-card">
        <h1 id="form-title"></h1>
        <p id="form-subtitle" class="muted"></p>
        <p class="req-note"><span class="req">*</span> ระบุว่าเป็นคำถามที่จำเป็น</p>
      </div>

      <form id="qa-form" novalidate></form>

      <div class="card result-card" id="result-card">
        <div>
          <div class="muted">ผลรวม</div>
          <div id="overall" class="overall">—</div>
        </div>
        <div class="counts" id="counts"></div>
      </div>

      <div class="actions">
        <button type="button" class="btn ghost" id="btn-reset">ล้างแบบฟอร์ม</button>
        <button type="submit" form="qa-form" class="btn primary">ส่ง</button>
      </div>
    </section>

    <!-- ประวัติ -->
    <section id="view-history" class="view" hidden>
      <div class="card">
        <div class="history-head">
          <h2>ประวัติการบันทึก</h2>
          <div class="history-tools">
            <select id="filter-machine"><option value="">ทุกเครื่อง</option></select>
            <button class="btn ghost" id="btn-csv">ส่งออก CSV</button>
            <button class="btn ghost" id="btn-print">พิมพ์</button>
          </div>
        </div>
        <div class="table-scroll">
          <table class="history">
            <thead>
              <tr><th>วันที่</th><th>เครื่อง</th><th>ผู้ตรวจ</th><th>ผล</th><th>สถานะเครื่อง</th><th></th></tr>
            </thead>
            <tbody id="history-body"></tbody>
          </table>
        </div>
        <p class="muted" id="history-empty">ยังไม่มีข้อมูล</p>
      </div>

      <div class="card" id="detail-card" hidden>
        <div class="history-head">
          <h2>รายละเอียด</h2>
          <button class="btn ghost" id="btn-close-detail">ปิด</button>
        </div>
        <div id="detail"></div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
