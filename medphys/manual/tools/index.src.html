<title>คู่มือ LPCH RT Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600;700&display=swap">
<style>
/* Layout: หน้าแรกเลือก "ตามวิชาชีพ" หรือ "ตามกรณี" → หน้าคู่มือแต่ละเรื่อง: ขั้นตอนเรียงลงมา แต่ละขั้น = ภาพหน้าจอจริง + กรอบ/ลูกศร/เลขลำดับที่ต้องกด
   โทน: เขียวน้ำทะเลแบบระบบ (ให้ภาพกับคู่มือเป็นชุดเดียวกัน) · เครื่องหมายบนภาพใช้ส้มสด ขอบขาว อ่านออกบนทุกหน้าจอ */
:root {
  --bg: #f2f5f4; --surface: #ffffff; --sunken: #e6ecea; --ink: #10201c; --muted: #52625e; --faint: #8a9894; --line: #d5dfdc;
  --accent: #0d6b5c; --accent-soft: #d8efe9; --accent-ink: #ffffff;
  --mark: #f0541e; --mark-ink: #ffffff; --mark-soft: #ffe4d8;
  --display: "Prompt", "IBM Plex Sans Thai", "Noto Sans Thai", system-ui, sans-serif;
  --body: "IBM Plex Sans Thai", "Noto Sans Thai", "Leelawadee UI", system-ui, sans-serif;
  --r: 14px; --shadow: 0 1px 2px rgb(16 32 28 / .06), 0 8px 24px rgb(16 32 28 / .07);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1513; --surface: #15201d; --sunken: #1c2925; --ink: #e6efec; --muted: #9db0ab; --faint: #6c7f7a; --line: #27362f;
  --accent: #46c2a8; --accent-soft: #163a32; --accent-ink: #06221c;
  --mark: #ff7a45; --mark-ink: #1a0b04; --mark-soft: #3d1e10;
  --shadow: 0 1px 2px rgb(0 0 0 / .4); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d1513; --surface: #15201d; --sunken: #1c2925; --ink: #e6efec; --muted: #9db0ab; --faint: #6c7f7a; --line: #27362f;
  --accent: #46c2a8; --accent-soft: #163a32; --accent-ink: #06221c;
  --mark: #ff7a45; --mark-ink: #1a0b04; --mark-soft: #3d1e10;
  --shadow: 0 1px 2px rgb(0 0 0 / .4); color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.65 var(--body); }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 20px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-bottom: 18px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); min-width: 0; }
.brand > span { min-width: 0; }
.brand svg { width: 34px; height: 34px; color: var(--accent); flex: none; }
.brand b { font: 600 19px/1.2 var(--display); }
.brand small { display: block; color: var(--muted); font: 400 12.5px var(--body); }
.crumb { margin-left: auto; color: var(--muted); font-size: 14px; }
.crumb a { text-decoration: none; }

/* home */
h1, h2, h3 { font-family: var(--display); text-wrap: balance; }
.hero { display: grid; gap: 6px; margin: 6px 0 22px; }
.hero h1 { margin: 0; font-size: clamp(28px, 4.4vw, 42px); line-height: 1.15; font-weight: 700; }
.hero p { margin: 0; color: var(--muted); max-width: 62ch; }
.tabs { display: inline-flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--sunken); margin-bottom: 16px; }
.tabs button { border: 0; background: none; padding: 8px 18px; border-radius: 999px; color: var(--muted); font-weight: 600; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.card { display: grid; gap: 6px; align-content: start; padding: 16px 18px; border-radius: var(--r); background: var(--surface);
  border: 1px solid var(--line); text-decoration: none; color: var(--ink); min-width: 0; }
.card:hover { border-color: var(--accent); }
.card h3 { margin: 0; font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
.card h3 .ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; font: 600 13px var(--display); }
.card p { margin: 0; color: var(--muted); font-size: 14.5px; }
.card ul { margin: 2px 0 0; padding: 0; list-style: none; display: grid; gap: 2px; font-size: 14.5px; }
.card li::before { content: "→ "; color: var(--accent); }
.path { margin: 26px 0 6px; }
.path h2 { margin: 0 0 4px; font-size: 20px; }
.path > p { margin: 0 0 12px; color: var(--muted); font-size: 14.5px; }
.flow { overflow-x: auto; padding-bottom: 6px; }
.flow svg { display: block; min-width: 980px; width: 100%; height: auto; }
.flow .st { fill: var(--surface); stroke: var(--line); }
.flow .st.hl { stroke: var(--accent); stroke-width: 2; }
.flow text { fill: var(--ink); font: 600 13px var(--body); }
.flow .sub { fill: var(--muted); font: 400 11.5px var(--body); }
.flow .ln { stroke: var(--faint); stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.flow .ln.back { stroke: var(--mark); stroke-dasharray: 5 4; }
.flow .lbl { fill: var(--accent); font: 600 11.5px var(--body); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.flow .lbl.back { fill: var(--mark); }
.flow .ah { fill: var(--faint); stroke: var(--faint); stroke-width: 1; stroke-linejoin: round; }
.flow .ah.back { fill: var(--mark); stroke: var(--mark); }
.flow .who { fill: var(--accent); font: 600 11px var(--body); }
.flow .sec { fill: var(--muted); font: 600 12.5px var(--display); letter-spacing: .02em; }
.flow .band { fill: var(--sunken); }
.flow a:hover .st, .flow a:focus .st { stroke: var(--accent); stroke-width: 2; }

/* guide */
.guide-head { display: grid; gap: 6px; margin: 4px 0 18px; }
.guide-head h1 { margin: 0; font-size: clamp(26px, 3.8vw, 36px); line-height: 1.2; }
.who { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 600; }
.lead { margin: 0; color: var(--muted); max-width: 70ch; }
.layout { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 28px; align-items: start; }
.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); display: grid; gap: 2px; font-size: 14px; }
.toc b { font: 600 13px var(--display); color: var(--muted); letter-spacing: .03em; margin-bottom: 4px; }
.toc a { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 6px; padding: 5px 8px; border-radius: 8px; text-decoration: none; color: var(--ink); }
.toc a:hover { background: var(--sunken); }
.toc a span:first-child { font: 600 13px var(--display); color: var(--accent); }
.steps { display: grid; gap: 34px; min-width: 0; }
.step { display: grid; gap: 12px; min-width: 0; scroll-margin-top: 16px; }
.step h2 { margin: 0; font-size: 21px; display: flex; gap: 12px; align-items: baseline; }
.step h2 .no { flex: none; font: 700 15px var(--display); color: var(--accent-ink); background: var(--accent); border-radius: 8px; padding: 1px 9px; }
.shot { position: relative; margin: 0; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); cursor: zoom-in; }
.shot img { display: block; width: 100%; height: auto; }
.shot svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.shot figcaption { padding: 8px 12px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); }
.acts { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.acts li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: start; }
.acts .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--mark); color: var(--mark-ink); font: 700 14px var(--display); }
.acts .n.t { background: var(--sunken); color: var(--muted); }
.result { padding: 10px 14px; border-radius: 10px; background: var(--accent-soft); color: var(--ink); font-size: 15px; }
.result b { color: var(--accent); }
.note { padding: 10px 14px; border-radius: 10px; background: var(--mark-soft); font-size: 15px; }
kbd, .ui { font: 600 .92em var(--body); padding: 0 6px; border-radius: 6px; background: var(--sunken); border: 1px solid var(--line); white-space: nowrap; }
.step h2 .pill.by { vertical-align: 3px; margin-left: 4px; font-family: var(--body); }
.paths { padding: 12px 16px; border-radius: var(--r); border: 1.5px dashed var(--accent); background: var(--surface); }
.paths > b { display: block; font: 600 14px var(--display); color: var(--accent); margin-bottom: 6px; }
.paths ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.paths li { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1.25fr); gap: 10px; align-items: baseline; font-size: 15px; }
.paths .if { color: var(--ink); font-weight: 600; }
.paths .go { color: var(--accent); font-weight: 700; }
@media (max-width: 560px) { .paths li { grid-template-columns: minmax(0, 1fr); gap: 0; } .paths .go { display: none; } .paths li + li { border-top: 1px solid var(--line); padding-top: 8px; } }
.next { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
.next a { flex: 1 1 260px; padding: 12px 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); text-decoration: none; color: var(--ink); }
.next a small { display: block; color: var(--muted); }
.next a:hover { border-color: var(--accent); }

/* marks drawn on screenshots (viewBox = screenshot pixels) */
.mk-box { fill: none; stroke: var(--mark); }
.mk-halo { fill: none; stroke: #fff; opacity: .9; }
.mk-arrow { stroke: var(--mark); fill: none; stroke-linecap: round; }
.mk-head { fill: var(--mark); }
.mk-dot { fill: var(--mark); stroke: #fff; }
.mk-num { fill: var(--mark-ink); font-family: var(--display); font-weight: 700; text-anchor: middle; dominant-baseline: central; }

/* zoom */
.zoom { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgb(6 12 10 / .82);
  padding: calc(env(safe-area-inset-top, 0px) + 16px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px) max(16px, env(safe-area-inset-left, 0px)); }
.zoom .shot { cursor: zoom-out; width: min(1400px, 100%); max-height: 100%; overflow: auto; }
.zoom-close { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); right: max(12px, env(safe-area-inset-right, 0px)); z-index: 51;
  border: 0; border-radius: 999px; padding: 8px 16px; background: var(--surface); color: var(--ink); font-weight: 600; cursor: pointer; }

@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .toc { position: static; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  .toc b { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

/* ฝังใน RT Hub (หน้าต่างคู่มือ): หัวไม่ซ้ำกับหัวหน้าต่าง · การ์ดของตำแหน่งผู้ใช้ขึ้นก่อนและมีป้าย */
html.embed .brand { display: none; }
html.embed .wrap { padding-block: 14px 40px; }
html.embed .bar { margin-bottom: 10px; }
html.embed .bar:has(.crumb:empty) { display: none; }
html.embed .crumb { margin-left: 0; }
.card.mine { position: relative; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.card .me { position: absolute; top: -11px; right: 14px; padding: 1px 10px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font: 600 12px/1.7 var(--body); white-space: nowrap; }
</style>

<div class="wrap">
  <header class="bar">
    <a class="brand" href="#" aria-label="คู่มือ LPCH RT Hub หน้าแรก">
      <svg viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="10.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M17 2.5v8M17 23.5v8M2.5 17h8M23.5 17h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="17" cy="17" r="2.2" fill="currentColor"/></svg>
      <span><b>คู่มือ LPCH RT Hub</b><small>กลุ่มงานรังสีรักษา · โรงพยาบาลมะเร็งลำปาง</small></span>
    </a>
    <nav class="crumb" id="crumb" aria-label="ตำแหน่งในคู่มือ"></nav>
  </header>
  <main id="view"><p class="lead">กำลังโหลดคู่มือ…</p></main>
</div>

<script>
(function () {
  "use strict";
  var M = null, view = document.getElementById("view"), crumb = document.getElementById("crumb");
  /* หน้าที่ฝังคู่มือ (RT Hub) ตั้งค่าเหล่านี้ก่อนสคริปต์นี้ทำงาน · ไม่ตั้ง = คู่มือเปิดเดี่ยวตามปกติ
     RTHUB_EMBED  เปลี่ยนหน้าในตัว ไม่ใช้ # ของที่อยู่ (หน้า blob / srcdoc)     RTHUB_BASE  ที่อยู่โฟลเดอร์คู่มือ (ต่อหน้า guides.json และภาพ)
     RTHUB_DATA   เนื้อหา guides.json ที่โหลดมาแล้ว (ไม่ต้องโหลดเอง)           RTHUB_NAV   ชื่อแถบเมนูปัจจุบัน { view: ชื่อ }
     RTHUB_ROLE   ตำแหน่งของผู้ใช้ (การ์ดของตำแหน่งนั้นขึ้นก่อน)                 RTHUB_THEME "light" | "dark"     RTHUB_START หน้าที่เปิดครั้งแรก (id ของคู่มือ) */
  var EMBED = !!window.RTHUB_EMBED, FRAMED = EMBED && window.parent !== window;
  var BASE = typeof window.RTHUB_BASE === "string" ? window.RTHUB_BASE : "";
  var ROLE = typeof window.RTHUB_ROLE === "string" ? window.RTHUB_ROLE : "";
  var cur = typeof window.RTHUB_START === "string" ? window.RTHUB_START : "";
  if (FRAMED) document.documentElement.classList.add("embed");
  if (window.RTHUB_THEME === "dark" || window.RTHUB_THEME === "light") document.documentElement.setAttribute("data-theme", window.RTHUB_THEME);
  function tell(what) { if (FRAMED) try { window.parent.postMessage({ rthubManual: what }, "*"); } catch (e) {} }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  // text in the guides may use **bold** and [ปุ่ม] for a button label
  function rich(s) {
    return esc(s).replace(/\{\{([\w-]+)\|(.+?)\}\}/g, '<a href="#$1">$2</a>')
      .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\[(.+?)\]/g, '<span class="ui">$1</span>');
  }
  // ทางแยก: [{ if: "เงื่อนไข", to: "guide-id" | step: เลขขั้นในหน้านี้, text: "ต่อที่…" }]
  function paths(list, head, gid) {
    if (!list || !list.length) return "";
    return '<div class="paths"><b>' + esc(head || "ไปต่อทางไหน") + "</b><ul>" + list.map(function (p) {
      var g = p.to && byId(p.to);
      if (p.step) return "<li><span class=\"if\">" + rich(p.if) + '</span><span class="go" aria-hidden="true">→</span><span><a href="#' + gid + '" data-step="' + (p.step - 1) + '">' + esc(p.text) + "</a></span></li>";
      return "<li><span class=\"if\">" + rich(p.if) + '</span><span class="go" aria-hidden="true">→</span><span>' +
        (g ? '<a href="#' + p.to + '">' + esc(p.text || g.title) + "</a>" : rich(p.text || "")) + "</span></li>";
    }).join("") + "</ul></div>";
  }
  function byId(id) { return M.guides.filter(function (g) { return g.id === id; })[0]; }

  /* ---------- ชื่อแถบเมนู: ข้อความในคู่มือเขียนเป็น {nav:view} แล้วแทนด้วยชื่อที่แอดมินตั้ง (guides.json → nav) ----------
     หน้าที่ฝังคู่มือส่งชื่อปัจจุบันมาแทนได้: window.RTHUB_NAV = { course: "…" } หรือ ?nav={"course":"…"} ต่อท้ายลิงก์ */
  function navNames(base) {
    var out = {}, q = null, k;
    for (k in base || {}) out[k] = base[k];
    try { q = JSON.parse(new URLSearchParams(location.search).get("nav") || "null"); } catch (e) { q = null; }
    [window.RTHUB_NAV, q].forEach(function (o) {
      if (o && typeof o === "object") for (var k in o) if (typeof o[k] === "string" && o[k].trim() && o[k].length <= 40) out[k] = o[k].trim();
    });
    return out;
  }
  function navFill(o, nav, key) {
    if (typeof o === "string") return o.replace(/\{nav:([a-z]+)\}/g, function (m, k) { var v = nav[k] || k; return key === "svg" ? esc(v) : v; });   // svg ใส่ลงหน้าเป็น markup จึง escape ที่นี่ · ข้อความอื่น escape ตอนแสดง
    if (Array.isArray(o)) return o.map(function (x) { return navFill(x, nav, key); });
    if (o && typeof o === "object") { var r = {}; for (var k in o) r[k] = k === "nav" ? o[k] : navFill(o[k], nav, k); return r; }
    return o;
  }

  /* ---------- marks on a screenshot: box around each target, numbered badge beside it, arrow from badge to box ---------- */
  function marksSvg(st) {
    var W = st.w, H = st.h, s = Math.max(1, W / 1000), R = 17 * s, sw = 3.2 * s, out = [], placed = [];
    function hits(x, y) {
      return placed.some(function (p) { return Math.hypot(p[0] - x, p[1] - y) < R * 2.3; }) ||
        (st.marks || []).some(function (m) { return x > m.x - R && x < m.x + m.w + R && y > m.y - R && y < m.y + m.h + R; });
    }
    (st.marks || []).forEach(function (m, i) {
      var n = m.n || i + 1, pad = 4 * s, bx = m.x - pad, by = m.y - pad, bw = m.w + pad * 2, bh = m.h + pad * 2;
      var cx = bx + bw / 2, cy = by + bh / 2, gap = R * 2.4;
      var cands = (m.side ? [m.side] : []).concat(["top", "left", "right", "bottom", "topleft", "topright"]).map(function (side) {
        return { side: side, x: side === "left" ? bx - gap : side === "right" ? bx + bw + gap : side === "topleft" ? bx - gap * .8 : side === "topright" ? bx + bw + gap * .8 : cx,
          y: side === "top" ? by - gap : side === "bottom" ? by + bh + gap : side.indexOf("top") === 0 ? by - gap * .8 : cy };
      });
      var c = cands.filter(function (p) { return p.x > R + 2 && p.x < W - R - 2 && p.y > R + 2 && p.y < H - R - 2 && !hits(p.x, p.y); })[0] ||
        cands.filter(function (p) { return p.x > R + 2 && p.x < W - R - 2 && p.y > R + 2 && p.y < H - R - 2; })[0] || { x: Math.min(W - R - 2, bx + bw + R), y: Math.max(R + 2, by - R) };
      placed.push([c.x, c.y]);
      // arrow: from the badge edge to the nearest point on the box
      var tx = Math.max(bx, Math.min(c.x, bx + bw)), ty = Math.max(by, Math.min(c.y, by + bh));
      var dx = tx - c.x, dy = ty - c.y, d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d;
      var x1 = c.x + ux * (R + 2 * s), y1 = c.y + uy * (R + 2 * s), x2 = tx - ux * 3 * s, y2 = ty - uy * 3 * s, hl = 9 * s;
      var hx = x2 - ux * hl, hy = y2 - uy * hl, px = -uy * hl * .55, py = ux * hl * .55;
      var rr = 7 * s;
      out.push('<rect class="mk-halo" x="' + bx + '" y="' + by + '" width="' + bw + '" height="' + bh + '" rx="' + rr + '" stroke-width="' + (sw + 3 * s) + '"/>' +
        '<rect class="mk-box" x="' + bx + '" y="' + by + '" width="' + bw + '" height="' + bh + '" rx="' + rr + '" stroke-width="' + sw + '"/>' +
        (d > R * 1.3 ? '<line class="mk-halo" x1="' + x1 + '" y1="' + y1 + '" x2="' + hx + '" y2="' + hy + '" stroke-width="' + (sw + 3 * s) + '" stroke-linecap="round"/>' +
          '<line class="mk-arrow" x1="' + x1 + '" y1="' + y1 + '" x2="' + hx + '" y2="' + hy + '" stroke-width="' + sw + '"/>' +
          '<path class="mk-head" stroke="#fff" stroke-width="' + 1.2 * s + '" d="M' + x2 + " " + y2 + "L" + (hx + px) + " " + (hy + py) + "L" + (hx - px) + " " + (hy - py) + 'Z"/>' : "") +
        '<circle class="mk-dot" cx="' + c.x + '" cy="' + c.y + '" r="' + R + '" stroke-width="' + 2.5 * s + '"/>' +
        '<text class="mk-num" x="' + c.x + '" y="' + (c.y + 0.5 * s) + '" font-size="' + 19 * s + '">' + esc(n) + "</text>");
    });
    return '<svg viewBox="0 0 ' + W + " " + H + '" aria-hidden="true">' + out.join("") + "</svg>";
  }

  function figure(st, alt) {
    return '<figure class="shot" tabindex="0" role="button" aria-label="ขยายภาพ: ' + esc(alt) + '">' +
      '<img src="' + esc(BASE + st.img) + '" width="' + st.w + '" height="' + st.h + '" alt="' + esc(alt) + '" loading="lazy">' + marksSvg(st) +
      (st.caption ? "<figcaption>" + rich(st.caption) + "</figcaption>" : "") + "</figure>";
  }

  /* ---------- pages ---------- */
  function home(tab) {
    tab = tab === "case" ? "case" : "role";
    crumb.innerHTML = "";
    var groups = tab === "role" ? M.roles : M.cases;
    function mine(g) { return tab === "role" && !!ROLE && (g.hub || []).indexOf(ROLE) >= 0; }
    if (tab === "role" && ROLE) groups = groups.filter(mine).concat(groups.filter(function (g) { return !mine(g); }));
    view.innerHTML =
      '<section class="hero"><h1>' + esc(M.title) + "</h1><p>" + rich(M.intro) + "</p></section>" +
      '<div class="tabs" role="tablist" aria-label="เลือกคู่มือ">' +
        '<button type="button" role="tab" data-tab="role" aria-selected="' + (tab === "role") + '">ตามวิชาชีพ</button>' +
        '<button type="button" role="tab" data-tab="case" aria-selected="' + (tab === "case") + '">ตามกรณีผู้ป่วย</button></div>' +
      '<div class="grid">' + groups.map(function (g) {
        return '<div class="card' + (mine(g) ? " mine" : "") + '"><h3><span class="ic" aria-hidden="true">' + esc(g.badge) + "</span>" + esc(g.title) +
          (mine(g) ? '<span class="me">ตำแหน่งของคุณ</span>' : "") + "</h3>" +
          "<p>" + rich(g.desc) + "</p><ul>" + g.guides.map(function (id) { var x = byId(id); return x ? '<li><a href="#' + id + '">' + esc(x.title) + "</a></li>" : ""; }).join("") + "</ul></div>";
      }).join("") + "</div>" +
      (M.flow ? '<section class="path"><h2>' + esc(M.flow.title) + "</h2><p>" + rich(M.flow.desc) + '</p><div class="flow">' + M.flow.svg + "</div></section>" : "");
    view.querySelectorAll("[data-tab]").forEach(function (b) {
      b.addEventListener("click", function () { home(b.getAttribute("data-tab")); try { sessionStorage.setItem("rthub-manual-tab", b.getAttribute("data-tab")); } catch (e) {} });
    });
  }

  function guide(g) {
    var i = M.guides.indexOf(g), prev = M.guides[i - 1], next = M.guides[i + 1];
    crumb.innerHTML = '<a href="#">หน้าแรกคู่มือ</a> › ' + esc(g.title);
    view.innerHTML =
      '<section class="guide-head"><div class="who">' + (g.who || []).map(function (w) { return '<span class="pill">' + esc(w) + "</span>"; }).join("") + "</div>" +
        "<h1>" + esc(g.title) + "</h1>" + (g.lead ? '<p class="lead">' + rich(g.lead) + "</p>" : "") + "</section>" +
      '<div class="layout"><nav class="toc" aria-label="ขั้นตอน"><b>ขั้นตอน</b>' + g.steps.map(function (s, k) {
        return '<a href="#' + g.id + '" data-step="' + k + '"><span>' + (k + 1) + "</span><span>" + esc(s.title) + "</span></a>";
      }).join("") + "</nav>" +
      '<div class="steps">' + g.steps.map(function (s, k) {
        return '<section class="step" id="s' + k + '"><h2><span class="no">' + (k + 1) + "</span><span>" + esc(s.title) +
          (s.who ? ' <span class="pill by">' + esc(s.who) + "</span>" : "") + "</span></h2>" +
          (s.text ? "<p class=\"lead\">" + rich(s.text) + "</p>" : "") +
          (s.shot ? figure(s.shot, s.title) : "") +
          (s.acts && s.acts.length ? '<ol class="acts">' + s.acts.map(function (a, j) {
            var numbered = s.shot && s.shot.marks && s.shot.marks.length > j;
            return '<li><span class="n' + (numbered ? "" : " t") + '">' + (numbered ? (s.shot.marks[j].n || j + 1) : "•") + "</span><span>" + rich(a) + "</span></li>";
          }).join("") + "</ol>" : "") +
          (s.result ? '<p class="result"><b>ผลที่ได้</b> · ' + rich(s.result) + "</p>" : "") +
          (s.note ? '<p class="note">' + rich(s.note) + "</p>" : "") + paths(s.paths, "", g.id) + "</section>";
      }).join("") + paths(g.paths, "จบขั้นตอนนี้แล้ว ไปต่อทางไหน", g.id) +
      '<div class="next">' + (prev ? '<a href="#' + prev.id + '"><small>← ก่อนหน้า</small>' + esc(prev.title) + "</a>" : "") +
        (next ? '<a href="#' + next.id + '"><small>ถัดไป →</small>' + esc(next.title) + "</a>" : "") + "</div></div></div>";
    view.querySelectorAll("[data-step]").forEach(function (a) {
      a.addEventListener("click", function (e) { e.preventDefault(); var el = document.getElementById("s" + a.getAttribute("data-step")); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); });
    });
    window.scrollTo(0, 0);
  }

  function route() {
    var id = EMBED ? cur : location.hash.replace(/^#/, ""), g = id && byId(id);
    if (g) guide(g);
    else { var t = "role"; try { t = sessionStorage.getItem("rthub-manual-tab") || "role"; } catch (e) {} home(t); }
  }

  /* ---------- zoom a screenshot ---------- */
  function zoom(fig) {
    var z = document.createElement("div");
    z.className = "zoom";
    z.innerHTML = '<button type="button" class="zoom-close">ปิด ✕</button>';
    var copy = fig.cloneNode(true);
    copy.removeAttribute("tabindex"); copy.removeAttribute("role");
    z.appendChild(copy);
    function close() { z.remove(); document.removeEventListener("keydown", onKey); fig.focus(); }
    function onKey(e) { if (e.key === "Escape") close(); }
    z.addEventListener("click", close);
    document.addEventListener("keydown", onKey);
    document.body.appendChild(z);
    z.querySelector(".zoom-close").focus();
  }
  view.addEventListener("click", function (e) { var f = e.target.closest && e.target.closest(".shot"); if (f && !f.closest(".zoom")) zoom(f); });
  view.addEventListener("keydown", function (e) { var f = e.target.closest && e.target.closest(".shot"); if (f && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); zoom(f); } });

  if (EMBED) {
    // ลิงก์ #… ในคู่มือ = เปลี่ยนหน้าในตัว (ลิงก์ไปขั้นตอนในหน้าเดียวกันมีตัวจัดการของตัวเอง)
    document.addEventListener("click", function (e) {
      var a = e.target.closest && e.target.closest("a[href^='#']");
      if (!a || a.hasAttribute("data-step")) return;
      e.preventDefault();
      cur = a.getAttribute("href").slice(1);
      route();
      if (!byId(cur)) window.scrollTo(0, 0);
    });
    // Esc ในคู่มือ (ไม่มีภาพขยายเปิดอยู่) = ปิดหน้าต่างของหน้าที่ฝัง
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !document.querySelector(".zoom")) tell("close"); }, true);
  } else window.addEventListener("hashchange", route);
  (window.RTHUB_DATA && typeof window.RTHUB_DATA === "object" ? Promise.resolve(window.RTHUB_DATA) : fetch(BASE + "guides.json").then(function (r) { return r.json(); }))
    .then(function (data) { M = navFill(data, navNames(data.nav), ""); route(); tell("ready"); })
    .catch(function () { view.innerHTML = '<p class="note">โหลดเนื้อหาคู่มือไม่สำเร็จ ลองรีเฟรชหน้า</p>'; tell("error"); });
})();
</script>
