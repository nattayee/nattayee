<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LPCH RO Workspace</title>
  <meta name="description" content="พื้นที่ทำงานกลางของหน่วยรังสีรักษา โรงพยาบาลมะเร็งลำปาง: แนวทางการรักษา เอกสาร แบบฟอร์ม และเครื่องมือคำนวณ">
  <link rel="icon" href="assets/lpch-emblem.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script>
  /* Day/night mode: "auto" follows the device; light/dark override it. Runs before paint to avoid a flash. */
  (function () {
    var root = document.documentElement, KEY = "lpch-ro-theme";
    function read() { try { return localStorage.getItem(KEY) || "auto"; } catch (e) { return "auto"; } }
    function apply(mode) {
      if (mode === "light" || mode === "dark") root.setAttribute("data-theme", mode);
      else root.removeAttribute("data-theme");
    }
    window.LPCHTheme = {
      get: read,
      set: function (mode) { try { localStorage.setItem(KEY, mode); } catch (e) { /* storage unavailable */ } apply(mode); }
    };
    apply(read());
  })();
  </script>
</head>
<body class="locked">
  <div class="gate" id="authScreen">
    <div class="gate-card"><span class="gate-spin" aria-hidden="true"></span><p class="gate-msg">กำลังตรวจสอบการเข้าสู่ระบบ…</p></div>
  </div>

  <div class="wrap site">
    <header class="top">
      <div class="brand">
        <img class="brand-logo" src="assets/lpch-emblem.png" width="72" height="72" alt="โลโก้โรงพยาบาลมะเร็งลำปาง">
        <div class="brand-text">
          <h1><a href="#/home" id="siteTitle">LPCH <span>RO Workspace</span></a></h1>
          <div class="org" id="siteOrg">Lampang Cancer Hospital</div>
          <p id="siteDesc"></p>
        </div>
      </div>
      <div class="top-side">
        <div class="user-badge" id="userBadge" hidden><span>เข้าสู่ระบบเป็น</span> <strong id="userName"></strong></div>
        <div class="top-controls">
          <div class="seg theme-seg" role="radiogroup" aria-label="โหมดสี">
            <label title="อัตโนมัติ (ตามอุปกรณ์)"><input type="radio" name="theme" value="auto">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg><span class="sr-only">อัตโนมัติ</span></label>
            <label title="กลางวัน"><input type="radio" name="theme" value="light">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span class="sr-only">กลางวัน</span></label>
            <label title="กลางคืน"><input type="radio" name="theme" value="dark">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span class="sr-only">กลางคืน</span></label>
          </div>
          <a class="inbox-btn" href="#/inbox" id="inboxLink" title="ข้อความส่วนตัว">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
            <span>ข้อความ</span><span class="dm-badge" id="dmBadge" hidden>0</span></a>
          <div class="user-menu" id="userMenu"></div>
        </div>
      </div>
    </header>

    <div class="secnav" id="topbar">
      <button class="menu-toggle" id="menuToggle" aria-label="เปิดเมนู" aria-expanded="false" aria-controls="nav">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span id="menuCurrent">เมนู</span>
      </button>
      <nav class="nav" id="nav" aria-label="เมนูหลัก"></nav>
    </div>

    <main id="app" tabindex="-1"></main>

    <footer class="footer">
      <img src="assets/lpch-logo.png" width="72" height="72" alt="Lampang Cancer Hospital">
      <div>
        <p><strong>LPCH RO Workspace</strong> · <span id="footerOrg"></span></p>
        <p class="muted">สำหรับใช้งานภายในหน่วยงาน — ข้อมูลทางคลินิกใช้เป็นแนวทางประกอบเท่านั้น โปรดตรวจสอบกับ protocol ของหน่วยงานทุกครั้ง</p>
      </div>
    </footer>
  </div>

  <script src="data.js"></script>
  <script src="auth.js"></script>
  <script src="chat.js"></script>
  <script src="dm.js"></script>
  <script src="quick.js"></script>
  <script src="notify.js"></script>
  <script src="app.js"></script>
</body>
</html>
