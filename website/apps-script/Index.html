          '<div class="chat-replying" id="chatReplying" hidden></div>' +
          '<div class="chat-to" id="chatTo"></div>' +
          '<div class="chat-picker" id="chatPicker" hidden></div>' +
          '<div class="chat-previews" id="chatPreviews"></div>' +
          '<div class="chat-input-row">' +
            '<label class="chat-attach" title="แนบรูป" aria-label="แนบรูป">📎<input id="chatFile" type="file" accept="image/*" multiple hidden></label>' +
            '<textarea id="chatText" rows="1" placeholder="พิมพ์ข้อความ…"></textarea>' +
            '<button class="chat-send" type="submit" id="chatSend" aria-label="ส่ง" title="ส่ง (Ctrl+Enter)">' + SEND_ICON + "</button>" +
          "</div>" +
          '<p class="chat-error" id="chatError" hidden></p>' +
        "</form>" +
      "</div>" +
      '<div class="lightbox" id="lightbox" hidden><img alt=""></div>';

    var feed = root.querySelector("#chatFeed");
    var form = root.querySelector("#chatForm");
    var textIn = root.querySelector("#chatText");
    var fileIn = root.querySelector("#chatFile");
    var previews = root.querySelector("#chatPreviews");
    var errEl = root.querySelector("#chatError");
    var sendBtn = root.querySelector("#chatSend");
    var lightbox = root.querySelector("#lightbox");
    var toEl = root.querySelector("#chatTo");
    var pickerEl = root.querySelector("#chatPicker");
    var replyEl = root.querySelector("#chatReplying");

    function showError(msg) { errEl.textContent = msg || ""; errEl.hidden = !msg; }

    /* ---- member directory (for individual recipients) ---- */

    function remember(p) { if (p && p.username) names[nameKey(p.username)] = p.name + " (" + p.role + ")"; }

    if (window.Auth && window.Auth.directory) {
      window.Auth.directory().then(function (list) {
        people = list.map(function (u) { return { username: u.username, name: u.fullName, role: u.role }; })
          .filter(function (p) { return !samePerson(p, me); });
        people.forEach(remember);
        renderTo();
        renderPicker();
        if (forwardOpen) render();
      }).catch(function () { /* individual recipients stay unavailable */ });
    }

    /* ---- recipients ---- */

    function toggleTarget(t, list) {
      if (t === "ALL") return ["ALL"];
      list = list.filter(function (x) { return x !== "ALL"; });
      var i = list.indexOf(t);
      if (i === -1) list.push(t); else list.splice(i, 1);
      return list.length ? list : ["ALL"];
    }

    function renderTo() {
      var picked = recipients.filter(function (t) { return t.indexOf("u:") === 0; });
      toEl.innerHTML = "<span>ถึง</span>" +
        ["ALL"].concat(ROLES).map(function (r) {
          return '<button type="button" class="chip' + (recipients.indexOf(r) !== -1 ? " active" : "") + '" data-to="' + esc(r) + '">' +
            esc(r === "ALL" ? "ทุกคน" : r) + "</button>";
        }).join("") +
        '<button type="button" class="chip' + (pickerOpen ? " active" : "") + '" id="pickerToggle" aria-expanded="' + pickerOpen + '"' +
          (people.length ? "" : ' disabled title="ยังไม่มีสมาชิกคนอื่น"') + '>👤 เลือกคน ▾</button>' +
        picked.map(function (t) {
          return '<span class="person-chip">' + esc(names[nameKey(t.slice(2))] || t.slice(2)) +
            '<button type="button" data-unpick="' + esc(t) + '" aria-label="เอาออก">×</button></span>';
        }).join("");
    }

    // Checkbox list of members grouped by profession; usable for composing and forwarding.
    function peopleChecklist(selected, exclude) {
      var groups = ROLE_GROUPS.map(function (r) {
        var inRole = people.filter(function (p) { return p.role === r && (!exclude || exclude.indexOf("u:" + p.username) === -1); });
        if (!inRole.length) return "";
        return '<fieldset><legend>' + esc(r === "Other" ? "อื่นๆ" : r) + "</legend>" + inRole.map(function (p) {
          var v = "u:" + p.username;
          return '<label><input type="checkbox" value="' + esc(v) + '"' + (selected.indexOf(v) !== -1 ? " checked" : "") + "> " + esc(p.name) + "</label>";
        }).join("") + "</fieldset>";
      }).join("");
      return groups || '<p class="muted">ยังไม่มีสมาชิกคนอื่นในระบบ</p>';
    }

    function renderPicker() {
      pickerEl.hidden = !pickerOpen;
      if (pickerOpen) pickerEl.innerHTML = '<p class="picker-hint">เลือกผู้รับรายบุคคล แยกตามวิชาชีพ</p>' + peopleChecklist(recipients);
    }

    toEl.addEventListener("click", function (e) {
      var b = e.target.closest("button");
      if (!b) return;
      if (b.id === "pickerToggle") { pickerOpen = !pickerOpen; renderTo(); renderPicker(); return; }
      var t = b.getAttribute("data-to") || b.getAttribute("data-unpick");
      if (!t) return;
      recipients = toggleTarget(t, recipients);
      renderTo();
      renderPicker();
    });

    pickerEl.addEventListener("change", function (e) {
      if (e.target.type !== "checkbox") return;
      recipients = toggleTarget(e.target.value, recipients);
      renderTo();
    });

    /* ---- reply ---- */

    function startReply(m) {
      replyTo = { id: m.id, name: m.author.name, role: m.author.role, username: m.author.username || "",
        text: snippet(m.text, 120) || (m.images.length ? "(รูปภาพ " + m.images.length + " รูป)" : "") };
      remember(m.author);
      // A reply goes back to the sender by default (personally if they are a member).
      if (!samePerson(m.author, me)) recipients = m.author.username ? ["u:" + m.author.username] : [m.author.role];
      renderReply();
      renderTo();
      renderPicker();
      textIn.focus();
    }

    function renderReply() {
      replyEl.hidden = !replyTo;
      if (!replyTo) return;
      replyEl.innerHTML = '<span class="reply-bar">↩ ตอบกลับ <strong>' + esc(replyTo.name) + "</strong>: " + esc(replyTo.text) + "</span>" +
        '<button type="button" class="link-btn" id="replyCancel" aria-label="ยกเลิกการตอบกลับ">✕ ยกเลิก</button>';
    }

    replyEl.addEventListener("click", function (e) {
      if (e.target.id !== "replyCancel") return;
      replyTo = null;
      recipients = ["ALL"];
      renderReply();
      renderTo();
      renderPicker();
    });

    /* ---- filters, CSV ---- */

    root.querySelectorAll("[data-filter]").forEach(function (b) {
      b.addEventListener("click", function () {
        root.querySelectorAll("[data-filter]").forEach(function (x) { x.classList.remove("active"); });
        b.classList.add("active");
        filter = b.getAttribute("data-filter");
        firstRender = true;
        render();
      });
    });

    root.querySelector("#chatCsv").addEventListener("click", function () { exportCsv(messages); });

    /* ---- attachments ---- */

    function renderPreviews() {
      previews.innerHTML = pending.map(function (src, i) {
        return '<div class="chat-thumb"><img src="' + src + '" alt="รูปแนบ ' + (i + 1) + '">' +
          '<button type="button" data-rm="' + i + '" aria-label="ลบรูป">×</button></div>';
      }).join("");
    }
    previews.addEventListener("click", function (e) {
      var i = e.target.getAttribute("data-rm");
      if (i !== null) { pending.splice(+i, 1); renderPreviews(); }
    });

    function addFiles(files) {
      var imgs = Array.prototype.filter.call(files, function (f) { return /^image\//.test(f.type); });
      if (!imgs.length) return;
      var room = MAX_IMAGES - pending.length;
      if (imgs.length > room) showError("แนบรูปได้สูงสุด " + MAX_IMAGES + " รูปต่อข้อความ");
      else showError("");
      Promise.all(imgs.slice(0, Math.max(0, room)).map(function (f) {
        return compress(f, store.imageSize[0], store.imageSize[1]);
      })).then(function (urls) {
        pending = pending.concat(urls);
        renderPreviews();
      }).catch(function (e) { showError(e.message); });
    }

    fileIn.addEventListener("change", function () { addFiles(fileIn.files); fileIn.value = ""; });
    textIn.addEventListener("paste", function (e) {
      var files = e.clipboardData && e.clipboardData.files;
      if (files && files.length) { e.preventDefault(); addFiles(files); }
    });
    form.addEventListener("dragover", function (e) { e.preventDefault(); form.classList.add("drag"); });
    form.addEventListener("dragleave", function () { form.classList.remove("drag"); });
    form.addEventListener("drop", function (e) {
      e.preventDefault();
      form.classList.remove("drag");
      addFiles(e.dataTransfer.files);
    });

    textIn.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) form.requestSubmit();
    });
    // The box grows with the text up to a few lines, like a chat app.
    function grow() { textIn.style.height = "auto"; textIn.style.height = Math.min(textIn.scrollHeight, 140) + "px"; }
    textIn.addEventListener("input", grow);

    function namesFor(targets) {
      var out = {};
      targets.forEach(function (t) {
        if (t.indexOf("u:") === 0) {
          var k = nameKey(t.slice(2));
          if (names[k]) out[k] = names[k];
        }
      });
      return out;
    }

    /* ---- send ---- */

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var text = textIn.value.trim();
      if (!me) { showError("กรุณาเข้าสู่ระบบก่อนส่งข้อความ"); return; }
      if (!text && !pending.length) { showError("พิมพ์ข้อความหรือแนบรูปก่อนส่ง"); textIn.focus(); return; }
      if (useFirebase && pending.join("").length > 900000) {
        showError("รูปแนบรวมกันใหญ่เกินไป (จำกัดประมาณ 900 KB ต่อข้อความ) — ลดจำนวนรูป");
        return;
      }
      showError("");
      sendBtn.disabled = true;
      var reads = {};
      reads[readerKey(me)] = stamp(me); // the author has read it
      var msg = {
        author: person(me),
        text: text,
        images: pending.slice(),
        to: recipients.slice(),
        toNames: namesFor(recipients),
        forwards: [],
        reads: reads,
        reactions: {},
        reactionLog: [],
        createdAt: Date.now(),
      };
      if (replyTo) msg.replyTo = replyTo;
      store.add(msg).then(function () {
        textIn.value = "";
        grow();
        pending = [];
        replyTo = null;
        recipients = ["ALL"];
        pickerOpen = false;
        renderPreviews();
        renderReply();
        renderTo();
        renderPicker();
        stickToBottom = true;
      }).catch(function (err) {
        showError("ส่งไม่สำเร็จ: " + err.message);
      }).then(function () { sendBtn.disabled = false; });
    });

    /* ---- feed actions (event delegation) ---- */

    function find(id) { return messages.filter(function (x) { return x.id === id; })[0]; }

    feed.addEventListener("click", function (e) {
      var t = e.target.closest("[data-act]");
      if (!t) {
        var img = e.target.closest(".chat-images img");
        if (img) { lightbox.querySelector("img").src = img.src; lightbox.hidden = false; }
        return;
      }
      var id = t.getAttribute("data-id");
      var act = t.getAttribute("data-act");
      var m = find(id);

      if (act === "log") { openLog[id] = !openLog[id]; render(); }
      else if (act === "fwd") { forwardOpen = forwardOpen === id ? null : id; render(); }
      else if (act === "reply") { if (m) startReply(m); }
      else if (act === "jump") {
        var el = feed.querySelector('[data-msg="' + id + '"]');
        if (!el) { showError("ไม่พบข้อความต้นฉบับ (อาจถูกลบหรือถูกกรองออก)"); return; }
        el.scrollIntoView({ behavior: "smooth", block: "center" });
        el.classList.remove("flash");
        void el.offsetWidth; // restart the animation
        el.classList.add("flash");
      }
      else if (act === "ok" || act === "no") {
        if (!me) { showError("กรุณาเข้าสู่ระบบก่อน"); return; }
        if (!m || !mayReact(m, me)) { showError("กด ✓/✗ ได้เฉพาะผู้ที่ได้รับข้อความนี้"); return; }
        var cur = m.reactions[readerKey(me)];
        if (cur && cur.type === act) return; // already recorded
        store.react(id, me, act).catch(function (err) { showError("บันทึกไม่สำเร็จ: " + err.message); });
      }
      else if (act === "fwd-send") {
        if (!me) { showError("กรุณาเข้าสู่ระบบก่อนส่งต่อ"); return; }
        var box = t.closest(".chat-forward");
        var to = Array.prototype.map.call(box.querySelectorAll("input:checked"), function (c) { return c.value; });
        if (!to.length) return;
        forwardOpen = null;
        store.forward(id, { by: person(me), to: to, at: Date.now() }, namesFor(to))
          .catch(function (err) { showError("ส่งต่อไม่สำเร็จ: " + err.message); });
      } else if (act === "del") {
        if (!isAdmin()) { showError("ลบข้อความได้เฉพาะผู้ดูแลระบบ (admin)"); return; }
        if (confirm("ลบข้อความนี้? (การลบจะถูกบันทึกไว้)")) store.remove(id).catch(function (err) { showError("ลบไม่สำเร็จ: " + err.message); });
      }
    });

    lightbox.addEventListener("click", function () { lightbox.hidden = true; });

    /* read receipts: mark a message read once it is actually on screen */
    var observer = "IntersectionObserver" in window ? new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting || !me || document.hidden) return;
        var id = en.target.getAttribute("data-msg");
        var m = find(id);
        if (!m || marked[id] || m.reads[readerKey(me)] || !isForMe(m, me)) return;
        marked[id] = true;
        store.markRead(id, me).catch(function () { delete marked[id]; });
      });
    }, { root: feed, threshold: 0.6 }) : null;

    var stickToBottom = true;
    feed.addEventListener("scroll", function () {
      stickToBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 40;
    });

    /* ---- message markup ---- */

    function readersOf(m) {
      return Object.keys(m.reads).map(function (k) { return m.reads[k]; })
        .filter(function (r) { return !samePerson(r, m.author); })
        .sort(function (a, b) { return a.at - b.at; });
    }

    function statusHtml(m, readers) {
      // Groups are "read" once anyone in them has read it; individuals once that person has.
      var chips = m.to.map(function (t) {
        var done = t === "ALL" ? readers.length > 0
          : t.indexOf("u:") === 0 ? !!m.reads["u_" + nameKey(t.slice(2))]
          : readers.some(function (x) { return x.role === t; });
        return '<span class="to-chip' + (done ? " done" : "") + (t.indexOf("u:") === 0 ? " person" : "") +
          '" title="' + (done ? "อ่านแล้ว" : "ยังไม่ได้อ่าน") + '">' + (done ? "✓✓ " : "✓ ") + esc(targetLabel(m, t)) + "</span>";
      }).join("");

      var fwd = m.forwards.map(function (f) {
        return '<div class="chat-fwd-line">↪ ' + esc(f.by.name) + " (" + esc(f.by.role) + ") ส่งต่อให้ " +
          esc(f.to.map(function (t) { return targetLabel(m, t); }).join(", ")) + " · " + fmtTime(f.at) + "</div>";
      }).join("");

      return '<div class="chat-status"><span class="to-label">ถึง</span>' + chips + "</div>" + fwd;
    }

    function reactHtml(m, readers) {
      var all = Object.keys(m.reactions).map(function (k) { return m.reactions[k]; });
      var mineR = me && m.reactions[readerKey(me)];
      var replies = messages.filter(function (x) { return x.replyTo && x.replyTo.id === m.id; }).length;

      var can = mayReact(m, me);
      var why = byMe(m) ? "ผู้ส่งกด ✓/✗ ข้อความของตัวเองไม่ได้" : "กด ✓/✗ ได้เฉพาะผู้ที่ได้รับข้อความนี้";
      var btns = ["ok", "no"].map(function (type) {
        var n = all.filter(function (r) { return r.type === type; }).length;
        var on = mineR && mineR.type === type;
        return '<button type="button" class="react-btn ' + type + (on ? " on" : "") + '" data-act="' + type + '" data-id="' + esc(m.id) + '"' +
          (can ? "" : " disabled") + ' aria-pressed="' + !!on + '" title="' +
          (!can ? why : on ? "คุณกด " + REACT[type].label + " เมื่อ " + fmtFull(mineR.at) : "กด " + REACT[type].label) + '">' +
          REACT[type].icon + (n ? " <b>" + n + "</b>" : "") + "</button>";
      }).join("");

      var summary = "👁 " + readers.length + (all.length ? " · ✓✗ " + all.length : "");

      return '<div class="chat-actions">' + btns +
        '<button type="button" class="tool-btn" data-act="reply" data-id="' + esc(m.id) + '" title="ตอบกลับ" aria-label="ตอบกลับ">↩' + (replies ? " " + replies : "") + "</button>" +
        '<button type="button" class="tool-btn" data-act="fwd" data-id="' + esc(m.id) + '" title="ส่งต่อ" aria-label="ส่งต่อ">↪</button>' +
        (isAdmin() ? '<button type="button" class="tool-btn danger" data-act="del" data-id="' + esc(m.id) + '" title="ลบข้อความ (เฉพาะ admin)" aria-label="ลบข้อความ">🗑</button>' : "") +
        '<button type="button" class="link-btn log-toggle" data-act="log" data-id="' + esc(m.id) + '" aria-expanded="' + !!openLog[m.id] + '" title="ผู้อ่านและผู้กด ✓/✗ พร้อมเวลา">' +
          summary + (openLog[m.id] ? " ▴" : " ▾") + "</button>" +
        "</div>" + reactListHtml(all);
    }

    // Always-visible record of who pressed ✓/✗ (their current answer) with date and time.
    function reactListHtml(all) {
      if (!all.length) return "";
      return '<ul class="react-list">' + all.slice().sort(function (a, b) { return a.at - b.at; }).map(function (r) {
        return '<li><span class="react-tag ' + r.type + '">' + REACT[r.type].icon + " " + REACT[r.type].label + "</span> " +
          esc(r.name) + ' <span class="badge">' + esc(r.role) + '</span> <time>' + fmtFull(r.at) + "</time></li>";
      }).join("") + "</ul>";
    }

    // Who pressed ✓/✗ (with history of changes) and who read it, each with date and time.
    function logHtml(m, readers) {
      if (!openLog[m.id]) return "";
      var log = m.reactionLog.length ? m.reactionLog.slice() : Object.keys(m.reactions).map(function (k) { return m.reactions[k]; });
      log.sort(function (a, b) { return a.at - b.at; });
      var current = {};
      Object.keys(m.reactions).forEach(function (k) { current[k] = m.reactions[k]; });

      var reactRows = log.map(function (r) {
        var cur = current[readerKey(r)];
        var superseded = cur && (cur.at !== r.at || cur.type !== r.type);
        return '<li class="' + (superseded ? "old" : "") + '"><span class="react-tag ' + r.type + '">' + REACT[r.type].icon + " " + REACT[r.type].label + "</span> " +
          esc(r.name) + ' <span class="badge">' + esc(r.role) + "</span> · <time>" + fmtFull(r.at) + "</time>" +
          (superseded ? ' <em>(เปลี่ยนภายหลัง)</em>' : "") + "</li>";
      }).join("");

      var readRows = readers.map(function (r) {
        return "<li>👁 " + esc(r.name) + ' <span class="badge">' + esc(r.role) + "</span> · <time>" + fmtFull(r.at) + "</time></li>";
      }).join("");

      return '<div class="chat-log">' +
        '<div><h4>การกด ✓ / ✗</h4>' + (reactRows ? "<ul>" + reactRows + "</ul>" : '<p class="muted">ยังไม่มีผู้กด</p>') + "</div>" +
        '<div><h4>ผู้อ่าน</h4>' + (readRows ? "<ul>" + readRows + "</ul>" : '<p class="muted">ยังไม่มีผู้อ่าน</p>') + "</div>" +
        "</div>";
    }

    function forwardHtml(m) {
      if (forwardOpen !== m.id) return "";
      var roles = ["ALL"].concat(ROLES).filter(function (r) { return m.to.indexOf(r) === -1; });
      return '<div class="chat-forward"><div class="fwd-roles"><span>ส่งต่อให้:</span>' + roles.map(function (r) {
        return '<label><input type="checkbox" value="' + esc(r) + '"> ' + esc(r === "ALL" ? "ทุกคน" : r) + "</label>";
      }).join("") + "</div>" +
        (people.length ? '<div class="chat-picker inline">' + peopleChecklist([], m.to) + "</div>" : "") +
        '<button type="button" class="chip active" data-act="fwd-send" data-id="' + esc(m.id) + '">ส่งต่อ</button></div>';
    }

    function quoteHtml(m) {
      if (!m.replyTo) return "";
      return '<button type="button" class="chat-quote" data-act="jump" data-id="' + esc(m.replyTo.id) + '" title="ไปที่ข้อความต้นฉบับ">' +
        "↩ <strong>" + esc(m.replyTo.name) + "</strong> " + esc(m.replyTo.text) + "</button>";
    }

    function render() {
      var list = messages.filter(function (m) {
        if (filter === "mine") return isForMe(m, me) && !byMe(m);
        if (filter === "sent") return byMe(m);
        return true;
      });

      var unread = me ? messages.filter(function (m) {
        return isForMe(m, me) && !byMe(m) && !m.reads[readerKey(me)];
      }).length : 0;
      var badge = root.querySelector("#chatUnread");
      badge.hidden = !unread;
      badge.textContent = "ยังไม่อ่าน " + unread;
      // Keep the count on the "แชท" menu tab in step as messages get read here.
      var navCount = document.querySelector('.nav-link[data-page="chat"] .nav-count');
      if (navCount) { navCount.textContent = unread > 99 ? "99+" : String(unread); navCount.hidden = !unread; }

      var prevTop = feed.scrollTop;
      if (observer) observer.disconnect();

      var items = [], prev = null;
      list.forEach(function (m) {
        var day = new Date(m.createdAt).toDateString();
        if (!prev || new Date(prev.createdAt).toDateString() !== day) {
          items.push({ id: "day-" + day, html: '<div class="day-sep" data-msg="day-' + esc(day) + '"><span>' + esc(dayLabel(m.createdAt)) + "</span></div>" });
          prev = null;
        }
        var cont = !!prev && samePerson(prev.author, m.author) && m.createdAt - prev.createdAt < GROUP_MS && !m.replyTo;
        items.push(messageItem(m, cont));
        prev = m;
      });
      patchFeed(items);

      if (firstRender || stickToBottom) feed.scrollTop = feed.scrollHeight;
      else feed.scrollTop = prevTop;
      firstRender = false;

      if (observer) feed.querySelectorAll("[data-msg]").forEach(function (el) { observer.observe(el); });
      hydrateImages(feed);
      focusPending();
    }

    // One message, laid out like a chat app: avatar and name for others, a bubble with the time, small tools below.
    function messageItem(m, cont) {
        var mine = byMe(m);
        var readers = readersOf(m);
        var images = m.images.length
          ? '<div class="chat-images n' + Math.min(m.images.length, 4) + '">' + m.images.map(function (src, i) {
              var drive = /^drive:/.test(src);
              return '<img src="' + esc(imageSrc(src)) + '"' + (drive ? ' data-img="' + esc(src.slice(6)) + '" class="loading"' : "") +
                ' alt="รูปแนบ ' + (i + 1) + '" loading="lazy">';
            }).join("") + "</div>"
          : "";
        var unreadMine = me && isForMe(m, me) && !mine && !m.reads[readerKey(me)];
        var html = '<article class="chat-msg' + (mine ? " mine" : "") + (cont ? " cont" : "") + (unreadMine ? " unread" : "") + '" data-msg="' + esc(m.id) + '">' +
          (mine ? "" : '<span class="msg-avatar" aria-hidden="true">' + esc(initialOf(m.author.name)) + "</span>") +
          '<div class="msg-main">' +
            '<header class="msg-name"><strong>' + esc(mine ? "คุณ" : m.author.name) + '</strong> <span class="badge">' + esc(m.author.role) + "</span></header>" +
            '<div class="bubble">' +
              quoteHtml(m) +
              (m.text ? '<div class="chat-text">' + linkify(m.text) + "</div>" : "") + images +
              '<time class="msg-time" title="' + fmtFull(m.createdAt) + '">' + clock(m.createdAt) + "</time>" +
            "</div>" +
            statusHtml(m, readers) +
            reactHtml(m, readers) +
            logHtml(m, readers) +
            forwardHtml(m) +
          "</div>" +
          "</article>";
        return { id: m.id, html: html };
    }

    function byMe(m) { return samePerson(m.author, me); }

    // Replace only the messages whose markup changed, so a click in progress on an
    // unchanged message (e.g. while a read receipt arrives) is not lost.
    var htmlCache = {};
    function patchFeed(items) {
      var empty = feed.querySelector(".chat-empty");
      if (!items.length) {
        feed.innerHTML = '<p class="chat-empty">ยังไม่มีข้อความ</p>';
        htmlCache = {};
        return;
      }
      if (empty) empty.remove();

      var existing = {};
      feed.querySelectorAll("[data-msg]").forEach(function (el) { existing[el.getAttribute("data-msg")] = el; });
      var tpl = document.createElement("template");
      var next = {};
      var prev = null;

      items.forEach(function (it) {
        var el = existing[it.id];
        if (!el || htmlCache[it.id] !== it.html) {
          tpl.innerHTML = it.html;
          var fresh = tpl.content.firstChild;
          if (el && el.classList.contains("flash")) fresh.classList.add("flash"); // keep a highlight in progress
          if (el) feed.replaceChild(fresh, el);
          el = fresh;
        }
        var want = prev ? prev.nextSibling : feed.firstChild;
        if (want !== el) feed.insertBefore(el, want);
        next[it.id] = it.html;
        delete existing[it.id];
        prev = el;
      });

      Object.keys(existing).forEach(function (id) { existing[id].remove(); });
      htmlCache = next;
    }

    renderTo();

    var unsubscribe = store.subscribe(function (list) {
      messages = list.map(normalize);
      render();
    }, function (err) {
      feed.innerHTML = '<p class="chat-empty">เชื่อมต่อฐานข้อมูลไม่สำเร็จ: ' + esc(err.message) + "</p>";
    });

    function onVisible() { if (!document.hidden) render(); }
    document.addEventListener("visibilitychange", onVisible);

    // "Open" on a notification pop-up: scroll to that message and highlight it once it is in the feed.
    function focusPending() {
      var id = window.__lpchFocusMessage;
      if (!id) return;
      var el = feed.querySelector('[data-msg="' + id + '"]');
      if (!el) return;
      window.__lpchFocusMessage = null;
      root.scrollIntoView({ behavior: "smooth", block: "start" });
      setTimeout(function () {
        // Look the message up again: a read receipt may have re-drawn it in the meantime.
        var cur = feed.querySelector('[data-msg="' + id + '"]');
        if (!cur) return;
        cur.scrollIntoView({ behavior: "smooth", block: "center" });
        cur.classList.remove("flash");
        void cur.offsetWidth;
        cur.classList.add("flash");
      }, 250);
    }
    function onFocusEvent() {
      if (filter !== "all") {
        filter = "all";
        root.querySelectorAll("[data-filter]").forEach(function (x) { x.classList.toggle("active", x.getAttribute("data-filter") === "all"); });
        render();
      }
      focusPending();
    }
    window.addEventListener("lpch:focus-message", onFocusEvent);

    return function unmount() {
      unsubscribe();
      if (observer) observer.disconnect();
      document.removeEventListener("visibilitychange", onVisible);
      window.removeEventListener("lpch:focus-message", onFocusEvent);
    };
  }

  window.Chat = { mount: mount };
})();

</script>
  <script>
/*
 * ข้อความส่วนตัว (Inbox) — ส่งข้อความตัวต่อตัวระหว่างสมาชิก แนบรูปได้ ตอบกลับ และกด ✓ ถูก / ✗ ผิด
 * เห็นเฉพาะผู้ส่งและผู้รับ (เซิร์ฟเวอร์ Code.gs ตรวจสิทธิ์ทุกคำขอ) แยกจากแชทประกาศหน้าหลัก
 *
 * Backend: Code.gs (dmList, dmThread, dmSend, dmRead, dmReact, dmDelete, dmImage) เมื่อเปิดผ่าน Apps Script
 * หรือใส่ auth.apiUrl, ไม่เช่นนั้นใช้โหมดทดลองที่เก็บในเบราว์เซอร์นี้
 */
(function () {
  "use strict";

  var S = window.SITE;
  var C = S.chat || {};
  var MAX_IMAGES = C.maxImages || 4;
  var POLL_MS = (C.pollSeconds || 15) * 1000;
  var BADGE_MS = 30000;
  var ROLE_GROUPS = (C.roles || ["RO", "MP", "RTT", "Nurse"]).concat(["Other"]);
  var REACT = { ok: { icon: "✓", label: "ถูก" }, no: { icon: "✗", label: "ผิด" } };
  var SEND_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.6 2-12.6 2z"/></svg>';
  var GROUP_MS = 5 * 60000;
  function clock(ms) { return new Date(ms).toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" }); }
  function dayLabel(ms) {
    var d = new Date(ms), t = new Date(), y = new Date(Date.now() - 864e5);
    if (d.toDateString() === t.toDateString()) return "วันนี้";
    if (d.toDateString() === y.toDateString()) return "เมื่อวาน";
    return d.toLocaleDateString("th-TH", { weekday: "short", day: "numeric", month: "short", year: "numeric" });
  }
  var BLANK = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function linkify(text) {
    return esc(text).replace(/https?:\/\/[^\s<]+/g, function (u) { return '<a href="' + u + '" target="_blank" rel="noopener">' + u + "</a>"; });
  }
  function snippet(text, n) {
    var t = String(text || "").replace(/\s+/g, " ").trim();
    return t.length > n ? t.slice(0, n) + "…" : t;
  }
  function fmtTime(ms) {
    var d = new Date(ms), now = new Date();
    var t = d.toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" });
    if (d.toDateString() === now.toDateString()) return t;
    return d.toLocaleDateString("th-TH", { day: "numeric", month: "short" }) + " " + t;
  }
  function fmtFull(ms) {
    var d = new Date(ms);
    return d.toLocaleDateString("th-TH", { day: "numeric", month: "short", year: "numeric" }) + " " +
      d.toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  }
  function initial(name) { return String(name || "?").trim().replace(/^[เ-ไ]/, "").charAt(0) || "?"; }
  function me() { var u = window.Auth && window.Auth.user; return u ? { username: u.username, name: u.fullName, role: u.role } : null; }
  function key(p) { return "u_" + String(p.username).replace(/\W/g, "_"); }
  // Only admins may delete messages (in conversations they are part of — they cannot see others').
  function isAdmin() { return !!(window.Auth && window.Auth.user && window.Auth.user.isAdmin); }

  function compress(file, maxSide, quality) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        var c = document.createElement("canvas");
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        var ctx = c.getContext("2d");
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL("image/jpeg", quality));
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("อ่านไฟล์รูปไม่ได้")); };
      img.src = url;
    });
  }

  /* ---------------- demo backend (mirrors the dm* actions in Code.gs) ---------------- */

  var LocalDM = (function () {
    var KEY = "lpch-ro-dm-v1";
    function all() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; } }
    function save(list) {
      try { localStorage.setItem(KEY, JSON.stringify(list)); }
      catch (e) { throw new Error("พื้นที่เก็บข้อมูลในเบราว์เซอร์เต็ม (โหมดทดลอง) — ลองลดจำนวนรูป"); }
    }
    function convo(a, b) { return [a, b].sort().join("|"); }
    function mine(list, u) { return list.filter(function (m) { return m.from.username === u || m.to.username === u; }); }
    function people() {
      return window.Auth.directory().then(function (list) {
        var out = {};
        list.forEach(function (u) { out[u.username] = { username: u.username, name: u.fullName, role: u.role, active: true }; });
        return out;
      });
    }
    function need() { var m = me(); if (!m) throw new Error("กรุณาเข้าสู่ระบบใหม่"); return m; }
    function find(list, id) { return list.filter(function (m) { return m.id === id; })[0]; }

    var actions = {
      dmList: function () {
        var u = need();
        return people().then(function (dir) {
          var convos = {}, unread = 0;
          mine(all(), u.username).forEach(function (m) {
            var p = m.from.username === u.username ? m.to : m.from;
            var c = convos[p.username] || (convos[p.username] = { partner: dir[p.username] || p, last: null, unread: 0 });
            if (!c.last || m.createdAt > c.last.createdAt) c.last = { text: snippet(m.text, 80) || (m.images.length ? "(รูปภาพ)" : ""), createdAt: m.createdAt, fromMe: m.from.username === u.username };
            if (m.to.username === u.username && !m.readAt) { c.unread++; unread++; }
          });
          var list = Object.keys(convos).map(function (k) { return convos[k]; });
          list.sort(function (a, b) { return b.last.createdAt - a.last.createdAt; });
          return { conversations: list, unread: unread };
        });
      },
      dmThread: function (r) {
        var u = need();
        return people().then(function (dir) {
          var k = convo(u.username, r["with"]);
          var partner = dir[r["with"]] || mine(all(), u.username).map(function (m) { return m.from.username === r["with"] ? m.from : m.to.username === r["with"] ? m.to : null; }).filter(Boolean)[0];
          if (!partner) throw new Error("ไม่พบสมาชิก");
          var msgs = all().filter(function (m) { return convo(m.from.username, m.to.username) === k; });
          msgs.sort(function (a, b) { return a.createdAt - b.createdAt; });
          return { partner: partner, messages: msgs };
        });
      },
      dmSend: function (r) {
        var u = need();
        return people().then(function (dir) {
          var to = dir[r.to];
          if (!to) throw new Error("ไม่พบผู้รับ หรือบัญชีผู้รับยังไม่เปิดใช้งาน");
          if (to.username === u.username) throw new Error("ส่งข้อความถึงตัวเองไม่ได้");
          var list = all();
          var msg = { id: "dm" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), from: u,
            to: { username: to.username, name: to.name, role: to.role }, text: String(r.text || "").trim(),
            images: r.images || [], createdAt: Date.now(), readAt: null, reactions: {}, reactionLog: [] };
          var orig = r.replyTo && find(list, r.replyTo);
          if (orig) msg.replyTo = { id: orig.id, name: orig.from.name, text: snippet(orig.text, 120) || "(รูปภาพ)" };
          list.push(msg);
          save(list);
          return { message: msg };
        });
      },
      dmRead: function (r) {
        var u = need(), list = all(), n = 0;
        list.forEach(function (m) {
          if (m.from.username === r["with"] && m.to.username === u.username && !m.readAt) { m.readAt = Date.now(); n++; }
        });
        if (n) save(list);
        return { count: n };
      },
      dmReact: function (r) {
        var u = need(), list = all(), m = find(list, r.id);
        if (!m || (m.from.username !== u.username && m.to.username !== u.username)) throw new Error("ไม่พบข้อความ");
        if (m.to.username !== u.username) throw new Error("กด ✓/✗ ได้เฉพาะผู้รับข้อความนี้");
        var cur = m.reactions[key(u)];
        if (!cur || cur.type !== r.type) {
          var rec = { username: u.username, name: u.name, role: u.role, at: Date.now(), type: r.type };
          m.reactions[key(u)] = rec;
          m.reactionLog.push(rec);
          save(list);
        }
        return { message: m };
      },
      dmDelete: function (r) {
        var u = need(), list = all(), m = find(list, r.id);
        if (!isAdmin()) throw new Error("ลบข้อความได้เฉพาะผู้ดูแลระบบ (admin)");
        if (m && m.from.username !== u.username && m.to.username !== u.username) throw new Error("ไม่พบข้อความ");
        save(list.filter(function (x) { return x.id !== r.id; }));
        return { deleted: r.id };
      },
    };

    return function (action, data) {
      return new Promise(function (resolve) { setTimeout(resolve, 60); })
        .then(function () { return actions[action](data || {}); });
    };
  })();

  function api(action, data) {
    return window.Auth.remote ? window.Auth.call(action, data) : LocalDM(action, data);
  }

  /* Private images ("dm:<fileId>") are fetched per message and cached for the session. */
  var imageCache = {};
  function hydrate(rootEl) {
    rootEl.querySelectorAll("img[data-dm-img]").forEach(function (img) {
      var fileId = img.getAttribute("data-dm-img"), id = img.getAttribute("data-msg-id");
      if (!imageCache[fileId]) imageCache[fileId] = api("dmImage", { id: id, fileId: fileId }).then(function (r) { return r.dataUrl; });
      imageCache[fileId].then(function (src) { img.src = src; img.classList.remove("loading"); }, function () {
        delete imageCache[fileId];
        img.alt = "โหลดรูปไม่สำเร็จ";
        img.classList.remove("loading");
      });
    });
  }

  // Username of the conversation open on screen (so pop-ups skip messages already in view).
  var activePartner = null;

  /* ---------------- unread badge in the header ---------------- */

  var badgeTimer = null;
  function refreshBadge() {
    var el = document.getElementById("dmBadge");
    if (!el || !me()) return Promise.resolve();
    return api("dmList").then(function (r) {
      el.textContent = r.unread > 99 ? "99+" : String(r.unread);
      el.hidden = !r.unread;
    }, function () { /* try again on the next tick */ });
  }
  function startBadge() {
    stopBadge();
    refreshBadge();
    badgeTimer = setInterval(function () { if (!document.hidden) refreshBadge(); }, BADGE_MS);
  }
  function stopBadge() {
    if (badgeTimer) clearInterval(badgeTimer);
    badgeTimer = null;
    var el = document.getElementById("dmBadge");
    if (el) el.hidden = true;
  }

  /* ---------------- page ---------------- */

  function mount(root, startWith) {
    var self = me();
    var convos = [], people = [], current = null, partner = null, thread = [];
    var pending = [], replyTo = null, pickerOpen = false, openLog = {}, lastThreadJson = "", lastListJson = "";
    var alive = true, timer = null;

    root.innerHTML =
      '<div class="dm card" id="dmApp">' +
        '<aside class="dm-side">' +
          '<div class="dm-side-head"><h3>✉️ กล่องข้อความ</h3>' +
            '<button type="button" class="chip active" id="dmNew">+ ข้อความใหม่</button></div>' +
          '<div class="dm-picker" id="dmPicker" hidden>' +
            '<input type="search" id="dmSearch" placeholder="ค้นหาชื่อสมาชิก…" aria-label="ค้นหาชื่อสมาชิก">' +
            '<div id="dmPeople"></div>' +
          "</div>" +
          '<div class="dm-convos" id="dmConvos" role="list"><p class="dm-empty">กำลังโหลด…</p></div>' +
        "</aside>" +
        '<section class="dm-main" id="dmMain">' +
          '<div class="dm-placeholder" id="dmPlaceholder"><p>🔒 ข้อความส่วนตัว — เห็นเฉพาะคุณกับผู้รับ</p>' +
            '<p class="muted">เลือกบทสนทนาทางซ้าย หรือกด “+ ข้อความใหม่” เพื่อเริ่มส่งถึงสมาชิก</p></div>' +
          '<div class="dm-conv" id="dmConv" hidden>' +
            '<header class="dm-conv-head"><button type="button" class="dm-back" id="dmBack" aria-label="กลับไปรายการ">‹</button>' +
              '<span class="dm-avatar" id="dmAvatar"></span><div><strong id="dmName"></strong> <span class="badge" id="dmRole"></span>' +
              '<div class="dm-private">🔒 ส่วนตัว · เห็นเฉพาะ 2 คน</div></div></header>' +
            '<div class="chat-feed dm-feed" id="dmFeed" aria-live="polite"></div>' +
            '<form class="chat-compose" id="dmForm" autocomplete="off">' +
              '<div class="chat-replying" id="dmReplying" hidden></div>' +
              '<div class="chat-previews" id="dmPreviews"></div>' +
              '<div class="chat-input-row">' +
                '<label class="chat-attach" title="แนบรูป" aria-label="แนบรูป">📎<input id="dmFile" type="file" accept="image/*" multiple hidden></label>' +
                '<textarea id="dmText" rows="1" placeholder="พิมพ์ข้อความ…"></textarea>' +
                '<button class="chat-send" type="submit" id="dmSend" aria-label="ส่ง" title="ส่ง (Ctrl+Enter)">' + SEND_ICON + "</button>" +
              "</div>" +
              '<p class="chat-error" id="dmError" hidden></p>' +
            "</form>" +
          "</div>" +
        "</section>" +
      "</div>" +
      '<div class="lightbox" id="dmLightbox" hidden><img alt=""></div>';

    var $ = function (id) { return root.querySelector("#" + id); };
    var app = $("dmApp"), feed = $("dmFeed"), errEl = $("dmError"), textIn = $("dmText"), lightbox = $("dmLightbox");

    function showError(msg) { errEl.textContent = msg || ""; errEl.hidden = !msg; }

    /* ---- conversation list ---- */

    function renderList() {
      var json = JSON.stringify(convos) + current;
      if (json === lastListJson) return;
      lastListJson = json;
      var el = $("dmConvos");
      if (!convos.length) {
        el.innerHTML = '<p class="dm-empty">ยังไม่มีข้อความ<br>กด “+ ข้อความใหม่” เพื่อเริ่มสนทนา</p>';
        return;
      }
      el.innerHTML = convos.map(function (c) {
        var p = c.partner;
        return '<button type="button" role="listitem" class="dm-convo' + (p.username === current ? " active" : "") + (c.unread ? " has-unread" : "") +
          '" data-open="' + esc(p.username) + '"><span class="dm-avatar">' + esc(initial(p.name)) + "</span>" +
          '<span class="dm-convo-body"><span class="dm-convo-top"><strong>' + esc(p.name) + '</strong> <span class="badge">' + esc(p.role) + "</span>" +
          '<time>' + fmtTime(c.last.createdAt) + "</time></span>" +
          '<span class="dm-snippet">' + (c.last.fromMe ? "คุณ: " : "") + esc(c.last.text) + "</span></span>" +
          (c.unread ? '<span class="dm-unread">' + c.unread + "</span>" : "") + "</button>";
      }).join("");
    }

    function loadList() {
      return api("dmList").then(function (r) {
        if (!alive) return;
        convos = r.conversations;

        if (badge) { badge.textContent = String(r.unread); badge.hidden = !r.unread; }
