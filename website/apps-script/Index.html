<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>LPCH RO Workspace</title>
  <meta name="description" content="พื้นที่ทำงานกลางของหน่วยรังสีรักษา โรงพยาบาลมะเร็งลำปาง: แนวทางการรักษา เอกสาร แบบฟอร์ม และเครื่องมือคำนวณ">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
/* Design tokens follow the TRS-398 Output Calibration app (Lampang Cancer Hospital). */
:root {
  --bg: #eef2f6;
  --surface: #fbfcfe;
  --ink: #142033;
  --muted: #5a6679;
  --line: #d3dbe6;
  --accent: #1d5bd6;          /* Cherenkov blue */
  --accent-soft: #e2ebfc;
  --ok: #1b7a45;   --ok-soft: #e1f3e8;
  --warn: #9a6100; --warn-soft: #fbefd6;
  --bad: #bf3328;  --bad-soft: #fbe3e0;
  --sec-blue: #e8f1fd;  --sec-blue-line: #c4d8f5;
  --sec-purple: #f0ebfc; --sec-purple-line: #d6cbf2;
  --font-display: "Chakra Petch", "IBM Plex Sans Thai", system-ui, sans-serif;
  --font-body: "IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 6px;
  --secnav-h: 54px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c121d; --surface: #131b29; --ink: #e2e8f1; --muted: #93a0b4; --line: #26324a;
    --accent: #77a3ff; --accent-soft: #1a2742;
    --ok: #52c78a; --ok-soft: #12301f; --warn: #e3a93f; --warn-soft: #33270f; --bad: #ff7366; --bad-soft: #3a1714;
    --sec-blue: #13213a;  --sec-blue-line: #253a5e;
    --sec-purple: #1f1938; --sec-purple-line: #3a2f63;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c121d; --surface: #131b29; --ink: #e2e8f1; --muted: #93a0b4; --line: #26324a;
  --accent: #77a3ff; --accent-soft: #1a2742;
  --ok: #52c78a; --ok-soft: #12301f; --warn: #e3a93f; --warn-soft: #33270f; --bad: #ff7366; --bad-soft: #3a1714;
  --sec-blue: #13213a;  --sec-blue-line: #253a5e;
  --sec-purple: #1f1938; --sec-purple-line: #3a2f63;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.55 var(--font-body);
}
a { color: var(--accent); }
.muted { color: var(--muted); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 32px; }

/* ---------- Header (brand block) ---------- */
header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; margin-bottom: 18px; }
.brand { display: flex; align-items: center; gap: 16px; min-width: 0; }
.brand-text { min-width: 0; }
/* Hospital emblem on a white tile, so its greens stay true on the dark theme as well */
.brand-logo { flex: none; width: 72px; height: 72px; padding: 6px; border-radius: 12px; background: #ffffff; border: 1px solid var(--line); object-fit: contain; }
header.top h1 { font: 600 clamp(1.6rem, 3.4vw, 2.2rem)/1.15 var(--font-display); margin: 0; letter-spacing: .01em; text-wrap: balance; }
header.top h1 a { color: var(--ink); text-decoration: none; }
header.top h1 span { color: var(--accent); }
header.top .org { margin: 2px 0 6px; font: 600 .9rem/1.3 var(--font-display); letter-spacing: .02em; color: var(--muted); }
header.top p { margin: 4px 0 0; color: var(--muted); max-width: 62ch; font-size: .86rem; line-height: 1.5; }
@media (max-width: 600px) { .brand { align-items: flex-start; gap: 12px; } .brand-logo { width: 56px; height: 56px; padding: 4px; } }

.top-side { display: grid; gap: 10px; justify-items: end; }
.top-controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; align-items: center; }
@media (max-width: 600px) { .top-side { justify-items: start; } .top-controls { justify-content: flex-start; } }

.user-badge { font-size: .8rem; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.user-badge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.user-badge strong { color: var(--ink); font-weight: 600; word-break: break-all; }

/* Segmented control (theme switch) */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--bg); }
.seg label { position: relative; padding: 6px 12px; cursor: pointer; color: var(--muted); font-size: .86rem; }
.seg label + label { border-left: 1px solid var(--line); }
.seg input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.seg label:has(input:checked) { background: var(--accent); color: var(--surface); }
.seg label:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
.theme-seg label { display: inline-flex; align-items: center; justify-content: center; padding: 7px 10px; }
.theme-seg svg, .menu-toggle svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* User menu */
.user-menu { position: relative; }
.user-btn {
  display: inline-flex; align-items: center; gap: 8px; max-width: 220px;
  padding: 4px 12px 4px 4px; border: 1px solid var(--line); border-radius: 4px;
  background: var(--surface); color: var(--ink); font: 500 .86rem var(--font-body); cursor: pointer;
}
.user-btn:hover { border-color: var(--accent); color: var(--accent); }
.avatar { flex: none; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 3px; background: var(--accent); color: var(--surface); font-weight: 600; }
.user-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.user-drop {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; min-width: 230px; padding: 6px 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: 0 8px 24px rgba(16, 32, 51, .14);
}
.user-info { display: grid; padding: 6px 14px 10px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.user-info span { font-size: .8rem; color: var(--muted); }
.user-drop a, .user-drop button {
  display: block; width: 100%; padding: 8px 14px; text-align: left; background: none; border: 0;
  font: .9rem var(--font-body); color: var(--ink); text-decoration: none; cursor: pointer;
}
.user-drop a:hover, .user-drop button:hover { background: var(--accent-soft); color: var(--accent); }
@media (max-width: 600px) { .user-menu .user-drop { left: 0; right: auto; } }

/* ---------- Section nav (pill bar) ---------- */
.secnav {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 6px;
  margin: 0 -16px 22px; padding: 9px 16px; background: var(--bg); border-bottom: 1px solid var(--line);
}
.nav { display: flex; flex-wrap: wrap; gap: 6px; }
.nav-item { position: relative; display: flex; }
.nav-link, .sub-toggle {
  text-decoration: none; color: var(--muted); font: 600 .86rem var(--font-body);
  padding: 6px 12px; border: 1px solid var(--line); background: var(--surface); white-space: nowrap;
}
.nav > .nav-link { border-radius: 999px; }
.has-sub .nav-link { border-radius: 999px 0 0 999px; border-right: 0; padding-right: 6px; }
.sub-toggle { display: flex; align-items: center; border-radius: 0 999px 999px 0; padding: 6px 10px 6px 4px; cursor: pointer; }
.sub-toggle svg { transition: transform .15s; }
.has-sub.open .sub-toggle svg { transform: rotate(180deg); }
.nav-link:hover, .sub-toggle:hover { color: var(--accent); border-color: var(--accent); }
.has-sub .nav-link:hover + .sub-toggle { border-color: var(--accent); }
.nav-link.active, .nav-link.active + .sub-toggle { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.nav-link:focus-visible, .sub-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.submenu {
  display: none; position: absolute; top: calc(100% + 6px); left: 0; z-index: 25; min-width: 220px; padding: 6px 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: 0 8px 24px rgba(16, 32, 51, .14);
}
.has-sub.open .submenu { display: block; }
@media (hover: hover) and (min-width: 901px) {
  .has-sub:hover .submenu, .has-sub:focus-within .submenu { display: block; }
  /* bridge the gap so the pointer can travel from the pill to the menu */
  .has-sub:hover::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 8px; }
}
.submenu a { display: block; padding: 8px 14px; color: var(--ink); text-decoration: none; font-size: .9rem; }
.submenu a:hover { background: var(--accent-soft); color: var(--accent); }
.submenu a.active { color: var(--accent); font-weight: 600; }

.menu-toggle {
  display: none; align-items: center; gap: 8px;
  padding: 6px 14px; border: 1px solid var(--accent); border-radius: 999px;
  background: var(--accent); color: var(--surface); font: 600 .86rem var(--font-body); cursor: pointer;
}

@media (max-width: 900px) {
  .menu-toggle { display: inline-flex; }
  .nav {
    display: none; position: absolute; top: 100%; left: 0; right: 0;
    flex-direction: column; flex-wrap: nowrap; gap: 0; padding: 8px 16px 12px;
    background: var(--bg); border-bottom: 1px solid var(--line);
    max-height: calc(100vh - var(--secnav-h)); overflow-y: auto;
  }
  .nav.open { display: flex; }
  .nav > .nav-link, .has-sub .nav-link { border: 0; border-radius: 4px; background: none; padding: 10px 12px; flex: 1; }
  .nav-item { flex-wrap: wrap; }
  .sub-toggle { border: 0; background: none; border-radius: 4px; padding: 0 14px; }
  .nav-link.active, .nav-link.active + .sub-toggle { background: var(--accent-soft); color: var(--accent); }
  .submenu { position: static; flex-basis: 100%; box-shadow: none; border: 0; border-left: 2px solid var(--line); border-radius: 0; margin: 0 0 6px 14px; padding: 0; background: none; }
  .submenu a { padding: 8px 14px; }
}

/* ---------- Content ---------- */
main { outline: none; min-height: 50vh; }
.section { margin-bottom: 32px; }
.section h2, .page-head h2 {
  margin: 0 0 4px; font: 600 1.56rem/1.2 var(--font-display);
  text-transform: uppercase; letter-spacing: .03em; color: var(--accent);
}
.section .lead, .page-head .lead { margin: 0 0 16px; color: var(--muted); font-size: .9rem; }

.breadcrumb { font-size: .84rem; color: var(--muted); margin-bottom: 6px; }
.breadcrumb a { text-decoration: none; }
.breadcrumb span { margin: 0 4px; }
.page-head { margin-bottom: 20px; }
.page-head h2 { font-size: clamp(1.6rem, 3vw, 2rem); }

.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.grid.wide { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; min-width: 0; }
.card.flush { padding: 0; overflow: hidden; }
.card h3 { margin: 0 0 10px; font: 600 1.05rem/1.3 var(--font-display); letter-spacing: .02em; }
/* Alternate section tints, as the worksheet sections of the TRS-398 app */
.grid > .card:nth-child(odd):not(.tile):not(.contact-card) { background: var(--sec-blue); border-color: var(--sec-blue-line); }
.grid > .card:nth-child(even):not(.tile):not(.contact-card) { background: var(--sec-purple); border-color: var(--sec-purple-line); }

a.tile { display: flex; gap: 14px; align-items: flex-start; text-decoration: none; color: inherit; transition: border-color .15s, transform .15s; }
a.tile:hover { border-color: var(--accent); transform: translateY(-1px); }
.tile-icon { font-size: 1.6rem; line-height: 1; }
.tile strong { display: block; color: var(--accent); font: 600 1.05rem var(--font-display); letter-spacing: .02em; }
.tile span { color: var(--muted); font-size: .86rem; }

.intro { max-width: 860px; margin-bottom: 24px; }
.intro h2 { text-transform: none; }
.intro-text { margin: 0; color: var(--ink); }

.link-list { list-style: none; margin: 0; padding: 0; }
.link-list li { padding: 6px 0; border-top: 1px dashed var(--line); display: flex; justify-content: space-between; gap: 8px; }
.link-list li:first-child { border-top: 0; }
.link-list a { text-decoration: none; font-weight: 500; }
.link-list a:hover { text-decoration: underline; }

.badge {
  display: inline-block; align-self: center; white-space: nowrap;
  padding: 1px 8px; border-radius: 999px; font: 600 .72rem/1.5 var(--font-body);
  background: var(--accent-soft); color: var(--accent);
}

.placeholder { color: var(--muted); }
.placeholder::after { content: " (รอใส่ลิงก์)"; font-size: .78rem; }

.note {
  margin-top: 14px; padding: 10px 14px; border-radius: var(--radius); font-size: .88rem;
  background: var(--warn-soft); color: var(--ink); border-left: 3px solid var(--warn);
}

/* ---------- Buttons, chips, inputs ---------- */
button { font-family: var(--font-body); }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 12px; border: 1px solid var(--line); border-radius: 999px;
  background: var(--surface); color: var(--muted); font: 600 .84rem var(--font-body); cursor: pointer;
}
.chip:hover { color: var(--accent); border-color: var(--accent); }
.chip.active { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.chip.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.search, .form-row input, .form-row select {
  font: inherit; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 4px; padding: 7px 9px;
}
.search { flex: 1 1 220px; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ---------- Tables ---------- */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; background: var(--surface); }
th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: var(--accent-soft); color: var(--accent); font: 600 .84rem var(--font-body); text-transform: none; }
tbody tr:hover { background: color-mix(in srgb, var(--accent) 4%, transparent); }
.specs th { width: 35%; }
.specs tr:last-child th, .specs tr:last-child td { border-bottom: 0; }

/* ---------- Calculators ---------- */
.form-row { display: grid; gap: 4px; margin-bottom: 12px; }
.form-row label { font-size: .84rem; color: var(--muted); font-weight: 500; }
.form-row input[type="number"] { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.results { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 8px; }
.result { text-align: center; padding: 10px 8px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); }
.result small { display: block; color: var(--muted); font-size: .78rem; }
.result b { font: 500 1.35rem var(--font-mono); color: var(--accent); font-variant-numeric: tabular-nums; }
.formula { font: .8rem var(--font-mono); color: var(--muted); margin: 12px 0 0; }

.calendar-frame { width: 100%; height: 600px; border: 0; margin-top: 16px; }
.contact-card p { margin: 4px 0; color: var(--muted); }

/* ---------- Footer ---------- */
.footer {
  display: flex; align-items: center; gap: 16px; margin-top: 40px; padding-top: 20px;
  border-top: 1px solid var(--line); font-size: .86rem;
}
.footer img { flex: none; width: 64px; height: 64px; padding: 4px; border-radius: 10px; background: #fff; border: 1px solid var(--line); }
.footer p { margin: 2px 0; }

/* ---------- Login / register gate ---------- */
body.locked .site { display: none; }
body:not(.locked) .gate { display: none; }
.gate { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); }
.gate-card {
  width: 100%; max-width: 440px; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 28px 24px; display: grid; gap: 10px; justify-items: center; text-align: center;
}
.gate-logo { width: 72px; height: 72px; padding: 6px; border-radius: 14px; background: #fff; border: 1px solid var(--line); object-fit: contain; }
.gate-card h2 { font: 700 1.5rem/1.2 var(--font-display); margin: 6px 0 0; color: var(--ink); }
.gate-card h2 span { color: var(--accent); }
.gate-org { font: 600 .9rem var(--font-display); letter-spacing: .02em; color: var(--muted); }
.gate-msg { margin: 6px 0 2px; color: var(--ink); }
.gate-note { font-size: .78rem; color: var(--muted); margin: 4px 0 0; }
.gate-spin { display: inline-block; width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--accent-soft); border-top-color: var(--accent); animation: gate-spin 1s linear infinite; }
@keyframes gate-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .gate-spin { animation-duration: 3s; } }

.auth-tabs { display: grid; grid-template-columns: 1fr 1fr; width: 100%; margin: 8px 0 4px; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--bg); }
.auth-tabs button { padding: 8px; background: none; border: 0; font: 600 .9rem var(--font-body); color: var(--muted); cursor: pointer; }
.auth-tabs button + button { border-left: 1px solid var(--line); }
.auth-tabs button.active { background: var(--accent); color: var(--surface); }

.auth-form { display: grid; gap: 12px; width: 100%; text-align: left; }
.auth-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.auth-field { display: grid; gap: 4px; font-size: .84rem; color: var(--muted); font-weight: 500; }
.auth-field input, .auth-field select {
  font: 400 .95rem var(--font-body); color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; width: 100%; min-width: 0;
}
.auth-submit, .login-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; margin-top: 4px;
  padding: 9px 14px; border: 1px solid var(--accent); border-radius: 4px;
  background: var(--accent); color: var(--surface); font: 600 .92rem var(--font-body); cursor: pointer;
}
.auth-submit:hover { filter: brightness(1.08); }
.auth-submit:disabled { opacity: .6; cursor: wait; }
.auth-error { margin: 0; color: var(--bad); font-size: .88rem; }
.auth-help { font-size: .76rem; font-weight: 400; color: var(--muted); }
.auth-step { margin: 0; font: 600 .86rem var(--font-display); letter-spacing: .02em; color: var(--accent); text-align: center; }
.auth-field input.code-input { font: 500 1.4rem var(--font-mono); letter-spacing: .5em; text-align: center; }
.profile-form { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); }
.auth-msg { width: 100%; padding: 9px 12px; border-radius: 4px; font-size: .88rem; text-align: left; }
.auth-msg.ok { background: var(--ok-soft); color: var(--ok); }
.auth-hint { margin: 2px 0 0; text-align: center; font-size: .86rem; color: var(--muted); }
.auth-hint .link-btn { font-size: inherit; }
.auth-demo { margin: 6px 0 0; font-size: .76rem; color: var(--warn); background: var(--warn-soft); border-radius: 4px; padding: 4px 8px; }
@media (max-width: 480px) { .auth-row { grid-template-columns: 1fr; } }

/* ---------- Admin: members ---------- */
table.users td { vertical-align: middle; }
table.users .small { font-size: .8rem; color: var(--muted); }
table.users select { padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; font: inherit; background: var(--bg); color: var(--ink); }
table.users .actions { display: flex; flex-wrap: wrap; gap: 4px; }
table.users .chip { padding: 2px 10px; font-size: .8rem; white-space: nowrap; }
.status { display: inline-flex; align-items: center; gap: 6px; font: 600 .78rem var(--font-body); padding: 2px 10px; border-radius: 999px; white-space: nowrap; }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.status.ok { background: var(--ok-soft); color: var(--ok); }
.status.warn { background: var(--warn-soft); color: var(--warn); }
.status.off { background: var(--bad-soft); color: var(--bad); }

/* ---------- Announcement chat ---------- */
.link-btn { background: none; border: 0; padding: 0; font: .8rem var(--font-body); color: var(--accent); cursor: pointer; }
.link-btn:hover { text-decoration: underline; }
.link-btn.danger { color: var(--bad); }

.chat { padding: 0; overflow: hidden; display: flex; flex-direction: column; }
.chat-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.chat-head h3 { margin: 0; display: flex; align-items: center; gap: 8px; font: 600 1.25rem var(--font-display); text-transform: uppercase; letter-spacing: .03em; color: var(--accent); }
.chat-filters { display: flex; gap: 6px; flex-wrap: wrap; }
.chat-filters .chip, .chat-to .chip { padding: 3px 12px; font-size: .82rem; }
.chat-unread { font: 600 .74rem var(--font-body); padding: 2px 10px; border-radius: 999px; background: var(--bad-soft); color: var(--bad); text-transform: none; letter-spacing: 0; }
.chat-mode { padding: 6px 18px; font-size: .8rem; color: var(--warn); background: var(--warn-soft); border-bottom: 1px solid var(--line); }

.chat-feed { height: 480px; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; background: var(--bg); }
.chat-empty { margin: auto; color: var(--muted); }
.chat-msg {
  max-width: min(560px, 88%); align-self: flex-start; padding: 10px 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 2px var(--radius) var(--radius) var(--radius);
}
.chat-msg.mine { align-self: flex-end; border-radius: var(--radius) 2px var(--radius) var(--radius); background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 30%, var(--line)); }
.chat-msg.unread { border-left: 3px solid var(--bad); }
.chat-msg header { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: .9rem; }
.chat-msg header time { margin-left: auto; font: .76rem var(--font-mono); color: var(--muted); }
.chat-text { margin-top: 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
.chat-images { display: grid; gap: 4px; margin-top: 8px; border-radius: 4px; overflow: hidden; }
.chat-images.n2, .chat-images.n3, .chat-images.n4 { grid-template-columns: 1fr 1fr; }
.chat-images img { width: 100%; height: 100%; max-height: 320px; object-fit: cover; display: block; cursor: zoom-in; background: var(--line); }
.chat-images.n1 img { object-fit: contain; }
.chat-images img.loading { min-height: 120px; animation: img-pulse 1.2s ease-in-out infinite alternate; }
@keyframes img-pulse { from { opacity: .45; } to { opacity: .8; } }
.chat-images.n2 img, .chat-images.n3 img, .chat-images.n4 img { aspect-ratio: 1; }

.chat-status { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin-top: 8px; padding-top: 6px; border-top: 1px dashed var(--line); font-size: .78rem; }
.chat-status .link-btn { margin-left: auto; font-size: .78rem; }
.to-label { color: var(--muted); }
.to-chip { padding: 0 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.to-chip.done { border-color: var(--ok); color: var(--ok); background: var(--ok-soft); }
.chat-fwd-line { font-size: .78rem; color: var(--muted); margin-top: 4px; }
.chat-readers { list-style: none; margin: 6px 0 0; padding: 6px 10px; font-size: .8rem; background: var(--bg); border-radius: 4px; }
.chat-readers li { padding: 2px 0; }
.chat-actions { display: flex; gap: 12px; margin-top: 4px; }
.chat-forward { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-top: 8px; padding: 8px 10px; font-size: .84rem; background: var(--bg); border-radius: 4px; }
.chat-forward .chip { padding: 2px 12px; font-size: .82rem; }

.chat-compose { padding: 12px 18px 16px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
.chat-compose.drag { outline: 2px dashed var(--accent); outline-offset: -6px; }
.chat-me, .chat-to { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: .86rem; color: var(--muted); }
.chat-me strong { color: var(--ink); }
.chat-to > span { margin-right: 4px; }
.chat-input-row { display: flex; align-items: flex-end; gap: 8px; }
.chat-input-row textarea {
  flex: 1; resize: vertical; min-height: 44px;
  font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px;
}
.chat-attach { display: grid; place-items: center; width: 42px; height: 42px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); font-size: 1.2rem; cursor: pointer; flex: none; }
.chat-attach:hover { border-color: var(--accent); }
.chat-send { height: 42px; padding: 0 20px; border: 1px solid var(--accent); border-radius: 4px; background: var(--accent); color: var(--surface); font: 600 .92rem var(--font-body); cursor: pointer; flex: none; }
.chat-send:disabled { opacity: .6; cursor: wait; }
.chat-previews { display: flex; flex-wrap: wrap; gap: 8px; }
.chat-previews:empty { display: none; }
.chat-thumb { position: relative; }
.chat-thumb img { width: 72px; height: 72px; object-fit: cover; border-radius: 4px; display: block; border: 1px solid var(--line); }
.chat-thumb button { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: var(--ink); color: var(--surface); cursor: pointer; line-height: 1; }
.chat-error { margin: 0; color: var(--bad); font-size: .86rem; }

.chat-actions { flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-top: 8px; }
.chat-actions .log-toggle { margin-left: auto; color: var(--muted); }
.react-btn {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px;
  border: 1px solid var(--line); border-radius: 999px; background: var(--surface);
  font: 600 .8rem var(--font-body); color: var(--muted); cursor: pointer;
}
.react-btn b { font-family: var(--font-mono); font-weight: 500; }
.react-btn.ok:hover, .react-btn.ok.on { border-color: var(--ok); color: var(--ok); }
.react-btn.no:hover, .react-btn.no.on { border-color: var(--bad); color: var(--bad); }
.react-btn.ok.on { background: var(--ok-soft); }
.react-btn:disabled { opacity: .45; cursor: not-allowed; }
.react-btn:disabled:hover { border-color: var(--line); color: var(--muted); }
.react-list { list-style: none; margin: 6px 0 0; padding: 6px 10px; display: grid; gap: 2px; font-size: .8rem; background: var(--bg); border-radius: 4px; }
.react-list li { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
.react-list time { font: .76rem var(--font-mono); color: var(--muted); }
.react-btn.no.on { background: var(--bad-soft); }

.chat-quote {
  display: block; width: 100%; margin: 6px 0 2px; padding: 4px 10px; text-align: left;
  border: 0; border-left: 3px solid var(--accent); border-radius: 0 4px 4px 0;
  background: color-mix(in srgb, var(--accent) 8%, transparent);
  font: .82rem var(--font-body); color: var(--muted); cursor: pointer;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.chat-quote strong { color: var(--ink); }
.chat-quote:hover { background: color-mix(in srgb, var(--accent) 14%, transparent); }
@keyframes chat-flash { 0%, 40% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }
.chat-msg.flash { animation: chat-flash 1.6s ease-out; }

.chat-log { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; padding: 8px 10px; background: var(--bg); border-radius: 4px; font-size: .8rem; }
.chat-log h4 { margin: 0 0 4px; font: 600 .8rem var(--font-body); color: var(--muted); }
.chat-log ul { list-style: none; margin: 0; padding: 0; }
.chat-log li { padding: 2px 0; }
.chat-log li.old { opacity: .55; }
.chat-log time { font-family: var(--font-mono); font-size: .76rem; color: var(--muted); }
.chat-log p { margin: 0; }
.react-tag { font-weight: 600; }
.react-tag.ok { color: var(--ok); }
.react-tag.no { color: var(--bad); }
@media (max-width: 600px) { .chat-log { grid-template-columns: 1fr; } }

.to-chip.person { border-style: dashed; }
.to-chip.person.done { border-style: solid; }

.person-chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 4px 2px 10px;
  border-radius: 999px; background: var(--accent-soft); color: var(--accent); font: 600 .8rem var(--font-body);
}
.person-chip button { width: 18px; height: 18px; border: 0; border-radius: 50%; background: none; color: inherit; cursor: pointer; line-height: 1; }
.person-chip button:hover { background: color-mix(in srgb, var(--accent) 20%, transparent); }
.chip:disabled { opacity: .5; cursor: not-allowed; }

.chat-picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; padding: 10px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; }
.chat-picker.inline { width: 100%; background: var(--surface); }
.chat-picker .picker-hint { grid-column: 1 / -1; margin: 0; font-size: .8rem; color: var(--muted); }
.chat-picker fieldset { margin: 0; padding: 6px 10px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); min-width: 0; }
.chat-picker legend { padding: 0 4px; font: 600 .8rem var(--font-display); letter-spacing: .03em; color: var(--accent); }
.chat-picker label { display: flex; align-items: center; gap: 6px; padding: 2px 0; font-size: .86rem; color: var(--ink); cursor: pointer; }
.chat-picker input { accent-color: var(--accent); }
.chat-forward { flex-direction: column; align-items: stretch; }
.fwd-roles { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.chat-forward > .chip { align-self: flex-start; }

.chat-replying { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 4px 4px 0; font-size: .84rem; }
.reply-bar { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.reply-bar strong { color: var(--ink); }

/* ---------- Private messages (inbox) ---------- */
.inbox-btn {
  position: relative; display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px;
  border: 1px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--ink);
  font: 500 .86rem var(--font-body); text-decoration: none;
}
.inbox-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.inbox-btn:hover, .inbox-btn.active { border-color: var(--accent); color: var(--accent); }
.dm-badge {
  min-width: 20px; height: 20px; padding: 0 6px; display: inline-grid; place-items: center;
  border-radius: 999px; background: var(--bad); color: #fff; font: 600 .72rem var(--font-mono);
}
@media (max-width: 520px) { .inbox-btn span:not(.dm-badge) { display: none; } }

.dm { display: grid; grid-template-columns: 300px minmax(0, 1fr); padding: 0; overflow: hidden; height: min(720px, calc(100vh - 140px)); min-height: 480px; }
.dm-side { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); background: var(--surface); }
.dm-side-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 14px 12px; border-bottom: 1px solid var(--line); }
.dm-side-head h3 { margin: 0; font: 600 1.1rem var(--font-display); color: var(--accent); }
.dm-side-head .chip { padding: 4px 12px; font-size: .82rem; }
.dm-picker { display: grid; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--bg); max-height: 50%; overflow-y: auto; }
.dm-picker input { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 7px 10px; }
.dm-group h4 { margin: 4px 0 2px; font: 600 .78rem var(--font-display); letter-spacing: .04em; color: var(--accent); }
.dm-person { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border: 0; border-radius: 4px; background: none; font: .9rem var(--font-body); color: var(--ink); text-align: left; cursor: pointer; }
.dm-person:hover { background: var(--accent-soft); color: var(--accent); }
.dm-convos { flex: 1; overflow-y: auto; }
.dm-empty { margin: 0; padding: 24px 16px; text-align: center; color: var(--muted); font-size: .88rem; }
.dm-convo {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 14px; border: 0; border-bottom: 1px solid var(--line);
  background: none; color: var(--ink); font: inherit; text-align: left; cursor: pointer;
}
.dm-convo:hover { background: color-mix(in srgb, var(--accent) 5%, transparent); }
.dm-convo.active { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.dm-convo-body { flex: 1; min-width: 0; display: grid; gap: 2px; }
.dm-convo-top { display: flex; align-items: center; gap: 6px; min-width: 0; }
.dm-convo-top strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dm-convo-top time { margin-left: auto; flex: none; font: .74rem var(--font-mono); color: var(--muted); }
.dm-snippet { font-size: .82rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dm-convo.has-unread .dm-snippet { color: var(--ink); font-weight: 600; }
.dm-unread { flex: none; min-width: 20px; height: 20px; padding: 0 6px; display: grid; place-items: center; border-radius: 999px; background: var(--accent); color: var(--surface); font: 600 .72rem var(--font-mono); }
.dm-avatar { flex: none; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.dm-avatar.sm { width: 26px; height: 26px; font-size: .8rem; }

.dm-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.dm-placeholder { margin: auto; padding: 24px; text-align: center; }
.dm-placeholder p { margin: 4px 0; }
.dm-conv { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.dm-conv[hidden] { display: none; }
.dm-conv-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
.dm-private { font-size: .76rem; color: var(--muted); }
.dm-back { display: none; border: 0; background: none; font: 600 1.6rem/1 var(--font-body); color: var(--accent); cursor: pointer; padding: 0 6px 0 0; }
.dm-feed { flex: 1; height: auto; min-height: 0; }
.dm-status { color: var(--muted); }
.dm-status.read { color: var(--ok); }
.dm-log { list-style: none; margin: 8px 0 0; padding: 6px 10px; font-size: .8rem; background: var(--bg); border-radius: 4px; }
.dm-log li { padding: 2px 0; }
.dm-log time { font-family: var(--font-mono); font-size: .76rem; color: var(--muted); }

@media (max-width: 760px) {
  .dm { grid-template-columns: 1fr; height: calc(100vh - 120px); }
  .dm-side { border-right: 0; }
  .dm.show-conv .dm-side { display: none; }
  .dm:not(.show-conv) .dm-main { display: none; }
  .dm-back { display: block; }
}

/* ---------- Chat app layout (announcements + private messages) ----------
   Compact bubbles like LINE / Messenger: avatar + name for others, own messages on the right,
   time inside the bubble, day separators, small tools under each bubble, pill input at the bottom. */
.chat { min-height: 420px; }
.chat-head { padding: 10px 14px; gap: 6px 10px; }
.chat-head h3 { font-size: 1.05rem; text-transform: none; letter-spacing: .01em; }
.chat-filters { gap: 4px; }
.chat-filters .chip { padding: 3px 10px; font-size: .76rem; }
.chip.icon { padding: 3px 9px; }
.chat-unread { font-size: .68rem; }
.chat-mode { padding: 4px 14px; font-size: .72rem; }

.chat-feed, .dm-feed { flex: 1; height: auto; min-height: 0; padding: 8px 12px 14px; gap: 0; }
.day-sep { display: flex; justify-content: center; margin: 12px 0 4px; }
.day-sep span { font: 600 .68rem var(--font-body); color: var(--muted); background: var(--surface); border: 1px solid var(--line); padding: 1px 10px; border-radius: 999px; }

.chat-msg {
  display: flex; align-items: flex-start; gap: 8px; align-self: flex-start;
  max-width: min(78%, 520px); margin-top: 10px; padding: 0; background: none; border: 0; border-radius: 0;
}
.chat-msg.cont { margin-top: 3px; }
.chat-msg.mine { align-self: flex-end; flex-direction: row-reverse; background: none; border: 0; }
.chat-msg.unread { border-left: 0; }
.chat-msg.unread .bubble { box-shadow: inset 3px 0 0 var(--bad); }
.chat-msg.flash .bubble { animation: chat-flash 1.6s ease-out; }
.chat-msg.flash { animation: none; }
.msg-avatar {
  flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent); font: 600 .8rem var(--font-body);
}
.chat-msg.cont .msg-avatar { visibility: hidden; height: 0; }
.msg-main { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; }
.chat-msg.mine .msg-main { align-items: flex-end; }
.chat-msg .msg-name { display: flex; align-items: center; gap: 4px; margin: 0 0 2px 4px; font-size: .72rem; color: var(--muted); }
.msg-name strong { font-weight: 600; color: var(--ink); }
.msg-name .badge { font-size: .6rem; padding: 0 6px; }
.chat-msg.mine .msg-name, .chat-msg.cont .msg-name { display: none; }
.bubble {
  max-width: 100%; padding: 6px 10px 4px; font-size: .88rem; line-height: 1.45;
  background: var(--surface); border: 1px solid var(--line); border-radius: 4px 14px 14px 14px;
}
.chat-msg.cont .bubble { border-radius: 14px; }
.chat-msg.mine .bubble {
  background: color-mix(in srgb, var(--accent) 15%, var(--surface));
  border-color: color-mix(in srgb, var(--accent) 28%, var(--line)); border-radius: 14px 4px 14px 14px;
}
.chat-msg.mine.cont .bubble { border-radius: 14px; }
.bubble .chat-text { margin: 0; }
.msg-time { display: block; margin-top: 1px; text-align: right; font: .62rem var(--font-mono); color: var(--muted); }
.bubble .chat-images { margin: 4px 0 2px; max-width: 260px; border-radius: 10px; }
.bubble .chat-images img { max-height: 240px; }
.bubble .chat-quote { margin: 2px 0 4px; padding: 3px 8px; font-size: .74rem; }

.chat-msg .chat-status { margin: 2px 4px 0; padding: 0; border: 0; gap: 3px; font-size: .64rem; }
.chat-msg .to-chip { padding: 0 6px; font-size: .62rem; }
.chat-msg .chat-fwd-line { margin: 1px 4px 0; font-size: .64rem; }
.chat-msg .chat-actions { margin: 2px 2px 0; gap: 4px; align-items: center; }
.chat-msg.mine .chat-actions { justify-content: flex-end; }
.chat-msg .react-btn { padding: 0 8px; font-size: .7rem; line-height: 1.6; }
.tool-btn {
  padding: 0 5px; border: 0; border-radius: 4px; background: none; cursor: pointer;
  font: .8rem/1.6 var(--font-body); color: var(--muted);
}
.tool-btn:hover { background: var(--accent-soft); color: var(--accent); }
.tool-btn.danger:hover { background: var(--bad-soft); color: var(--bad); }
.chat-msg .chat-actions .log-toggle { margin-left: 2px; font-size: .66rem; }
.chat-msg .react-list, .chat-msg .chat-log, .chat-msg .dm-log { max-width: 100%; margin-top: 3px; padding: 4px 8px; font-size: .68rem; }
.chat-msg .react-list time, .chat-msg .chat-log time, .chat-msg .dm-log time { font-size: .64rem; }
.chat-msg .chat-log { grid-template-columns: 1fr; }
.chat-msg .chat-forward { font-size: .74rem; }
.chat-msg .dm-status { font-size: .66rem; }

.chat-compose { gap: 6px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px)); background: var(--surface); }
.chat-to { flex-wrap: nowrap; gap: 5px; overflow-x: auto; font-size: .74rem; scrollbar-width: none; }
.chat-to::-webkit-scrollbar { display: none; }
.chat-to .chip { flex: none; padding: 2px 10px; font-size: .74rem; }
.chat-to .person-chip { flex: none; font-size: .72rem; }
.chat-input-row { gap: 6px; }
.chat-input-row textarea {
  min-height: 38px; max-height: 140px; padding: 8px 14px; resize: none; overflow-y: auto;
  border-radius: 20px; font-size: .9rem; line-height: 1.4;
}
.chat-attach { width: 38px; height: 38px; border-radius: 50%; font-size: 1.05rem; }
.chat-send { display: grid; place-items: center; width: 38px; height: 38px; padding: 0; border-radius: 50%; }
.chat-send svg { width: 18px; height: 18px; fill: currentColor; }
.chat-replying { padding: 4px 8px; font-size: .76rem; }
.chat-thumb img { width: 56px; height: 56px; }
.chat-picker { max-height: 38vh; overflow-y: auto; }
.chat-error { font-size: .78rem; }

/* Chat pages fill the screen: no footer, and a compact header on phones. */
body.chat-page .footer { display: none; }
body.chat-page .wrap { padding-block-end: 8px; }
body.chat-page main .section { margin-bottom: 0; }
body.chat-page .secnav { margin-bottom: 10px; }
@media (max-width: 600px) {
  .chat-msg { max-width: 88%; }
  .chat-head { padding: 8px 10px; }
  .chat-feed, .dm-feed { padding: 6px 8px 10px; }
  body.chat-page .wrap { padding-block-start: 8px; }
  body.chat-page header.top { flex-wrap: nowrap; align-items: center; gap: 8px; margin-bottom: 6px; }
  body.chat-page header.top p, body.chat-page header.top .org, body.chat-page .user-badge, body.chat-page .theme-seg { display: none; }
  body.chat-page .brand { align-items: center; gap: 8px; }
  body.chat-page .brand-logo { width: 34px; height: 34px; padding: 2px; border-radius: 8px; }
  body.chat-page header.top h1 { font-size: 1.1rem; }
  body.chat-page .top-side { gap: 0; justify-items: end; }
  body.chat-page .top-controls { flex-wrap: nowrap; justify-content: flex-end; }
  body.chat-page .secnav { margin-bottom: 6px; padding-block: 5px; }
  body.chat-page .chat, body.chat-page .dm { margin-inline: -8px; }
}

/* ---------- Notification pop-ups ---------- */
.toasts {
  position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 60;
  display: flex; flex-direction: column; gap: 10px; width: min(380px, calc(100vw - 32px)); pointer-events: none;
}
.toast {
  position: relative; display: flex; gap: 12px; padding: 14px 36px 12px 14px; pointer-events: auto;
  background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-left: 4px solid var(--accent);
  border-radius: var(--radius); box-shadow: 0 10px 30px rgba(16, 32, 51, .22);
  animation: toast-in .25s ease-out;
}
.toast-dm { border-left-color: var(--ok); }
.toast-info { border-left-color: var(--warn); }
.toast.leaving { opacity: 0; transform: translateX(16px); transition: opacity .2s, transform .2s; }
@keyframes toast-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } .toast.leaving { transition: none; } }
.toast-icon { font-size: 1.4rem; line-height: 1.2; }
.toast-body { min-width: 0; display: grid; gap: 2px; }
.toast-body strong { font: 600 .95rem/1.35 var(--font-body); }
.toast-body p { margin: 0; font-size: .88rem; color: var(--ink); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.toast-body small { font-size: .76rem; color: var(--muted); }

.toast-actions button { padding: 5px 14px; border-radius: 4px; font: 600 .84rem var(--font-body); cursor: pointer; }
.toast-open { border: 1px solid var(--accent); background: var(--accent); color: var(--surface); }
.toast-close { border: 1px solid var(--line); background: var(--surface); color: var(--muted); }
.toast-x { position: absolute; top: 6px; right: 8px; border: 0; background: none; font-size: 1.2rem; line-height: 1; color: var(--muted); cursor: pointer; }

    window.LPCHTheme = {
      get: read,
      set: function (mode) { try { localStorage.setItem(KEY, mode); } catch (e) { /* storage unavailable */ } apply(mode); }

    apply(read());
  })();

 *  - ถ้าเว้นว่าง จะใช้ "โหมดทดลอง" ที่จำลอง backend ไว้ใน localStorage ของเบราว์เซอร์นี้

(function () {

  var S = window.SITE;
  var CFG = S.auth || {};

    ["Nurse", "พยาบาล (Nurse)"], ["Other", "อื่นๆ"]];
  // Inside a Google Apps Script web app the page talks to Code.gs through google.script.run.
  var gas = !!(window.google && google.script && google.script.run);
  var remote = gas || !!CFG.apiUrl;

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function store(key, val) {
    try { if (val == null) localStorage.removeItem(key); else localStorage.setItem(key, val); } catch (e) { /* ignore */ }
  }
  function load(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }

  /* ---------------- Backend: Google Apps Script ---------------- */

  function gasCall(req) {
    return new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function (e) { reject(new Error((e && e.message) || "เชื่อมต่อเซิร์ฟเวอร์ไม่ได้")); })
        .api(req);
    });
  }

  function remoteCall(req) {
    // text/plain keeps this a "simple" CORS request, which Apps Script web apps accept.
    return fetch(CFG.apiUrl, { method: "POST", body: JSON.stringify(req), redirect: "follow" })
      .then(function (r) {
        if (!r.ok) throw new Error("เซิร์ฟเวอร์ตอบกลับผิดพลาด (" + r.status + ")");
        return r.json();
      }, function () {
        throw new Error("เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ — ตรวจสอบอินเทอร์เน็ต หรือการ Deploy ของ Apps Script");

  /* ---------------- Backend: local demo (mirrors Code.gs) ---------------- */

  var LocalBackend = (function () {
    var KEY = "lpch-ro-demo-auth";

    // Demo only — the real backend hashes with salted, iterated SHA-256 on the server.
    function hash(pw, salt) {
      var s = salt + ":" + pw, h1 = 0x811c9dc5, h2 = 5381;
      for (var r = 0; r < 50; r++) {
        for (var i = 0; i < s.length; i++) {

          h2 = ((h2 << 5) + h2 + s.charCodeAt(i)) >>> 0;

    }

    }

        if (!ROLES.some(function (x) { return x[0] === r.role; })) fail("กรุณาเลือกตำแหน่ง");
        if (find(d, username)) fail("ชื่อผู้ใช้นี้ถูกใช้แล้ว");

        delete d.resets[u.username];
        d.sessions = d.sessions.filter(function (x) { return x.username !== u.username; });
        return { username: u.username, message: "ตั้งรหัสผ่านใหม่เรียบร้อย กรุณาเข้าสู่ระบบด้วยรหัสผ่านใหม่" };
      },
      directory: function (d, r) {
        requireUser(d, r.token);
        return { users: d.users.filter(function (u) { return u.status === "active"; }).map(function (u) {
          return { username: u.username, fullName: u.fullName, role: u.role };
        }) };
      },
      listUsers: function (d, r) { requireAdmin(d, r.token); return { users: d.users.map(pub) }; },
      updateUser: function (d, r) {
        var admin = requireAdmin(d, r.token);
        var u = find(d, r.username);
        if (!u) fail("ไม่พบผู้ใช้");
        if (u === admin && (r.isAdmin === false || (r.status && r.status !== "active"))) fail("ไม่สามารถยกเลิกสิทธิ์หรือระงับบัญชีของตัวเองได้");
        if (r.status) {
          u.status = r.status;
          if (r.status !== "active") d.sessions = d.sessions.filter(function (s) { return s.username !== u.username; });
        }
        if (typeof r.isAdmin === "boolean") u.isAdmin = r.isAdmin;
        if (r.role) u.role = r.role;
        return { user: pub(u) };
      },
      deleteUser: function (d, r) {
        var admin = requireAdmin(d, r.token);
        var u = find(d, r.username);
        if (!u) fail("ไม่พบผู้ใช้");
        if (u === admin) fail("ไม่สามารถลบบัญชีของตัวเองได้");
        d.users = d.users.filter(function (x) { return x !== u; });
        d.sessions = d.sessions.filter(function (s) { return s.username !== u.username; });
        return {};
      },
    };

    return function (req) {
      return new Promise(function (resolve) {
        setTimeout(function () {
          var d = db();
          try {
            var out = actions[req.action](d, req);
            save(d);
            out.ok = true;
            resolve(out);
          } catch (e) {
            resolve({ ok: false, error: e.message });
          }
        }, 150);
      });
    };
  })();

  /* ---------------- API ---------------- */

  var token = load(TOKEN_KEY);
  var user = null;
  var listeners = [];

  function call(action, data) {
    var req = Object.assign({ action: action, token: token }, data || {});
    return (gas ? gasCall(req) : remote ? remoteCall(req) : LocalBackend(req)).then(function (res) {
      if (!res.ok) {
        if (res.error === "session_expired") { setSession(null, null); throw new Error("กรุณาเข้าสู่ระบบใหม่"); }
        throw new Error(res.error || "เกิดข้อผิดพลาด");
      }
      return res;
    });
  }

  function setSession(t, u) {
    token = t;
    user = u;
    store(TOKEN_KEY, t);
    listeners.forEach(function (cb) { cb(user); });
  }

  /* ---------------- Login / register screen ---------------- */

  function roleOptions(selected) {
    return '<option value="">— เลือกตำแหน่ง —</option>' + ROLES.map(function (r) {
      return '<option value="' + r[0] + '"' + (r[0] === selected ? " selected" : "") + ">" + esc(r[1]) + "</option>";
    }).join("");
  }

  var EMAIL_OK = /^[^\s@,;]+@[^\s@,;]+\.[^\s@,;]+$/;
  var SUBMIT_LABEL = { login: "เข้าสู่ระบบ", register: "สมัครสมาชิก", forgot: "ส่งรหัสไปที่อีเมล", reset: "ตั้งรหัสผ่านใหม่" };

  // tab: login | register | forgot (ask for a code) | reset (enter code + new password)
  function renderAuthScreen(el, tab, flash, state) {
    state = state || {};
    var forms = { login: loginForm, register: registerForm, forgot: forgotForm, reset: resetForm };
    el.innerHTML =
      '<div class="gate-card">' +
        '<img class="gate-logo" src="' + esc(S.brand.logo) + '" width="72" height="72" alt="">' +
        '<h2 id="gateTitle">' + esc(S.brand.name) + " <span>" + esc(S.brand.accent) + "</span></h2>" +
        '<div class="gate-org">' + esc(S.brand.org) + "</div>" +
        '<div class="auth-tabs" role="tablist">' +
          '<button type="button" role="tab" data-tab="login" class="' + (tab === "login" ? "active" : "") + '">เข้าสู่ระบบ</button>' +
          '<button type="button" role="tab" data-tab="register" class="' + (tab === "register" ? "active" : "") + '">สมัครสมาชิก</button>' +
        "</div>" +
        (flash ? '<div class="auth-msg ' + flash.type + '">' + esc(flash.text) + "</div>" : "") +
        forms[tab](state) +
        '<p class="gate-note">ระบบจะจำการเข้าสู่ระบบไว้ 7 วัน</p>' +
        (remote ? "" : '<p class="auth-demo">ℹ️ โหมดทดลอง — ข้อมูลสมาชิกเก็บในเบราว์เซอร์นี้เท่านั้น ตั้งค่า <code>auth.apiUrl</code> ใน data.js เพื่อเชื่อม Google Sheets</p>') +
      "</div>";

    el.querySelectorAll("[data-tab]").forEach(function (b) {
      b.addEventListener("click", function () {
        var f = el.querySelector("form");
        var typed = f && f.elements.username ? f.elements.username.value : f && f.elements.login ? f.elements.login.value : "";
        renderAuthScreen(el, b.getAttribute("data-tab"), null, { login: typed });
      });
    });

    var form = el.querySelector("form");
    var err = el.querySelector(".auth-error");
    var btn = form.querySelector("button[type=submit]");
    function showErr(msg) { err.textContent = msg; err.hidden = false; }

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var f = form.elements;
      err.hidden = true;

      if (tab === "register") {
        if (!EMAIL_OK.test(f.email.value.trim())) return showErr("กรุณากรอกอีเมลให้ถูกต้อง (ใช้รับรหัสเมื่อลืมรหัสผ่าน)");
        if (f.password.value !== f.confirm.value) return showErr("รหัสผ่านทั้งสองช่องไม่ตรงกัน");
      }
      if (tab === "reset" && f.newPassword.value !== f.confirm.value) return showErr("รหัสผ่านใหม่ทั้งสองช่องไม่ตรงกัน");
      btn.disabled = true;
      btn.textContent = "กำลังดำเนินการ…";

      var p = tab === "login" ? call("login", { username: f.username.value, password: f.password.value })
        : tab === "register" ? call("register", {
            username: f.username.value, password: f.password.value, fullName: f.fullName.value,
            role: f.role.value, phone: f.phone.value, email: f.email.value,
          })
        : tab === "forgot" ? call("forgotPassword", { login: f.login.value })
        : call("resetPassword", { login: f.login.value, code: f.code.value, newPassword: f.newPassword.value });

      p.then(function (res) {
        if (res.token) { setSession(res.token, res.user); return; }
        if (tab === "forgot") {
          var text = res.message + (res.demoCode ? " — โหมดทดลองส่งอีเมลไม่ได้ รหัสของคุณคือ " + res.demoCode : "");
          renderAuthScreen(el, "reset", { type: "ok", text: text }, { login: f.login.value.trim() });
        } else if (tab === "reset") {
          renderAuthScreen(el, "login", { type: "ok", text: res.message }, { login: res.username });
        } else {
          renderAuthScreen(el, "login", { type: "ok", text: res.message });
        }
      }).catch(function (ex) {
        showErr(ex.message);
        btn.disabled = false;
        btn.textContent = SUBMIT_LABEL[tab];
      });
    });

    var first = form.querySelector("input:not([value]), input[value='']") || form.querySelector("input");
    if (first) first.focus();
  }

  function field(label, input, hint) {

  function forgotForm(state) {

  /* ---------------- Admin: member management ---------------- */

  var STATUS = { active: ["ใช้งาน", "ok"], pending: ["รออนุมัติ", "warn"], disabled: ["ระงับ", "off"] };

  function fmtDate(ms) {
    return ms ? new Date(ms).toLocaleString("th-TH", { day: "numeric", month: "short", year: "2-digit", hour: "2-digit", minute: "2-digit" }) : "—";
  }

  function mountAdmin(el) {
    var users = [];
    var filter = "pending";

    function load() {
      el.innerHTML = '<p class="muted">กำลังโหลด…</p>';
      call("listUsers").then(function (res) { users = res.users; render(); })
        .catch(function (e) { el.innerHTML = '<p class="auth-error">' + esc(e.message) + "</p>"; });
    }

    function render(msg) {
      var counts = { all: users.length, pending: 0, active: 0, disabled: 0 };
      users.forEach(function (u) { counts[u.status] = (counts[u.status] || 0) + 1; });
      if (filter === "pending" && !counts.pending) filter = "all";
      var list = users.filter(function (u) { return filter === "all" || u.status === filter; });

      el.innerHTML =
        '<div class="toolbar">' + [["pending", "รออนุมัติ"], ["active", "ใช้งาน"], ["disabled", "ระงับ"], ["all", "ทั้งหมด"]].map(function (f) {
          return '<button class="chip' + (filter === f[0] ? " active" : "") + '" data-filter="' + f[0] + '">' + f[1] + " (" + (counts[f[0]] || 0) + ")</button>";
        }).join("") + "</div>" +
        (msg ? '<div class="note">' + esc(msg) + "</div>" : "") +
        '<div class="table-wrap card flush"><table class="users"><thead><tr>' +
        "<th>ชื่อ-นามสกุล</th><th>Username</th><th>ตำแหน่ง</th><th>ติดต่อ</th><th>สถานะ</th><th>สมัครเมื่อ / เข้าล่าสุด</th><th></th></tr></thead><tbody>" +
        (list.length ? list.map(function (u) {
          var st = STATUS[u.status] || [u.status, ""];
          var self = user && u.username === user.username;
          var acts = [];
          if (u.status !== "active") acts.push('<button class="chip active" data-act="approve">' + (u.status === "pending" ? "อนุมัติ" : "เปิดใช้งาน") + "</button>");
          if (u.status === "active" && !self) acts.push('<button class="chip" data-act="disable">ระงับ</button>');
          if (!self) acts.push('<button class="chip" data-act="admin">' + (u.isAdmin ? "ยกเลิก admin" : "ตั้งเป็น admin") + "</button>");
          if (!self) acts.push('<button class="chip danger" data-act="delete">ลบ</button>');
          return '<tr data-user="' + esc(u.username) + '">' +
            "<td><strong>" + esc(u.fullName) + "</strong>" + (u.isAdmin ? ' <span class="badge">admin</span>' : "") + "</td>" +
            "<td>" + esc(u.username) + "</td>" +
            '<td><select data-act="role" aria-label="ตำแหน่ง">' + ROLES.map(function (r) {
              return '<option value="' + r[0] + '"' + (r[0] === u.role ? " selected" : "") + ">" + r[0] + "</option>";
            }).join("") + "</select></td>" +
            '<td class="small">' + esc(u.phone || "") + (u.email ? "<br>" + esc(u.email) : "") + "</td>" +
            '<td><span class="status ' + st[1] + '">' + st[0] + "</span></td>" +
            '<td class="small">' + fmtDate(u.createdAt) + "<br>" + fmtDate(u.lastLogin) + "</td>" +
            '<td><div class="actions">' + acts.join("") + "</div></td></tr>";
        }).join("") : '<tr><td colspan="7" class="muted">ไม่มีรายการ</td></tr>') +
        "</tbody></table></div>";
    }

    function update(username, data, okMsg) {
      call("updateUser", Object.assign({ username: username }, data)).then(function (res) {
        users = users.map(function (u) { return u.username === username ? res.user : u; });
        render(okMsg);
      }).catch(function (e) { render("⚠️ " + e.message); });
    }

    el.addEventListener("click", function (e) {
      var f = e.target.getAttribute("data-filter");
      if (f) { filter = f; render(); return; }
      var act = e.target.getAttribute("data-act");
      var tr = e.target.closest("tr[data-user]");
      if (!act || !tr || act === "role") return;
      var username = tr.getAttribute("data-user");
      var u = users.filter(function (x) { return x.username === username; })[0];
      if (act === "approve") update(username, { status: "active" }, "เปิดใช้งานบัญชี " + u.fullName + " แล้ว");
      if (act === "disable") update(username, { status: "disabled" }, "ระงับบัญชี " + u.fullName + " แล้ว");
      if (act === "admin") update(username, { isAdmin: !u.isAdmin }, "อัปเดตสิทธิ์ของ " + u.fullName + " แล้ว");
      if (act === "delete" && confirm("ลบบัญชี " + u.fullName + " ?")) {
        call("deleteUser", { username: username }).then(function () {
          users = users.filter(function (x) { return x.username !== username; });
          render("ลบบัญชี " + u.fullName + " แล้ว");
        }).catch(function (e2) { render("⚠️ " + e2.message); });
      }
    });

    el.addEventListener("change", function (e) {
      if (e.target.getAttribute("data-act") !== "role") return;
      var username = e.target.closest("tr").getAttribute("data-user");
      update(username, { role: e.target.value }, "เปลี่ยนตำแหน่งเรียบร้อย");
    });

    load();
  }

  /* ---------------- Account: profile + change password ---------------- */

  function mountAccount(el) {
    var roleName = (ROLES.filter(function (r) { return r[0] === user.role; })[0] || [0, user.role])[1];
    el.innerHTML =
      (user.email ? "" : '<div class="note">⚠️ บัญชีของคุณยังไม่มีอีเมล กรุณาเพิ่มอีเมลเพื่อใช้รับรหัสเมื่อลืมรหัสผ่าน</div>') +
      '<div class="grid wide">' +
        '<div class="card"><h3>👤 ข้อมูลสมาชิก</h3><table class="specs"><tbody>' +
          "<tr><th>ชื่อ-นามสกุล</th><td>" + esc(user.fullName) + "</td></tr>" +
          "<tr><th>Username</th><td>" + esc(user.username) + "</td></tr>" +
          "<tr><th>ตำแหน่ง</th><td>" + esc(roleName) + (user.isAdmin ? ' <span class="badge">admin</span>' : "") + "</td></tr>" +
        "</tbody></table>" +
        '<form class="auth-form profile-form" novalidate>' +
          field("อีเมล *", '<input name="email" type="email" autocomplete="email" value="' + esc(user.email || "") + '" required>',
            "ใช้รับรหัสยืนยันเมื่อลืมรหัสผ่าน") +
          field("เบอร์โทร / เบอร์ภายใน", '<input name="phone" type="tel" autocomplete="tel" value="' + esc(user.phone || "") + '">') +
          '<p class="auth-error" role="alert" hidden></p><p class="auth-msg ok" hidden></p>' +
          '<button type="submit" class="auth-submit">บันทึกข้อมูล</button>' +
        "</form></div>" +
        '<div class="card"><h3>🔑 เปลี่ยนรหัสผ่าน</h3><form class="auth-form password-form" novalidate>' +
          field("รหัสผ่านเดิม", '<input name="oldPassword" type="password" autocomplete="current-password" required>') +
          field("รหัสผ่านใหม่", '<input name="newPassword" type="password" autocomplete="new-password" placeholder="อย่างน้อย 8 ตัว" required>') +
          field("ยืนยันรหัสผ่านใหม่", '<input name="confirm" type="password" autocomplete="new-password" required>') +
          '<p class="auth-error" role="alert" hidden></p><p class="auth-msg ok" hidden></p>' +
          '<button type="submit" class="auth-submit">บันทึก</button>' +
        "</form></div>" +
      "</div>";

    function wire(form, run) {
      var err = form.querySelector(".auth-error");
      var ok = form.querySelector(".auth-msg");
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        err.hidden = ok.hidden = true;
        var bad = run.check(form.elements);
        if (bad) { err.textContent = bad; err.hidden = false; return; }
        run.send(form.elements).then(function (res) {
          ok.textContent = res.message;
          ok.hidden = false;
          if (run.done) run.done(res);
        }).catch(function (ex) { err.textContent = ex.message; err.hidden = false; });
      });
    }

    wire(el.querySelector(".profile-form"), {
      check: function (f) { return EMAIL_OK.test(f.email.value.trim()) ? "" : "รูปแบบอีเมลไม่ถูกต้อง"; },
      send: function (f) { return call("updateProfile", { email: f.email.value, phone: f.phone.value }); },
      done: function (res) {
        user = res.user; // keep the header badge in step without re-rendering this page
        var warn = el.querySelector(".note");
        if (warn && user.email) warn.remove();
      },
    });

    wire(el.querySelector(".password-form"), {
      check: function (f) { return f.newPassword.value !== f.confirm.value ? "รหัสผ่านใหม่ทั้งสองช่องไม่ตรงกัน" : ""; },
      send: function (f) { return call("changePassword", { oldPassword: f.oldPassword.value, newPassword: f.newPassword.value }); },
      done: function () { el.querySelector(".password-form").reset(); },
    });
  }

  /* ---------------- Public API ---------------- */
