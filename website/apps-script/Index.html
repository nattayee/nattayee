    }

    /* ---- new-message picker (members grouped by profession) ---- */

    function renderPeople() {
      var q = $("dmSearch").value.trim().toLowerCase();
      var html = ROLE_GROUPS.map(function (r) {
        var inRole = people.filter(function (p) { return p.role === r && (!q || (p.name + " " + p.username).toLowerCase().indexOf(q) !== -1); });
        if (!inRole.length) return "";
        return '<div class="dm-group"><h4>' + esc(r === "Other" ? "อื่นๆ" : r) + "</h4>" + inRole.map(function (p) {
          return '<button type="button" class="dm-person" data-open="' + esc(p.username) + '"><span class="dm-avatar sm">' + esc(initial(p.name)) + "</span>" + esc(p.name) + "</button>";
        }).join("") + "</div>";
      }).join("");
      $("dmPeople").innerHTML = html || '<p class="dm-empty">' + (people.length ? "ไม่พบชื่อที่ค้นหา" : "ยังไม่มีสมาชิกคนอื่นในระบบ") + "</p>";
    }

    $("dmNew").addEventListener("click", function () {
      pickerOpen = !pickerOpen;
      $("dmPicker").hidden = !pickerOpen;
      $("dmNew").textContent = pickerOpen ? "✕ ปิด" : "+ ข้อความใหม่";
      if (pickerOpen) { renderPeople(); $("dmSearch").focus(); }
    });
    $("dmSearch").addEventListener("input", renderPeople);

    window.Auth.directory().then(function (list) {
      people = list.filter(function (u) { return u.username !== self.username; })
        .map(function (u) { return { username: u.username, name: u.fullName, role: u.role }; });
      if (pickerOpen) renderPeople();
    }).catch(function () { /* picker stays empty */ });

    root.addEventListener("click", function (e) {
      var b = e.target.closest("[data-open]");
      if (b) {
        pickerOpen = false;
        $("dmPicker").hidden = true;
        $("dmNew").textContent = "+ ข้อความใหม่";
        open(b.getAttribute("data-open"));
      }
    });

    /* ---- one conversation ---- */

    function open(username) {
      current = username;
      activePartner = username;
      partner = null;
      thread = [];
      lastThreadJson = "";
      replyTo = null;
      pending = [];
      openLog = {};
      renderReply();
      renderPreviews();
      showError("");
      feed.innerHTML = '<p class="chat-empty">กำลังโหลด…</p>';
      $("dmPlaceholder").hidden = true;
      $("dmConv").hidden = false;
      app.classList.add("show-conv");
      renderList();
      loadThread(true).then(function () { textIn.focus(); });
    }

    function loadThread(first) {
      if (!current) return Promise.resolve();
      var who = current;
      return api("dmThread", { "with": who }).then(function (r) {
        if (!alive || who !== current) return;
        partner = r.partner;
        $("dmAvatar").textContent = initial(partner.name);
        $("dmName").textContent = partner.name;
        $("dmRole").textContent = partner.role;
        thread = r.messages;
        renderThread(first);
        var unread = thread.some(function (m) { return m.to.username === self.username && !m.readAt; });
        if (unread && !document.hidden) {
          api("dmRead", { "with": who }).then(loadList, function () { /* next poll retries */ });
        }
      }).catch(function (e) { if (who === current) feed.innerHTML = '<p class="chat-empty">' + esc(e.message) + "</p>"; });
    }

    function renderThread(scrollToEnd) {
      var json = JSON.stringify(thread) + JSON.stringify(openLog);
      if (json === lastThreadJson && !scrollToEnd) return;
      lastThreadJson = json;
      var nearEnd = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 60;
      var prevTop = feed.scrollTop;

      var prevMsg = null;
      feed.innerHTML = thread.length ? thread.map(function (m) {
        var mine = m.from.username === self.username;
        var sep = "";
        if (!prevMsg || new Date(prevMsg.createdAt).toDateString() !== new Date(m.createdAt).toDateString()) {
          sep = '<div class="day-sep"><span>' + esc(dayLabel(m.createdAt)) + "</span></div>";
          prevMsg = null;
        }
        var cont = !!prevMsg && prevMsg.from.username === m.from.username && m.createdAt - prevMsg.createdAt < GROUP_MS && !m.replyTo;
        prevMsg = m;
        var images = m.images.length ? '<div class="chat-images n' + Math.min(m.images.length, 4) + '">' + m.images.map(function (src, i) {
          var priv = /^dm:/.test(src);
          return '<img src="' + esc(priv ? BLANK : src) + '"' + (priv ? ' class="loading" data-dm-img="' + esc(src.slice(3)) + '" data-msg-id="' + esc(m.id) + '"' : "") +
            ' alt="รูปแนบ ' + (i + 1) + '" loading="lazy">';
        }).join("") + "</div>" : "";
        var reacts = Object.keys(m.reactions).map(function (k) { return m.reactions[k]; });
        var myR = m.reactions[key(self)];
        var status = mine ? '<span class="dm-status' + (m.readAt ? " read" : "") + '">' + (m.readAt ? "✓✓ อ่านแล้ว" : "✓ ส่งแล้ว") + "</span>" : "";
        var log = openLog[m.id] ? '<ul class="dm-log">' +
          '<li>ส่งเมื่อ <time>' + fmtFull(m.createdAt) + "</time></li>" +
          (m.readAt ? "<li>👁 " + esc(m.to.name) + " อ่านเมื่อ <time>" + fmtFull(m.readAt) + "</time></li>" : "<li>👁 ยังไม่ได้อ่าน</li>") +
          m.reactionLog.map(function (r) {
            return '<li><span class="react-tag ' + r.type + '">' + REACT[r.type].icon + " " + REACT[r.type].label + "</span> " + esc(r.name) + " · <time>" + fmtFull(r.at) + "</time></li>";
          }).join("") + "</ul>" : "";
        return sep + '<article class="chat-msg' + (mine ? " mine" : "") + (cont ? " cont" : "") + '" data-msg="' + esc(m.id) + '">' +
          (mine ? "" : '<span class="msg-avatar" aria-hidden="true">' + esc(initial(m.from.name)) + "</span>") +
          '<div class="msg-main">' +
          '<header class="msg-name"><strong>' + esc(mine ? "คุณ" : m.from.name) + "</strong></header>" +
          '<div class="bubble">' +
            (m.replyTo ? '<button type="button" class="chat-quote" data-act="jump" data-id="' + esc(m.replyTo.id) + '">↩ <strong>' + esc(m.replyTo.name) + "</strong> " + esc(m.replyTo.text) + "</button>" : "") +
            (m.text ? '<div class="chat-text">' + linkify(m.text) + "</div>" : "") + images +
            '<time class="msg-time" title="' + fmtFull(m.createdAt) + '">' + clock(m.createdAt) + "</time>" +
          "</div>" +
          '<div class="chat-actions">' +
            ["ok", "no"].map(function (t) {
              var on = myR && myR.type === t;
              var n = reacts.filter(function (r) { return r.type === t; }).length;
              return '<button type="button" class="react-btn ' + t + (on ? " on" : "") + '" data-act="' + t + '" data-id="' + esc(m.id) + '"' +
                (mine ? ' disabled title="ผู้รับเท่านั้นที่กด ✓/✗ ได้"' : "") + ' aria-pressed="' + !!on + '">' +
                REACT[t].icon + (n ? " <b>" + n + "</b>" : "") + "</button>";
            }).join("") +
            '<button type="button" class="tool-btn" data-act="reply" data-id="' + esc(m.id) + '" title="ตอบกลับ" aria-label="ตอบกลับ">↩</button>' +
            (isAdmin() ? '<button type="button" class="tool-btn danger" data-act="del" data-id="' + esc(m.id) + '" title="ลบข้อความ (เฉพาะ admin)" aria-label="ลบข้อความ">🗑</button>' : "") +
            '<button type="button" class="link-btn log-toggle" data-act="log" data-id="' + esc(m.id) + '" title="เวลาส่ง เวลาอ่าน และการกด ✓/✗">' + (status || "ⓘ") + (openLog[m.id] ? " ▴" : " ▾") + "</button>" +
          "</div>" +
          (reacts.length ? '<ul class="react-list">' + reacts.map(function (r) {
            return '<li><span class="react-tag ' + r.type + '">' + REACT[r.type].icon + " " + REACT[r.type].label + "</span> " +
              esc(r.name) + " <time>" + fmtFull(r.at) + "</time></li>";
          }).join("") + "</ul>" : "") +
          log + "</div></article>";
      }).join("") : '<p class="chat-empty">ยังไม่มีข้อความ — เริ่มพิมพ์ด้านล่างเพื่อส่งถึง ' + esc(partner ? partner.name : "") + "</p>";

      feed.scrollTop = scrollToEnd || nearEnd ? feed.scrollHeight : prevTop;
      hydrate(feed);
      var dead = partner && partner.active === false;
      $("dmSend").disabled = dead;
      textIn.disabled = dead;
      textIn.placeholder = dead ? "บัญชีนี้ไม่ได้ใช้งานแล้ว ส่งข้อความไม่ได้" : "พิมพ์ข้อความ…";
    }

    $("dmBack").addEventListener("click", function () {
      app.classList.remove("show-conv");
      current = null;
      activePartner = null;
      $("dmConv").hidden = true;
      $("dmPlaceholder").hidden = false;
      renderList();
    });

    /* ---- message actions ---- */

    function find(id) { return thread.filter(function (m) { return m.id === id; })[0]; }
    function upsert(m) {
      var i = thread.map(function (x) { return x.id; }).indexOf(m.id);
      if (i === -1) thread.push(m); else thread[i] = m;
    }

    feed.addEventListener("click", function (e) {
      var img = e.target.closest(".chat-images img");
      if (img && !e.target.closest("[data-act]")) { lightbox.querySelector("img").src = img.src; lightbox.hidden = false; return; }
      var t = e.target.closest("[data-act]");
      if (!t) return;
      var id = t.getAttribute("data-id"), act = t.getAttribute("data-act"), m = find(id);
      if (act === "log") { openLog[id] = !openLog[id]; renderThread(); }
      else if (act === "reply" && m) {
        replyTo = { id: m.id, name: m.from.name, text: snippet(m.text, 120) || "(รูปภาพ)" };
        renderReply();
        textIn.focus();
      } else if (act === "jump") {
        var el = feed.querySelector('[data-msg="' + id + '"]');
        if (!el) return;
        el.scrollIntoView({ behavior: "smooth", block: "center" });
        el.classList.remove("flash");
        void el.offsetWidth;
        el.classList.add("flash");
      } else if ((act === "ok" || act === "no") && m) {
        if (m.to.username !== self.username) { showError("กด ✓/✗ ได้เฉพาะผู้รับข้อความนี้"); return; }
        var cur = m.reactions[key(self)];
        if (cur && cur.type === act) return;
        api("dmReact", { id: id, type: act }).then(function (r) { upsert(r.message); renderThread(); }, function (err) { showError(err.message); });
      } else if (act === "del") {
        t.textContent = "ยืนยันลบ?";
        t.setAttribute("data-act", "del-yes");
      } else if (act === "del-yes") {
        api("dmDelete", { id: id }).then(function () {
          thread = thread.filter(function (x) { return x.id !== id; });
          renderThread();
          loadList();
        }, function (err) { showError(err.message); });
      }
    });
    lightbox.addEventListener("click", function () { lightbox.hidden = true; });

    /* ---- compose ---- */

    function renderReply() {
      var el = $("dmReplying");
      el.hidden = !replyTo;
      if (replyTo) {
        el.innerHTML = '<span class="reply-bar">↩ ตอบกลับ <strong>' + esc(replyTo.name) + "</strong>: " + esc(replyTo.text) + "</span>" +
          '<button type="button" class="link-btn" id="dmReplyCancel">✕ ยกเลิก</button>';
      }
    }
    $("dmReplying").addEventListener("click", function (e) {
      if (e.target.id === "dmReplyCancel") { replyTo = null; renderReply(); }
    });

    function renderPreviews() {
      $("dmPreviews").innerHTML = pending.map(function (src, i) {
        return '<div class="chat-thumb"><img src="' + src + '" alt="รูปแนบ ' + (i + 1) + '"><button type="button" data-rm="' + i + '" aria-label="ลบรูป">×</button></div>';
      }).join("");
    }
    $("dmPreviews").addEventListener("click", function (e) {
      var i = e.target.getAttribute("data-rm");
      if (i !== null) { pending.splice(+i, 1); renderPreviews(); }
    });

    function addFiles(files) {
      var imgs = Array.prototype.filter.call(files, function (f) { return /^image\//.test(f.type); });
      if (!imgs.length) return;
      var room = MAX_IMAGES - pending.length;
      showError(imgs.length > room ? "แนบรูปได้สูงสุด " + MAX_IMAGES + " รูปต่อข้อความ" : "");
      var size = window.Auth.remote ? [1280, 0.75] : [1024, 0.7];
      Promise.all(imgs.slice(0, Math.max(0, room)).map(function (f) { return compress(f, size[0], size[1]); }))
        .then(function (urls) { pending = pending.concat(urls); renderPreviews(); })
        .catch(function (e) { showError(e.message); });
    }
    $("dmFile").addEventListener("change", function () { addFiles(this.files); this.value = ""; });
    textIn.addEventListener("paste", function (e) {
      var files = e.clipboardData && e.clipboardData.files;
      if (files && files.length) { e.preventDefault(); addFiles(files); }
    });
    var form = $("dmForm");
    form.addEventListener("dragover", function (e) { e.preventDefault(); form.classList.add("drag"); });
    form.addEventListener("dragleave", function () { form.classList.remove("drag"); });
    form.addEventListener("drop", function (e) { e.preventDefault(); form.classList.remove("drag"); addFiles(e.dataTransfer.files); });
    textIn.addEventListener("keydown", function (e) { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) form.requestSubmit(); });
    function grow() { textIn.style.height = "auto"; textIn.style.height = Math.min(textIn.scrollHeight, 140) + "px"; }
    textIn.addEventListener("input", grow);

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var text = textIn.value.trim();
      if (!current) return;
      if (!text && !pending.length) { showError("พิมพ์ข้อความหรือแนบรูปก่อนส่ง"); return; }
      showError("");
      var btn = $("dmSend");
      btn.disabled = true;
      api("dmSend", { to: current, text: text, images: pending.slice(), replyTo: replyTo ? replyTo.id : null }).then(function (r) {
        textIn.value = "";
        grow();
        pending = [];
        replyTo = null;
        renderPreviews();
        renderReply();
        upsert(r.message);
        renderThread(true);
        loadList();
      }).catch(function (err) { showError("ส่งไม่สำเร็จ: " + err.message); })
        .then(function () { btn.disabled = false; });
    });

    /* ---- polling ---- */

    function tick() { if (!document.hidden) { loadList().catch(function () {}); loadThread(false); } }
    timer = setInterval(tick, POLL_MS);
    function onVisible() { if (!document.hidden) tick(); }
    document.addEventListener("visibilitychange", onVisible);

    loadList().then(function () {
      if (startWith) open(startWith);
    }, function (e) { $("dmConvos").innerHTML = '<p class="dm-empty">' + esc(e.message) + "</p>"; });

    return function unmount() {
      alive = false;
      activePartner = null;
      clearInterval(timer);
      document.removeEventListener("visibilitychange", onVisible);
    };
  }

  window.DM = { mount: mount, startBadge: startBadge, stopBadge: stopBadge, refreshBadge: refreshBadge,
    currentPartner: function () { return activePartner; } };
})();

</script>
  <script>
/*
 * Pop-up แจ้งเตือนเมื่อมีข้อความส่งถึงผู้ใช้ — ทั้งแชทประกาศ (ส่งถึงทุกคน / วิชาชีพ / รายบุคคล / ส่งต่อมา)
 * และข้อความส่วนตัว ทำงานทุกหน้าหลังเข้าสู่ระบบ
 *
 *  - ถามเซิร์ฟเวอร์ (Code.gs: notify) ทุก chat.notifySeconds วินาที (ค่าเริ่มต้น 20)
 *  - แสดง pop up มุมขวาล่าง + เสียงเตือนสั้นๆ (ปิดได้ที่เมนูผู้ใช้) + ตัวเลขบนแท็บเมื่อดูหน้าอื่นอยู่
 *  - เด้งทุกครั้งที่มีข้อความใหม่ถึงผู้ใช้ (รวมถึงตอนอยู่หน้าแชท) ยกเว้นข้อความส่วนตัวในบทสนทนาที่เปิดดูอยู่
 *  - แจ้งเตือนของระบบ (Notification API) เมื่อผู้ใช้อนุญาตและแท็บไม่ได้เปิดอยู่
 */
(function () {
  "use strict";

  var S = window.SITE;
  var C = S.chat || {};
  var POLL_MS = (C.notifySeconds || 20) * 1000;
  var TOAST_MS = 20000;
  var MAX_TOASTS = 4;
  var SOUND_KEY = "lpch-ro-notify-sound";
  var TITLE_RE = /^\(\d+\) ข้อความใหม่ · /;

  var timer = null, since = null, unseen = 0, audio = null, box = null, running = false, warnedOld = false;
  var OVERLAP_MS = 2000;  // ask a little further back each time so nothing sent at the edge is missed
  var seen = {};          // pop-ups already shown (kind:id:time), so the overlap never shows one twice
  var floor = 0;          // time of the first check: older messages are covered by the sign-in summary

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function fmtTime(ms) { return new Date(ms).toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" }); }
  function user() { return window.Auth && window.Auth.user; }
  function soundOn() { try { return localStorage.getItem(SOUND_KEY) !== "off"; } catch (e) { return true; } }
  function setSound(on) { try { localStorage.setItem(SOUND_KEY, on ? "on" : "off"); } catch (e) { /* ignore */ } }
  function currentPage() { return (location.hash.replace(/^#\/?/, "") || "home").split("?")[0]; }

  /* ---------------- data ---------------- */

  // Demo mode: the same answer as Code.gs notify, computed from this browser's stores.
  function localNotify(sinceMs) {
    var u = user(), key = "u_" + String(u.username).replace(/\W/g, "_");
    var read = function (k) { try { return JSON.parse(localStorage.getItem(k)) || []; } catch (e) { return []; } };
    var forMe = function (to) { return to.indexOf("ALL") !== -1 || to.indexOf(u.role) !== -1 || to.indexOf("u:" + u.username) !== -1; };
    var snip = function (t) { t = String(t || "").replace(/\s+/g, " ").trim(); return t.length > 140 ? t.slice(0, 140) + "…" : t; };
    var chat = [], dm = [], chatUnread = 0, dmUnread = 0;
    read("lpch-ro-chat-v1").forEach(function (m) {
      var to = m.to || [], reads = m.reads || {}, fwds = m.forwards || [];
      if ((m.author && m.author.username === u.username) || !forMe(to)) return;
      if (!reads[key]) chatUnread++;
      var fwd = fwds.filter(function (f) { return f.at > sinceMs && forMe(f.to); }).pop();
      if (m.createdAt > sinceMs || fwd) {
        chat.push({ id: m.id, from: m.author, text: snip(m.text), images: (m.images || []).length,
          personal: to.indexOf("u:" + u.username) !== -1, forwardedBy: fwd ? fwd.by : null, createdAt: fwd ? fwd.at : m.createdAt });
      }
    });
    read("lpch-ro-dm-v1").forEach(function (m) {
      if (m.to.username !== u.username) return;
      if (!m.readAt) dmUnread++;
      if (m.createdAt > sinceMs) dm.push({ id: m.id, from: m.from, text: snip(m.text), images: (m.images || []).length, createdAt: m.createdAt });
    });
    return Promise.resolve({ now: Date.now(), chat: chat, chatUnread: chatUnread, dm: dm, dmUnread: dmUnread });
  }

  function fetchNew(sinceMs) {
    return window.Auth.remote ? window.Auth.call("notify", { since: sinceMs }) : localNotify(sinceMs);
  }

  /* ---------------- pop-ups ---------------- */

  function container() {
    if (!box || !document.body.contains(box)) {
      box = document.createElement("div");
      box.className = "toasts";
      box.setAttribute("aria-live", "polite");
      box.setAttribute("aria-label", "การแจ้งเตือน");
      document.body.appendChild(box);
    }
    return box;
  }

  function close(t) {
    if (!t.parentNode) return;
    t.classList.add("leaving");
    setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 200);
  }

  /** opts: { kind: "chat"|"dm"|"info", title, text, meta, action: { label, run } } */
  function toast(opts) {
    var c = container();
    var t = document.createElement("div");
    t.className = "toast toast-" + opts.kind;
    t.setAttribute("role", opts.kind === "info" ? "status" : "alert");
    t.innerHTML =
      '<div class="toast-icon" aria-hidden="true">' + (opts.kind === "dm" ? "✉️" : opts.kind === "chat" ? "📣" : "🔔") + "</div>" +
      '<div class="toast-body"><strong>' + esc(opts.title) + "</strong>" +
        (opts.text ? '<p>' + esc(opts.text) + "</p>" : "") +
        (opts.meta ? '<small>' + esc(opts.meta) + "</small>" : "") +
        '<div class="toast-actions">' +
          (opts.action ? '<button type="button" class="toast-open">' + esc(opts.action.label) + "</button>" : "") +
          '<button type="button" class="toast-close">ปิด</button>' +
        "</div></div>" +
      '<button type="button" class="toast-x" aria-label="ปิดการแจ้งเตือน">×</button>';
    c.insertBefore(t, c.firstChild);
    while (c.children.length > MAX_TOASTS) close(c.lastChild);

    var hide = setTimeout(function () { close(t); }, TOAST_MS);
    t.addEventListener("mouseenter", function () { clearTimeout(hide); });
    t.addEventListener("mouseleave", function () { hide = setTimeout(function () { close(t); }, TOAST_MS / 2); });
    t.querySelector(".toast-x").addEventListener("click", function () { close(t); });
    t.querySelector(".toast-close").addEventListener("click", function () { close(t); });
    if (opts.action) {
      t.querySelector(".toast-open").addEventListener("click", function () { close(t); opts.action.run(); });
    }
    return t;
  }

  function chime() {
    if (!soundOn()) return;
    try {
      var A = window.AudioContext || window.webkitAudioContext;
      if (!A) return;
      audio = audio || new A();
      if (audio.state === "suspended") audio.resume();
      var t0 = audio.currentTime;
      [880, 1318.5].forEach(function (f, i) {
        var o = audio.createOscillator(), g = audio.createGain(), t = t0 + i * 0.13;
        o.type = "sine";
        o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.12, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
        o.connect(g);
        g.connect(audio.destination);
        o.start(t);
        o.stop(t + 0.36);
      });
    } catch (e) { /* sound is optional */ }
  }

  // Browsers only let a page start audio after a click, so create the audio context on the first one.
  document.addEventListener("click", function unlock() {
    try { var A = window.AudioContext || window.webkitAudioContext; if (A && !audio) audio = new A(); } catch (e) { /* ignore */ }
    document.removeEventListener("click", unlock);
  });

  function systemNotify(title, body) {
    try {
      if (document.hidden && "Notification" in window && Notification.permission === "granted") {
        new Notification(title, { body: body, tag: "lpch-ro-workspace" });
      }
    } catch (e) { /* not available in this frame */ }
  }

  function openChat(id) {
    window.__lpchFocusMessage = id;
    if (currentPage() === "chat") window.dispatchEvent(new CustomEvent("lpch:focus-message", { detail: id }));
    else location.hash = "#/chat";
  }
  function openDm(username) { location.hash = "#/inbox?u=" + encodeURIComponent(username); }

  function who(p) { return p ? p.name + (p.role ? " (" + p.role + ")" : "") : ""; }
  function body(n) { return n.text || (n.images ? "📷 รูปภาพ " + n.images + " รูป" : ""); }

  /* ---------------- badges and tab title ---------------- */

  function setBadges(r) {
    var dmBadge = document.getElementById("dmBadge");
    if (dmBadge) { dmBadge.textContent = r.dmUnread > 99 ? "99+" : String(r.dmUnread); dmBadge.hidden = !r.dmUnread; }
    var home = document.querySelector('.nav-link[data-page="chat"]');
    if (home) {
      var b = home.querySelector(".nav-count");
      if (!b) { b = document.createElement("span"); b.className = "nav-count"; home.appendChild(b); }
      b.textContent = r.chatUnread > 99 ? "99+" : String(r.chatUnread);
      b.hidden = !r.chatUnread;
      b.title = "ประกาศที่ยังไม่อ่าน";
    }
  }

  function bumpTitle(n) {
    if (!document.hidden || !n) return;
    unseen += n;
    document.title = "(" + unseen + ") ข้อความใหม่ · " + document.title.replace(TITLE_RE, "");
  }
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) return;
    unseen = 0;
    document.title = document.title.replace(TITLE_RE, "");
    if (running) poll();
  });

  /* ---------------- polling ---------------- */

  function poll() {
    var u = user();
    if (!u) return;
    var first = since === null;
    // First call only asks for the unread totals (Number.MAX_SAFE_INTEGER = nothing is "new" yet).
    fetchNew(first ? Number.MAX_SAFE_INTEGER : since).then(function (r) {
      if (!running || !user() || user().username !== u.username) return;
      since = r.now - OVERLAP_MS;
      setBadges(r);

      if (first) {
        floor = r.now;
        var flag = "lpch-ro-notified-" + u.username;
        var told = false;
        try { told = sessionStorage.getItem(flag) === "1"; sessionStorage.setItem(flag, "1"); } catch (e) { /* ignore */ }
        if (!told && (r.chatUnread || r.dmUnread)) {
          var parts = [];
          if (r.chatUnread) parts.push("ประกาศ " + r.chatUnread + " ข้อความ");
          if (r.dmUnread) parts.push("ข้อความส่วนตัว " + r.dmUnread + " ข้อความ");
          toast({ kind: "info", title: "คุณมีข้อความที่ยังไม่อ่าน", text: parts.join(" · "),
            action: r.dmUnread && !r.chatUnread ? { label: "เปิดข้อความส่วนตัว", run: function () { location.hash = "#/inbox"; } }
              : { label: "ไปที่แชทประกาศ", run: function () { location.hash = "#/chat"; } } });
        }
        return;
      }

      var page = currentPage(), visible = !document.hidden;
      var openPartner = window.DM && window.DM.currentPartner ? window.DM.currentPartner() : null;
      var shown = 0;

      var fresh = function (kind, n) {
        var k = kind + ":" + n.id + ":" + n.createdAt;
        if (seen[k] || n.createdAt <= floor) return false;
        seen[k] = 1;
        return true;
      };

      r.chat.forEach(function (n) {
        if (!fresh("chat", n)) return;
        var title = n.forwardedBy ? who(n.forwardedBy) + " ส่งต่อประกาศถึงคุณ"
          : n.personal ? "ประกาศถึงคุณจาก " + who(n.from) : "ประกาศใหม่จาก " + who(n.from);
        toast({ kind: "chat", title: title, text: body(n), meta: "แชทประกาศ · " + fmtTime(n.createdAt),
          action: { label: "เปิดดู", run: function () { openChat(n.id); } } });
        systemNotify(title, body(n));
        shown++;
      });

      r.dm.forEach(function (n) {
        if (!fresh("dm", n)) return;
        if (visible && page === "inbox" && openPartner === n.from.username) return; // conversation is open
        var title = "ข้อความส่วนตัวจาก " + who(n.from);
        toast({ kind: "dm", title: title, text: body(n), meta: "🔒 ส่วนตัว · " + fmtTime(n.createdAt),
          action: { label: "เปิดดู", run: function () { openDm(n.from.username); } } });
        systemNotify(title, body(n));
        shown++;
      });

      if (shown) { chime(); bumpTitle(shown); }
    }).catch(function (e) {
      // An older Code.gs has no "notify" action: say so once instead of failing silently.
      if (/notify/.test(String(e && e.message)) && !warnedOld) {
        warnedOld = true;
        toast({ kind: "info", title: "ระบบแจ้งเตือนยังไม่พร้อม",
          text: "เซิร์ฟเวอร์ (Code.gs) ยังเป็นเวอร์ชันเก่า — ผู้ดูแลระบบต้องวาง Code.gs เวอร์ชันล่าสุดและ Deploy เวอร์ชันใหม่" });
      }
    });
  }

  function start() {
    stop();
    running = true;
    since = null;
    poll();
    timer = setInterval(function () { poll(); }, POLL_MS);
  }

  function stop() {
    running = false;
    if (timer) clearInterval(timer);
    timer = null;
    since = null;
    seen = {};
    unseen = 0;
    document.title = document.title.replace(TITLE_RE, "");
    if (box) box.innerHTML = "";
  }

  /** Items for the user menu: sound on/off and the browser's own notifications. */
  function menuHtml() {
    var sys = "Notification" in window ? Notification.permission : "unsupported";
    return '<button type="button" id="notifySound">' + (soundOn() ? "🔔 เสียงแจ้งเตือน: เปิด" : "🔕 เสียงแจ้งเตือน: ปิด") + "</button>" +
      (sys === "default" ? '<button type="button" id="notifySystem">📲 เปิดการแจ้งเตือนบนเครื่อง</button>' : "");
  }

  function bindMenu(root) {
    var s = root.querySelector("#notifySound");
    if (s) s.addEventListener("click", function () {
      setSound(!soundOn());
      s.textContent = soundOn() ? "🔔 เสียงแจ้งเตือน: เปิด" : "🔕 เสียงแจ้งเตือน: ปิด";
      if (soundOn()) chime();
    });
    var n = root.querySelector("#notifySystem");
    if (n) n.addEventListener("click", function () {
      try {
        Notification.requestPermission().then(function (p) {
          toast({ kind: "info", title: p === "granted" ? "เปิดการแจ้งเตือนบนเครื่องแล้ว" : "เบราว์เซอร์ไม่อนุญาตการแจ้งเตือน",
            text: p === "granted" ? "จะแจ้งเตือนเมื่อมีข้อความใหม่ขณะเปิดหน้าอื่นอยู่" : "ยังแสดง pop up ในหน้าเว็บได้ตามปกติ" });
        });
      } catch (e) {
        toast({ kind: "info", title: "เบราว์เซอร์ไม่อนุญาตการแจ้งเตือน", text: "ยังแสดง pop up ในหน้าเว็บได้ตามปกติ" });
      }
    });
  }

  window.Notifier = { start: start, stop: stop, poll: poll, toast: toast, menuHtml: menuHtml, bindMenu: bindMenu };
})();

</script>
  <script>
(function () {
  "use strict";

  var S = window.SITE;
  var Auth = window.Auth;
  var app = document.getElementById("app");
  var userMenu = document.getElementById("userMenu");
  var authScreen = document.getElementById("authScreen");

  // Member pages (not in the top menu).
  S.pages.account = { title: "บัญชีของฉัน", lead: "ข้อมูลสมาชิกและการเปลี่ยนรหัสผ่าน", widgets: ["account"] };
  S.pages.inbox = { title: "ข้อความส่วนตัว", bare: true, widgets: ["inbox"] };
  S.pages.admin = { title: "จัดการสมาชิก", lead: "อนุมัติผู้สมัคร ระงับบัญชี และกำหนดสิทธิ์ผู้ดูแลระบบ", widgets: ["admin"], adminOnly: true };
  var navEl = document.getElementById("nav");

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function isExternal(url) { return /^https?:/i.test(url); }

  // A link whose url is "#" or empty is a placeholder waiting for a real Drive/Docs URL.
  function link(label, url) {
    if (!url || url === "#") return '<span class="placeholder">' + esc(label) + "</span>";
    return '<a href="' + esc(url) + '"' + (isExternal(url) ? ' target="_blank" rel="noopener"' : "") + ">" + esc(label) + "</a>";
  }

  function section(title, lead, body) {
    return '<section class="section">' + (title ? "<h2>" + esc(title) + "</h2>" : "") +
      (lead ? '<p class="lead">' + esc(lead) + "</p>" : "") + body + "</section>";
  }

  // Find the nav entry (and its parent) for a page key.
  function findNav(page) {
    for (var i = 0; i < S.nav.length; i++) {
      var n = S.nav[i];
      if (n.page === page) return { item: n, parent: null };
      var kids = n.children || [];
      for (var j = 0; j < kids.length; j++) if (kids[j].page === page) return { item: kids[j], parent: n };
    }
    return null;
  }

  /* ---------------- Navigation ---------------- */

  function renderNav() {
    navEl.innerHTML = S.nav.map(function (n, i) {
      if (!n.children) return '<a class="nav-link" href="#/' + esc(n.page) + '" data-page="' + esc(n.page) + '">' + esc(n.label) + "</a>";
      var sub = n.children.map(function (c) {
        return '<a href="#/' + esc(c.page) + '" data-page="' + esc(c.page) + '">' + esc(c.label) + "</a>";
      }).join("");
      return '<div class="nav-item has-sub" data-page="' + esc(n.page) + '">' +
        '<a class="nav-link" href="#/' + esc(n.page) + '" data-page="' + esc(n.page) + '">' + esc(n.label) + "</a>" +
        '<button class="sub-toggle" aria-label="เปิดเมนูย่อย ' + esc(n.label) + '" aria-expanded="false" aria-controls="sub' + i + '">' +
        '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>' +
        '<div class="submenu" id="sub' + i + '">' + sub + "</div></div>";
    }).join("");

    navEl.querySelectorAll(".sub-toggle").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        var item = btn.parentElement;
        var open = !item.classList.contains("open");
        closeSubmenus();
        item.classList.toggle("open", open);
        btn.setAttribute("aria-expanded", open ? "true" : "false");
      });
    });
  }

  function closeSubmenus() {
    navEl.querySelectorAll(".has-sub").forEach(function (i) {
      i.classList.remove("open");
      i.querySelector(".sub-toggle").setAttribute("aria-expanded", "false");
    });
  }

  /* ---------------- Widgets ---------------- */

  var widgets = {
    intro: function () {
      return '<div class="intro section"><h2>' + esc(S.organization) + "</h2>" +
        '<p class="intro-text">' + esc(S.description) + "</p></div>";
    },

    account: function () { return '<section class="section" id="accountRoot"></section>'; },

    admin: function () { return '<section class="section" id="adminRoot"></section>'; },

    inbox: function () { return '<section class="section" id="inboxRoot"></section>'; },

    announcements: function () {
      return '<section class="section" id="chatRoot"></section>';
    },

    quicklinks: function () {
      var tiles = S.quickLinks.map(function (q) {
        return '<a class="card tile" href="' + esc(q.url) + '"' + (isExternal(q.url) ? ' target="_blank" rel="noopener"' : "") + ">" +
          '<span class="tile-icon" aria-hidden="true">' + q.icon + "</span>" +
          "<div><strong>" + esc(q.label) + "</strong><span>" + esc(q.desc) + "</span></div></a>";
      }).join("");
      return section("Workspace", "เลือกส่วนงาน", '<div class="grid">' + tiles + "</div>");
    },

    subpages: function (page) {
      var nav = findNav(page);
      var kids = (nav && nav.item.children) || [];
      var tiles = kids.map(function (c) {
        var p = S.pages[c.page] || {};
        return '<a class="card tile" href="#/' + esc(c.page) + '"><div><strong>' + esc(c.label) + "</strong>" +
          "<span>" + esc(p.lead || "") + "</span></div></a>";
      }).join("");
      return section("", "", '<div class="grid">' + tiles + "</div>");
    },

    constraints: function () {
      var regions = ["ทั้งหมด"].concat(S.constraints.map(function (c) { return c.region; })
        .filter(function (r, i, a) { return a.indexOf(r) === i; }));
      var chips = regions.map(function (r, i) {
        return '<button class="chip' + (i === 0 ? " active" : "") + '" data-region="' + esc(r) + '">' + esc(r) + "</button>";
      }).join("");
      return section("Dose constraints", "ค่าจำกัดปริมาณรังสีของอวัยวะสำคัญ (Organs at risk)",
        '<div class="toolbar">' + chips +
        '<input class="search" id="organSearch" type="search" placeholder="ค้นหาอวัยวะ…" aria-label="ค้นหาอวัยวะ"></div>' +
        '<div class="table-wrap card flush"><table><thead><tr><th>Region</th><th>Organ at risk</th><th>Constraint</th><th>Endpoint</th></tr></thead>' +
        '<tbody id="constraintRows"></tbody></table></div>' +
        '<div class="note">ค่าอ้างอิงจาก QUANTEC (Int J Radiat Oncol Biol Phys 2010; 76(3) Suppl) สำหรับ conventional fractionation 1.8–2 Gy/fx ' +
        "ไม่ใช้กับ SBRT/SRS — โปรดยึดตาม protocol ของหน่วยงานและดุลยพินิจของแพทย์เป็นหลัก</div>");
    },

    calculators: function () {
      var abOptions = [
        ["10", "10 — Tumor / acute-reacting tissue"],
        ["3", "3 — Late-reacting tissue"],
        ["2", "2 — CNS / spinal cord"],
        ["1.5", "1.5 — Prostate"],
        ["custom", "กำหนดเอง…"],
      ].map(function (o) { return '<option value="' + o[0] + '">' + esc(o[1]) + "</option>"; }).join("");

      var bed =
        '<div class="card"><h3>🧮 BED / EQD2 Calculator</h3>' +
        '<div class="form-row"><label for="bedD">Dose per fraction, d (Gy)</label><input id="bedD" type="number" min="0" step="0.01" value="2"></div>' +
        '<div class="form-row"><label for="bedN">Number of fractions, n</label><input id="bedN" type="number" min="1" step="1" value="35"></div>' +
        '<div class="form-row"><label for="bedAB">α/β (Gy)</label><select id="bedAB">' + abOptions + "</select></div>" +
        '<div class="form-row" id="bedABCustomRow" hidden><label for="bedABCustom">α/β กำหนดเอง (Gy)</label><input id="bedABCustom" type="number" min="0.1" step="0.1" value="4"></div>' +
        '<div class="results"><div class="result"><small>Total dose</small><b id="outTD">–</b></div>' +
        '<div class="result"><small>BED</small><b id="outBED">–</b></div>' +
        '<div class="result"><small>EQD2</small><b id="outEQD2">–</b></div></div>' +
        '<p class="formula">BED = n·d·(1 + d / (α/β)) &nbsp;·&nbsp; EQD2 = BED / (1 + 2 / (α/β))</p></div>';

      var conv =
        '<div class="card"><h3>🔁 Fractionation converter</h3>' +
        '<p class="muted" style="margin-top:0">หาจำนวน fraction ที่ให้ EQD2 เท่ากับเป้าหมาย เมื่อเปลี่ยนขนาดต่อ fraction</p>' +
        '<div class="form-row"><label for="cvTarget">Target EQD2 (Gy)</label><input id="cvTarget" type="number" min="0" step="0.1" value="60"></div>' +
        '<div class="form-row"><label for="cvD">New dose per fraction (Gy)</label><input id="cvD" type="number" min="0" step="0.01" value="2.75"></div>' +
        '<div class="form-row"><label for="cvAB">α/β (Gy)</label><input id="cvAB" type="number" min="0.1" step="0.1" value="10"></div>' +
        '<div class="results"><div class="result"><small>Fractions (exact)</small><b id="cvN">–</b></div>' +
        '<div class="result"><small>Rounded n</small><b id="cvNR">–</b></div>' +
        '<div class="result"><small>Total dose</small><b id="cvTD">–</b></div></div>' +
        '<p class="formula">n = EQD2·(1 + 2/(α/β)) / [d·(1 + d/(α/β))] — ไม่ได้คิดผลของเวลา (time factor / repopulation)</p></div>';

      return section("เครื่องมือคำนวณ", "Linear-quadratic model สำหรับการเปรียบเทียบ fractionation schedule",
        '<div class="grid wide">' + bed + conv + "</div>" +
        '<div class="note">ผลการคำนวณใช้เพื่อประกอบการตัดสินใจเท่านั้น โปรดตรวจสอบซ้ำก่อนนำไปใช้ทางคลินิก</div>');
    },

    schedule: function () {
      var rows = S.schedule.items.map(function (i) {
        return "<tr><td>" + esc(i.day) + "</td><td>" + esc(i.time) + "</td><td>" + esc(i.title) + "</td></tr>";
      }).join("");
      var cal = S.schedule.calendarEmbedUrl
        ? '<iframe class="calendar-frame card" src="' + esc(S.schedule.calendarEmbedUrl) + '" title="Calendar"></iframe>'
        : "";
      return section("ตารางงานประจำสัปดาห์", "กิจกรรมวิชาการและงานประจำของหน่วย",
        '<div class="table-wrap card flush"><table><thead><tr><th>วัน</th><th>เวลา</th><th>กิจกรรม</th></tr></thead><tbody>' +
        rows + "</tbody></table></div>" + cal);
    },

    contacts: function () {
      var cards = S.contacts.map(function (c) {
        return '<div class="card contact-card"><h3>' + esc(c.role) + "</h3>" +
          "<p>👤 " + esc(c.name) + "</p>" +
          (c.phone ? "<p>📞 " + esc(c.phone) + "</p>" : "") +
          (c.email ? '<p>✉️ <a href="mailto:' + esc(c.email) + '">' + esc(c.email) + "</a></p>" : "") +
          "</div>";
      }).join("");
      return section("ติดต่อ", "ผู้รับผิดชอบและช่องทางติดต่อภายในหน่วย", '<div class="grid">' + cards + "</div>");
    },
  };

  /* ---------------- Page rendering ---------------- */

  function renderPage(key) {
    var p = S.pages[key];
    var nav = findNav(key);
    var html = "";

    if (key !== "home" && !p.bare) {
      var crumbs = '<a href="#/home">Home</a>' +
        (nav && nav.parent ? ' <span>›</span> <a href="#/' + esc(nav.parent.page) + '">' + esc(nav.parent.label) + "</a>" : "") +
        " <span>›</span> " + esc(p.title);
      html += '<nav class="breadcrumb" aria-label="breadcrumb">' + crumbs + "</nav>" +
        '<header class="page-head"><h2>' + esc(p.title) + "</h2>" + (p.lead ? '<p class="lead">' + esc(p.lead) + "</p>" : "") + "</header>";
    }

    if (p.specs) {
      html += section("ข้อมูลเครื่อง", "", '<div class="card flush"><table class="specs"><tbody>' +
        p.specs.map(function (r) { return "<tr><th>" + esc(r[0]) + "</th><td>" + esc(r[1]) + "</td></tr>"; }).join("") +
        "</tbody></table></div>");
    }

    if (p.groups) {
      html += section("", "", '<div class="grid">' + p.groups.map(function (g) {
        return '<div class="card"><h3>' + (g.icon ? g.icon + " " : "") + esc(g.title) + '</h3><ul class="link-list">' +
          g.items.map(function (i) {
            return "<li>" + link(i.label, i.url) + (i.type ? '<span class="badge">' + esc(i.type) + "</span>" : "") + "</li>";
          }).join("") + "</ul></div>";
      }).join("") + "</div>");
    }

    (p.widgets || []).forEach(function (w) { html += widgets[w](key); });
    return html;
  }

  /* ---------------- Interactive widgets ---------------- */

  function initConstraints() {
    var tbody = document.getElementById("constraintRows");
    if (!tbody) return;
    var search = document.getElementById("organSearch");
    var region = "ทั้งหมด";

    function render() {
      var q = search.value.trim().toLowerCase();
      var rows = S.constraints.filter(function (c) {
        return (region === "ทั้งหมด" || c.region === region) &&
          (!q || (c.organ + " " + c.endpoint).toLowerCase().indexOf(q) !== -1);
      });
      tbody.innerHTML = rows.length
        ? rows.map(function (c) {
            return "<tr><td>" + esc(c.region) + "</td><td><strong>" + esc(c.organ) + "</strong></td><td>" +
              esc(c.constraint) + "</td><td>" + esc(c.endpoint) + "</td></tr>";
          }).join("")
        : '<tr><td colspan="4" class="muted">ไม่พบข้อมูล</td></tr>';
    }

    document.querySelectorAll(".chip").forEach(function (chip) {
      chip.addEventListener("click", function () {
        document.querySelectorAll(".chip").forEach(function (c) { c.classList.remove("active"); });
        chip.classList.add("active");
        region = chip.getAttribute("data-region");
        render();
      });
    });
    search.addEventListener("input", render);
    render();
  }

  function fmt(x) {
    return isFinite(x) ? (Math.round(x * 100) / 100).toString() : "–";
  }

  function initCalculators() {
    var d = document.getElementById("bedD");
    if (!d) return;
    var n = document.getElementById("bedN");
    var ab = document.getElementById("bedAB");
    var abCustomRow = document.getElementById("bedABCustomRow");
    var abCustom = document.getElementById("bedABCustom");

    function calcBED() {
      abCustomRow.hidden = ab.value !== "custom";
      var dv = parseFloat(d.value), nv = parseFloat(n.value);
      var abv = parseFloat(ab.value === "custom" ? abCustom.value : ab.value);
      var ok = dv > 0 && nv > 0 && abv > 0;
      var td = nv * dv;
      var bed = td * (1 + dv / abv);
      var eqd2 = bed / (1 + 2 / abv);
      document.getElementById("outTD").textContent = ok ? fmt(td) + " Gy" : "–";
      document.getElementById("outBED").textContent = ok ? fmt(bed) + " Gy" : "–";
      document.getElementById("outEQD2").textContent = ok ? fmt(eqd2) + " Gy" : "–";
    }
    [d, n, ab, abCustom].forEach(function (el) { el.addEventListener("input", calcBED); });
    calcBED();

    var t = document.getElementById("cvTarget");
    var cd = document.getElementById("cvD");
    var cab = document.getElementById("cvAB");

    function calcConv() {
      var tv = parseFloat(t.value), dv = parseFloat(cd.value), abv = parseFloat(cab.value);
      var ok = tv > 0 && dv > 0 && abv > 0;
      var nExact = (tv * (1 + 2 / abv)) / (dv * (1 + dv / abv));
      var nRound = Math.max(1, Math.round(nExact));
      document.getElementById("cvN").textContent = ok ? fmt(nExact) : "–";
      document.getElementById("cvNR").textContent = ok ? nRound + " fx" : "–";
      document.getElementById("cvTD").textContent = ok ? fmt(nRound * dv) + " Gy" : "–";
    }
    [t, cd, cab].forEach(function (el) { el.addEventListener("input", calcConv); });
    calcConv();
  }

  /* ---------------- Router ---------------- */

  var unmountChat = null;
  var unmountInbox = null;

  function unmountWidgets() {
    if (unmountChat) { unmountChat(); unmountChat = null; }
    if (unmountInbox) { unmountInbox(); unmountInbox = null; }
  }

  function route() {
    if (!Auth.user) return;
    var page = (location.hash.replace(/^#\/?/, "") || "home").split("?")[0];
    if (!S.pages[page] || (S.pages[page].adminOnly && !Auth.user.isAdmin)) page = "home";

    unmountWidgets();
    app.innerHTML = renderPage(page);
    initConstraints();
    initCalculators();
    var chatRoot = document.getElementById("chatRoot");
    if (chatRoot && window.Chat) unmountChat = window.Chat.mount(chatRoot);
    var inboxRoot = document.getElementById("inboxRoot");
    if (inboxRoot && window.DM) {
      // #/inbox?u=<username> opens that conversation directly
      var m = /[?&]u=([^&]+)/.exec(location.hash);
      unmountInbox = window.DM.mount(inboxRoot, m ? decodeURIComponent(m[1]) : null);
    }
    document.getElementById("inboxLink").classList.toggle("active", page === "inbox");
    // Chat pages fill the screen like a chat app (compact header on phones, no footer).
    document.body.classList.toggle("chat-page", page === "chat" || page === "inbox");
    fitChat();
    var accountRoot = document.getElementById("accountRoot");
    if (accountRoot) Auth.mountAccount(accountRoot);
    var adminRoot = document.getElementById("adminRoot");
    if (adminRoot) Auth.mountAdmin(adminRoot);


    // Highlight the top-level item that owns this page.
    var nav = findNav(page);
    var top = nav ? (nav.parent || nav.item).page : "home";
    navEl.querySelectorAll(".nav-link").forEach(function (a) {
      a.classList.toggle("active", a.getAttribute("data-page") === top);
    });
    navEl.querySelectorAll(".submenu a").forEach(function (a) {
      a.classList.toggle("active", a.getAttribute("data-page") === page);
    });

    var cur = nav ? nav.item.label : S.pages[page].title;
    document.getElementById("menuCurrent").textContent = cur;

    closeSubmenus();
    closeUserMenu();
    navEl.classList.remove("open");
    document.getElementById("menuToggle").setAttribute("aria-expanded", "false");

    document.title = page === "home" ? S.title : S.pages[page].title + " · " + S.title;
    window.scrollTo(0, 0);
  }

  /* ---------------- Signed-in user ---------------- */

  function renderUserMenu() {
    var u = Auth.user;
    var badge = document.getElementById("userBadge");
    badge.hidden = !u;
    if (!u) { userMenu.innerHTML = ""; return; }
    document.getElementById("userName").textContent = u.fullName + " (" + u.role + ")";
    // First letter for the avatar, skipping Thai leading vowels (เ แ โ ใ ไ).
    var initial = (u.fullName || u.username).trim().replace(/^[\u0e40-\u0e44]/, "").charAt(0);
    userMenu.innerHTML =
      '<button class="user-btn" id="userBtn" aria-haspopup="true" aria-expanded="false" aria-controls="userDrop">' +
        '<span class="avatar" aria-hidden="true">' + esc(initial) + "</span>" +
        '<span class="user-name">' + esc(u.fullName) + "</span></button>" +
      '<div class="user-drop" id="userDrop" hidden>' +
        '<div class="user-info"><strong>' + esc(u.fullName) + "</strong><span>" + esc(Auth.roleName(u.role)) +
          (u.isAdmin ? " · admin" : "") + "</span></div>" +
        '<a href="#/inbox">✉️ ข้อความส่วนตัว</a>' +
        '<a href="#/account">👤 บัญชีของฉัน</a>' +
        (u.isAdmin ? '<a href="#/admin">👥 จัดการสมาชิก</a>' : "") +
        (window.Notifier ? window.Notifier.menuHtml() : "") +
        '<button type="button" id="logoutBtn">🚪 ออกจากระบบ</button>' +
      "</div>";
    var btn = document.getElementById("userBtn");
    var drop = document.getElementById("userDrop");
    if (window.Notifier) window.Notifier.bindMenu(drop);
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      drop.hidden = !drop.hidden;
      // Keep the menu inside the screen (on phones the button is not at the right edge).
      drop.style.left = drop.style.right = "";
      if (!drop.hidden) {
        var r = drop.getBoundingClientRect(), gap = 12;
        if (r.right > window.innerWidth - gap) { drop.style.right = "auto"; drop.style.left = (drop.offsetLeft - (r.right - (window.innerWidth - gap))) + "px"; }
        else if (r.left < gap) { drop.style.right = "auto"; drop.style.left = (drop.offsetLeft + (gap - r.left)) + "px"; }
      }
      btn.setAttribute("aria-expanded", drop.hidden ? "false" : "true");
    });
    drop.addEventListener("click", function () { drop.hidden = true; });
    document.getElementById("logoutBtn").addEventListener("click", function () { Auth.logout(); });
  }

  function closeUserMenu() {
    var drop = document.getElementById("userDrop");
    if (drop) drop.hidden = true;
  }

  // Show the site for a signed-in member, or the login / sign-up screen.
  function applyAuth(user) {
    document.body.classList.toggle("locked", !user);
    renderUserMenu();
    if (user) {
      authScreen.innerHTML = "";
      // Accounts created before email was required are asked to add one (needed to reset a password).
      if (!user.email && location.hash !== "#/account") location.hash = "#/account";
      route();
      // Pop-ups for new announcements and private messages (also keeps the unread badges current).
      if (window.Notifier) window.Notifier.start();
    } else {
      unmountWidgets();
      if (window.Notifier) window.Notifier.stop();
      app.innerHTML = "";
      Auth.showLogin(authScreen);
    }
  }

  var titleEl = document.getElementById("siteTitle");
  titleEl.textContent = S.brand.name + " ";
  titleEl.appendChild(document.createElement("span")).textContent = S.brand.accent;
  document.getElementById("siteOrg").textContent = S.brand.org;
  document.getElementById("siteDesc").textContent = S.organization + " — " + S.tagline;
  document.getElementById("footerOrg").textContent = S.organization;

  // Theme switch (auto / light / dark), stored per browser by the snippet in index.html.
  document.querySelectorAll('input[name="theme"]').forEach(function (r) {
    r.checked = r.value === window.LPCHTheme.get();
    r.addEventListener("change", function () { window.LPCHTheme.set(r.value); });
  });

  renderNav();

  document.getElementById("menuToggle").addEventListener("click", function () {
    var open = navEl.classList.toggle("open");
    this.setAttribute("aria-expanded", open ? "true" : "false");
  });
  document.addEventListener("click", function (e) {
    if (!navEl.contains(e.target)) closeSubmenus();
    if (!userMenu.contains(e.target)) closeUserMenu();
  });
  window.addEventListener("resize", closeUserMenu);
  window.addEventListener("resize", fitChat);

  // Size the chat panel to the rest of the screen below the header and menu bar.
  function fitChat() {
    var el = app.querySelector(".chat, .dm");
    if (!el) return;
    var top = el.getBoundingClientRect().top + window.scrollY;
    var h = (window.visualViewport ? window.visualViewport.height : window.innerHeight) - top - 10;
    el.style.height = Math.max(420, Math.round(h)) + "px";
  }
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { closeSubmenus(); closeUserMenu(); }
  });

  window.addEventListener("hashchange", route);
  Auth.onChange(applyAuth);
  Auth.init().then(applyAuth);
})();

</script>
</body>
</html>
