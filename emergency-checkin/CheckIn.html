<!-- ไฟล์ HTML ชื่อ "CheckIn" · ห้ามวางในไฟล์ Code.gs (กด + → HTML แล้วตั้งชื่อ CheckIn) -->
<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<script>
/* เลือกธีมก่อนหน้าเว็บแสดงผล: ใช้ค่าที่เคยเลือกไว้ ถ้ายังไม่เคยเลือกให้ตามการตั้งค่าของเครื่อง */
(function () {
  var t; try { t = localStorage.getItem('theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t);
})();
function toggleTheme() {
  var t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('theme', t); } catch (e) {}
}
</script>
<style>
  /* ---------- ธีม: สว่าง (ค่าเริ่มต้น) ---------- */
  :root {
    --bg:#f3f5f4; --glow:rgba(16,137,79,.13); --surface:#ffffff; --surface-2:#f1f4f2; --glass:rgba(255,255,255,.78);
    --ink:#0d1712; --muted:#5d6b64; --line:#e2e8e5; --line-2:#d3dcd7;
    --brand:#0f7a46; --brand-soft:#e3f3ea;
    --safe:#0f8a4b; --safe-soft:#e2f4ea; --help:#dc2a1f; --help-soft:#fdecea; --alert:#e5352b;
    --warn-soft:#fff5dc; --warn-ink:#8a5a00;
    --ring:rgba(15,122,70,.30);
    --shadow:0 1px 2px rgba(13,23,18,.05), 0 12px 32px -14px rgba(13,23,18,.20);
    --shadow-btn:0 10px 24px -12px;
    /* ฟอนต์ไทยที่มีในเครื่องอยู่แล้ว ไม่ต้องดาวน์โหลด หน้าเว็บแสดงผลทันที */
    --f:"Noto Sans Thai","Thonburi","Leelawadee UI","Sarabun","Tahoma",system-ui,sans-serif;
    color-scheme:light;
  }
  /* ---------- ธีม: มืด ---------- */
  :root[data-theme="dark"] {
    --bg:#090e0c; --glow:rgba(47,191,120,.14); --surface:#111915; --surface-2:#16201b; --glass:rgba(13,20,17,.78);
    --ink:#e6eee9; --muted:#93a39b; --line:#212e27; --line-2:#2c3b33;
    --brand:#2fbf78; --brand-soft:#0f2b1d;
    --safe:#2fbf78; --safe-soft:#0f2b1d; --help:#ff6b5e; --help-soft:#3a1512; --alert:#ff5a4d;
    --warn-soft:#33270b; --warn-ink:#f3c661;
    --ring:rgba(47,191,120,.35);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -16px rgba(0,0,0,.6);
    color-scheme:dark;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { background:var(--bg); }
  body { margin:0; font-family:var(--f); color:var(--ink); font-size:17px; line-height:1.5; min-height:100vh;
    background:radial-gradient(900px 360px at 50% -140px, var(--glow), transparent 70%), var(--bg); }
  .hidden { display:none !important; }
  svg { width:1em; height:1em; flex:none; }
  button { font:inherit; color:inherit; }

  /* ---------- แถบบน (โปร่งแสง ติดด้านบน) ---------- */
  .bar { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:12px; padding:10px 16px;
    background:var(--glass); -webkit-backdrop-filter:saturate(1.6) blur(16px); backdrop-filter:saturate(1.6) blur(16px);
    border-bottom:1px solid var(--line); }
  .logo { width:40px; height:40px; border-radius:12px; background:#fff; padding:4px; flex:none; display:block; box-shadow:0 0 0 1px var(--line); }
  .brand { min-width:0; display:grid; line-height:1.3; }
  .brand b { font-weight:700; font-size:16px; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .brand span { font-size:12.5px; color:var(--muted); }
  .icon-btn { margin-left:auto; width:40px; height:40px; border-radius:12px; border:1px solid var(--line); background:var(--surface);
    display:grid; place-items:center; cursor:pointer; color:var(--ink); font-size:19px; flex:none; transition:transform .1s, border-color .15s; }
  .icon-btn:hover { border-color:var(--line-2); }
  .icon-btn:active { transform:scale(.94); }
  :root[data-theme="dark"] .i-moon, :root:not([data-theme="dark"]) .i-sun { display:none; }

  main { padding:16px 16px 40px; max-width:480px; margin:0 auto; display:grid; gap:14px; }

  /* ---------- แถบสถานะเหตุ + จุดรวมพล ---------- */
  .hero { display:flex; align-items:center; justify-content:space-between; gap:8px 12px; flex-wrap:wrap; padding:12px 14px;
    border-radius:18px; border:1px solid var(--line); background:var(--surface); box-shadow:var(--shadow); }
  .live { display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:700; color:var(--alert);
    background:var(--help-soft); padding:5px 11px 5px 9px; border-radius:999px; letter-spacing:.01em; }
  .pulse { width:8px; height:8px; border-radius:50%; background:var(--alert); box-shadow:0 0 0 0 rgba(229,53,43,.55); animation:pulse 1.6s infinite; }
  @keyframes pulse { 70% { box-shadow:0 0 0 8px rgba(229,53,43,0); } 100% { box-shadow:0 0 0 0 rgba(229,53,43,0); } }
  .place { display:inline-flex; align-items:center; gap:6px; font-size:14px; font-weight:600; min-width:0; }
  .place svg { color:var(--brand); font-size:17px; }

  section { display:grid; gap:12px; animation:rise .28s cubic-bezier(.2,.8,.2,1); }
  @keyframes rise { from { opacity:.3; transform:translateY(8px); } }
  h2 { font-size:24px; margin:6px 2px 0; font-weight:700; letter-spacing:-.015em; line-height:1.3; }
  .sub { color:var(--muted); font-size:15px; margin:-6px 2px 2px; }

  /* ---------- ค้นหา ---------- */
  .search { position:relative; }
  .search svg { position:absolute; left:17px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:21px; pointer-events:none; }
  .search input { width:100%; font:inherit; font-size:19px; padding:17px 16px 17px 50px; border-radius:18px; border:1.5px solid var(--line);
    background:var(--surface); color:var(--ink); box-shadow:var(--shadow); outline:none; transition:border-color .15s, box-shadow .15s; -webkit-appearance:none; appearance:none; }
  .search input::placeholder { color:var(--muted); opacity:.75; }
  .search input:focus { border-color:var(--brand); box-shadow:0 0 0 4px var(--ring); }
  .list { display:grid; gap:8px; }
  .item { display:flex; align-items:center; gap:14px; width:100%; text-align:left; background:var(--surface);
    border:1px solid var(--line); border-radius:18px; padding:12px 14px; cursor:pointer; transition:transform .1s, border-color .15s, box-shadow .15s; }
  .item:hover { border-color:var(--brand); box-shadow:var(--shadow); }
  .item:active { transform:scale(.985); }
  .item .nm { font-weight:600; font-size:17px; }
  .item small { color:var(--muted); display:block; font-size:13.5px; }
  .item .go { margin-left:auto; color:var(--muted); font-size:22px; line-height:1; }
  .avatar { width:44px; height:44px; border-radius:14px; display:grid; place-items:center; font-weight:700;
    background:var(--brand-soft); color:var(--brand); flex:none; font-size:19px; }
  .empty { text-align:center; color:var(--muted); font-size:15px; padding:24px 12px; border:1.5px dashed var(--line-2); border-radius:18px; }

  /* ---------- การ์ดชื่อ ---------- */
  .card { background:var(--surface); border:1px solid var(--line); border-radius:26px; padding:26px 20px 24px; text-align:center; box-shadow:var(--shadow);
    display:grid; justify-items:center; gap:4px; }
  .card .avatar { width:68px; height:68px; border-radius:22px; font-size:30px; margin-bottom:8px; }
  .eyebrow { color:var(--muted); font-size:13px; font-weight:600; letter-spacing:.02em; }
  .who { font-size:26px; font-weight:700; line-height:1.25; letter-spacing:-.015em; }
  .meta { color:var(--muted); font-size:15px; }

  /* ---------- ปุ่ม ---------- */
  .btn { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; border:0; border-radius:20px; padding:20px;
    font-size:21px; font-weight:700; cursor:pointer; transition:transform .1s, filter .15s, box-shadow .15s; letter-spacing:-.01em; }
  .btn:active { transform:scale(.98); }
  .btn svg { font-size:26px; }
  .btn.safe { background:var(--safe); color:#fff; box-shadow:var(--shadow-btn) var(--safe);
    background:linear-gradient(180deg, color-mix(in srgb, var(--safe) 82%, #fff), var(--safe)); }
  .btn.help { background:var(--help-soft); color:var(--help); }
  .btn.help.solid { background:var(--help); color:#fff; box-shadow:var(--shadow-btn) var(--help);
    background:linear-gradient(180deg, color-mix(in srgb, var(--help) 85%, #fff), var(--help)); }
  .btn.ghost { background:transparent; color:var(--muted); font-size:16px; font-weight:500; padding:14px; }
  .btn.outline { background:var(--surface); color:var(--ink); border:1px solid var(--line); font-size:16px; font-weight:600; padding:16px; box-shadow:var(--shadow); }
  .btn:focus-visible, .item:focus-visible, .icon-btn:focus-visible { outline:3px solid var(--ring); outline-offset:2px; }
  .stack { display:grid; gap:10px; }

  textarea { width:100%; font:inherit; font-size:16px; padding:14px 16px; border:1.5px solid var(--line); border-radius:18px; background:var(--surface);
    color:var(--ink); resize:vertical; outline:none; }
  textarea:focus { border-color:var(--help); box-shadow:0 0 0 4px var(--help-soft); }
  label { font-size:15px; color:var(--muted); margin:2px 2px -4px; }

  /* ---------- สำเร็จ ---------- */
  .done-ring { width:104px; height:104px; border-radius:50%; display:grid; place-items:center; background:var(--safe-soft); color:var(--safe);
    margin-bottom:12px; box-shadow:0 0 0 10px color-mix(in srgb, var(--safe-soft) 50%, transparent); animation:pop .35s cubic-bezier(.2,1.4,.4,1); }
  .done-ring.help { background:var(--help-soft); color:var(--help); box-shadow:0 0 0 10px color-mix(in srgb, var(--help-soft) 50%, transparent); }
  @keyframes pop { from { transform:scale(.6); opacity:0; } }
  .done-ring svg { width:54px; height:54px; }
  .done-ring .draw { stroke-dasharray:40; stroke-dashoffset:40; animation:draw .5s .15s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset:0; } }
  .status { display:inline-flex; align-items:center; gap:8px; margin-top:12px; font-size:14px; color:var(--muted); background:var(--surface-2);
    padding:7px 13px; border-radius:999px; font-weight:500; }
  .status.ok { color:var(--safe); background:var(--safe-soft); }
  .dot { width:8px; height:8px; border-radius:50%; background:currentColor; }
  .status:not(.ok) .dot { animation:blink 1s infinite; }
  @keyframes blink { 50% { opacity:.25; } }

  /* ---------- อัดเสียง ---------- */
  .rec { background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:18px 16px; box-shadow:var(--shadow);
    display:grid; justify-items:center; gap:10px; text-align:center; }
  .rec-t { font-weight:700; font-size:17px; }
  .rec-s { color:var(--muted); font-size:14px; margin-top:-8px; }
  .mic { width:88px; height:88px; border-radius:50%; border:0; cursor:pointer; display:grid; place-items:center; color:#fff; font-size:38px;
    background:var(--help); background:linear-gradient(180deg, color-mix(in srgb, var(--help) 80%, #fff), var(--help));
    box-shadow:0 12px 28px -12px var(--help); transition:transform .1s; }
  .mic:active { transform:scale(.95); }
  .mic .i-stop { display:none; }
  .rec.on .mic { animation:recpulse 1.4s infinite; }
  .rec.on .mic .i-mic { display:none; }
  .rec.on .mic .i-stop { display:block; }
  @keyframes recpulse { 0% { box-shadow:0 0 0 0 color-mix(in srgb, var(--help) 55%, transparent); } 70% { box-shadow:0 0 0 18px transparent; } 100% { box-shadow:0 0 0 0 transparent; } }
  .rec-time { font-variant-numeric:tabular-nums; font-weight:700; font-size:18px; color:var(--help); }
  .rec-time:empty { display:none; }
  .rec-hint { font-size:13.5px; color:var(--muted); }
  .rec-done { display:grid; gap:10px; width:100%; }
  .rec-done audio, .rec-done video { width:100%; max-height:160px; }
  .rec-row { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .chip-btn { border:1px solid var(--line); background:var(--surface-2); border-radius:999px; padding:8px 14px; font-size:14px; font-weight:600; cursor:pointer; }
  .rec-ok { display:inline-flex; align-items:center; gap:6px; color:var(--safe); font-weight:600; font-size:14px; }
  .file-btn { display:inline-flex; align-items:center; gap:8px; border:1.5px dashed var(--line-2); border-radius:16px; padding:12px 16px; font-size:15px;
    font-weight:600; cursor:pointer; color:var(--ink); background:var(--surface-2); }
  .file-btn input { display:none; }
  .rec-msg { font-size:13.5px; color:var(--warn-ink); }
  .rec-msg:empty { display:none; }
  .or { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:13px; }
  .or::before, .or::after { content:""; flex:1; height:1px; background:var(--line); }

  .banner { padding:12px 14px; border-radius:16px; font-size:15px; background:var(--warn-soft); color:var(--warn-ink); }
  .banner.err { background:var(--help-soft); color:var(--help); }
  @media (prefers-reduced-motion: reduce) { *, *::before { animation:none !important; transition:none !important; } .done-ring .draw { stroke-dashoffset:0; } }
</style>
</head>
<body data-point="<?= point ?>">
<header class="bar">
  <img class="logo" src="<?!= logo ?>" alt="" width="40" height="40">
  <div class="brand"><b><?= appName ?></b><span><?= orgName ?></span></div>
  <button class="icon-btn" type="button" onclick="toggleTheme()" aria-label="สลับโหมดสว่าง/มืด" title="สลับโหมดสว่าง/มืด">
    <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>
    <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
  </button>
</header>
<main>
  <div class="hero">
    <span class="live"><span class="pulse"></span>เช็คอินความปลอดภัย</span>
    <span class="place"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg><span id="pointLabel">กำลังโหลด…</span></span>
  </div>
  <div id="netBanner" class="banner hidden"></div>

  <!-- 1) จำเครื่องนี้ได้: กดปุ่มเดียว -->
  <section id="vRemember" class="hidden">
    <div class="card">
      <div class="avatar" id="rememberAvatar"></div>
      <div class="eyebrow">คุณคือ</div>
      <div class="who" id="rememberName"></div>
      <div class="meta" id="rememberDept"></div>
    </div>
    <div class="stack">
      <button class="btn safe" onclick="submit(me, 'SAFE', 'SELF')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>ฉันปลอดภัย</button>
      <button class="btn help" onclick="showConfirm(me, 'SELF', true)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg>ต้องการความช่วยเหลือ</button>
      <button class="btn ghost" onclick="forgetMe()">ไม่ใช่ฉัน · เปลี่ยนชื่อ</button>
    </div>
  </section>

  <!-- 2) ค้นหาชื่อ -->
  <section id="vSearch" class="hidden">
    <div id="buddyBanner" class="banner hidden">กำลังเช็คอิน <b>แทนเพื่อน</b> ที่ไม่มีมือถือ</div>
    <h2 id="searchTitle">ค้นหาชื่อของคุณ</h2>
    <p class="sub">พิมพ์ชื่อหรือนามสกุล ไม่ต้องพิมพ์คำนำหน้า</p>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="เช่น สมชาย หรือ ใจดี" autocomplete="off" enterkeyhint="search">
    </div>
    <div id="results" class="list"></div>
    <button id="cancelBuddy" class="btn ghost hidden" onclick="backHome()">ยกเลิก</button>
  </section>

  <!-- 3) ยืนยัน -->
  <section id="vConfirm" class="hidden">
    <div class="card">
      <div class="avatar" id="confirmAvatar"></div>
      <div class="eyebrow" id="confirmLabel">ยืนยันชื่อ</div>
      <div class="who" id="confirmName"></div>
      <div class="meta" id="confirmDept"></div>
    </div>
    <div id="helpBox" class="stack hidden">
      <div class="rec" id="rec">
        <div class="rec-t">ส่งเสียงถึงศูนย์บัญชาการ</div>
        <div class="rec-s">บอกอาการและตำแหน่งที่อยู่ ไม่เกิน 60 วินาที</div>
        <div id="recIdle" style="display:grid;justify-items:center;gap:8px">
          <button class="mic" id="recBtn" type="button" onclick="recToggle()" aria-label="อัดเสียง">
            <svg class="i-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
            <svg class="i-stop" viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2.5"/></svg>
          </button>
          <div class="rec-time" id="recTime"></div>
          <div class="rec-hint" id="recHint">แตะเพื่อเริ่มอัดเสียง</div>
        </div>
        <div class="rec-done hidden" id="recDone">
          <span class="rec-ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg><span id="recLen">อัดเสียงแล้ว</span></span>
          <div id="recPlayer"></div>
          <div class="rec-row">
            <button class="chip-btn" type="button" onclick="recReset(); recToggle()">อัดใหม่</button>
            <button class="chip-btn" type="button" onclick="recReset()">ลบเสียง</button>
          </div>
        </div>
        <label class="file-btn hidden" id="recFileWrap">
          <input type="file" id="recFile" accept="audio/*" capture>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
          เปิดแอปอัดเสียงของเครื่อง
        </label>
        <div class="rec-msg" id="recMsg"></div>
      </div>
      <div class="or">หรือพิมพ์ข้อความ (ไม่บังคับ)</div>
      <textarea id="note" rows="2" placeholder="เช่น บาดเจ็บที่ขา, สำลักควัน" aria-label="ข้อความถึงศูนย์บัญชาการ"></textarea>
      <button class="btn help solid" onclick="submit(selected, 'HELP', mode)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg>ส่งขอความช่วยเหลือ</button>
    </div>
    <div id="choiceBox" class="stack">
      <button class="btn safe" onclick="submit(selected, 'SAFE', mode)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>ปลอดภัย</button>
      <button class="btn help" onclick="showHelp()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg>ต้องการความช่วยเหลือ</button>
    </div>
    <button class="btn ghost" onclick="backHome()">ย้อนกลับ</button>
  </section>

  <!-- 4) สำเร็จ -->
  <section id="vDone" class="hidden">
    <div class="card">
      <div class="done-ring" id="doneRing"></div>
      <div class="who" id="doneName"></div>
      <div class="meta" id="doneMsg"></div>
      <div class="status" id="doneStatus"><span class="dot"></span><span id="doneTime"></span></div>
    </div>
    <div class="stack">
      <button class="btn outline" onclick="startBuddy()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M17 14.5c2.4 0 4 1.5 4.6 4.5"/></svg>เช็คอินแทนเพื่อนที่ไม่มีมือถือ</button>
      <button class="btn ghost" onclick="backHome()">กลับหน้าแรก</button>
    </div>
  </section>
</main>

<script>
var POINT = document.body.getAttribute('data-point') || '';
var employees = [];   // [ตัวระบุ (รหัสหรือชื่อ), ชื่อ, หน่วยงาน, โซน, ตำแหน่ง]
var me = null;        // พนักงานที่จำไว้ในเครื่องนี้
var selected = null;
var mode = 'SELF';    // SELF | BUDDY
var ICON_OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path class="draw" d="M20 6 9 17l-5-5"/></svg>';
var ICON_HELP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path class="draw" d="M12 6v8"/><path d="M12 17.5v.5"/></svg>';

function $(id) { return document.getElementById(id); }
function show(id) {
  ['vRemember', 'vSearch', 'vConfirm', 'vDone'].forEach(function (v) { $(v).classList.toggle('hidden', v !== id); });
  window.scrollTo(0, 0);
}
function store(k, v) { try { v === undefined ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function load(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
// คิวรอส่ง: เก็บในหน่วยความจำเสมอ และสำรองลง localStorage (ถ้าเบราว์เซอร์อนุญาต)
var pending = load('pending') || [];
function savePending() { store('pending', pending); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
// ตัวอักษรแรกของชื่อ (ข้ามสระหน้า เ แ โ ใ ไ)
function stripTitle(name) { return String(name || '').replace(/^(นางสาว|นาวสาว|นาง|นาย|น\.ส\.|ว่าที่\s*ร\.?\s*ต\.?|ดร\.)\s*/, ''); }
function initial(name) { var s = stripTitle(name).replace(/^[เแโใไ]/, ''); return s.charAt(0) || '?'; }
function squash(s) { return String(s || '').replace(/\s+/g, '').toLowerCase(); }
var keys = [];        // ชื่อ/รหัสแบบตัดช่องว่าง เตรียมไว้ครั้งเดียว ค้นหาเร็วขึ้น
function sub(e) { return [e[4], e[3]].filter(Boolean).join(' · '); }

/* ---------- โหลดข้อมูล ---------- */
function init(data) {
  employees = data.employees;
  keys = employees.map(function (e) { return { all: squash(e[1]) + '|' + squash(e[0]), bare: squash(stripTitle(e[1])) }; });
  var p = data.points.filter(function (x) { return x.code === POINT; })[0];
  $('pointLabel').textContent = p ? (/^จุดรวมพล/.test(p.name) ? p.name : 'จุดรวมพล ' + p.code + ' · ' + p.name) : (POINT ? 'จุดรวมพล ' + POINT : 'ไม่ระบุจุดรวมพล');
  var saved = load('me');
  // หาเครื่องที่เคยจำไว้ ด้วยตัวระบุ หรือชื่อ (กรณีเพิ่มรหัสพนักงานภายหลัง)
  me = saved && (employees.filter(function (e) { return e[0] === saved[0]; })[0] ||
    employees.filter(function (e) { return e[1] === saved[1]; })[0]);
  backHome();
  flush(); // ส่งข้อมูลที่ค้างจากครั้งก่อน (ถ้ามี)
}

// รายชื่อฝังมากับหน้าเว็บแล้ว (ไม่ต้องรอเรียกเซิร์ฟเวอร์) ถ้าไม่มีจึงค่อยโหลด
var BOOT = <?!= boot ?>;
if (BOOT) init(BOOT);
else google.script.run
  .withSuccessHandler(init)
  .withFailureHandler(function () { $('pointLabel').textContent = 'โหลดข้อมูลไม่สำเร็จ กรุณารีเฟรช หรือแจ้งเจ้าหน้าที่ที่จุดรวมพล'; })
  .getCheckInData();

/* ---------- หน้าจอ ---------- */
function backHome() {
  mode = 'SELF'; selected = null;
  if (typeof rec !== 'undefined' && rec && (rec.mr || rec.stream)) recReset();
  $('buddyBanner').classList.add('hidden');
  $('cancelBuddy').classList.add('hidden');
  $('searchTitle').textContent = 'ค้นหาชื่อของคุณ';
  if (me) {
    $('rememberAvatar').textContent = initial(me[1]);
    $('rememberName').textContent = me[1];
    $('rememberDept').textContent = sub(me);
    show('vRemember');
  } else {
    $('q').value = ''; render('');
    show('vSearch'); $('q').focus();
  }
}
function forgetMe() { me = null; store('me'); backHome(); }
function startBuddy() {
  mode = 'BUDDY'; $('q').value = ''; render('');
  $('buddyBanner').classList.remove('hidden');
  $('cancelBuddy').classList.remove('hidden');
  $('searchTitle').textContent = 'ค้นหาชื่อเพื่อน';
  show('vSearch'); $('q').focus();
}

$('q').addEventListener('input', function () { render(this.value); });
function render(q) {
  q = squash(q);
  if (!q) { $('results').innerHTML = ''; return; }
  // เทียบแบบไม่สนช่องว่าง: "สมชาย ใจ" เจอ "นายสมชาย  ใจดี"
  var hits = [];
  for (var i = 0; i < keys.length; i++) if (keys[i].all.indexOf(q) >= 0) hits.push(i);
  hits = hits.sort(function (a, b) {   // ชื่อที่ขึ้นต้นด้วยคำค้นมาก่อน
    return (keys[a].bare.indexOf(q) === 0 ? 0 : 1) - (keys[b].bare.indexOf(q) === 0 ? 0 : 1) || a - b;
  }).slice(0, 20);
  $('results').innerHTML = hits.length ? hits.map(function (i) {
    var e = employees[i];
    return '<button class="item" data-i="' + i + '"><span class="avatar">' + esc(initial(e[1])) + '</span>' +
      '<span><span class="nm">' + esc(e[1]) + '</span><small>' + esc(sub(e)) + '</small></span>' +
      '<span class="go">›</span></button>';
  }).join('') : '<div class="empty">ไม่พบชื่อนี้ ลองพิมพ์แค่ชื่อหรือแค่นามสกุล หรือแจ้งเจ้าหน้าที่ที่จุดรวมพล</div>';
}
$('results').addEventListener('click', function (ev) {
  var b = ev.target.closest('.item'); if (!b) return;
  showConfirm(employees[+b.getAttribute('data-i')], mode, false);
});

function showConfirm(emp, m, help) {
  selected = emp; mode = m;
  recReset();
  $('confirmAvatar').textContent = initial(emp[1]);
  $('confirmLabel').textContent = m === 'BUDDY' ? 'เช็คอินแทนเพื่อน' : 'ยืนยันว่าเป็นคุณ';
  $('confirmName').textContent = emp[1];
  $('confirmDept').textContent = [emp[4], emp[2], emp[3]].filter(Boolean).join(' · ');
  $('note').value = '';
  $('helpBox').classList.toggle('hidden', !help);
  $('choiceBox').classList.toggle('hidden', help);
  show('vConfirm');
}
function showHelp() { $('helpBox').classList.remove('hidden'); $('choiceBox').classList.add('hidden'); }

/* ---------- อัดเสียงขอความช่วยเหลือ ---------- */
var REC_MAX = 60;                     // วินาที
var FILE_MAX = 3 * 1024 * 1024;       // ไฟล์จากแอปอัดเสียง ไม่เกิน 3MB
var rec = { mr: null, stream: null, chunks: [], blob: null, mime: '', t0: 0, timer: null, url: '' };
function recMime() {
  if (!window.MediaRecorder) return null;
  var c = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm', 'audio/ogg;codecs=opus'];
  for (var i = 0; i < c.length; i++) if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(c[i])) return c[i];
  return '';
}
function recToggle() {
  if (rec.mr && rec.mr.state === 'recording') return recStop();
  var m = recMime();
  if (m === null || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return recFallback('เบราว์เซอร์นี้อัดเสียงในหน้าเว็บไม่ได้ ใช้แอปอัดเสียงของเครื่องแทน');
  $('recHint').textContent = 'กำลังขอใช้ไมโครโฟน…';
  navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }).then(function (stream) {
    rec.stream = stream; rec.chunks = [];
    var opt = { audioBitsPerSecond: 32000 }; if (m) opt.mimeType = m;
    var mr; try { mr = new MediaRecorder(stream, opt); } catch (e) { mr = new MediaRecorder(stream); }
    rec.mr = mr;
    mr.ondataavailable = function (e) { if (e.data && e.data.size) rec.chunks.push(e.data); };
    mr.onstop = function () {
      recRelease();
      if (!rec.chunks.length) { recIdleUI(); return; }
      rec.mime = (mr.mimeType || m || 'audio/webm');
      rec.blob = new Blob(rec.chunks, { type: rec.mime });
      recDoneUI(Math.round((Date.now() - rec.t0) / 1000));
    };
    mr.start(1000);
    rec.t0 = Date.now();
    $('rec').classList.add('on');
    $('recHint').textContent = 'กำลังอัด… แตะอีกครั้งเพื่อหยุด';
    recTick(); rec.timer = setInterval(recTick, 250);
  }).catch(function () {
    recFallback('ไม่ได้รับอนุญาตให้ใช้ไมโครโฟน ใช้แอปอัดเสียงของเครื่องแทนได้');
  });
}
function recTick() {
  var sec = Math.floor((Date.now() - rec.t0) / 1000);
  $('recTime').textContent = mmss(sec) + ' / ' + mmss(REC_MAX);
  if (sec >= REC_MAX) recStop();
}
function mmss(s) { return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
function recStop() { clearInterval(rec.timer); if (rec.mr && rec.mr.state !== 'inactive') rec.mr.stop(); }
function recRelease() {
  clearInterval(rec.timer);
  if (rec.stream) rec.stream.getTracks().forEach(function (t) { t.stop(); });
  rec.stream = null; $('rec').classList.remove('on');
}
function recIdleUI() {
  $('recIdle').classList.remove('hidden'); $('recDone').classList.add('hidden');
  $('recTime').textContent = ''; $('recHint').textContent = 'แตะเพื่อเริ่มอัดเสียง';
}
function recDoneUI(sec) {
  if (rec.url) URL.revokeObjectURL(rec.url);
  rec.url = URL.createObjectURL(rec.blob);
  var tag = /^video\//.test(rec.mime) ? 'video' : 'audio';
  $('recPlayer').innerHTML = '<' + tag + ' controls playsinline preload="metadata" src="' + rec.url + '"></' + tag + '>';
  $('recLen').textContent = sec ? 'อัดเสียงแล้ว ' + mmss(sec) + ' นาที' : 'แนบเสียงแล้ว';
  $('recIdle').classList.add('hidden'); $('recDone').classList.remove('hidden');
  $('recMsg').textContent = '';
}
function recReset() {
  recStop(); recRelease();
  rec.mr = null; rec.blob = null; rec.chunks = []; rec.mime = '';
  if (rec.url) { URL.revokeObjectURL(rec.url); rec.url = ''; }
  $('recPlayer').innerHTML = ''; $('recFile').value = ''; $('recMsg').textContent = '';
  recIdleUI();
}
function recFallback(msg) {
  recRelease(); recIdleUI();
  $('recMsg').textContent = msg;
  $('recFileWrap').classList.remove('hidden');
}
$('recFile').addEventListener('change', function () {
  var f = this.files && this.files[0]; if (!f) return;
  if (f.size > FILE_MAX) { $('recMsg').textContent = 'ไฟล์ใหญ่เกิน 3MB กรุณาอัดให้สั้นลง'; this.value = ''; return; }
  rec.blob = f; rec.mime = f.type || 'audio/mp4';
  recDoneUI(0);
});

/* ---------- ส่งข้อมูล (มีคิวสำรองกรณีเน็ตหลุด / เซิร์ฟเวอร์ยุ่ง) ---------- */
function submit(emp, status, by) {
  var help = status === 'HELP';
  if (help && rec.mr && rec.mr.state === 'recording') {   // ยังอัดอยู่: หยุดก่อนแล้วส่งพร้อมเสียง
    rec.mr.addEventListener('stop', function () { submit(emp, status, by); }, { once: true });
    recStop(); return;
  }
  var payload = { empId: emp[0], name: emp[1], status: status, point: POINT, by: by, note: help ? $('note').value : '' };
  var audio = help && rec.blob ? rec : null;
  if (audio) payload.audioId = Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  if (by === 'SELF') { me = emp; store('me', emp); }
  pending.push(payload); savePending();
  if (audio) {   // ส่งสถานะก่อนทันที แล้วส่งไฟล์เสียงตามไป
    var id = payload.audioId, mime = audio.mime, reader = new FileReader();
    reader.onload = function () {
      pending.push({ kind: 'audio', audioId: id, mime: mime, data: String(reader.result).split(',')[1] || '' });
      savePending(); flush();
    };
    reader.readAsDataURL(audio.blob);
  }
  $('doneRing').className = 'done-ring' + (help ? ' help' : '');
  $('doneRing').innerHTML = help ? ICON_HELP : ICON_OK;
  $('doneName').textContent = emp[1];
  $('doneMsg').textContent = help ? 'ส่งคำขอความช่วยเหลือแล้ว' + (audio ? ' พร้อมข้อความเสียง' : '') + ' อยู่ในที่ปลอดภัย เจ้าหน้าที่กำลังไปหา' : 'บันทึกว่าปลอดภัยแล้ว';
  setStatus(false, 'กำลังส่งข้อมูล…');
  show('vDone');
  flush();
}
function setStatus(ok, text) { $('doneStatus').classList.toggle('ok', ok); $('doneTime').textContent = text; }

var flushing = false, retryDelay = 2000;
function flush() {
  if (flushing || !pending.length) return;
  flushing = true;
  var item = pending[0], isAudio = item.kind === 'audio';
  var runner = google.script.run
    .withSuccessHandler(function (res) {
      flushing = false; retryDelay = 2000;
      pending.shift(); savePending();
      var audioNext = pending.length && pending[0].kind === 'audio';
      if (isAudio) setStatus(true, 'ส่งสำเร็จพร้อมเสียง ' + res.time);
      else if (audioNext) setStatus(false, 'ส่งแล้ว กำลังส่งเสียง…');
      else setStatus(true, 'ส่งสำเร็จ ' + res.time);
      banner(pending.length && !audioNext ? 'รอส่งอีก ' + pending.length + ' รายการ' : '');
      if (pending.length) flush();
    })
    .withFailureHandler(function (err) {
      flushing = false;
      var msg = (err && err.message) || '';
      if (/ไม่พบรายชื่อ|ไม่พบรายการเสียง|ไม่รองรับ|ใหญ่เกินไป|ไม่มีข้อมูลเสียง/.test(msg)) {   // ข้อมูลผิด ไม่ต้องลองซ้ำ
        pending.shift(); savePending();
        if (isAudio) setStatus(true, 'ส่งขอความช่วยเหลือแล้ว (ส่งเสียงไม่สำเร็จ)');
        banner(msg, true);
        if (pending.length) flush();
        return;
      }
      setStatus(false, isAudio ? 'ส่งแล้ว กำลังลองส่งเสียงใหม่ (ห้ามปิดหน้านี้)' : 'ยังส่งไม่สำเร็จ กำลังลองใหม่ (ห้ามปิดหน้านี้)');
      banner('สัญญาณไม่ดีหรือระบบมีผู้ใช้มาก กำลังลองส่งใหม่…');
      setTimeout(flush, retryDelay);
      retryDelay = Math.min(retryDelay * 2, 20000);
    });
  if (isAudio) runner.uploadAudio(item); else runner.checkIn(item);
}
setInterval(flush, 15000);
window.addEventListener('online', flush);

function banner(msg, isErr) {
  var b = $('netBanner');
  b.textContent = msg || '';
  b.className = 'banner' + (isErr ? ' err' : '') + (msg ? '' : ' hidden');
}
</script>
</body>
</html>
