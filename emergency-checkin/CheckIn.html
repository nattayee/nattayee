<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="theme-color" content="#0e1512">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
  :root {
    --bg:#f2f4f3; --surface:#ffffff; --surface-2:#f7f9f8; --ink:#101a15; --muted:#5f6d66; --line:#e1e7e4;
    --top:#0e1512; --top-ink:#f2f6f4;
    --safe:#0e8a52; --safe-soft:#e3f4ec; --help:#d92d20; --help-soft:#fdeceb; --warn-soft:#fff4dc; --warn-ink:#8a5a00;
    --ring:rgba(14,138,82,.35); --shadow:0 1px 2px rgba(16,26,21,.06), 0 8px 24px rgba(16,26,21,.06);
    --f-display:"Anuphan","IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
    --f-body:"IBM Plex Sans Thai","Noto Sans Thai","Sarabun",system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0b110e; --surface:#141d18; --surface-2:#18231d; --ink:#e8efeb; --muted:#97a69e; --line:#26332c;
      --safe:#22b06c; --safe-soft:#123323; --help:#f0574b; --help-soft:#3a1714; --warn-soft:#33270b; --warn-ink:#f3c661;
      --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:var(--f-body); background:var(--bg); color:var(--ink); font-size:17px; line-height:1.5; min-height:100vh; }
  .hidden { display:none !important; }
  svg { width:1em; height:1em; flex:none; }

  /* แถบบน */
  .top { background:var(--top); color:var(--top-ink); padding:18px 20px 22px; border-radius:0 0 24px 24px; }
  .top-row { display:flex; align-items:center; gap:10px; font-family:var(--f-display); font-weight:700; font-size:19px; }
  .pulse { width:10px; height:10px; border-radius:50%; background:#ff4b3e; box-shadow:0 0 0 0 rgba(255,75,62,.6); animation:pulse 1.6s infinite; }
  @keyframes pulse { 70% { box-shadow:0 0 0 10px rgba(255,75,62,0); } 100% { box-shadow:0 0 0 0 rgba(255,75,62,0); } }
  .chip { margin-top:12px; display:inline-flex; align-items:center; gap:8px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.14);
    padding:7px 12px 7px 10px; border-radius:999px; font-size:14px; }
  .chip svg { color:#4fd18f; font-size:16px; }

  main { padding:18px 16px 40px; max-width:480px; margin:0 auto; display:grid; gap:14px; }
  section { display:grid; gap:12px; animation:rise .25s ease-out; }
  @keyframes rise { from { opacity:.4; transform:translateY(6px); } }
  h2 { font-family:var(--f-display); font-size:22px; margin:4px 2px 0; font-weight:700; }
  .sub { color:var(--muted); font-size:15px; margin:-6px 2px 0; }

  /* ค้นหา */
  .search { position:relative; }
  .search svg { position:absolute; left:16px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:20px; }
  .search input { width:100%; font:inherit; font-size:19px; padding:16px 16px 16px 48px; border-radius:16px; border:1.5px solid var(--line);
    background:var(--surface); color:var(--ink); box-shadow:var(--shadow); outline:none; transition:border-color .15s, box-shadow .15s; }
  .search input:focus { border-color:var(--safe); box-shadow:0 0 0 4px var(--ring); }
  .list { display:grid; gap:8px; }
  .item { display:flex; align-items:center; gap:14px; width:100%; text-align:left; font:inherit; color:inherit; background:var(--surface);
    border:1px solid var(--line); border-radius:16px; padding:12px 14px; cursor:pointer; transition:transform .1s, border-color .15s; }
  .item:active { transform:scale(.98); }
  .item:hover { border-color:var(--safe); }
  .item .nm { font-weight:600; font-size:17px; }
  .item small { color:var(--muted); display:block; font-size:14px; }
  .item .go { margin-left:auto; color:var(--muted); font-size:18px; }
  .avatar { width:44px; height:44px; border-radius:14px; display:grid; place-items:center; font-family:var(--f-display); font-weight:700;
    background:var(--safe-soft); color:var(--safe); flex:none; font-size:19px; }
  .empty { text-align:center; color:var(--muted); font-size:15px; padding:22px 10px; }

  /* การ์ดชื่อ */
  .card { background:var(--surface); border:1px solid var(--line); border-radius:24px; padding:24px 20px; text-align:center; box-shadow:var(--shadow);
    display:grid; justify-items:center; gap:4px; }
  .card .avatar { width:64px; height:64px; border-radius:20px; font-size:28px; margin-bottom:8px; }
  .eyebrow { color:var(--muted); font-size:14px; }
  .who { font-family:var(--f-display); font-size:26px; font-weight:700; line-height:1.25; }
  .meta { color:var(--muted); font-size:15px; }

  /* ปุ่ม */
  .btn { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; border:0; border-radius:18px; padding:20px;
    font:inherit; font-family:var(--f-display); font-size:21px; font-weight:700; cursor:pointer; transition:transform .1s, filter .15s; }
  .btn:active { transform:scale(.98); }
  .btn svg { font-size:26px; }
  .btn.safe { background:var(--safe); color:#fff; box-shadow:0 8px 20px -8px var(--safe); }
  .btn.help { background:var(--help-soft); color:var(--help); }
  .btn.help.solid { background:var(--help); color:#fff; box-shadow:0 8px 20px -8px var(--help); }
  .btn.ghost { background:transparent; color:var(--muted); font-family:var(--f-body); font-size:16px; font-weight:500; padding:14px; }
  .btn.outline { background:var(--surface); color:var(--ink); border:1px solid var(--line); font-family:var(--f-body); font-size:16px; font-weight:600; padding:16px; }
  .btn:focus-visible, .item:focus-visible { outline:3px solid var(--ring); outline-offset:2px; }
  .stack { display:grid; gap:10px; }

  textarea { width:100%; font:inherit; font-size:16px; padding:14px; border:1.5px solid var(--line); border-radius:16px; background:var(--surface);
    color:var(--ink); resize:vertical; outline:none; }
  textarea:focus { border-color:var(--help); }
  label { font-size:15px; color:var(--muted); margin:2px 2px -4px; }

  /* สำเร็จ */
  .done-ring { width:96px; height:96px; border-radius:50%; display:grid; place-items:center; background:var(--safe-soft); color:var(--safe); margin-bottom:10px; }
  .done-ring.help { background:var(--help-soft); color:var(--help); }
  .done-ring svg { width:52px; height:52px; }
  .done-ring .draw { stroke-dasharray:40; stroke-dashoffset:40; animation:draw .5s .1s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset:0; } }
  .status { display:inline-flex; align-items:center; gap:8px; margin-top:10px; font-size:14px; color:var(--muted); background:var(--surface-2);
    padding:6px 12px; border-radius:999px; }
  .status.ok { color:var(--safe); background:var(--safe-soft); }
  .dot { width:8px; height:8px; border-radius:50%; background:currentColor; }
  .status:not(.ok) .dot { animation:blink 1s infinite; }
  @keyframes blink { 50% { opacity:.25; } }

  .banner { padding:12px 14px; border-radius:14px; font-size:15px; background:var(--warn-soft); color:var(--warn-ink); }
  .banner.err { background:var(--help-soft); color:var(--help); }
  @media (prefers-reduced-motion: reduce) { *, *::before { animation:none !important; transition:none !important; } .done-ring .draw { stroke-dashoffset:0; } }
</style>
</head>
<body data-point="<?= point ?>">
<header class="top">
  <div class="top-row"><span class="pulse"></span>เช็คอินฉุกเฉิน</div>
  <div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg><span id="pointLabel">กำลังโหลด…</span></div>
</header>
<main>
  <div id="netBanner" class="banner hidden"></div>

  <!-- 1) จำเครื่องนี้ได้: กดปุ่มเดียว -->
  <section id="vRemember" class="hidden">
    <div class="card">
      <div class="avatar" id="rememberAvatar"></div>
      <div class="eyebrow">คุณคือ</div>
      <div class="who" id="rememberName"></div>
      <div class="meta" id="rememberDept"></div>
    </div>
    <div class="stack">
      <button class="btn safe" onclick="submit(me, 'SAFE', 'SELF')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>ฉันปลอดภัย</button>
      <button class="btn help" onclick="showConfirm(me, 'SELF', true)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg>ต้องการความช่วยเหลือ</button>
      <button class="btn ghost" onclick="forgetMe()">ไม่ใช่ฉัน · เปลี่ยนชื่อ</button>
    </div>
  </section>

  <!-- 2) ค้นหาชื่อ -->
  <section id="vSearch" class="hidden">
    <div id="buddyBanner" class="banner hidden">กำลังเช็คอิน <b>แทนเพื่อน</b> ที่ไม่มีมือถือ</div>
    <h2 id="searchTitle">ค้นหาชื่อของคุณ</h2>
    <p class="sub">พิมพ์ชื่อเล่น ชื่อจริง หรือรหัสพนักงาน</p>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="เช่น สมชาย หรือ 10021" autocomplete="off" enterkeyhint="search">
    </div>
    <div id="results" class="list"></div>
    <button id="cancelBuddy" class="btn ghost hidden" onclick="backHome()">ยกเลิก</button>
  </section>

  <!-- 3) ยืนยัน -->
  <section id="vConfirm" class="hidden">
    <div class="card">
      <div class="avatar" id="confirmAvatar"></div>
      <div class="eyebrow" id="confirmLabel">ยืนยันชื่อ</div>
      <div class="who" id="confirmName"></div>
      <div class="meta" id="confirmDept"></div>
    </div>
    <div id="helpBox" class="stack hidden">
      <label for="note">ต้องการความช่วยเหลือเรื่องอะไร (ไม่บังคับ)</label>
      <textarea id="note" rows="2" placeholder="เช่น บาดเจ็บที่ขา, สำลักควัน"></textarea>
      <button class="btn help solid" onclick="submit(selected, 'HELP', mode)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg>ส่งขอความช่วยเหลือ</button>
    </div>
    <div id="choiceBox" class="stack">
      <button class="btn safe" onclick="submit(selected, 'SAFE', mode)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>ปลอดภัย</button>
      <button class="btn help" onclick="showHelp()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg>ต้องการความช่วยเหลือ</button>
    </div>
    <button class="btn ghost" onclick="backHome()">ย้อนกลับ</button>
  </section>

  <!-- 4) สำเร็จ -->
  <section id="vDone" class="hidden">
    <div class="card">
      <div class="done-ring" id="doneRing"></div>
      <div class="who" id="doneName"></div>
      <div class="meta" id="doneMsg"></div>
      <div class="status" id="doneStatus"><span class="dot"></span><span id="doneTime"></span></div>
    </div>
    <div class="stack">
      <button class="btn outline" onclick="startBuddy()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M17 14.5c2.4 0 4 1.5 4.6 4.5"/></svg>เช็คอินแทนเพื่อนที่ไม่มีมือถือ</button>
      <button class="btn ghost" onclick="backHome()">กลับหน้าแรก</button>
    </div>
  </section>
</main>

<script>
var POINT = document.body.getAttribute('data-point') || '';
var employees = [];   // [id, name, dept]
var me = null;        // พนักงานที่จำไว้ในเครื่องนี้
var selected = null;
var mode = 'SELF';    // SELF | BUDDY
var ICON_OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path class="draw" d="M20 6 9 17l-5-5"/></svg>';
var ICON_HELP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path class="draw" d="M12 6v8"/><path d="M12 17.5v.5"/></svg>';

function $(id) { return document.getElementById(id); }
function show(id) {
  ['vRemember', 'vSearch', 'vConfirm', 'vDone'].forEach(function (v) { $(v).classList.toggle('hidden', v !== id); });
  window.scrollTo(0, 0);
}
function store(k, v) { try { v === undefined ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function load(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
// คิวรอส่ง: เก็บในหน่วยความจำเสมอ และสำรองลง localStorage (ถ้าเบราว์เซอร์อนุญาต)
var pending = load('pending') || [];
function savePending() { store('pending', pending); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
// ตัวอักษรแรกของชื่อ (ข้ามสระหน้า เ แ โ ใ ไ)
function initial(name) { var s = String(name || '').replace(/^(นาย|นางสาว|นาง|น\.ส\.)\s*/, '').replace(/^[เแโใไ]/, ''); return s.charAt(0) || '?'; }

/* ---------- โหลดข้อมูล ---------- */
function init(data) {
  employees = data.employees;
  store('emp_cache', data);
  var p = data.points.filter(function (x) { return x.code === POINT; })[0];
  $('pointLabel').textContent = p ? ('จุดรวมพล ' + p.code + ' · ' + p.name) : (POINT ? 'จุดรวมพล ' + POINT : 'ไม่ระบุจุดรวมพล');
  var saved = load('me');
  me = saved && employees.filter(function (e) { return e[0] === saved[0]; })[0];
  backHome();
  flush(); // ส่งข้อมูลที่ค้างจากครั้งก่อน (ถ้ามี)
}

google.script.run
  .withSuccessHandler(init)
  .withFailureHandler(function () {
    var cached = load('emp_cache');
    if (cached) { init(cached); banner('ออฟไลน์: ใช้รายชื่อที่เคยโหลดไว้ ข้อมูลจะส่งเมื่อมีสัญญาณ'); }
    else { $('pointLabel').textContent = 'โหลดข้อมูลไม่สำเร็จ กรุณารีเฟรช หรือแจ้งเจ้าหน้าที่ที่จุดรวมพล'; }
  })
  .getCheckInData();

/* ---------- หน้าจอ ---------- */
function backHome() {
  mode = 'SELF'; selected = null;
  $('buddyBanner').classList.add('hidden');
  $('cancelBuddy').classList.add('hidden');
  $('searchTitle').textContent = 'ค้นหาชื่อของคุณ';
  if (me) {
    $('rememberAvatar').textContent = initial(me[1]);
    $('rememberName').textContent = me[1];
    $('rememberDept').textContent = me[2] + ' · ' + me[0];
    show('vRemember');
  } else {
    $('q').value = ''; render('');
    show('vSearch'); $('q').focus();
  }
}
function forgetMe() { me = null; store('me'); backHome(); }
function startBuddy() {
  mode = 'BUDDY'; $('q').value = ''; render('');
  $('buddyBanner').classList.remove('hidden');
  $('cancelBuddy').classList.remove('hidden');
  $('searchTitle').textContent = 'ค้นหาชื่อเพื่อน';
  show('vSearch'); $('q').focus();
}

$('q').addEventListener('input', function () { render(this.value); });
function render(q) {
  q = q.trim().toLowerCase();
  if (!q) { $('results').innerHTML = ''; return; }
  var hits = employees.filter(function (e) {
    return e[0].toLowerCase().indexOf(q) >= 0 || e[1].toLowerCase().indexOf(q) >= 0;
  }).slice(0, 20);
  $('results').innerHTML = hits.length ? hits.map(function (e) {
    return '<button class="item" data-i="' + employees.indexOf(e) + '"><span class="avatar">' + esc(initial(e[1])) + '</span>' +
      '<span><span class="nm">' + esc(e[1]) + '</span><small>' + esc(e[2]) + ' · ' + esc(e[0]) + '</small></span>' +
      '<span class="go">›</span></button>';
  }).join('') : '<div class="empty">ไม่พบชื่อนี้ ลองพิมพ์รหัสพนักงาน หรือแจ้งเจ้าหน้าที่ที่จุดรวมพล</div>';
}
$('results').addEventListener('click', function (ev) {
  var b = ev.target.closest('.item'); if (!b) return;
  showConfirm(employees[+b.getAttribute('data-i')], mode, false);
});

function showConfirm(emp, m, help) {
  selected = emp; mode = m;
  $('confirmAvatar').textContent = initial(emp[1]);
  $('confirmLabel').textContent = m === 'BUDDY' ? 'เช็คอินแทนเพื่อน' : 'ยืนยันว่าเป็นคุณ';
  $('confirmName').textContent = emp[1];
  $('confirmDept').textContent = emp[2] + ' · ' + emp[0];
  $('note').value = '';
  $('helpBox').classList.toggle('hidden', !help);
  $('choiceBox').classList.toggle('hidden', help);
  show('vConfirm');
}
function showHelp() { $('helpBox').classList.remove('hidden'); $('choiceBox').classList.add('hidden'); $('note').focus(); }

/* ---------- ส่งข้อมูล (มีคิวสำรองกรณีเน็ตหลุด / เซิร์ฟเวอร์ยุ่ง) ---------- */
function submit(emp, status, by) {
  var payload = { empId: emp[0], status: status, point: POINT, by: by, note: status === 'HELP' ? $('note').value : '' };
  if (by === 'SELF') { me = emp; store('me', emp); }
  pending.push(payload); savePending();
  var help = status === 'HELP';
  $('doneRing').className = 'done-ring' + (help ? ' help' : '');
  $('doneRing').innerHTML = help ? ICON_HELP : ICON_OK;
  $('doneName').textContent = emp[1];
  $('doneMsg').textContent = help ? 'ส่งคำขอความช่วยเหลือแล้ว อยู่ในที่ปลอดภัย เจ้าหน้าที่กำลังไปหา' : 'บันทึกว่าปลอดภัยแล้ว';
  setStatus(false, 'กำลังส่งข้อมูล…');
  show('vDone');
  flush();
}
function setStatus(ok, text) { $('doneStatus').classList.toggle('ok', ok); $('doneTime').textContent = text; }

var flushing = false, retryDelay = 2000;
function flush() {
  if (flushing || !pending.length) return;
  flushing = true;
  google.script.run
    .withSuccessHandler(function (res) {
      flushing = false; retryDelay = 2000;
      pending.shift(); savePending();
      setStatus(true, 'ส่งสำเร็จ ' + res.time);
      banner(pending.length ? 'รอส่งอีก ' + pending.length + ' รายการ' : '');
      if (pending.length) flush();
    })
    .withFailureHandler(function (err) {
      flushing = false;
      var msg = (err && err.message) || '';
      if (/ไม่พบรหัสพนักงาน/.test(msg)) {   // ข้อมูลผิด ไม่ต้องลองซ้ำ
        pending.shift(); savePending();
        banner(msg, true); return;
      }
      setStatus(false, 'ยังส่งไม่สำเร็จ กำลังลองใหม่ (ห้ามปิดหน้านี้)');
      banner('สัญญาณไม่ดีหรือระบบมีผู้ใช้มาก กำลังลองส่งใหม่…');
      setTimeout(flush, retryDelay);
      retryDelay = Math.min(retryDelay * 2, 20000);
    })
    .checkIn(pending[0]);
}
setInterval(flush, 15000);
window.addEventListener('online', flush);

function banner(msg, isErr) {
  var b = $('netBanner');
  b.textContent = msg || '';
  b.className = 'banner' + (isErr ? ' err' : '') + (msg ? '' : ' hidden');
}
</script>
</body>
</html>
